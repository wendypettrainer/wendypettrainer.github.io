<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訓練報告 · Wendy 溫蒂．貓與狗訓練日常</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<style>
  :root {
    --bg: #f0e6d6;
    --bg-soft: #f7f0e3;
    --brown: #8b6f47;
    --brown-dark: #6b5435;
    --brown-light: #c9b693;
    --text: #3d2f1f;
    --text-soft: #6b5435;
    --good: #6b9e6e;
    --ok: #c9a85a;
    --work: #c97a4f;
  }
  * {
    box-sizing: border-box; margin: 0; padding: 0;
    /* 強迫列印時保留背景色（避免色塊只剩左邊線像「大引號」）*/
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
                 "Microsoft JhengHei", sans-serif;
    line-height: 1.6;
    min-height: 100vh;
  }
  .page {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px 40px;
  }
  header.brand {
    background: var(--bg);
    padding: 24px 16px 16px;
    margin: 0 -16px 16px;
    text-align: center;
    border-bottom: 2px solid var(--brown);
  }
  header.brand img {
    max-width: 320px;
    width: 80%;
    height: auto;
  }
  header.brand .sub {
    font-size: 12px;
    color: var(--text-soft);
    margin-top: 8px;
    letter-spacing: 1px;
  }
  .pet-card {
    background: var(--bg-soft);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(139,111,71,0.15);
  }
  .pet-name {
    font-size: 22px;
    font-weight: 600;
    color: var(--brown-dark);
    margin-bottom: 4px;
  }
  .pet-meta {
    font-size: 13px;
    color: var(--text-soft);
  }
  .session-meta {
    display: flex;
    gap: 14px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--brown-light);
    font-size: 13px;
    color: var(--text-soft);
    flex-wrap: wrap;
  }
  h2 {
    color: var(--brown-dark);
    font-size: 16px;
    margin: 24px 0 10px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--brown-light);
  }
  .item {
    /* 改邊框設計：白底 + 中等棕邊框（跨頁時不會有米黃 vs 頁緣白的斷層）*/
    background: #ffffff;
    border: 2.5px solid #a89272;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .item-name { font-weight: 500; flex: 1; }
  .item-steps, .item-petnote, .item-method {
    margin-top: 8px;
    font-size: 13px;
    line-height: 1.6;
  }
  .item-steps {
    padding-top: 8px;
    border-top: 1px dashed var(--brown-light);
    color: var(--text-soft);
    white-space: pre-wrap;
  }
  .item-method {
    padding: 8px 10px;
    background: white;
    /* 加細邊框讓多個方法在白色 .item 內仍能分辨。比 .item 邊框淡，視覺層次清楚 */
    border: 1.5px solid #cfc1a3;
    border-radius: 6px;
    margin-top: 6px;
  }
  .item-method-steps {
    margin-top: 4px;
    /* 不強制顏色，繼承 body 預設文字色 */
    /* pre-wrap 會把 HTML 元素間的 \n 渲染成可見空白，撐出大空格 → 改用 normal */
    white-space: normal;
  }
  /* 訓練項目色塊（步驟 / 注意 / 提示）*/
  .block-step, .block-note, .block-tip {
    padding: 8px 10px;
    margin: 6px 0;
    border-radius: 6px;
    /* pre-line：保留色塊內部使用者輸入的 \n 換行（如多條 ⚠️），但折疊其他空白 */
    white-space: pre-line;
    line-height: 1.7;
  }
  .block-step { background: rgba(192,168,120,0.18); }
  .block-note { background: rgba(201,122,79,0.10); }
  .block-tip  { background: rgba(107,158,110,0.10); }
  .item-petnote {
    color: var(--brown-dark);
    background: rgba(201, 182, 147, 0.25);
    padding: 8px 10px;
    border-radius: 6px;
    margin-top: 6px;
    white-space: pre-wrap;
  }
  .item-label {
    /* 14px 比內文（13px）略大、加粗，當 sub-heading */
    font-size: 14px;
    color: var(--brown);
    font-weight: 700;
    letter-spacing: 0.3px;
    margin-bottom: 5px;
  }
  .rating {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 12px;
    color: white;
    white-space: nowrap;
  }
  .rating.good { background: var(--good); }
  .rating.ok { background: var(--ok); }
  .rating.work { background: var(--work); }
  .rating.none { background: var(--brown-light); color: var(--brown-dark); }
  .homework {
    background: var(--bg-soft);
    border-left: 4px solid var(--brown);
    padding: 14px 16px;
    border-radius: 8px;
    white-space: pre-wrap;
    line-height: 1.7;
  }
  .footer {
    text-align: center;
    margin-top: 32px;
    padding-top: 20px;
    font-size: 12px;
    color: var(--text-soft);
    border-top: 1px solid var(--brown-light);
  }
  .loading, .err {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-soft);
  }
  .err { color: var(--work); }
</style>
</head>
<body>
<div class="page">
  <header class="brand">
    <img src="logo.png" alt="Wendy 溫蒂．貓與狗訓練日常"
         onerror="this.outerHTML='<h1 style=&quot;color:var(--brown-dark);font-size:18px&quot;>Wendy 溫蒂．貓與狗訓練日常</h1>'">
    <div class="sub">Cat &amp; Dog Training Session Report</div>
  </header>
  <div id="content"><div class="loading">載入中⋯</div></div>
</div>
<script>
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function fmtDate(s) {
  if (!s) return '';
  const [y,m,d] = s.split('-');
  return `${y} 年 ${parseInt(m)} 月 ${parseInt(d)} 日`;
}

// 課程類型標籤（與 index.html courseTypeLabel 保持同步）
function courseTypeLabel(b) {
  switch (b && b.courseType) {
    case 'firstConsult': return '首堂諮詢';
    case 'group':
      if (b.groupSubType === 'puppy') return '幼犬班';
      if (b.groupSubType === 'youth') return '青少年犬班';
      if (b.groupSubType === 'other') return (b.groupSubTypeOther || '').trim() || '團體班';
      return '團體班';
    case 'other':
      return (b.courseTypeOther || '').trim() || '其他課程';
    case 'oneOnOne':
      return '一對一';
    default:
      return '';
  }
}
// 把舊內容（含 ▶ / 【注意事項】 / ⚠️ 重要提醒 markers）轉成色塊結構
// 已含 block class 就 no-op
function legacyToBlocks(html) {
  if (!html) return '';
  if (/<div\s+class="block-(step|note|tip)"/i.test(html)) return html;
  const stripTags = s => s.replace(/<[^>]+>/g, '').trim();
  const lines = String(html).split(/<br\s*\/?>/i);
  const out = [];
  let cur = null;
  const flush = () => {
    if (!cur) return;
    const inner = cur.lines.join('<br>');
    if (cur.type === 'plain') out.push(inner);
    else out.push('<div class="block-' + cur.type + '">' + inner + '</div>');
    cur = null;
  };
  const detect = line => {
    const t = stripTags(line);
    if (!t) return null;
    if (/^▶/.test(t)) return 'step';
    if (/^【注意事項】|^⚠️\s*注意|^注意事項\s*[:：]|^⚠️\s*重要|^【重要提醒】|^【注意】/.test(t)) return 'note';
    if (/^💡|^【提示】|^【建議】|^提示\s*[:：]/.test(t)) return 'tip';
    return null;
  };
  for (const raw of lines) {
    const trimmed = raw.trim();
    const t = detect(trimmed);
    if (t === 'step') {
      if (cur && cur.type === 'step') cur.lines.push(trimmed);
      else { flush(); cur = { type: 'step', lines: [trimmed] }; }
    } else if (t === 'note' || t === 'tip') {
      flush();
      cur = { type: t, lines: [trimmed] };
    } else if (cur && (cur.type === 'note' || cur.type === 'tip') && trimmed) {
      cur.lines.push(trimmed);
    } else {
      if (cur && cur.type === 'plain') cur.lines.push(trimmed);
      else { flush(); cur = { type: 'plain', lines: [trimmed] }; }
    }
  }
  flush();
  return out.join('');
}

// 堂數標籤（首堂諮詢不顯示）
function sessionSeqLabel(s) {
  if (!s) return '';
  if (s.courseType === 'firstConsult') return '';
  const seq = parseInt(s.sessionSeq, 10);
  const total = parseInt(s.sessionTotal, 10);
  if (!seq && !total) return '';
  if (seq && total) return `第 ${seq} 堂 / 共 ${total} 堂`;
  if (seq) return `第 ${seq} 堂`;
  return '';
}

function ratingLabel(r) {
  if (r === 'good') return { cls: 'good', txt: '😊 表現好' };
  if (r === 'ok') return { cls: 'ok', txt: '😐 普通' };
  if (r === 'work') return { cls: 'work', txt: '💪 需加強' };
  return { cls: 'none', txt: '已練習' };
}

function getGistId() {
  const hash = window.location.hash.slice(1);
  const params = new URLSearchParams(hash);
  return params.get('gist') || '';
}

async function loadReport() {
  const id = getGistId();
  const el = document.getElementById('content');
  if (!id) {
    el.innerHTML = `<div class="err">⚠️ 連結缺少 gist 參數</div>`;
    return;
  }
  try {
    const r = await fetch(`https://api.github.com/gists/${id}`);
    if (!r.ok) throw new Error(`找不到報告 (${r.status})`);
    const gist = await r.json();
    const file = gist.files['report.json'];
    if (!file) throw new Error('報告格式錯誤');
    let content = file.content;
    if (file.truncated && file.raw_url) {
      const rr = await fetch(file.raw_url);
      content = await rr.text();
    }
    const data = JSON.parse(content);
    renderReport(data);
  } catch (e) {
    el.innerHTML = `<div class="err">⚠️ 載入失敗<br><small>${escapeHtml(e.message)}</small></div>`;
  }
}

function renderReport(data) {
  const { pet, session } = data;
  const el = document.getElementById('content');

  const records = (session.records || []).filter(r => r.selected);
  const itemsHtml = records.length === 0
    ? `<p style="color:var(--text-soft); text-align:center; padding: 16px">本堂課暫無項目記錄</p>`
    : records.map(r => {
        const lab = ratingLabel(r.rating);
        const petNote = (r.petNote || '').trim();
        // 新版：r.methodDetails = [{name, steps}]
        const methodDetails = Array.isArray(r.methodDetails) ? r.methodDetails : [];
        const methodsHtml = methodDetails.map(md => {
          const stepsTxt = (md.steps || '').trim();
          const missingWarn = md.missing ? `<div style="color:#c97a4f; font-size:11px; margin-top:4px">⚠️ 此方法已從訓練項目庫移除或改名</div>` : '';
          return `
            <div class="item-method">
              <div class="item-label">🎯 方法：${escapeHtml(md.name || '（未命名方法）')}</div>
              ${missingWarn}
              ${stepsTxt ? `<div class="item-method-steps">${legacyToBlocks(stepsTxt)}</div>` : ''}
            </div>`;
        }).join('');
        // 向下相容舊版 r.steps
        const legacySteps = (r.steps || '').trim();
        // 注意：.item-steps / .item-petnote 都有 white-space: pre-wrap，
        //       所以這裡不能用 multi-line template literal（否則縮排空白會被當成內容顯示）。
        const legacyHtml = (!methodDetails.length && legacySteps)
          ? `<div class="item-steps"><div class="item-label">📋 在家練習步驟</div>${escapeHtml(legacySteps)}</div>`
          : '';
        const noteHtml = petNote
          ? `<div class="item-petnote"><div class="item-label">💭 針對 ${escapeHtml(pet.name)} 的調整</div>${escapeHtml(petNote)}</div>`
          : '';
        return `
          <div class="item">
            <div class="item-row">
              <span class="item-name">${escapeHtml(r.name)}</span>
              <span class="rating ${lab.cls}">${lab.txt}</span>
            </div>
            ${methodsHtml}
            ${legacyHtml}
            ${noteHtml}
          </div>`;
      }).join('');

  // 判斷 homework 是否有實質內容：strip HTML tags + trim。
  // 否則 contenteditable 留下的 <br> / <p></p> 會讓判斷誤判為「有內容」。
  const homeworkText = (session.homework || '').replace(/<[^>]+>/g, '').trim();
  const homeworkHtml = homeworkText
    ? `<h2>📝 本週飼主作業</h2><div class="homework">${escapeHtml(session.homework)}</div>`
    : '';

  const genderTxt = pet.gender === 'male' ? '公' : pet.gender === 'female' ? '母' : '';
  const neuteredTxt = pet.neutered === 'yes' ? '已絕育' : pet.neutered === 'no' ? '未絕育' : '';
  const metaParts = [
    pet.breed || (pet.species==='cat'?'貓':'狗'),
    genderTxt,
    neuteredTxt,
    pet.birth,
  ].filter(Boolean).join(' · ');
  el.innerHTML = `
    <div class="pet-card">
      <div class="pet-name">${pet.species==='cat'?'🐱':'🐶'} ${escapeHtml(pet.name)}</div>
      <div class="pet-meta">
        ${escapeHtml(metaParts)}
        ${pet.ownerName ? ' · 飼主：' + escapeHtml(pet.ownerName) : ''}
      </div>
      <div class="session-meta">
        ${(() => {
          const ctLab = (typeof courseTypeLabel === 'function') ? courseTypeLabel(session) : '';
          const seqLab = (typeof sessionSeqLabel === 'function') ? sessionSeqLabel(session) : '';
          return (ctLab || seqLab)
            ? `<span>📋 ${escapeHtml(ctLab)}${ctLab && seqLab ? ' · ' : ''}${escapeHtml(seqLab)}</span>`
            : '';
        })()}
        <span>📅 ${fmtDate(session.date)}</span>
        ${session.location ? `<span>📍 ${escapeHtml(session.location)}</span>` : ''}
        ${session.duration ? `<span>⏱ ${session.duration} 分鐘</span>` : ''}
      </div>
    </div>

    <h2>🎯 本堂訓練項目</h2>
    ${itemsHtml}

    ${homeworkHtml}

    <div class="footer">
      Wendy 溫蒂．貓與狗訓練日常
    </div>
  `;
  document.title = `${pet.name} ${session.date} · 訓練報告`;
}

loadReport();
</script>
</body>
</html>
