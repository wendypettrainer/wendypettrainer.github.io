<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寵物訓練報告 · Wendy 溫蒂．貓與狗訓練日常</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f3ed;
    --bg-soft: #ede5d6;
    --card: #ffffff;
    --brown: #4a4138;
    --brown-dark: #2c2620;
    --brown-light: #b8ad9a;
    --text: #2c2620;
    --text-soft: #7a716a;
    --border: #e0dcd4;
    --accent: #c08a5e;
    --accent-dark: #8b4d22;
    --good: #6b9e6e;
    --ok: #c9a85a;
    --work: #c97a4f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px 60px;
  }
  header.brand {
    text-align: center;
    padding: 32px 16px 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  header.brand img {
    max-width: 200px;
    width: 60%;
    height: auto;
  }
  header.brand h1 {
    color: var(--brown-dark);
    font-size: 20px;
    font-weight: 600;
    margin-top: 12px;
    letter-spacing: 0.5px;
  }
  header.brand .sub {
    font-size: 12px;
    color: var(--text-soft);
    margin-top: 8px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .pet-hero {
    background: var(--card);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
  }
  .pet-hero .name {
    font-size: 24px;
    font-weight: 700;
    color: var(--brown-dark);
    margin-bottom: 4px;
  }
  .pet-hero .meta {
    font-size: 13px;
    color: var(--text-soft);
  }
  .section {
    background: var(--card);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
  }
  .section h2 {
    color: var(--brown-dark);
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    letter-spacing: 0.3px;
  }
  /* 可摺疊 section（首堂諮詢用） */
  .section-collapsible {
    padding: 0;
    overflow: hidden;
  }
  .section-collapsible > summary {
    list-style: none;
    cursor: pointer;
    padding: 14px 18px;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s;
  }
  .section-collapsible > summary::-webkit-details-marker { display: none; }
  .section-collapsible > summary:hover { background: rgba(192,138,94,0.05); }
  .section-collapsible[open] > summary {
    border-bottom: 1px solid var(--border);
    background: rgba(192,138,94,0.04);
  }
  .section-collapsible .section-arrow {
    font-size: 11px;
    color: var(--text-soft);
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .section-collapsible[open] > summary .section-arrow {
    transform: rotate(90deg);
  }
  .section-collapsible .section-title {
    color: var(--brown-dark);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .section-collapsible > .section-body {
    padding: 14px 18px 16px;
  }
  .qa-row {
    font-size: 14px;
    line-height: 1.7;
    padding: 4px 0;
  }
  .qa-row b { color: var(--brown-dark); margin-right: 6px; }
  .concerns-box {
    background: rgba(192,138,94,0.08);
    border-left: 3px solid var(--accent);
    padding: 10px 14px;
    border-radius: 4px;
    white-space: pre-wrap;
    font-size: 14px;
    line-height: 1.7;
  }
  /* 全域：隱藏所有 <summary> 瀏覽器預設的 disclosure marker（▶/▼）
     讓我們自己加的 .session-arrow / .section-arrow 才是唯一三角形 */
  details > summary {
    list-style: none;
  }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::marker { content: ''; }

  /* session-card 是 <details>：summary 永遠顯示，body 展開才看 */
  .session-card {
    background: var(--bg-soft);
    border-radius: 8px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .session-card.is-booked {
    background: #ffffff;
    border-style: dashed;
  }
  .session-card > summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 16px;
    user-select: none;
    transition: background 0.15s;
  }
  .session-card > summary::-webkit-details-marker { display: none; }
  .session-card > summary:hover { background: rgba(192,138,94,0.06); }
  .session-arrow {
    display: inline-block;
    font-size: 10px;
    color: var(--text-soft);
    transition: transform 0.2s;
    flex-shrink: 0;
    margin-right: 2px;
  }
  .session-card[open] > summary .session-arrow {
    transform: rotate(90deg);
  }
  .session-card[open] > summary {
    border-bottom: 1px solid var(--border);
    background: rgba(192,138,94,0.04);
  }
  .session-card[open].is-booked > summary {
    background: rgba(192,138,94,0.08);
  }
  .session-body {
    padding: 14px 16px;
  }
  .session-loc {
    color: var(--text-soft);
  }
  .booked-badge {
    background: #c08a5e;
    color: #fff;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    flex-shrink: 0;
  }
  .done-badge {
    background: var(--good);
    color: #fff;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    flex-shrink: 0;
  }
  .booked-hint {
    font-size: 13px;
    color: var(--text-soft);
    font-style: italic;
    text-align: center;
    padding: 8px 0;
  }
  .session-head {
    display: flex;
    align-items: center;
    font-size: 13px;
    color: var(--text-soft);
    gap: 8px;
    flex-wrap: wrap;
  }
  .session-head .date {
    font-weight: 600;
    color: var(--brown-dark);
    font-size: 14px;
  }
  .session-head .seq {
    background: var(--accent);
    color: white;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
  }
  .item {
    background: #ffffff;
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 6px;
    border: 1px solid var(--border);
  }
  .item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .item-name { font-weight: 500; flex: 1; font-size: 14px; }
  .rating {
    flex-shrink: 0;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 500;
  }
  .rating.good { background: var(--good); color: white; }
  .rating.ok { background: var(--ok); color: white; }
  .rating.work { background: var(--work); color: white; }
  .item-method {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    font-size: 13px;
  }
  .item-method-name { font-weight: 500; color: var(--brown-dark); }
  .item-method-steps {
    color: var(--text-soft);
    margin-top: 4px;
    font-size: 13px;
    line-height: 1.7;
  }
  .item-method-steps b, .item-method-steps strong { color: var(--brown-dark); }
  .item-method-steps span[style] { /* 保留訓練師上的顏色 */ }
  .item-petnote {
    margin-top: 8px;
    padding: 8px 10px;
    background: rgba(192,138,94,0.08);
    border-radius: 4px;
    font-size: 13px;
    white-space: pre-wrap;
  }
  .homework {
    margin-top: 10px;
    padding: 10px 12px;
    background: rgba(107,158,110,0.08);
    border-left: 3px solid var(--good);
    border-radius: 4px;
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
  }
  .homework-label {
    font-weight: 600;
    color: var(--brown-dark);
    font-size: 12px;
    margin-bottom: 4px;
    display: block;
  }
  .material-link {
    display: inline-block;
    padding: 6px 12px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--accent-dark);
    text-decoration: none;
    font-size: 13px;
    margin: 4px 6px 4px 0;
  }
  .material-link:hover { background: var(--accent); color: white; }
  .material-card {
    padding: 10px 12px;
    background: #ffffff;
    border-radius: 6px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
  }
  .material-title { font-weight: 600; color: var(--brown-dark); margin-bottom: 4px; }
  .material-content { font-size: 13px; color: var(--text-soft); line-height: 1.6; }
  .err {
    background: var(--card);
    border: 1px solid var(--work);
    color: var(--work);
    padding: 20px;
    border-radius: 8px;
    margin: 40px 0;
    text-align: center;
  }
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-soft);
  }
  .footer {
    text-align: center;
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-soft);
    letter-spacing: 1px;
  }
  .first-consult-content {
    white-space: pre-wrap;
    font-size: 14px;
    line-height: 1.7;
  }
  .first-consult-report {
    font-size: 14px;
    line-height: 1.85;
  }
  /* contenteditable 包行用 <div>，要顯示為 block */
  .first-consult-report div { display: block; }
  .first-consult-report p { margin: 8px 0; }
  .first-consult-report b, .first-consult-report strong { color: var(--brown-dark); font-weight: 600; }
  .first-consult-report ul, .first-consult-report ol { margin: 8px 0 8px 22px; }
  .first-consult-report li { margin: 4px 0; }
  /* 段落視覺呼吸：每個 block 元素之間有間距 */
  .first-consult-report > div + div { margin-top: 4px; }
  .first-consult-report table {
    border-collapse: collapse;
    margin: 10px 0;
    width: 100%;
    font-size: 13px;
  }
  .first-consult-report th, .first-consult-report td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
  }
  .first-consult-report th { background: var(--bg-soft); font-weight: 600; }
  /* 空行（只有 <br> 的 div）也保留高度 */
  .first-consult-report div:empty,
  .first-consult-report div:has(> br:only-child) {
    height: 0.8em;
  }
  details { margin-bottom: 8px; }
  summary {
    cursor: pointer;
    padding: 8px 10px;
    background: var(--bg-soft);
    border-radius: 6px;
    font-weight: 500;
    font-size: 13px;
    list-style: none;
    color: var(--brown-dark);
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: '▶ '; font-size: 10px; transition: transform 0.15s; display: inline-block; }
  details[open] summary::before { content: '▼ '; }
</style>
</head>
<body>
<div class="page">
  <header class="brand">
    <img src="logo.png" alt="Wendy"
         onerror="this.outerHTML='<h1>Wendy 溫蒂．貓與狗訓練日常</h1>'">
    <div class="sub">Pet Training Report</div>
  </header>
  <div id="content" class="loading">載入中⋯</div>
</div>

<script>
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[ch]);
}
function fmtDate(s) {
  if (!s) return '';
  return s.replace(/-/g, '/');
}
function ratingLabel(r) {
  if (r === 'good') return { cls: 'good', txt: '良好' };
  if (r === 'ok')   return { cls: 'ok',   txt: '尚可' };
  if (r === 'work') return { cls: 'work', txt: '需要練習' };
  return { cls: '', txt: '' };
}
function courseTypeLabel(s) {
  switch (s && s.courseType) {
    case 'firstConsult': return '首堂諮詢';
    case 'group':
      if (s.groupSubType === 'puppy') return '幼犬班';
      if (s.groupSubType === 'youth') return '青少年犬班';
      if (s.groupSubType === 'other') return (s.groupSubTypeOther || '').trim() || '團體班';
      return '團體班';
    case 'other': return (s.courseTypeOther || '').trim() || '其他課程';
    case 'oneOnOne': return '一對一';
    default: return '';
  }
}
// 美化首堂諮詢報告：在【段落標題】、列點符號前自動換行
function formatFirstConsultHtml(html) {
  if (!html) return '';
  return html
    // 【XX】類段落標題前自動空一行
    .replace(/(【)/g, '<br><br>$1')
    // ▶ / ❶❷❸❹❺❻❼❽❾ / • 列點前換行
    .replace(/([❶❷❸❹❺❻❼❽❾])/g, '<br>$1')
    .replace(/(▶\s)/g, '<br>$1')
    .replace(/([^>\s])(\s?•\s)/g, '$1<br>$2')
    // 清開頭多餘的 <br>
    .replace(/^(\s*<br>\s*)+/, '')
    // 連續 <br> 最多 2 個
    .replace(/(<br>\s*){3,}/g, '<br><br>');
}

function getGistId() {
  const hash = window.location.hash.slice(1);
  const params = new URLSearchParams(hash);
  return params.get('gist') || '';
}

async function loadReport() {
  const id = getGistId();
  const el = document.getElementById('content');
  if (!id) {
    el.innerHTML = `<div class="err">⚠️ 連結缺少 gist 參數</div>`;
    return;
  }
  try {
    const r = await fetch(`https://api.github.com/gists/${id}`);
    if (!r.ok) throw new Error(`找不到報告 (${r.status})`);
    const gist = await r.json();
    const file = gist.files['pet-report.json'];
    if (!file) throw new Error('報告格式錯誤');
    let content = file.content;
    if (file.truncated && file.raw_url) {
      const rr = await fetch(file.raw_url);
      content = await rr.text();
    }
    const data = JSON.parse(content);
    renderReport(data);
  } catch (e) {
    el.innerHTML = `<div class="err">⚠️ 載入失敗<br><small>${escapeHtml(e.message)}</small></div>`;
  }
}

function renderRecords(records) {
  if (!records || records.length === 0) return '';
  return records.map(r => {
    const lab = ratingLabel(r.rating);
    const petNote = (r.petNote || '').trim();
    const methodDetails = Array.isArray(r.methodDetails) ? r.methodDetails : [];
    const methodsHtml = methodDetails.map(md => `
      <div class="item-method">
        <div class="item-method-name">🎯 ${escapeHtml(md.name || '（未命名方法）')}</div>
        ${md.steps ? `<div class="item-method-steps">${md.steps}</div>` : ''}
      </div>`).join('');
    const noteHtml = petNote
      ? `<div class="item-petnote">💭 ${escapeHtml(petNote)}</div>`
      : '';
    return `
      <div class="item">
        <div class="item-row">
          <span class="item-name">${escapeHtml(r.name)}</span>
          ${lab.txt ? `<span class="rating ${lab.cls}">${lab.txt}</span>` : ''}
        </div>
        ${methodsHtml}
        ${noteHtml}
      </div>`;
  }).join('');
}

function renderMaterials(s) {
  const mats = s.attachedMaterials || [];
  const links = s.externalLinks || [];
  if (mats.length === 0 && links.length === 0) return '';
  const matsHtml = mats.map(m => {
    if (m.url && !m.content) {
      return `<a class="material-link" href="${escapeHtml(m.url)}" target="_blank" rel="noopener">▶ ${escapeHtml(m.title)}</a>`;
    }
    return `
      <div class="material-card">
        <div class="material-title">${escapeHtml(m.title)}</div>
        ${m.url ? `<a class="material-link" href="${escapeHtml(m.url)}" target="_blank" rel="noopener">▶ 觀看</a>` : ''}
        ${m.content ? `<div class="material-content">${m.content}</div>` : ''}
      </div>`;
  }).join('');
  const linksHtml = links.map(l =>
    `<a class="material-link" href="${escapeHtml(l.url)}" target="_blank" rel="noopener">${escapeHtml(l.title || l.url)}</a>`
  ).join('');
  return `
    <div style="margin-top:10px; padding-top:10px; border-top:1px dashed var(--border)">
      <div style="font-size:12px; font-weight:600; color:var(--brown-dark); margin-bottom:6px">📎 相關教材 / 連結</div>
      ${matsHtml}
      ${linksHtml}
    </div>`;
}

function renderSession(s) {
  const ctLab = courseTypeLabel(s) || '訓練課';
  const seq = parseInt(s.sessionSeq, 10);
  const total = parseInt(s.sessionTotal, 10);
  const seqStr = (seq && total) ? `第 ${seq} / ${total} 堂` : (seq ? `第 ${seq} 堂` : '');
  const isBooked = s.status === 'booked';
  const dateLabel = s.date ? fmtDate(s.date) : '待安排';

  // 判斷是否有實質內容（避免空 session 渲染空白）
  const hasRecords = Array.isArray(s.records) && s.records.length > 0;
  const hasHomework = !!(s.homework && s.homework.trim());
  const hasMaterials = (Array.isArray(s.attachedMaterials) && s.attachedMaterials.length > 0)
                    || (Array.isArray(s.externalLinks) && s.externalLinks.length > 0);
  const hasContent = hasRecords || hasHomework || hasMaterials;

  const contentHtml = `
    ${renderRecords(s.records)}
    ${hasHomework ? `
      <div class="homework">
        <span class="homework-label">📝 本週飼主作業</span>
        ${escapeHtml(s.homework)}
      </div>` : ''}
    ${renderMaterials(s)}
  `;

  return `
    <details class="session-card${isBooked ? ' is-booked' : ''}">
      <summary class="session-head">
        <span class="session-arrow">▶</span>
        <span class="date">📅 ${escapeHtml(dateLabel)}</span>
        <span>${escapeHtml(ctLab)}</span>
        ${seqStr ? `<span class="seq">${escapeHtml(seqStr)}</span>` : ''}
        ${s.location ? `<span class="session-loc">📍 ${escapeHtml(s.location)}</span>` : ''}
        ${isBooked ? `<span class="booked-badge">⏳ 預約中</span>` : `<span class="done-badge">✓ 已完成</span>`}
      </summary>
      <div class="session-body">
        ${hasContent
          ? contentHtml
          : `<div class="booked-hint">尚未上課，課後內容會更新到這裡。</div>`}
      </div>
    </details>`;
}

function renderBasic(notes) {
  if (!notes) return '';
  const lines = notes.split(/\n+/).map(l => l.trim()).filter(Boolean);
  return lines.map(line => {
    const m = line.match(/^【([^】]+)】(.*)$/);
    if (m) {
      return `<div class="qa-row"><b>${escapeHtml(m[1])}：</b>${escapeHtml(m[2].trim())}</div>`;
    }
    return `<div class="qa-row">${escapeHtml(line)}</div>`;
  }).join('');
}

function renderReport(data) {
  const el = document.getElementById('content');
  el.classList.remove('loading');
  const pet = data.pet || {};
  const cfg = (data.config && data.config.sections) || {};

  const genderTxt = pet.gender === 'male' ? '公' : pet.gender === 'female' ? '母' : '';
  const neuteredTxt = pet.neutered === 'yes' ? '已絕育' : pet.neutered === 'no' ? '未絕育' : '';
  const metaParts = [
    pet.breed || (pet.species === 'cat' ? '貓' : '狗'),
    genderTxt,
    neuteredTxt,
    pet.birth,
  ].filter(Boolean).join(' · ');

  document.title = `${pet.name || '寵物'} · 訓練報告`;

  let html = `
    <div class="pet-hero">
      <div class="name">${pet.species === 'cat' ? '🐱' : '🐶'} ${escapeHtml(pet.name || '')}</div>
      <div class="meta">
        ${escapeHtml(metaParts)}
        ${pet.ownerName ? ' · 飼主：' + escapeHtml(pet.ownerName) : ''}
      </div>
    </div>`;

  // 基本資料
  if (cfg.basic !== false && data.basic && data.basic.notes) {
    html += `
      <div class="section">
        <h2>📋 基本資料</h2>
        ${renderBasic(data.basic.notes)}
      </div>`;
  }

  // 困擾行為
  if (cfg.concerns !== false && data.concerns) {
    html += `
      <div class="section">
        <h2>⚠️ 目前困擾行為</h2>
        <div class="concerns-box">${escapeHtml(data.concerns)}</div>
      </div>`;
  }

  // 首堂諮詢（可摺疊）
  if (cfg.firstConsult !== false && data.firstConsult) {
    const fc = data.firstConsult;
    const fcRecords = renderRecords(fc.records);
    const fcReportHtml = formatFirstConsultHtml((fc.firstConsultReport || '').trim());
    const fcHomework = (fc.homework || '').trim();
    html += `
      <details class="section section-collapsible">
        <summary class="section-summary">
          <span class="section-arrow">▶</span>
          <span class="section-title">🎯 首堂諮詢報告 · ${escapeHtml(fmtDate(fc.date))}</span>
        </summary>
        <div class="section-body">
          ${fcReportHtml ? `<div class="first-consult-report">${fcReportHtml}</div>` : ''}
          ${fcHomework ? `
            <div class="homework" style="margin-top:14px">
              <span class="homework-label">📝 飼主作業</span>
              ${escapeHtml(fcHomework)}
            </div>` : ''}
          ${fcRecords ? `
            <h3 style="margin:14px 0 8px; font-size:14px; color:var(--brown-dark);">🎯 訓練項目</h3>
            ${fcRecords}` : ''}
          ${renderMaterials(fc)}
        </div>
      </details>`;
  }

  // 每堂訓練紀錄（含已完成與預約中，排除強制結案）
  if (cfg.sessions !== false && Array.isArray(data.sessions) && data.sessions.length > 0) {
    const visibleSessions = data.sessions
      .filter(s => s.status === 'done' || s.status === 'booked')
      .sort((a, b) => {
        // 按「第 N 堂」順序排（家長看進度），無 seq 放最後
        const seqA = parseInt(a.sessionSeq, 10) || 999;
        const seqB = parseInt(b.sessionSeq, 10) || 999;
        if (seqA !== seqB) return seqA - seqB;
        return (a.date || '').localeCompare(b.date || '');
      });
    if (visibleSessions.length > 0) {
      const doneCount = visibleSessions.filter(s => s.status === 'done').length;
      const bookedCount = visibleSessions.filter(s => s.status === 'booked').length;
      const counterStr = doneCount && bookedCount
        ? `已完成 ${doneCount} 堂・預約中 ${bookedCount} 堂`
        : doneCount ? `共 ${doneCount} 堂` : `預約中 ${bookedCount} 堂`;
      html += `
        <div class="section">
          <h2>📒 訓練紀錄（${counterStr}）</h2>
          ${visibleSessions.map(renderSession).join('')}
        </div>`;
    }
  }

  html += `
    <div class="footer">
      Wendy 溫蒂．貓與狗訓練日常<br>
      <span style="font-size:10px">更新時間：${escapeHtml(fmtDate((data.generated || '').slice(0, 10)))}</span>
    </div>`;

  el.innerHTML = html;
}

loadReport();
</script>
</body>
</html>
