/* ============== GIST SHARE ============== */
async function shareToGist(sess, pet) {
  const settings = load(KEYS.settings, {});
  if (!settings.githubPat) {
    showNotice('請先到設定填入 GitHub PAT', 'err');
    return;
  }
  // 把該項目「被勾選的方法」連同 steps 一起嵌入 record，飼主端看得到
  const items = ensureItemShape(pet.species === 'cat' ? load(KEYS.itemsCat, []) : load(KEYS.itemsDog, []));
  const itemMap = {};
  items.forEach(it => { itemMap[it.name] = it.methods || []; });
  const enrichedRecords = (sess.records || []).map(r => {
    const itMethods = itemMap[r.name] || [];
    const checkedNames = r.methods || [];
    const methodDetails = checkedNames.map(mn => {
      const m = itMethods.find(im => im.name === mn);
      return { name: mn, steps: (m && m.steps) || '' };
    });
    return { ...r, methodDetails };
  });
  const payload = {
    pet: {
      name: pet.name, species: pet.species, breed: pet.breed,
      gender: pet.gender, neutered: pet.neutered, birth: pet.birth,
      ownerName: pet.ownerName,
    },
    session: {
      date: sess.date, location: sess.location, duration: sess.duration,
      records: enrichedRecords, homework: sess.homework,
    },
    brand: 'Wendy 溫蒂．貓與狗訓練日常',
    generated: new Date().toISOString(),
  };
  const body = {
    description: `Wendy Pet Training Report - ${pet.name} ${sess.date}`,
    public: false,
    files: { 'report.json': { content: JSON.stringify(payload, null, 2) } },
  };

  showNotice('上傳中⋯');
  try {
    let resp;
    if (sess.gistId) {
      resp = await fetch(`https://api.github.com/gists/${sess.gistId}`, {
        method: 'PATCH',
        headers: {
          'Authorization': `Bearer ${settings.githubPat}`,
          'Accept': 'application/vnd.github+json',
        },
        body: JSON.stringify(body),
      });
    } else {
      resp = await fetch('https://api.github.com/gists', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${settings.githubPat}`,
          'Accept': 'application/vnd.github+json',
        },
        body: JSON.stringify(body),
      });
    }
    if (!resp.ok) {
      const err = await resp.text();
      throw new Error(`GitHub ${resp.status}: ${err.slice(0,200)}`);
    }
    const gist = await resp.json();
    sess.gistId = gist.id;
    const sessions = load(KEYS.sessions, []);
    const idx = sessions.findIndex(s => s.id === sess.id);
    sessions[idx] = sess;
    save(KEYS.sessions, sessions);

    const reportUrl = buildReportUrl(settings, gist.id);
    showShareModal(reportUrl, gist.html_url);
  } catch (e) {
    showNotice('上傳失敗：' + e.message, 'err');
  }
}

function showShareModal(reportUrl, gistUrl) {
  const html = `
    <div class="modal">
      <h2>🔗 分享連結已產生</h2>
      <div class="notice ok">把下面這個連結貼給飼主，他點開就能看當堂報告。</div>
      <div class="field">
        <label>飼主檢視連結（建議貼這個）</label>
        <input id="shareUrl" type="text" readonly value="${escapeAttr(reportUrl)}">
      </div>
      <div class="field">
        <label>原始 Gist 連結</label>
        <input type="text" readonly value="${escapeAttr(gistUrl)}">
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="m_close">關閉</button>
        <button class="btn" id="m_copy">複製連結</button>
      </div>
    </div>
  `;
  const overlay = openModal(html);
  overlay.querySelector('#m_close').onclick = () => overlay.remove();
  overlay.querySelector('#m_copy').onclick = async () => {
    try {
      await navigator.clipboard.writeText(reportUrl);
      showNotice('已複製到剪貼簿');
    } catch {
      overlay.querySelector('#shareUrl').select();
      document.execCommand('copy');
      showNotice('已複製');
    }
  };
}

/* ============== EMAIL 單筆匯入 (SurveyCake / Google 表單通知信) ============== */
function parseSurveyCakeEmail(text) {
  if (!text) return null;
  // 1. 剝掉 markdown email link：[a@b](mailto:a@b) → a@b
  text = text.replace(/\[([^\]]+)\]\(mailto:[^)]+\)/g, '$1');
  // 2. 拆行、去空白、過濾空行
  const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  // 3. 嚴格交替：偶數行=問題、奇數行=答案
  const qa = [];
  for (let i = 0; i < lines.length; i += 2) {
    if (i + 1 < lines.length) qa.push([lines[i], lines[i + 1]]);
  }
  if (qa.length === 0) return null;

  // 4. 物種偵測：問題裡「狗狗」vs「貓貓」誰多
  const dogScore = (text.match(/狗狗/g) || []).length;
  const catScore = (text.match(/貓貓/g) || []).length;
  const species = catScore > dogScore ? 'cat' : 'dog';

  const result = {
    species,
    name: '', breed: '', birth: '', gender: '', neutered: '',
    ownerName: '', ownerContact: '', ownerAddress: '',
    concerns: '', notes: '',
  };
  const noteLines = [];

  function detectField(q) {
    // 嚴格 regex：盡量綁問題的「主語」+「關鍵字」，避免命中含有相同字的其他問題
    if (/^(狗狗|貓貓|寵物)名稱$|^名字$/.test(q)) return 'name';
    if (/^(狗狗|貓貓|寵物)?品種$/.test(q)) return 'breed';
    if (/^(狗狗|貓貓|寵物)?年齡|^狗狗年齡\/生日$|^生日$|^出生/.test(q)) return 'birth';
    if (/^性別$|^(狗狗|貓貓|寵物)性別$/.test(q)) return 'genderInfo';
    if (/^主要飼養人姓名$|^飼主姓名$|^姓名$/.test(q)) return 'ownerName';
    if (/^聯絡電話$|^電話$|^手機$|^聯繫電話$/.test(q)) return 'ownerContact';
    if (/^居住地址$|^地址$|^住址$/.test(q)) return 'ownerAddress';
    if (/困擾您的行為|^困擾行為$|請詳述目前.*困擾/.test(q)) return 'concerns';
    return null;
  }

  for (const [q, a] of qa) {
    const field = detectField(q);
    if (field === 'genderInfo') {
      // "男生（未結紮）" → gender + neutered (空值才填，避免覆蓋)
      if (!result.gender) {
        if (/男生|男孩|^男|^公|♂|male/i.test(a)) result.gender = 'male';
        else if (/女生|女孩|^女|^母|♀|female/i.test(a)) result.gender = 'female';
      }
      if (!result.neutered) {
        if (/未結紮|未絕育|不結紮|不絕育|沒結紮|沒絕育/.test(a)) result.neutered = 'no';
        else if (/已結紮|已絕育|結紮|絕育/.test(a)) result.neutered = 'yes';
      }
    } else if (field && !result[field]) {
      // 第一次遇到該欄位才填，已填的當作不認識的問題進 notes（first-match-wins）
      result[field] = a;
    } else {
      // 不認識的問題 OR 重複出現的同欄位 → 進備註
      noteLines.push(`【${q}】${a}`);
    }
  }
  result.notes = noteLines.join('\n');
  return result;
}

function openEmailImport() {
  const html = `
    <div class="modal" style="max-width:680px">
      <h2>📧 從 Email 內容匯入單筆寵物</h2>

        識別不到的欄位（疫苗、散步、餵食習慣⋯）會合併進「備註」保留。
      </p>
      <div class="field">
        <label>Email 原始內容</label>
        <textarea id="em_text" rows="10" placeholder="貼上 email 內容，例：

..."></textarea>
      </div>
      <div class="actions-row">

        <button class="btn" id="em_parse">解析 →</button>
      </div>
      <div id="em_preview" style="margin-top:14px; display:none"></div>
    </div>
  `;
  const overlay = openModal(html);
  overlay.querySelector('#em_cancel').onclick = () => overlay.remove();
  overlay.querySelector('#em_parse').onclick = () => {
    const txt = overlay.querySelector('#em_text').value;
    if (!txt.trim()) { showNotice('請先貼上 email 內容', 'err'); return; }
    const parsed = parseSurveyCakeEmail(txt);
    if (!parsed || !parsed.name) {
      showNotice('解析失敗，沒抓到寵物名稱。請檢查貼的內容是否完整', 'err');
      return;
    }
    renderEmailPreview(overlay, parsed);
  };
}

// 找既有寵物：名字一樣，且 (飼主名也一樣 OR 雙方都沒填飼主名)
function findExistingPet(parsed) {
  if (!parsed.name) return null;
  const pets = load(KEYS.pets, []);
  return pets.find(p => {
    if (p.name !== parsed.name) return false;
    // 名字一樣，再比飼主名（嚴格）
    if (parsed.ownerName && p.ownerName) {
      return parsed.ownerName === p.ownerName;
    }
    // 任一方沒填飼主，視為同一隻（保守判斷）
    return true;
  });
}

function renderEmailPreview(overlay, p) {
  const speciesLabel = p.species === 'cat' ? '🐱 貓' : '🐶 狗';
  const genderLabel = p.gender === 'male' ? '♂ 公' : p.gender === 'female' ? '♀ 母' : '—';
  const neuteredLabel = p.neutered === 'yes' ? '已絕育' : p.neutered === 'no' ? '未絕育' : '—';
  const existing = findExistingPet(p);
  const warningHtml = existing ? `
    <div style="background:#fff4ea; border-left:4px solid #c97a4f; padding:10px 12px; margin:12px 0 6px; border-radius:4px; font-size:13px;">
      ⚠️ <b>已有同名寵物：${escapeHtml(existing.name)}</b>${existing.ownerName ? '（飼主：' + escapeHtml(existing.ownerName) + '）' : ''}

// 簡單但堅實的 CSV 解析器：處理引號、轉義引號、多行儲存格、CRLF
function parseCsv(text) {
  const rows = [];
  let row = [];
  let cell = '';
  let inQuote = false;
  let i = 0;
  const N = text.length;
  while (i < N) {
    const c = text[i];
    if (inQuote) {
      if (c === '"' && text[i+1] === '"') { cell += '"'; i += 2; continue; }
      if (c === '"') { inQuote = false; i++; continue; }
      cell += c;
      i++;
    } else {
      if (c === '"') { inQuote = true; i++; continue; }
      if (c === ',') { row.push(cell); cell = ''; i++; continue; }
      if (c === '\r' || c === '\n') {
        if (c === '\r' && text[i+1] === '\n') i++;
        row.push(cell); cell = '';
        if (row.length > 1 || (row[0] && row[0] !== '')) rows.push(row);
        row = [];
        i++;
        continue;
      }
      cell += c;
      i++;
    }
  }
  if (cell !== '' || row.length > 0) {
    row.push(cell);
    if (row.length > 1 || (row[0] && row[0] !== '')) rows.push(row);
  }
  return rows;
}

// App 欄位選項
const CSV_FIELD_OPTIONS = [
  { value: '', label: '— 不匯入 —' },
  { value: 'name', label: '名字 ★' },
  { value: 'breed', label: '品種' },
  { value: 'gender', label: '性別' },

  { value: 'ownerName', label: '飼主姓名' },
  { value: 'ownerContact', label: '飼主聯絡' },
  { value: 'ownerAddress', label: '📍 飼主地址（上課地點預設）' },
  { value: 'concerns', label: '⚠️ 困擾行為（客戶想解決的問題）' },
  { value: 'notes', label: '合併進備註（可多選）' },
];

// 自動偵測欄名 → App 欄位（精確匹配優先，避免誤判）
function autoMapColumn(colName) {
  const s = colName || '';
  // 飼主姓名（不能是「飼主在 X 上的名字」這種社群帳號欄位）
  if (/^飼主.*姓名$|^飼主名$|^主人.*姓名$|^主人名$/i.test(s)) return 'ownerName';
  // 飼主聯絡（優先電話 > Email；Email 因可能用作識別、放備註更實用，這裡只抓電話）
  if (/聯絡電話|^電話|^手機|^phone$/i.test(s)) return 'ownerContact';
  // 飼主地址（住址、地址、上課地點、住處）
  if (/地址|住址|^住處$|上課地點|address|location/i.test(s)) return 'ownerAddress';
  // 寵物名字（嚴格：開頭必須是「寵物」）
  if (/^寵物.*名(字|稱)?$|^pet.*name$|^name$/i.test(s)) return 'name';
  // 寵物品種（嚴格：開頭必須是「寵物」）
  if (/^寵物.*品種$|^breed$/i.test(s)) return 'breed';
  // 性別
  if (/^寵物.*性別$|^性別$|^sex$|^gender$/i.test(s)) return 'gender';
  // 絕育（只抓「是否絕育」這個 yes/no 問題，後續「絕育的原因」等都歸備註）
  if (/^是否絕育/i.test(s)) return 'neutered';
  // 出生（嚴格：「出生」開頭、寵物的出生）
  if (/^寵物.*出生|^出生|^生日|^birth/i.test(s)) return 'birth';
  // 困擾行為（客戶填寫的目前最想解決的問題）
  if (/困擾.*行為|目前.*困擾|想解決|問題.*行為|concerns?$/i.test(s)) return 'concerns';
  // 其他全部歸備註
  return 'notes';
}

// 值轉換（性別、絕育用）
function normalizeGender(v) {
  if (!v) return '';
  const s = String(v).trim();
  if (/^(男|公|male|m|♂)/i.test(s)) return 'male';
  if (/^(女|母|female|f|♀)/i.test(s)) return 'female';
  return '';
}
function normalizeNeutered(v) {
  if (!v) return '';
  const s = String(v).trim();
  if (/^(是|已|yes|y|true|已結|已絕)/i.test(s)) return 'yes';
  if (/^(否|未|no|n|false|沒|還沒)/i.test(s)) return 'no';
  return '';
}

// 把一個 CSV 列轉成 pet 物件
function csvRowToPet(row, headers, mapping, batchSpecies) {
  const pet = {
    id: uid(),
    species: batchSpecies,
    name: '', breed: '', gender: '', neutered: '', birth: '',
    ownerName: '', ownerContact: '', ownerAddress: '',
    concerns: '', notes: '',
    createdAt: new Date().toISOString(),
  };
  const noteParts = [];
  headers.forEach((h, i) => {
    const target = mapping[i];
    const raw = (row[i] || '').trim();
    if (!raw) return;
    if (!target) return;
    if (target === 'gender') pet.gender = normalizeGender(raw);
    else if (target === 'neutered') pet.neutered = normalizeNeutered(raw);
    else if (target === 'notes') noteParts.push(`【${h}】${raw}`);
    else if (target in pet) pet[target] = raw;
  });
  pet.notes = noteParts.join('\n');
  return pet;
}

  };
  overlay.querySelector('#te_clear').onclick = () => {
    if (!confirm('清空整個表格？')) return;
    t = emptyTable(3, 3);
    render();
  };
  overlay.querySelector('#te_cancel').onclick = () => overlay.remove();
  overlay.querySelector('#te_save').onclick = () => {
    syncFromDom();
    onSave(normalizeTable(t));
    overlay.remove();
  };
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

/* ============== RENDER ============== */
function render() {
  updateHeader();
  if (state.view === 'pets') renderPets();
  else if (state.view === 'sessions') renderSessions();
  else if (state.view === 'session') renderSession();
  else if (state.view === 'bookings') renderBookings();
  else if (state.view === 'booking') renderBooking();
  else if (state.view === 'settings') renderSettings();
}

initStorage();
render();
refreshSyncDot();
// 載入後背景同步（不阻塞 UI）
if (syncEnabled()) {
  setTimeout(() => pullFromCloud(), 200);
}
</script>
</body>
</html>
