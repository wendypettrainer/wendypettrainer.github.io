/* ============== BOOKING / 課程預約 ============== */
function getBooking(id) { return load(KEYS.bookings, []).find(b => b.id === id); }
function getPetBookings(petId) {
  return load(KEYS.bookings, [])
    .filter(b => b.petId === petId)
    .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
}
function loadBookingTemplate() {
  // 缺欄位用預設補（向後相容、設定漏填都能容錯）
  return Object.assign({}, DEFAULT_BOOKING_TEMPLATE, load(KEYS.bookingTemplate, {}));
}
// 課程類型 → 顯示文字（共用：booking + session）
function courseTypeLabel(b) {
  switch (b && b.courseType) {
    case 'firstConsult': return '首堂諮詢';
    case 'group':
      if (b.groupSubType === 'puppy') return '幼犬班';
      if (b.groupSubType === 'youth') return '青少年犬班';
      if (b.groupSubType === 'other') return (b.groupSubTypeOther || '').trim() || '團體班';
      return '團體班';
    case 'other':
      return (b.courseTypeOther || '').trim() || '其他課程';
    case 'oneOnOne':
      return '一對一';
    default:
      return '';
  }
}
// 排序顯示：第 X 堂 / 共 Y 堂（首堂諮詢不顯示）
function sessionSeqLabel(s) {
  if (!s) return '';
  if (s.courseType === 'firstConsult') return '';
  const seq = parseInt(s.sessionSeq, 10);
  const total = parseInt(s.sessionTotal, 10);
  if (!seq && !total) return '';
  if (seq && total) return `第 ${seq} 堂 / 共 ${total} 堂`;
  if (seq) return `第 ${seq} 堂`;
  return '';
}

/* ============== LINE 訊息 + Google Calendar helpers ============== */
// 從 booking.sessions[sourceIndex] 反查時間（session shell 沒存 startTime/endTime）
function getSessionTimeRange(session) {
  if (!session || !session.sourceBookingId) return { start: '', end: '' };
  const bookings = load(KEYS.bookings, []);
  const b = bookings.find(x => x.id === session.sourceBookingId);
  if (!b || !Array.isArray(b.sessions)) return { start: '', end: '' };
  const bs = b.sessions[session.sourceIndex] || {};
  return { start: bs.startTime || '', end: bs.endTime || '' };
}

// 取得 LINE 模板（無就用預設）
function getLineTemplate() {
  const stored = load(KEYS.lineTemplate, '');
  return (typeof stored === 'string' && stored.trim()) ? stored : DEFAULT_LINE_TEMPLATE;
}

// 把 session 套進 LINE 模板，回傳填好的訊息字串
function fillLineTemplate(session, pet) {
  const tpl = getLineTemplate();
  const { start, end } = getSessionTimeRange(session);
  const timeStr = (start && end) ? `${start}-${end}` : (start || '時間待確認');
  const seq = parseInt(session.sessionSeq, 10) || '___';
  const courseLabel = courseTypeLabel(session) || '訓練課程';
  return tpl
    .replace(/\{petName\}/g, (pet && pet.name) || '')
    .replace(/\{date\}/g, fmtDate(session.date))
    .replace(/\{time\}/g, timeStr)
    .replace(/\{seq\}/g, seq)
    .replace(/\{courseLabel\}/g, courseLabel);
}

// 把 (YYYY-MM-DD, HH:MM) 拼成 Google/.ics 用的 local time YYYYMMDDTHHMMSS
function toGcalLocalString(dateStr, timeStr, fallbackHour) {
  if (!dateStr) return '';
  const pad = n => String(n).padStart(2, '0');
  const [y, m, d] = dateStr.split('-').map(x => parseInt(x, 10));
  if (!y || !m || !d) return '';
  let h = (typeof fallbackHour === 'number') ? fallbackHour : 14, mi = 0;
  if (timeStr && /^\d{1,2}:\d{2}$/.test(timeStr)) {
    const [hh, mm] = timeStr.split(':').map(x => parseInt(x, 10));
    h = hh; mi = mm;
  }
  return `${y}${pad(m)}${pad(d)}T${pad(h)}${pad(mi)}00`;
}

// 產生 Google Calendar 新增事件 URL
// opts: { date, startTime, endTime, title, location, description }
// 注意：Google Calendar URL 不支援 VALARM；想要前一天提醒請改用 .ics 路線。
function buildGoogleCalUrl(opts) {
  if (!opts || !opts.date) return '';
  const startLocal = toGcalLocalString(opts.date, opts.startTime, 14);
  if (!startLocal) return '';
  let endLocal = opts.endTime ? toGcalLocalString(opts.date, opts.endTime, 15) : '';
  if (!endLocal) {
    // 沒填結束 → 起始 + 1 小時
    const m = startLocal.match(/^(\d{8}T)(\d{2})(\d{2})(\d{2})$/);
    if (m) {
      const pad = n => String(n).padStart(2, '0');
      const newH = (parseInt(m[2], 10) + 1) % 24;
      endLocal = m[1] + pad(newH) + m[3] + m[4];
    }
  }
  if (!endLocal) return '';
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: opts.title || '訓練課',
    dates: `${startLocal}/${endLocal}`,
    details: opts.description || '',
    location: opts.location || '',
  });
  return 'https://calendar.google.com/calendar/render?' + params.toString();
}

// 從 session entity + pet 組成 GCal opts（首頁明日課程用）
function gcalOptsFromSession(session, pet) {
  const { start, end } = getSessionTimeRange(session);
  const courseLabel = courseTypeLabel(session) || '訓練課';
  const seq = parseInt(session.sessionSeq, 10);
  const seqStr = seq ? ` 第${seq}堂` : '';
  const title = `${(pet && pet.name) || '寵物'} ${courseLabel}${seqStr}`;
  const description = [
    '⏰ 上課前一天記得傳 LINE 提醒給家長',
    `飼主：${(pet && pet.ownerName) || '—'}`,
    pet && pet.ownerPhone ? `電話：${pet.ownerPhone}` : '',
  ].filter(Boolean).join('\n');
  return {
    date: session.date,
    startTime: start,
    endTime: end,
    title,
    location: session.location || '',
    description,
  };
}

// 從 booking + idx 組成 GCal opts（booking 編輯頁用，不依賴 session 已 spawn）
function gcalOptsFromBooking(booking, idx, pet) {
  if (!booking || !booking.sessions) return null;
  const bs = booking.sessions[idx] || {};
  if (!bs.date) return null;
  const courseLabel = courseTypeLabel(booking) || '訓練課';
  const seqStr = ` 第${idx + 1}堂`;
  const title = `${(pet && pet.name) || '寵物'} ${courseLabel}${seqStr}`;
  const description = [
    '⏰ 上課前一天記得傳 LINE 提醒給家長',
    `飼主：${(pet && pet.ownerName) || '—'}`,
    pet && pet.ownerPhone ? `電話：${pet.ownerPhone}` : '',
  ].filter(Boolean).join('\n');
  return {
    date: bs.date,
    startTime: bs.startTime,
    endTime: bs.endTime,
    title,
    location: booking.location || '',
    description,
  };
}

// 產生 .ics 內容字串（多事件 + 每事件含前 24h VALARM）
// sessionsForIcs: [{date, startTime, endTime, title, description, location}]
function buildIcsFile(events) {
  const now = new Date();
  function pad(n) { return String(n).padStart(2, '0'); }
  function fmtUtc(d) {
    return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}Z`;
  }
  function escIcs(s) {
    return String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
  }
  const dtstamp = fmtUtc(now);
  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Wendy 訓練課程//PetCare//ZH-TW',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
  ];
  events.forEach((ev, i) => {
    const dtstart = toGcalLocalString(ev.date, ev.startTime, 14);
    let dtend = ev.endTime ? toGcalLocalString(ev.date, ev.endTime, 15) : '';
    if (!dtend) {
      // 沒填結束 → start + 1 小時
      const m = dtstart.match(/^(\d{8}T)(\d{2})(\d{2})(\d{2})$/);
      if (m) {
        const newH = (parseInt(m[2], 10) + 1) % 24;
        dtend = m[1] + pad(newH) + m[3] + m[4];
      }
    }
    if (!dtstart || !dtend) return;
    const uid = `${ev.uid || (Date.now() + '-' + i)}@wendy-petcare`;
    lines.push('BEGIN:VEVENT');
    lines.push('UID:' + uid);
    lines.push('DTSTAMP:' + dtstamp);
    lines.push('DTSTART:' + dtstart);
    lines.push('DTEND:' + dtend);
    lines.push('SUMMARY:' + escIcs(ev.title));
    if (ev.description) lines.push('DESCRIPTION:' + escIcs(ev.description));
    if (ev.location) lines.push('LOCATION:' + escIcs(ev.location));
    // 前 24 小時提醒
    lines.push('BEGIN:VALARM');
    lines.push('TRIGGER:-P1D');
    lines.push('ACTION:DISPLAY');
    lines.push('DESCRIPTION:' + escIcs('明天有課，記得傳 LINE 提醒給家長：' + ev.title));
    lines.push('END:VALARM');
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  // RFC 5545 用 CRLF
  return lines.join('\r\n');
}

// 觸發瀏覽器下載 .ics 檔
function downloadIcsFile(filename, content) {
  const blob = new Blob([content], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 100);
}

// 把字串複製到剪貼簿，回傳 Promise<boolean>
function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(() => true).catch(() => false);
  }
  // fallback
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return Promise.resolve(ok);
  } catch (e) {
    return Promise.resolve(false);
  }
}
function bookingSubtotal(booking) {
  const n = booking.sessionCount || 0;
  return ((booking.feePerClass || 0) + (booking.transportPerClass || 0)) * n;
}
// 優惠金額（折抵後是正數，要從 subtotal 扣掉）
function bookingDiscount(booking) {
  const sub = bookingSubtotal(booking);
  const v = parseFloat(booking.discountValue) || 0;
  if (booking.discountType === 'amount') return Math.min(v, sub);
  if (booking.discountType === 'percent') return Math.round(sub * v / 100);
  return 0;
}
function bookingTotal(booking) {
  return bookingSubtotal(booking) - bookingDiscount(booking);
}

/* ============== BOOKING ⇄ SESSION 殼 SYNC ============== */
/**
 * 判斷一個 session 殼是不是「空殼」— 沒有任何訓練紀錄、沒有 done 狀態。
 * 空殼可以被自動刪除；非空殼縮減 booking 時要擋住、刪 booking 時要擋住。
 */
function isEmptyShell(s) {
  if (!s) return true;
  // closed / done 都「不算空殼」（有業務意義，不能被 booking 縮減自動刪）
  if (s.status !== 'booked') return false;
  return (!Array.isArray(s.records) || s.records.length === 0)
      && !s.homework
      && !s.notes
      && !s.firstConsultReport
      && !s.fasNotes;
}

/**
 * Dry-run：給定一份 booking，計算需要 spawn / 刪除的殼。
 * 回傳 { ok, error?, toAdd: [sourceIndex], toRemove: [sessionId] }。
 * 規則（採用 Steven「booking 是合約 snapshot」原則）：
 * - 沒對應殼的 sourceIndex → spawn 新殼
 * - 已有殼的 sourceIndex → 不更新（殼是排程 source of truth，改期改在殼上）
 * - 超出新 sessionCount 的殼：空殼可刪、非空殼擋住整次 save
 */
function planBookingShellSync(booking) {
  const all = load(KEYS.sessions, []);
  const existing = all.filter(s => s.sourceBookingId === booking.id);
  const sessionCount = booking.sessionCount || 0;
  const toAdd = [];
  for (let i = 0; i < sessionCount; i++) {
    if (!existing.find(s => s.sourceIndex === i)) toAdd.push(i);
  }
  const toRemove = [];
  const blockers = [];
  for (const s of existing) {
    if (s.sourceIndex == null) continue;
    if (s.sourceIndex >= sessionCount) {
      if (isEmptyShell(s)) toRemove.push(s.id);
      else blockers.push(s.sourceIndex + 1);
    }
  }
  if (blockers.length > 0) {
    return {
      ok: false,
      error: `第 ${blockers.join('、')} 堂已有紀錄或被標記已完成，無法縮減堂數`,
    };
  }
  return { ok: true, toAdd, toRemove };
}

/**
 * 套用 plan：實際把殼新增 / 刪除進 KEYS.sessions。回傳 {spawned, removed, updated}。
 * 額外：把所有現有殼的 courseType / groupSubType / location / sessionTotal 等同步成 booking 最新值。
 */
function applyBookingShellSync(booking, plan) {
  let arr = load(KEYS.sessions, []);
  if (plan.toRemove.length > 0) {
    arr = arr.filter(s => !plan.toRemove.includes(s.id));
  }
  // 同步現有殼的 courseType / 相關欄位（修 booking 改類型後 session 沒跟著改的問題）
  let updated = 0;
  arr = arr.map(s => {
    if (s.sourceBookingId !== booking.id) return s;
    const bs = (booking.sessions && booking.sessions[s.sourceIndex]) || {};
    const newCourseType = booking.courseType || '';
    const newGroupSubType = booking.groupSubType || '';
    const newGroupSubTypeOther = booking.groupSubTypeOther || '';
    const newCourseTypeOther = booking.courseTypeOther || '';
    const newLocation = booking.location || '';
    const newTotal = String(booking.sessionCount || 0);
    const newDate = bs.date || '';
    // 偵測是否真的有差異（避免不必要更新與 lastModified 抖動）
    const changed = (
      s.courseType !== newCourseType ||
      s.groupSubType !== newGroupSubType ||
      s.groupSubTypeOther !== newGroupSubTypeOther ||
      s.courseTypeOther !== newCourseTypeOther ||
      s.location !== newLocation ||
      s.sessionTotal !== newTotal ||
      s.date !== newDate
    );
    if (!changed) return s;
    updated++;
    return {
      ...s,
      courseType: newCourseType,
      groupSubType: newGroupSubType,
      groupSubTypeOther: newGroupSubTypeOther,
      courseTypeOther: newCourseTypeOther,
      location: newLocation,
      sessionTotal: newTotal,
      date: newDate,
    };
  });
  for (const i of plan.toAdd) {
    const bs = (booking.sessions && booking.sessions[i]) || {};
    arr.push({
      id: uid(),
      petId: booking.petId,
      date: bs.date || '',
      duration: 0,
      location: booking.location || '',
      courseType: booking.courseType || '',
      groupSubType: booking.groupSubType || '',
      groupSubTypeOther: booking.groupSubTypeOther || '',
      courseTypeOther: booking.courseTypeOther || '',
      sessionSeq: String(i + 1),
      sessionTotal: String(booking.sessionCount || 0),
      records: [],
      homework: '',
      notes: '',
      gistId: undefined,
      createdAt: new Date().toISOString(),
      status: 'booked',
      sourceBookingId: booking.id,
      sourceIndex: i,
    });
  }
  save(KEYS.sessions, arr);
  return { spawned: plan.toAdd.length, removed: plan.toRemove.length, updated };
}

/**
 * 認親 + 補殼工具（migration / 一次性修復）。
 * 對每份 booking 的每個 sourceIndex：
 *   1. 已有殼 → 跳過
 *   2. 沒殼但有日期 → 找同 petId + 同 date 且未連結的既有 session，補上 sourceBookingId/sourceIndex
 *   3. 還是找不到 → spawn 新空殼
 * 回傳 { newSessions, linked, spawned }。caller 自行決定是否寫入。
 */
function linkLegacyBookingsToSessions() {
  const bookings = load(KEYS.bookings, []);
  const sessions = load(KEYS.sessions, []);
  const newSessions = sessions.slice();
  let linked = 0, spawned = 0;
  for (const b of bookings) {
    const sessionCount = b.sessionCount || 0;
    for (let i = 0; i < sessionCount; i++) {
      const bs = (b.sessions && b.sessions[i]) || {};
      // 該 sourceIndex 已有殼？跳過
      if (newSessions.find(s => s.sourceBookingId === b.id && s.sourceIndex === i)) continue;
      // 找日期 + 寵物 match 的既有 session（未被連結到任何 booking）
      let matched = null;
      if (bs.date) {
        matched = newSessions.find(s =>
          s.petId === b.petId && s.date === bs.date && !s.sourceBookingId
        );
      }
      if (matched) {
        matched.sourceBookingId = b.id;
        matched.sourceIndex = i;
        linked++;
      } else {
        newSessions.push({
          id: uid(),
          petId: b.petId,
          date: bs.date || '',
          duration: 0,
          location: b.location || '',
          courseType: b.courseType || '',
          groupSubType: b.groupSubType || '',
          groupSubTypeOther: b.groupSubTypeOther || '',
          courseTypeOther: b.courseTypeOther || '',
          sessionSeq: String(i + 1),
          sessionTotal: String(sessionCount),
          records: [],
          homework: '',
          notes: '',
          gistId: undefined,
          createdAt: new Date().toISOString(),
          status: 'booked',
          sourceBookingId: b.id,
          sourceIndex: i,
        });
        spawned++;
      }
    }
  }
  return { newSessions, linked, spawned };
}

/**
 * 刪除 booking 時連帶處理殼：空殼直接刪、有紀錄則 throw（block 整次 booking 刪除）。
 * 回傳 { ok, error?, removed }。
 */
function cleanupBookingShells(bookingId) {
  const all = load(KEYS.sessions, []);
  const shells = all.filter(s => s.sourceBookingId === bookingId);
  const blockers = shells.filter(s => !isEmptyShell(s));
  if (blockers.length > 0) {
    return {
      ok: false,
      error: `課程預約對應的第 ${blockers.map(s => s.sourceIndex + 1).join('、')} 堂已有紀錄或已完成，請先處理那幾堂再刪`,
    };
  }
  const filtered = all.filter(s => s.sourceBookingId !== bookingId);
  save(KEYS.sessions, filtered);
  return { ok: true, removed: shells.length };
}

/* ============== 全局 money / method helpers ============== */
function fmtMoney(n) {
  if (n == null || isNaN(n)) return 'NT$ 0';
  return 'NT$ ' + Math.round(Number(n)).toLocaleString('zh-TW');
}
function methodLabel(m) {
  return ({
    cash: '現金', transfer: '轉帳', linepay: 'Line Pay', other: '其他',
  })[m] || (m || '—');
}

/* ============== PAYMENT (收款 / 退費) ============== */
/**
 * 確保 payment 物件 shape（讀取時做 migration / 防呆）
 */
function ensurePaymentShape(arr) {
  if (!Array.isArray(arr)) return [];
  return arr.map(p => {
    if (!p || typeof p !== 'object') return p;
    return {
      id: p.id,
      bookingId: p.bookingId || '',
      type: (p.type === 'in' || p.type === 'refund') ? p.type : 'in',
      amount: Number(p.amount) || 0,
      date: p.date || '',
      method: p.method || '',  // cash / transfer / linepay / other
      note: p.note || '',
      createdAt: p.createdAt || new Date().toISOString(),
    };
  });
}

/** 取某 booking 的所有 payments（按日期新→舊） */
function getBookingPayments(bookingId) {
  const all = load(KEYS.payments, []);
  return all
    .filter(p => p.bookingId === bookingId)
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
}

/** 該 booking 的應收 / 實收 / 退費 / 餘額 */
function bookingPaymentSummary(booking) {
  const total = bookingTotal(booking);
  const payments = getBookingPayments(booking.id);
  const received = payments.filter(p => p.type === 'in').reduce((s, p) => s + p.amount, 0);
  const refunded = payments.filter(p => p.type === 'refund').reduce((s, p) => s + p.amount, 0);
  // 應收餘額 = 總額 - 實收 + 退費
  const balance = total - received + refunded;
  return { total, received, refunded, balance, payments };
}

/**
 * 權責發生制 derived metric：
 * - recognizedRev: 已認列收入（done 課時 × 單堂單價）
 * - deferredRev: 預收款（淨實收 - 已認列；正數表示客戶已付未上）
 * - receivable: 應收款（已認列 - 淨實收；正數表示已上完課但客戶沒付齊）
 * - netReceived: 淨實收（實收 - 退費）
 *
 * 概念：
 * - 收到錢 ≠ 認列收入
 * - 上完一堂課，那堂的金額才從「預收款」轉成「已認列收入」
 * - 客戶取消強制結案的部分如果沒退費，理論上 forfeit revenue（但目前 UI 不直接顯示，看 stats 頁的「未兌現呆帳」）
 */
function bookingRevenueRecognition(booking) {
  const summary = bookingPaymentSummary(booking);
  const sessions = load(KEYS.sessions, []);
  const bSess = sessions.filter(s => s.sourceBookingId === booking.id);
  const sessCount = booking.sessionCount || 0;
  const pricePerSess = sessCount > 0 ? summary.total / sessCount : 0;
  const doneCount = bSess.filter(s => s.status === 'done').length;
  const recognizedRev = doneCount * pricePerSess;
  const netReceived = summary.received - summary.refunded;
  const deferredRev = Math.max(0, netReceived - recognizedRev);
  const receivable = Math.max(0, recognizedRev - netReceived);
  return { recognizedRev, deferredRev, receivable, netReceived, doneCount, pricePerSess };
}

/** 寫入 / 更新 / 刪除 payment */
function savePayment(payment) {
  const all = load(KEYS.payments, []);
  const idx = all.findIndex(p => p.id === payment.id);
  const now = new Date().toISOString();
  const final = Object.assign({}, payment, {
    id: payment.id || uid(),
    createdAt: payment.createdAt || now,
  });
  if (idx >= 0) all[idx] = final;
  else all.push(final);
  save(KEYS.payments, all);
  return final;
}
function deletePayment(paymentId) {
  const all = load(KEYS.payments, []);
  save(KEYS.payments, all.filter(p => p.id !== paymentId));
}

/* ============== MATERIAL (給家長 PDF 附錄用的教材) ============== */
function ensureMaterialShape(arr) {
  if (!Array.isArray(arr)) return [];
  return arr.map(m => {
    if (!m || typeof m !== 'object') return m;
    return {
      id: m.id,
      title: m.title || '',
      url: typeof m.url === 'string' ? m.url : '',  // 外部連結（如 YT 影片 URL，可空）
      content: ensureColorHtml(m.content || ''),     // HTML 文章內容（可空）
      createdAt: m.createdAt || new Date().toISOString(),
      updatedAt: m.updatedAt || m.createdAt || new Date().toISOString(),
    };
  });
}
/** 判斷教材有哪些 type（給 UI 顯示 icon 用） */
function materialTypeLabel(m) {
  if (!m) return '';
  const hasContent = m.content && m.content.replace(/<[^>]+>/g, '').trim().length > 0;
  const hasUrl = m.url && m.url.trim();
  if (hasContent && hasUrl) return '📝🔗';
  if (hasContent) return '📝';
  if (hasUrl) return '🔗';
  return '';
}
function getAllMaterials() {
  return load(KEYS.materials, []).slice().sort((a, b) =>
    (b.updatedAt || '').localeCompare(a.updatedAt || '')
  );
}
function getMaterialById(id) {
  return load(KEYS.materials, []).find(m => m.id === id) || null;
}
function saveMaterial(material) {
  const all = load(KEYS.materials, []);
  const idx = all.findIndex(m => m.id === material.id);
  const now = new Date().toISOString();
  const final = Object.assign({}, material, {
    id: material.id || uid(),
    content: sanitizeColorHtml(material.content || ''),
    createdAt: material.createdAt || now,
    updatedAt: now,
  });
  if (idx >= 0) all[idx] = final; else all.push(final);
  save(KEYS.materials, all);
  return final;
}
function deleteMaterial(materialId) {
  const all = load(KEYS.materials, []);
  save(KEYS.materials, all.filter(m => m.id !== materialId));
  // 也清掉 sessions 引用
  const sessions = load(KEYS.sessions, []);
  let dirty = false;
  for (const s of sessions) {
    if (Array.isArray(s.attachedMaterialIds) && s.attachedMaterialIds.includes(materialId)) {
      s.attachedMaterialIds = s.attachedMaterialIds.filter(id => id !== materialId);
      dirty = true;
    }
  }
  if (dirty) save(KEYS.sessions, sessions);
}

/**
 * 給 PDF 模板用：產出附錄頁 HTML（教材內容 + 外部連結）。
 * 每筆教材一個 page-break-before 的新頁；連結也獨立一頁。
 */
function attachmentPdfHtml(sess) {
  if (!sess) return '';
  const matIds = sess.attachedMaterialIds || [];
  const sessLinks = (sess.externalLinks || []).filter(l => l && l.url);
  if (matIds.length === 0 && sessLinks.length === 0) return '';

  const allMats = load(KEYS.materials, []);
  const matMap = {};
  allMats.forEach(m => { matMap[m.id] = m; });

  // 把 attached materials 拆兩堆：有 content 的進「文章附錄頁」、有 url 的進「連結 list」
  const articleMats = [];
  const linkEntries = [];
  for (const id of matIds) {
    const m = matMap[id];
    if (!m) continue;
    const hasContent = m.content && m.content.replace(/<[^>]+>/g, '').trim().length > 0;
    const hasUrl = m.url && m.url.trim();
    if (hasContent) articleMats.push(m);
    if (hasUrl) linkEntries.push({ title: m.title || '', url: m.url });
  }
  // session 額外連結（ad-hoc）
  for (const l of sessLinks) linkEntries.push(l);
  // 去重
  const seenUrl = new Set();
  const links = linkEntries.filter(l => {
    if (!l.url || seenUrl.has(l.url)) return false;
    seenUrl.add(l.url);
    return true;
  });

  if (articleMats.length === 0 && links.length === 0) return '';

  const matsHtml = articleMats.map(m => `
    <section style="page-break-before:always; padding-top:18pt">
      <h2 style="color:#6b5435; font-size:16pt; margin:0 0 12pt; border-bottom:2pt solid #c9a85a; padding-bottom:6pt">📚 ${escapeHtml(m.title || '附錄')}</h2>
      <div style="font-size:11pt; line-height:1.7; color:#2d2620">${ensureColorHtml(m.content)}</div>
    </section>
  `).join('');
  // 連結 section 不強制換頁（接著前段，省空白）；用 page-break-inside:avoid 避免列表中段斷頁
  const linksHtml = links.length === 0 ? '' : `
    <section style="margin-top:20pt; page-break-inside:avoid">
      <h2 style="color:#6b5435; font-size:14pt; margin:0 0 8pt; border-bottom:1.5pt solid #c9a85a; padding-bottom:4pt">🔗 相關資源連結</h2>
      <ul style="font-size:11pt; line-height:1.5; color:#2d2620; padding-left:20pt; margin:0">
        ${links.map(l => `
          <li style="margin-bottom:6pt">
            <b>${escapeHtml(l.title || l.url)}</b><br>
            <span style="font-size:9pt; color:#8a7e6f; word-break:break-all">${escapeHtml(l.url)}</span>
          </li>
        `).join('')}
      </ul>
    </section>
  `;
  return matsHtml + linksHtml;
}

/** session 已附加的教材 + 連結 數量摘要（給按鈕 label 用） */
function attachmentSummary(sess) {
  if (!sess) return { total: 0, mat: 0, link: 0 };
  const mat = (sess.attachedMaterialIds || []).length;
  const link = (sess.externalLinks || []).filter(l => l && l.url).length;
  return { total: mat + link, mat, link };
}

/** 開「附加資料」modal — 勾教材 + 外部連結，存到 session */
function openAttachmentForm(sess, onSaved) {
  const allMats = getAllMaterials();
  let links = JSON.parse(JSON.stringify(sess.externalLinks || []));
  const attachedSet = new Set(sess.attachedMaterialIds || []);

  const html = `
    <div class="modal" style="max-width:520px">
      <h2>📎 附加資料給家長</h2>
      <p class="card-meta" style="margin:0 0 12px; font-size:12px">
        勾選的教材 + 填好的連結，會出現在這堂課 PDF 報告的「附錄」頁。
      </p>

      <h3 style="font-size:14px; color:var(--brown-dark); margin:8px 0">📚 從教材庫挑（這隻狗適合的）</h3>
      ${allMats.length === 0
        ? '<div style="padding:10px; color:var(--text-soft); font-size:12px; background:rgba(0,0,0,0.03); border-radius:6px">尚無教材。請到 ⚙ 設定 → 教材庫 新增。</div>'
        : `<div style="max-height:280px; overflow-y:auto; padding:6px 10px; border:1px solid var(--border); border-radius:6px; margin-bottom:14px">
            ${allMats.map(m => {
              const typeIcon = materialTypeLabel(m);
              const urlPreview = m.url ? `<div style="font-size:11px; color:var(--text-soft); word-break:break-all; padding-left:24px">${escapeHtml(m.url)}</div>` : '';
              return `
                <label style="display:block; padding:6px 0; cursor:pointer; border-bottom:1px solid rgba(0,0,0,0.05)">
                  <div style="display:flex; align-items:center; gap:8px">
                    <input type="checkbox" data-mat-attach="${m.id}" ${attachedSet.has(m.id) ? 'checked' : ''} style="width:16px; height:16px; flex-shrink:0">
                    <span style="font-size:13px"><span style="margin-right:4px">${typeIcon}</span>${escapeHtml(m.title || '(未命名)')}</span>
                  </div>
                  ${urlPreview}
                </label>
              `;
            }).join('')}
          </div>
          <p class="card-meta" style="font-size:11px; margin:0 0 14px">📝 = 文章 / 🔗 = 外部連結 / 📝🔗 = 兩者都有</p>`}

      <h3 style="font-size:14px; color:var(--brown-dark); margin:14px 0 8px">🔗 這堂課額外加的連結</h3>
      <p class="card-meta" style="font-size:12px; margin-bottom:8px">只給這堂課用的（如：客戶問了某個特殊問題，給對應教學連結）— 不會進教材庫</p>
      <div id="linksList"></div>
      <button class="small-btn" id="addLinkBtn" type="button" style="margin-top:6px">+ 新增連結</button>

      <div class="modal-actions" style="margin-top:18px">
        <button class="btn ghost" id="att_cancel">取消</button>
        <button class="btn" id="att_save">儲存</button>
      </div>
    </div>
  `;
  const overlay = openModal(html);
  function renderLinksList() {
    const wrap = overlay.querySelector('#linksList');
    if (!wrap) return;
    if (links.length === 0) {
      wrap.innerHTML = '<div style="font-size:12px; color:var(--text-soft); padding:6px">尚無連結</div>';
      return;
    }
    wrap.innerHTML = links.map((l, i) => `
      <div style="display:flex; gap:6px; margin-bottom:6px; align-items:center">
        <input type="text" data-link-title="${i}" placeholder="標題（如「散步教學影片」）" value="${escapeAttr(l.title || '')}" style="flex:1; min-width:80px">
        <input type="url" data-link-url="${i}" placeholder="https://..." value="${escapeAttr(l.url || '')}" style="flex:2; min-width:120px">
        <button class="small-btn" data-link-del="${i}" type="button" style="border-color:var(--work); color:var(--work); flex-shrink:0">×</button>
      </div>
    `).join('');
    wrap.querySelectorAll('[data-link-title]').forEach(el => {
      el.oninput = () => { links[parseInt(el.dataset.linkTitle,10)].title = el.value; };
    });
    wrap.querySelectorAll('[data-link-url]').forEach(el => {
      el.oninput = () => { links[parseInt(el.dataset.linkUrl,10)].url = el.value; };
    });
    wrap.querySelectorAll('[data-link-del]').forEach(el => {
      el.onclick = () => { links.splice(parseInt(el.dataset.linkDel,10), 1); renderLinksList(); };
    });
  }
  renderLinksList();
  overlay.querySelector('#addLinkBtn').onclick = () => {
    links.push({ title: '', url: '' });
    renderLinksList();
  };
  overlay.querySelector('#att_cancel').onclick = () => overlay.remove();
  overlay.querySelector('#att_save').onclick = () => {
    const newAttached = [];
    overlay.querySelectorAll('[data-mat-attach]').forEach(cb => {
      if (cb.checked) newAttached.push(cb.dataset.matAttach);
    });
    const cleanLinks = links
      .map(l => ({ title: (l.title || '').trim(), url: cleanUrl((l.url || '').trim()) }))
      .filter(l => l.url);
    const all = load(KEYS.sessions, []);
    const idx = all.findIndex(s => s.id === sess.id);
    if (idx >= 0) {
      all[idx].attachedMaterialIds = newAttached;
      all[idx].externalLinks = cleanLinks;
      save(KEYS.sessions, all);
      // 同步更新傳入的 sess 物件（caller 可繼續用）
      sess.attachedMaterialIds = newAttached;
      sess.externalLinks = cleanLinks;
    }
    overlay.remove();
    if (typeof onSaved === 'function') onSaved();

function ensureStudioPaymentShape(arr) {
  if (!Array.isArray(arr)) return [];
  return arr.map(p => {
    if (!p || typeof p !== 'object') return p;
    return {
      id: p.id,
      studioName: p.studioName || '',
      date: p.date || '',
      amount: Number(p.amount) || 0,
      period: p.period || '',  // 'YYYY-MM'
      note: p.note || '',
      createdAt: p.createdAt || new Date().toISOString(),
    };
  });
}

function getAllStudioPayments() {
  return load(KEYS.studioPayments, []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
}
function getStudioPaymentsByName(studioName) {
  return getAllStudioPayments().filter(p => p.studioName === studioName);
}
function saveStudioPayment(payment) {
  const all = load(KEYS.studioPayments, []);
  const idx = all.findIndex(p => p.id === payment.id);
  const final = Object.assign({}, payment, {
    id: payment.id || uid(),
    createdAt: payment.createdAt || new Date().toISOString(),
  });
  if (idx >= 0) all[idx] = final; else all.push(final);
  save(KEYS.studioPayments, all);
  return final;
}
function deleteStudioPayment(paymentId) {
  const all = load(KEYS.studioPayments, []);
  save(KEYS.studioPayments, all.filter(p => p.id !== paymentId));
}

// 24h "16:00" → 「下午4:00」；空字串維持空
function fmtTime12(hhmm) {
  if (!hhmm) return '';
  const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm);
  if (!m) return hhmm;
  let h = parseInt(m[1], 10);
  const ampm = h < 12 ? '上午' : '下午';
  if (h === 0) h = 12;
  else if (h > 12) h -= 12;
  return `${ampm}${h}:${m[2]}`;
}
function fmtTimeRange(start, end) {
  if (!start && !end) return '';
  if (!end) return fmtTime12(start);
  // 同上午/下午只前綴一次
  const s = fmtTime12(start), e = fmtTime12(end);
  const sP = s.startsWith('上午') || s.startsWith('下午') ? s.slice(0, 2) : '';
  const eP = e.startsWith('上午') || e.startsWith('下午') ? e.slice(0, 2) : '';
  if (sP && sP === eP) return s + '-' + e.slice(2);
  return s + '-' + e;
}
function fmtMoney(n) { return 'NT$ ' + (n || 0).toLocaleString('en-US'); }

function openBookingMenu(anchorBtn, bookingId) {
  document.querySelectorAll('.card-menu').forEach(m => m.remove());
  const rect = anchorBtn.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.className = 'card-menu';
  menu.style.position = 'fixed';
  menu.style.top = (rect.bottom + 4) + 'px';
  menu.style.right = (window.innerWidth - rect.right) + 'px';
  menu.innerHTML = `
    <button data-act="edit">✏️ 編輯</button>
    <button data-act="pdf">🖨 列印 / 存 PDF</button>
    <button data-act="delete" class="danger">🗑 刪除</button>
  `;
  document.body.appendChild(menu);
  setTimeout(() => {
    const close = (e) => {
      if (!menu.contains(e.target)) {
        menu.remove();
        document.removeEventListener('click', close);
      }
    };
    document.addEventListener('click', close);
  }, 0);
  menu.querySelector('[data-act="edit"]').onclick = () => {
    menu.remove();
    go('booking', { petId: state.petId, bookingId });
  };
  menu.querySelector('[data-act="pdf"]').onclick = () => {
    menu.remove();
    const b = getBooking(bookingId);

    if (b && p) exportBookingPdf(b, p);
  };
  menu.querySelector('[data-act="delete"]').onclick = () => {
    menu.remove();
    if (!confirm('刪除這筆課程預約？')) return;
    const cleanup = cleanupBookingShells(bookingId);
    if (!cleanup.ok) {
      showNotice(cleanup.error, 'err');
      return;
    }
    save(KEYS.bookings, load(KEYS.bookings, []).filter(b => b.id !== bookingId));
    const removedPayments = cleanupBookingPayments(bookingId);
    let msg = '已刪除';
    if (cleanup.removed > 0) msg += ` · 移除 ${cleanup.removed} 筆空白紀錄`;
    if (removedPayments > 0) msg += ` · 移除 ${removedPayments} 筆收款紀錄`;
    showNotice(msg);
    render();
  };
}

          </div>
          <div style="display:flex; align-items:center; gap:8px;" id="bk_discountValueRow" ${b.discountType?'':'hidden'}>
            <div style="flex:0 0 60px"></div>
            <input id="bk_discountValue" type="number" min="0" value="${b.discountValue||0}" style="flex:0 0 100px;">
            <div style="flex:0 0 24px; color:var(--text-soft);" id="bk_discountUnit">${b.discountType==='percent'?'%':'$'}</div>
            <div style="flex:1; text-align:right; color:var(--work); font-weight:500;" id="bk_discountSubtotal">- $ ${bookingDiscount(b).toLocaleString()}</div>

        </div>

        <div style="display:flex; justify-content:space-between; padding-top:10px; margin-top:8px; border-top:1px solid var(--brown-light); font-weight:600; color:var(--work)">
          <div>合計</div>
          <div id="bk_total">${fmtMoney(bookingTotal(b))}</div>

      </div>

      <div class="card" style="cursor:default; display:${b.isStudioBooking ? 'none' : 'block'}">
        <div class="row2">
          <div class="field">
            <label>繳費截止日</label>
            <input id="bk_due" type="date" value="${escapeAttr(b.paymentDueDate||'')}">
          </div>
          <div class="field">
            <label>截止備註</label>
            <select id="bk_dueNote">
              <option value="" ${b.paymentDueNote===''?'selected':''}>—</option>
              <option value="中午前" ${b.paymentDueNote==='中午前'?'selected':''}>中午前</option>
              <option value="下午前" ${b.paymentDueNote==='下午前'?'selected':''}>下午前</option>
              <option value="晚上前" ${b.paymentDueNote==='晚上前'?'selected':''}>晚上前</option>
            </select>
          </div>
        </div>
      </div>

      ${(() => {
        if (b.isStudioBooking) return `
          <div style="margin-top:18px; padding:14px; background:rgba(255,217,102,0.15); border:1px solid #c9a85a; border-radius:8px">
            <div style="font-weight:600; color:var(--brown-dark); margin-bottom:4px">🏫 教室派案 booking</div>
            <p class="card-meta" style="margin:0; font-size:12px; line-height:1.7">
              教室付款是月結、跨多個 booking／多隻寵物，<b>不在這裡記</b>。<br>
              請到 <b>📊 會計頁</b>「教室派案」區，按教室記錄每筆月結款項。
            </p>
          </div>`;
        if (!isEdit) return `
          <div style="margin-top:18px; padding:14px; background:rgba(240,230,214,0.3); border-radius:8px; text-align:center; color:var(--text-soft); font-size:13px">
            • 請先儲存課程預約（按下方「儲存」），才能記錄實際收款 / 退費
          </div>`;
        const summary = bookingPaymentSummary(b);
        const recog = bookingRevenueRecognition(b);
        const balanceLabel = summary.balance > 0 ? '應收餘額' : (summary.balance < 0 ? '已超收' : '已結清');
        const balanceCls = summary.balance > 0 ? 'warn' : (summary.balance < 0 ? 'warn' : 'good');
        const paymentRows = summary.payments.length === 0
          ? `<tr><td colspan="6" style="padding:14px; text-align:center; color:var(--text-soft); border:1px solid var(--border)">尚無收款 / 退費紀錄</td></tr>`
          : summary.payments.map(p => `
              <tr data-payid="${p.id}" style="cursor:pointer">
                <td style="padding:6px 8px; border:1px solid var(--border); white-space:nowrap">${escapeHtml(fmtDate(p.date) || '—')}</td>
                <td style="padding:6px 8px; border:1px solid var(--border); color:${p.type==='in'?'#4a7d4d':'var(--work)'}; white-space:nowrap">${p.type==='in'?'+ 收款':'− 退費'}</td>
                <td style="padding:6px 8px; border:1px solid var(--border); text-align:right; font-weight:600; color:${p.type==='in'?'#4a7d4d':'var(--work)'}; white-space:nowrap">${p.type==='refund'?'−':''}${fmtMoney(p.amount)}</td>
                <td style="padding:6px 8px; border:1px solid var(--border); white-space:nowrap">${escapeHtml(methodLabel(p.method))}</td>
                <td style="padding:6px 8px; border:1px solid var(--border); font-size:12px; color:var(--text-soft)">${escapeHtml(p.note || '')}</td>
                <td style="padding:6px 8px; border:1px solid var(--border); text-align:center; color:var(--text-soft)">⋯</td>
              </tr>
            `).join('');
        return `
          <div style="margin-top:18px; padding:14px; background:rgba(240,230,214,0.4); border-radius:8px">
            <h3 style="margin:0 0 12px; font-size:15px; color:var(--brown-dark)">💰 收款紀錄</h3>
            <div style="font-size:11px; color:var(--text-soft); margin-bottom:4px">合約 / 金流</div>
            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap:8px; margin-bottom:8px">
              <div class="stat-card"><div class="stat-label">應收</div><div class="stat-value">${fmtMoney(summary.total)}</div></div>
              <div class="stat-card good"><div class="stat-label">實收</div><div class="stat-value">${fmtMoney(summary.received)}</div></div>
              <div class="stat-card warn"><div class="stat-label">退費</div><div class="stat-value">${fmtMoney(summary.refunded)}</div></div>
              <div class="stat-card ${balanceCls}"><div class="stat-label">${balanceLabel}</div><div class="stat-value">${fmtMoney(Math.abs(summary.balance))}</div></div>
            </div>
            <div style="font-size:11px; color:var(--text-soft); margin-bottom:4px">收入認列（每上完一堂從預收款轉認列）</div>
            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap:8px; margin-bottom:12px">
              <div class="stat-card good"><div class="stat-label">已認列收入</div><div class="stat-value">${fmtMoney(recog.recognizedRev)}</div><div class="stat-pct">${recog.doneCount}/${b.sessionCount} 堂</div></div>
              <div class="stat-card"><div class="stat-label">預收款</div><div class="stat-value">${fmtMoney(recog.deferredRev)}</div><div class="stat-pct" style="color:var(--text-soft)">已收未上的</div></div>
              ${recog.receivable > 0 ? `<div class="stat-card warn"><div class="stat-label">已上未收</div><div class="stat-value">${fmtMoney(recog.receivable)}</div><div class="stat-pct">已上但客戶沒付齊</div></div>` : ''}
            </div>
            <div style="overflow-x:auto">
            <table style="width:100%; border-collapse:collapse; font-size:13px; min-width:520px">
              <thead>
                <tr style="background:#f0e6d6; color:#6b5435; text-align:left">
                  <th style="padding:6px 8px; border:1px solid var(--border)">日期</th>
                  <th style="padding:6px 8px; border:1px solid var(--border)">類型</th>
                  <th style="padding:6px 8px; border:1px solid var(--border); text-align:right">金額</th>
                  <th style="padding:6px 8px; border:1px solid var(--border)">方式</th>
                  <th style="padding:6px 8px; border:1px solid var(--border)">備註</th>
                  <th style="padding:6px 8px; border:1px solid var(--border)"></th>
                </tr>
              </thead>
              <tbody id="paymentsTbody">${paymentRows}</tbody>
            </table>
            </div>
            <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap">
              <button type="button" class="small-btn" id="addPaymentIn">+ 新增收款</button>
              <button type="button" class="small-btn" id="addPaymentRefund" style="border-color:var(--work); color:var(--work)">− 新增退費</button>
            </div>
          </div>`;
      })()}

      <div class="actions-row" style="margin-top:14px">
        <button class="btn" id="bk_save">💾 儲存</button>
        <button class="btn ghost" id="bk_pdf">🖨 預覽 / 列印 PDF</button>
        ${isEdit ? '<button class="btn danger" id="bk_del">刪除</button>' : ''}
      </div>
    `;

    // 事件
    // 課程類型 radio
    main.querySelectorAll('input[name="bkCourseType"]').forEach(r => {
      r.onchange = () => {
        b.courseType = r.value;
        // 切到 group 而 groupSubType 是空字串時，預設選 puppy
        if (b.courseType === 'group' && !b.groupSubType) b.groupSubType = 'puppy';
        // 教室派案：切換 courseType 時自動更新鐘點費
        if (b.isStudioBooking && pet.studioRates) {
          b.feePerClass = pet.studioRates[b.courseType] || 0;
        }
        rerender();
      };
    });
    const grpSel = document.getElementById('bk_groupSubType');
    if (grpSel) grpSel.onchange = (e) => {
      b.groupSubType = e.target.value;
      rerender();
    };
    const grpOther = document.getElementById('bk_groupSubTypeOther');
    if (grpOther) grpOther.oninput = (e) => { b.groupSubTypeOther = e.target.value; };
    const ctOther = document.getElementById('bk_courseTypeOther');
    if (ctOther) ctOther.oninput = (e) => { b.courseTypeOther = e.target.value; };
    main.querySelectorAll('input[name="bkCount"]').forEach(r => {
      r.onchange = () => {
        b.sessionCount = parseInt(r.value, 10);
        alignSessions();
        rerender();
      };
    });
    main.querySelectorAll('#bk_sessions input').forEach(inp => {
      inp.onchange = () => {
        const i = parseInt(inp.dataset.i, 10);
        b.sessions[i][inp.dataset.f] = inp.value;
        // 重繪以更新 📅 按鈕的 enabled 狀態（日期填了才能點）
        rerender();
      };
    });
    // 每堂的 📅 行事曆按鈕（單筆跳 Google Cal）
    main.querySelectorAll('.gcal-row-btn[data-gcal-i]').forEach(btn => {
      btn.onclick = (e) => {
        e.preventDefault();
        const i = parseInt(btn.dataset.gcalI, 10);
        const opts = gcalOptsFromBooking(b, i, pet);
        if (!opts) { showNotice('日期未填，無法加入行事曆', 'err'); return; }
        const url = buildGoogleCalUrl(opts);
        if (!url) { showNotice('日期或時間格式錯誤', 'err'); return; }
        window.open(url, '_blank');
      };
    });
    // 批次下載 .ics
    const icsBtn = document.getElementById('bk_downloadIcs');
    if (icsBtn) {
      icsBtn.onclick = (e) => {
        e.preventDefault();
        const events = b.sessions
          .map((s, i) => {
            if (!s.date) return null;
            const opts = gcalOptsFromBooking(b, i, pet);
            return opts ? { ...opts, uid: `${b.id || 'new'}-${i}` } : null;
          })
          .filter(Boolean);
        if (events.length === 0) { showNotice('還沒有任何已填日期的課程', 'err'); return; }
        // 加 description 第一行，方便家長行事曆辨識
        events.forEach(ev => {
          ev.description = `🐾 ${pet.name || ''}\n${ev.description || ''}`;
        });
        const ics = buildIcsFile(events);
        const fname = `行事曆_${pet.name || '寵物'}_${todayStr()}.ics`;
        downloadIcsFile(fname, ics);
        showNotice(`✓ 已下載 ${events.length} 堂課的行事曆檔，匯入後會自動設定前一天提醒`);
      };
    }
    document.getElementById('bk_location').onchange = (e) => { b.location = e.target.value.trim(); };
    document.getElementById('bk_fee').oninput = (e) => {
      b.feePerClass = parseInt(e.target.value, 10) || 0;
      document.getElementById('bk_feeSubtotal').textContent = '$ ' + (b.feePerClass*b.sessionCount).toLocaleString();
      document.getElementById('bk_total').textContent = fmtMoney(bookingTotal(b));
    };
    document.getElementById('bk_transport').oninput = (e) => {
      b.transportPerClass = parseInt(e.target.value, 10) || 0;
      document.getElementById('bk_transportSubtotal').textContent = '$ ' + (b.transportPerClass*b.sessionCount).toLocaleString();
      document.getElementById('bk_total').textContent = fmtMoney(bookingTotal(b));
    };
    document.getElementById('bk_due').onchange = (e) => { b.paymentDueDate = e.target.value; };
    document.getElementById('bk_dueNote').onchange = (e) => { b.paymentDueNote = e.target.value; };

    // 優惠：類型切換 → 顯示/隱藏值欄、改單位、enable label
    function refreshDiscountUI() {
      const valueRow = document.getElementById('bk_discountValueRow');
      const labelInp = document.getElementById('bk_discountLabel');
      const unit = document.getElementById('bk_discountUnit');
      if (b.discountType) {
        valueRow.removeAttribute('hidden');
        labelInp.removeAttribute('disabled');
        unit.textContent = b.discountType === 'percent' ? '%' : '$';
      } else {
        valueRow.setAttribute('hidden', '');
        labelInp.setAttribute('disabled', '');
      }
      document.getElementById('bk_discountSubtotal').textContent = '- $ ' + bookingDiscount(b).toLocaleString();
      document.getElementById('bk_total').textContent = fmtMoney(bookingTotal(b));
    }
    document.getElementById('bk_discountType').onchange = (e) => {
      b.discountType = e.target.value;
      if (!b.discountType) { b.discountValue = 0; b.discountLabel = ''; }
      refreshDiscountUI();
    };
    document.getElementById('bk_discountLabel').oninput = (e) => { b.discountLabel = e.target.value; };
    document.getElementById('bk_discountValue').oninput = (e) => {
      b.discountValue = parseFloat(e.target.value) || 0;
      refreshDiscountUI();
    };
    // 課程/交通/堂數變動時也要重算優惠 (百分比情況)
    const origFeeHandler = document.getElementById('bk_fee').oninput;
    document.getElementById('bk_fee').oninput = (e) => {
      origFeeHandler(e);
      refreshDiscountUI();
    };
    const origTransHandler = document.getElementById('bk_transport').oninput;
    document.getElementById('bk_transport').oninput = (e) => {
      origTransHandler(e);
      refreshDiscountUI();
    };

    document.getElementById('bk_save').onclick = () => commitBooking({ thenPdf: false });
    document.getElementById('bk_pdf').onclick = () => commitBooking({ thenPdf: true });

    // 收款 / 退費 按鈕（只在 isEdit 時存在）
    const addInBtn = document.getElementById('addPaymentIn');
    if (addInBtn) addInBtn.onclick = () => openPaymentForm(b.id, null, 'in');
    const addRefBtn = document.getElementById('addPaymentRefund');
    if (addRefBtn) addRefBtn.onclick = () => openPaymentForm(b.id, null, 'refund');
    // 點 payment row → 編輯
    document.querySelectorAll('#paymentsTbody tr[data-payid]').forEach(tr => {
      tr.onclick = () => {
        const pid = tr.dataset.payid;
        const all = load(KEYS.payments, []);
        const p = all.find(x => x.id === pid);
        if (p) openPaymentForm(b.id, p);
      };
    });
    if (isEdit) {
      document.getElementById('bk_del').onclick = () => {
        if (!confirm('刪除這筆課程預約？')) return;
        const cleanup = cleanupBookingShells(b.id);
        if (!cleanup.ok) {
          showNotice(cleanup.error, 'err');
          return;
        }
        save(KEYS.bookings, load(KEYS.bookings, []).filter(x => x.id !== b.id));
        const removedPayments = cleanupBookingPayments(b.id);
        let msg = '已刪除';
        if (cleanup.removed > 0) msg += ` · 移除 ${cleanup.removed} 筆空白紀錄`;
        if (removedPayments > 0) msg += ` · 移除 ${removedPayments} 筆收款紀錄`;
        showNotice(msg);
        go('bookings', { petId: pet.id });
      };
    }
  }

  function commitBooking({ thenPdf }) {
    // 第 1 堂必填，其他堂可空（上完前一堂再回來補）
    if (!b.sessions[0] || !b.sessions[0].date) {
      showNotice('請至少填第 1 堂的日期', 'err');
      return;
    }
    const now = new Date().toISOString();
    const updated = Object.assign({}, b, {
      id: b.id || uid(),
      createdAt: b.createdAt || now,
      updatedAt: now,
    });
    // 先 dry-run 殼同步，能過再真的存 booking（避免 booking 跟殼 desync）
    const plan = planBookingShellSync(updated);
    if (!plan.ok) {
      showNotice(plan.error, 'err');
      return;
    }
    const all = load(KEYS.bookings, []);
    const idx = all.findIndex(x => x.id === updated.id);
    if (idx >= 0) all[idx] = updated; else all.push(updated);
    save(KEYS.bookings, all);
    const sync = applyBookingShellSync(updated, plan);
    let msg = '已儲存';
    if (sync.spawned > 0) msg += ` · 新增 ${sync.spawned} 堂預約`;
    if (sync.removed > 0) msg += ` · 移除 ${sync.removed} 筆空白紀錄`;
    showNotice(msg);
    if (thenPdf) {
      exportBookingPdf(updated, pet);
    } else if (!isEdit) {
      // 第一次新增 → 跳到編輯模式 (帶 id)
      go('booking', { petId: pet.id, bookingId: updated.id });
    }
  }

  renderInner();
}

// FAS 等級描述（從 FAS Spectrum 標準）
const FAS_DESCRIPTIONS = {
  '0': '沒有 FAS 的徵兆，表現出放鬆的肢體語言，並願意與家庭成員進行社交互動。',
  '1': '表現出 1 或 2 個輕微 FAS 的徵兆：流口水、舔唇、不願意眼神接觸、轉過頭但不走開、抬起腳掌、瞳孔部分放大和/或喘氣（嘴巴微微張開），每分鐘發生少於 4 次。對零食或玩具感興趣，並會與家庭成員進行社交互動。',
  '2': '表現出 1 到 2 個中度 FAS 的徵兆：耳朵稍微向後或向某一側、尾巴朝下、皺眉頭、移動緩慢、過度尋求關注 和/或張開口緊繃的喘著氣。容易接受零食或玩具，仍希望與家庭成員進行社交互動。',
  '3': '出現超過 2 個中等程度的 FAS 徵兆，在一分鐘內發生 4 次以上。可能會拒絕零食或玩具，或很急促地吃下進食。也可能不太想與互動，但不會主動避開。',
  '4': '不具有攻擊行為的強烈 FAS 徵兆：僵住、坐立不安、迴避、瞳孔放大、過度喘氣、呼吸頻率加快、頭抖、緊閉尾巴、耳朵向後 和/或尾巴捲起或擺動。可能不接受任何零食或玩具，沒興趣與家庭成員互動，可能出現主動避開。',
  '5': '具有攻擊行為的強烈 FAS 徵兆：低吼、暴衝、吠叫、哈氣、咆哮和/或空咬。'
};
function fasColorClass(level) {
  if (level === '0' || level === '1') return 'lvl-low';
  if (level === '2' || level === '3') return 'lvl-mid';
  if (level === '4' || level === '5') return 'lvl-high';
  return '';
}
function fasShortLabel(level) {
  return ({'0':'放鬆','1':'輕微','2':'輕中度','3':'中度','4':'高度','5':'高度+攻擊'})[level] || '';
}
function fasEmoji(level) {
  if (level === '0' || level === '1') return '🟢';
  if (level === '2' || level === '3') return '🟡';
  if (level === '4' || level === '5') return '🔴';
  return '';
}
function fasMarker(level) {
  return `${fasEmoji(level)} ${fasShortLabel(level)} `;
}

        : sess.status === 'done'
          ? `<button class="btn ghost" id="toggleStatusBtn" style="border-color:var(--text-soft); color:var(--text-soft)">↺ 取消完成</button>`
          : `<button class="btn" id="toggleStatusBtn" style="background:var(--good); color:white">✓ 標記已完成</button>`}
      ${(sess.status !== 'closed' && sess.status !== 'done')
        ? `<button class="btn ghost" id="closeSessBtn" style="border-color:#b8b3aa; color:#6a6258">⊘ 強制結案</button>`
        : ''}
      <button class="btn" id="saveBtn">💾 儲存</button>
      <button class="btn ghost" id="attachBtn">📎 附加資料${attachmentSummary(sess).total > 0 ? ' ('+attachmentSummary(sess).total+')' : ''}</button>
      <button class="btn ghost" id="pdfBtn">📄 報告 PDF</button>

  document.getElementById('editSess').onclick = () => openSessionForm(sess);
  document.getElementById('attachBtn').onclick = () => openAttachmentForm(sess, () => renderSession());
  document.getElementById('toggleStatusBtn').onclick = () => {
    toggleSessionStatus(sess.id);
    renderSession();
  };
  const closeSessBtnEl = document.getElementById('closeSessBtn');
  if (closeSessBtnEl) closeSessBtnEl.onclick = () => {
    let reason = '';
    while (true) {
      reason = prompt('結案原因（必填，呆帳追蹤用）：\n例如「已讀不回 2 個月」、「客戶主動表明不繼續」、「失聯」', reason);
      if (reason === null) return;
      if (reason.trim()) break;
      alert('⚠ 結案原因不能空白（之後分析呆帳模式會用到）');
    }
    if (!confirm(`確定強制結案？\n原因：${reason.trim()}\n\n這堂會計入呆帳統計，仍可從「⊘」按鈕解除。`)) return;
    closeSession(sess.id, reason.trim());
    renderSession();
  };
  // 待安排殼：inline 改日期（不用開 modal）
  const inlineDateInput = document.getElementById('inlineDateInput');

    inlineDateInput.onchange = () => {
      if (!inlineDateInput.value) return;
      sess.date = inlineDateInput.value;
      const all = load(KEYS.sessions, []);
      const idx = all.findIndex(s => s.id === sess.id);
      if (idx >= 0) { all[idx] = sess; save(KEYS.sessions, all); }
      showNotice('日期已設定');
      renderSession();
    };
  }

  function saveAll() {
    const fasEl = document.getElementById('fasNotes');
    const reportEl = document.getElementById('firstConsultReport');
    sess.fasNotes = sanitizeColorHtml(fasEl.innerHTML);
    sess.firstConsultReport = sanitizeColorHtml(reportEl.innerHTML);
    const sessions = load(KEYS.sessions, []);
    const idx = sessions.findIndex(s => s.id === sess.id);
    if (idx >= 0) { sessions[idx] = sess; save(KEYS.sessions, sessions); }
  }

  // 顏色 toolbar 綁定
  bindColorToolbar(main.querySelector('[data-tb-for="fasNotes"]'), document.getElementById('fasNotes'));
  bindColorToolbar(main.querySelector('[data-tb-for="firstConsultReport"]'), document.getElementById('firstConsultReport'));

  // FAS 色帶按鈕：插入「🔴 高度 」這種標記
  main.querySelectorAll('.fas-btn').forEach(btn => {
    btn.onclick = () => {
      const lv = btn.dataset.fas;
      const editor = document.getElementById('fasNotes');
      const isEmpty = editor.textContent.trim() === '';
      const marker = (isEmpty ? '' : '\n') + fasMarker(lv);
      insertTextAtCursor(editor, marker);
      saveAll();
    };
  });

  // 模板插入按鈕（content 已是 HTML，用 insertHtmlAtCursor）
  main.querySelectorAll('[data-tpl-idx]').forEach(btn => {
    btn.onclick = () => {
      const i = parseInt(btn.dataset.tplIdx, 10);
      const tplItem = templates[i];
      if (!tplItem) return;
      const editor = document.getElementById('firstConsultReport');
      const isEmpty = editor.textContent.trim() === '';
      const prefix = isEmpty ? '' : '<br><br>';
      const contentHtml = ensureColorHtml(tplItem.content || '');
      insertHtmlAtCursor(editor, prefix + contentHtml);
      saveAll();
    };
  });

  // Auto-save on blur
  ['fasNotes', 'firstConsultReport'].forEach(id => {
    document.getElementById(id).addEventListener('blur', saveAll);
  });

  document.getElementById('saveBtn').onclick = () => { saveAll(); showNotice('已儲存'); };
  document.getElementById('pdfBtn').onclick = () => {
    saveAll();
    exportFirstConsultPdf(sess, pet);
  };
}

function renderSession() {
  const main = document.getElementById('main');
  const sess = getSession(state.sessionId);
  if (!sess) { go('sessions', { petId: state.petId }); return; }
  const pet = getPet(sess.petId);
  if (!pet) { go('pets'); return; }
  // 首堂諮詢走專用 view
  if (sess.courseType === 'firstConsult') {
    return renderFirstConsultSession(sess, pet);
  }
  const items = ensureItemShape(pet.species === 'cat' ? load(KEYS.itemsCat, []) : load(KEYS.itemsDog, []));
  const recordsByName = {};
  (sess.records || []).forEach(r => recordsByName[r.name] = r);
  // 排序：勾選的在上（按 selectedAt 時間戳），未勾選的在下（按訓練項目原順序）
  const itemOrderIdx = {};
  items.forEach((it, i) => { itemOrderIdx[it.name] = i; });
  const sortedItems = items.slice().sort((a, b) => {
    const ra = recordsByName[a.name], rb = recordsByName[b.name];
    const aSel = ra && ra.selected;
    const bSel = rb && rb.selected;
    if (aSel && !bSel) return -1;
    if (!aSel && bSel) return 1;
    if (aSel && bSel) {
      const at = ra.selectedAt || 0, bt = rb.selectedAt || 0;
      if (at && bt && at !== bt) return at - bt;
      // 都沒 selectedAt 或時間相同 → 原順序
      return itemOrderIdx[a.name] - itemOrderIdx[b.name];
    }
    return itemOrderIdx[a.name] - itemOrderIdx[b.name];
  });

  const itemsHtml = sortedItems.map(it => {
    const name = it.name;
    const r = recordsByName[name] || { name, selected: false, rating: '', methods: [], petNote: '' };
    const itMethods = it.methods || [];
    const hasMethods = itMethods.length > 0;
    const checkedSet = new Set(r.methods || []);
    const methodsBlock = hasMethods ? `
      <div class="methods-section">
        <div class="methods-label">🎯 今天用的方法（可複選）</div>
        ${itMethods.map(m => {
          const stepsHtml = ensureColorHtml(m.steps);
          const hasSteps = stepsHtml && stepsHtml.replace(/<[^>]+>/g, '').trim().length > 0;
          const hasTbl = !!normalizeTable(m.table);
          const hasDetails = hasSteps || hasTbl;
          return `
            <div style="margin-bottom:6px">
              <label class="method-check" style="margin-bottom:2px">
                <input type="checkbox" data-method="${escapeAttr(m.name)}" ${checkedSet.has(m.name)?'checked':''}>
                <span>${escapeHtml(m.name || '（未命名方法）')}</span>
              </label>
              ${hasDetails ? `
                <details style="margin-left:24px; margin-top:2px;">
                  <summary style="cursor:pointer; font-size:11px; color:var(--text-soft); user-select:none;">📖 步驟${hasTbl ? ' / 表格' : ''}</summary>
                  <div style="margin-top:4px; padding:8px 10px; background:rgba(240,230,214,0.4); border-left:2px solid var(--brown-light); border-radius:4px; font-size:12px; line-height:1.6;">
                    ${hasSteps ? `<div style="margin-bottom:${hasTbl?'6px':'0'}">${stepsHtml}</div>` : ''}
                    ${hasTbl ? methodTableToHtml(m.table, {compact:true}) : ''}
                  </div>
                </details>` : ''}
            </div>`;
        }).join('')}
      </div>` : '';
    return `
      <div class="item ${r.selected ? 'selected' : ''}" data-name="${escapeAttr(name)}">
        <div class="item-head">
          <div class="check">${r.selected ? '✓' : ''}</div>
          <div class="item-name">${escapeHtml(name)}${hasMethods ? ' <span class="steps-badge" title="此項目有 '+itMethods.length+' 種訓練方法">📋</span>' : ''}</div>
        </div>
        ${r.selected ? `
          <div class="ratings">
            <button class="rating-btn good ${r.rating==='good'?'active':''}" data-rating="good">😊 好</button>
            <button class="rating-btn ok ${r.rating==='ok'?'active':''}" data-rating="ok">😐 普通</button>
            <button class="rating-btn work ${r.rating==='work'?'active':''}" data-rating="work">💪 需加強</button>
          </div>
          ${methodsBlock}
          <textarea class="pet-note-input" data-pet-note="${escapeAttr(name)}"
            placeholder="💭 針對這隻寵物的調整備註（可選，會給飼主）"
            rows="1">${escapeHtml(r.petNote || '')}</textarea>
        ` : ''}
      </div>`;
  }).join('');

  main.innerHTML = `
    <div class="autosave-banner">
      💾 評分、方法勾選、備註都是<b>自動儲存</b>。儲存按鈕只是快速確認。
    </div>
    <div class="card" style="cursor:default">
      <div class="card-row">
        <div>
          <div class="card-title">${speciesEmoji(pet.species)} ${escapeHtml(pet.name)} ${genderLabel(pet.gender)} ${statusBadgeHtml(sess)}</div>
          <div class="card-meta">
            ${sess.date
              ? fmtDate(sess.date)
              : `<span style="color:var(--work)">📅 請選日期：</span><input type="date" id="inlineDateInput" style="padding:4px 8px; border:1px solid var(--accent); border-radius:6px; font-family:inherit; font-size:13px; background:#fff8e7; margin-left:4px">`}
            ${sess.location ? ' · 📍 ' + escapeHtml(sess.location) : ''}
            ${sess.duration ? ' · ' + sess.duration + ' 分鐘' : ''}
          </div>
        </div>
        <button class="small-btn" id="editSess">編輯</button>
      </div>
    </div>

    <h3 style="color:var(--brown-dark); margin: 18px 0 10px; font-size:15px">訓練項目（點選擇要記錄的項目）</h3>
    <div id="itemList">${itemsHtml}</div>

    <div class="field" style="margin-top:18px">
      <label>📝 本週飼主作業</label>
      ${colorToolbarHtml('homework')}
      <div id="homework" class="color-editor" contenteditable="true"
           style="min-height:80px;"
           data-placeholder="例：每天早晚各 5 分鐘練習坐下，遛狗時遇到其他狗保持距離 3 公尺以上⋯">${ensureColorHtml(sess.homework)}</div>
    </div>
    <div class="field">
      <label>👀 訓練師備註（不會輸出給飼主）</label>
      ${colorToolbarHtml('trainerNotes')}
      <div id="trainerNotes" class="color-editor" contenteditable="true"
           style="min-height:80px;"
           data-placeholder="自己的觀察、下次計畫⋯">${ensureColorHtml(sess.notes)}</div>
    </div>

    <div class="actions-row">
      ${sess.status === 'closed'
        ? `<button class="btn ghost" id="toggleStatusBtn" style="border-color:var(--text-soft); color:var(--text-soft)">↺ 取消結案</button>`
        : sess.status === 'done'
          ? `<button class="btn ghost" id="toggleStatusBtn" style="border-color:var(--text-soft); color:var(--text-soft)">↺ 取消完成</button>`
          : `<button class="btn" id="toggleStatusBtn" style="background:var(--good); color:white">✓ 標記已完成</button>`}
      ${(sess.status !== 'closed' && sess.status !== 'done')
        ? `<button class="btn ghost" id="closeSessBtn" style="border-color:#b8b3aa; color:#6a6258">⊘ 強制結案</button>`
        : ''}
      <button class="btn" id="saveBtn">💾 儲存</button>
      <button class="btn ghost" id="attachBtn">📎 附加資料${attachmentSummary(sess).total > 0 ? ' ('+attachmentSummary(sess).total+')' : ''}</button>
      <button class="btn ghost" id="pdfBtn">📄 下載 PDF</button>
      <button class="btn ghost" id="shareBtn">🔗 產生分享連結</button>
    </div>
  `;

  document.getElementById('editSess').onclick = () => openSessionForm(sess);
  document.getElementById('attachBtn').onclick = () => openAttachmentForm(sess, () => renderSession());
  document.getElementById('toggleStatusBtn').onclick = () => {
    toggleSessionStatus(sess.id);
    renderSession();
  };
  const closeSessBtnEl = document.getElementById('closeSessBtn');
  if (closeSessBtnEl) closeSessBtnEl.onclick = () => {
    let reason = '';
    // 必填 loop：填空白會再要求；按取消才中斷
    while (true) {
      reason = prompt('結案原因（必填，呆帳追蹤用）：\n例如「已讀不回 2 個月」、「客戶主動表明不繼續」、「失聯」', reason);
      if (reason === null) return; // 取消
      if (reason.trim()) break;
      alert('⚠ 結案原因不能空白（之後分析呆帳模式會用到）');
    }
    if (!confirm(`確定強制結案？\n原因：${reason.trim()}\n\n這堂會計入呆帳統計，仍可從「⊘」按鈕解除。`)) return;
    closeSession(sess.id, reason.trim());
    renderSession();
  };
  // 待安排殼：inline 改日期（不用開 modal）
  const inlineDateInput = document.getElementById('inlineDateInput');
  if (inlineDateInput) {
    inlineDateInput.onchange = () => {
      if (!inlineDateInput.value) return;
      sess.date = inlineDateInput.value;
      const all = load(KEYS.sessions, []);
      const idx = all.findIndex(s => s.id === sess.id);
      if (idx >= 0) { all[idx] = sess; save(KEYS.sessions, all); }
      showNotice('日期已設定');
      renderSession();
    };
  }

  // Item interaction
  main.querySelectorAll('.item').forEach(el => {
    const name = el.dataset.name;
    el.querySelector('.item-head').onclick = () => {
      const cur = recordsByName[name] || { name, selected: false, rating: '', petNote: '' };
      const wasSelected = cur.selected;
      cur.selected = !cur.selected;
      if (cur.selected && !wasSelected) {
        cur.selectedAt = Date.now();  // 記錄勾選時間（用於排序）
      }
      if (!cur.selected) { cur.rating = ''; cur.petNote = ''; cur.selectedAt = null; }
      recordsByName[name] = cur;
      saveRecords();
      renderSession();
    };
    el.querySelectorAll('.rating-btn').forEach(rb => {
      rb.onclick = (e) => {
        e.stopPropagation();
        const cur = recordsByName[name];
        cur.rating = cur.rating === rb.dataset.rating ? '' : rb.dataset.rating;
        saveRecords();
        renderSession();
      };
    });
    const noteInput = el.querySelector('.pet-note-input');
    if (noteInput) {
      noteInput.onblur = () => {
        const cur = recordsByName[name];
        if (cur) cur.petNote = noteInput.value;
        saveRecords();
      };
      noteInput.onclick = (e) => e.stopPropagation();
    }
    el.querySelectorAll('.method-check input[type=checkbox]').forEach(cb => {
      cb.onclick = (e) => {
        e.stopPropagation();
        const cur = recordsByName[name];
        if (!cur) return;
        cur.methods = cur.methods || [];
        const mname = cb.dataset.method;
        if (cb.checked) {
          if (!cur.methods.includes(mname)) cur.methods.push(mname);
        } else {
          cur.methods = cur.methods.filter(m => m !== mname);
        }
        saveRecords();
      };
    });
  });

  function saveRecords() {
    sess.records = Object.values(recordsByName).filter(r => r.selected);
    sess.homework = sanitizeColorHtml(document.getElementById('homework').innerHTML);
    sess.notes = sanitizeColorHtml(document.getElementById('trainerNotes').innerHTML);
    const sessions = load(KEYS.sessions, []);
    const idx = sessions.findIndex(s => s.id === sess.id);
    sessions[idx] = sess;
    save(KEYS.sessions, sessions);
  }

  document.getElementById('saveBtn').onclick = () => {
    saveRecords();
    showNotice('已儲存');
  };
  document.getElementById('pdfBtn').onclick = () => {
    saveRecords();
    exportPdf(sess, pet);
  };
  document.getElementById('shareBtn').onclick = async () => {
    saveRecords();
    await shareToGist(sess, pet);
  };

  // Auto-save homework / notes on blur
  ['homework','trainerNotes'].forEach(id => {
    document.getElementById(id).addEventListener('blur', saveRecords);
  });
  // 顏色 toolbar 綁定 (homework + trainerNotes)
  ['homework','trainerNotes'].forEach(id => {
    const tb = main.querySelector(`[data-tb-for="${id}"]`);
    const ed = document.getElementById(id);
    if (tb && ed) bindColorToolbar(tb, ed);
  });
}

/* ============== PDF EXPORT (走瀏覽器列印對話框，中文完美) ============== */
function exportFirstConsultPdf(sess, pet) {
  const logoSrc = LOGO_DATA || (window.location.protocol.startsWith('http')
    ? window.location.origin + window.location.pathname.replace(/[^/]*$/, '') + 'logo.png'
    : '');
  // 用 DOM 掃描所有 block-level 空白行（cover 各種來源 paste 的奇怪 HTML），加 .empty-line class
  // 不依賴特定字串 pattern（之前 regex 只 match <div><br></div>，paste 來的可能是 <div></div> / <div>&nbsp;</div> / 多 br 等）
  const reportHtml = (() => {
    const raw = ensureColorHtml(sess.firstConsultReport);
    const tmp = document.createElement('div');
    tmp.innerHTML = raw;
    tmp.querySelectorAll('div, p').forEach(el => {
      // 把所有空白字元（含 nbsp  、zero-width 等）拿掉看是不是真的空
      const t = (el.textContent || '').replace(/[\s ​]/g, '');
      if (t === '') {
        el.className = 'empty-line';
        el.innerHTML = '';
      }
    });
    return tmp.innerHTML;
  })();
  const hasReportContent = reportHtml && reportHtml.replace(/<[^>]+>/g, '').trim().length > 0;
  const titleStr = `${pet.name}_首堂諮詢報告`;
  const dateStr = fmtDate(sess.date);
  const ownerLine = pet.ownerName ? `飼主：${escapeHtml(pet.ownerName)}` : '';

  const html = `<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>${escapeHtml(titleStr)}</title>
<style>
  @page {
    size: A4;
    margin: 16mm 14mm 20mm;
    @bottom-right {
      content: counter(page) ' / ' counter(pages);

                 "Noto Sans TC", "Heiti TC", sans-serif;

    line-height: 1.65;
    background: white;
    font-size: 12pt;
  }
  header.brand {
    text-align: center;
    padding-bottom: 8pt;
    margin-bottom: 12pt;
    border-bottom: 2px solid #8b6f47;
  }
  header.brand img { max-width: 150pt; height: auto; }
  header.brand .sub {

  /* colorEditor 產生的空白行（<div><br></div>）壓縮高度，避免段落間空白過大 */
  .report-body div:empty,
  .report-body p:empty,
  .report-body .empty-line,

function exportPdf(sess, pet) {
  const items = ensureItemShape(pet.species === 'cat' ? load(KEYS.itemsCat, []) : load(KEYS.itemsDog, []));
  const itemMap = {};
  items.forEach(it => { itemMap[it.name] = it.methods || []; });

  const speciesEmoji = pet.species === 'cat' ? '🐱' : '🐶';
  const genderTxt = pet.gender === 'male' ? '公' : pet.gender === 'female' ? '母' : '';
  const neuteredTxt = pet.neutered === 'yes' ? '已絕育' : pet.neutered === 'no' ? '未絕育' : '';
  const metaParts = [
    pet.breed,
    genderTxt,
    neuteredTxt,
    pet.birth,
  ].filter(Boolean).join(' · ');

  // 排序：勾選順序（selectedAt asc），無 selectedAt 則 fallback 訓練項目原順序
  const itemOrder = items.map(it => it.name);
  const records = (sess.records || []).filter(r => r.selected).slice().sort((a, b) => {
    if (a.selectedAt && b.selectedAt) return a.selectedAt - b.selectedAt;
    if (a.selectedAt && !b.selectedAt) return -1;
    if (!a.selectedAt && b.selectedAt) return 1;
    const ai = itemOrder.indexOf(a.name);
    const bi = itemOrder.indexOf(b.name);
    return (ai === -1 ? 9999 : ai) - (bi === -1 ? 9999 : bi);
  });
  const recordsHtml = records.length === 0
    ? `<p style="color:#999; text-align:center; padding:16px;">（這堂課還沒有勾選項目）</p>`
    : records.map(r => {
        const itMethods = itemMap[r.name] || [];
        const checkedNames = r.methods || [];
        const ratingCls = r.rating === 'good' ? 'good' : r.rating === 'ok' ? 'ok' : r.rating === 'work' ? 'work' : 'none';
        const ratingTxt = r.rating === 'good' ? '😊 表現好' : r.rating === 'ok' ? '😐 普通' : r.rating === 'work' ? '💪 需加強' : '已練習';
        const methodsHtml = checkedNames.map(mn => {
          const m = itMethods.find(im => im.name === mn);
          const stepsHtml = m ? ensureColorHtml(m.steps) : '';
          const hasSteps = stepsHtml && stepsHtml.replace(/<[^>]+>/g, '').trim().length > 0;
          const tblHtml = m && m.table ? methodTableToHtml(m.table) : '';
          return `
            <div class="item-method">
              <div class="item-label">🎯 方法：${escapeHtml(mn || '（未命名方法）')}</div>
              ${hasSteps ? `<div class="item-method-steps">${stepsHtml}</div>` : ''}
              ${tblHtml ? `<div style="margin-top:6px">${tblHtml}</div>` : ''}
            </div>`;
        }).join('');
        const noteHtml = (r.petNote && r.petNote.trim())
          ? `<div class="item-petnote"><div class="item-label">💭 針對 ${escapeHtml(pet.name)} 的調整</div><div class="item-petnote-body">${escapeHtml(r.petNote).replace(/\n/g, '<br>')}</div></div>`
          : '';
        return `
          <div class="item">
            <div class="item-row">
              <span class="item-name">${escapeHtml(r.name)}</span>
              <span class="rating ${ratingCls}">${ratingTxt}</span>
            </div>
            ${methodsHtml}
            ${noteHtml}
          </div>`;
      }).join('');

  // 用 LOGO_DATA（base64）或絕對 URL 引 logo
  const logoSrc = LOGO_DATA || (window.location.protocol.startsWith('http')
    ? window.location.origin + window.location.pathname.replace(/[^/]*$/, '') + 'logo.png'
    : '');

  const html = `<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>${escapeHtml(pet.name)}_${sess.date}</title>
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei",
                 "Noto Sans TC", "Heiti TC", sans-serif;

    background: white;
    font-size: 13pt;
  }
  body { padding: 0; }

    font-size: 9pt; color: #8b6f47; letter-spacing: 1px;

/* ============== GIST SHARE ============== */
async function shareToGist(sess, pet) {
  const settings = load(KEYS.settings, {});
  if (!settings.githubPat) {
    showNotice('請先到設定填入 GitHub PAT', 'err');
    return;
  }
  // 把該項目「被勾選的方法」連同 steps 一起嵌入 record，飼主端看得到
  const items = ensureItemShape(pet.species === 'cat' ? load(KEYS.itemsCat, []) : load(KEYS.itemsDog, []));
  const itemMap = {};
  items.forEach(it => { itemMap[it.name] = it.methods || []; });
  // 排序：勾選順序（selectedAt asc），無 selectedAt 則 fallback 訓練項目原順序
  const itemOrder = items.map(it => it.name);
  const enrichedRecords = (sess.records || []).slice().sort((a, b) => {
    if (a.selectedAt && b.selectedAt) return a.selectedAt - b.selectedAt;
    if (a.selectedAt && !b.selectedAt) return -1;
    if (!a.selectedAt && b.selectedAt) return 1;
    const ai = itemOrder.indexOf(a.name);
    const bi = itemOrder.indexOf(b.name);
    return (ai === -1 ? 9999 : ai) - (bi === -1 ? 9999 : bi);
  }).map(r => {
    const itMethods = itemMap[r.name] || [];
    const checkedNames = r.methods || [];
    const methodDetails = checkedNames.map(mn => {
      const m = itMethods.find(im => im.name === mn);
      return { name: mn, steps: (m && m.steps) || '' };
    });
    return { ...r, methodDetails };
  });
  const payload = {
    pet: {
      name: pet.name, species: pet.species, breed: pet.breed,
      gender: pet.gender, neutered: pet.neutered, birth: pet.birth,
      ownerName: pet.ownerName,
    },
    session: {
      date: sess.date, location: sess.location, duration: sess.duration,
      // 課程類型 + 堂數（給 report.html 顯示「📋 一對一 · 第 1 堂」之類的標籤）
      courseType: sess.courseType || '',
      sessionSeq: sess.sessionSeq || '',
      sessionTotal: sess.sessionTotal || '',
      groupSubType: sess.groupSubType || '',
      groupSubTypeOther: sess.groupSubTypeOther || '',
      courseTypeOther: sess.courseTypeOther || '',
      records: enrichedRecords, homework: sess.homework,
    },
    brand: 'Wendy 溫蒂．貓與狗訓練日常',
    generated: new Date().toISOString(),
  };
  const body = {
    description: `Wendy Pet Training Report - ${pet.name} ${sess.date}`,
    public: false,
    files: { 'report.json': { content: JSON.stringify(payload, null, 2) } },
  };

  showNotice('上傳中⋯');
  try {
    let resp;
    if (sess.gistId) {
      resp = await fetch(`https://api.github.com/gists/${sess.gistId}`, {
        method: 'PATCH',
        headers: {
          'Authorization': `Bearer ${settings.githubPat}`,
          'Accept': 'application/vnd.github+json',
        },
        body: JSON.stringify(body),
      });
    } else {
      resp = await fetch('https://api.github.com/gists', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${settings.githubPat}`,
          'Accept': 'application/vnd.github+json',
        },
        body: JSON.stringify(body),
      });
    }
    if (!resp.ok) {
      const err = await resp.text();
      throw new Error(`GitHub ${resp.status}: ${err.slice(0,200)}`);
    }
    const gist = await resp.json();
    sess.gistId = gist.id;
    const sessions = load(KEYS.sessions, []);
    const idx = sessions.findIndex(s => s.id === sess.id);
    sessions[idx] = sess;
    save(KEYS.sessions, sessions);

    const reportUrl = buildReportUrl(settings, gist.id);
    showShareModal(reportUrl, gist.html_url);
  } catch (e) {
    showNotice('上傳失敗：' + e.message, 'err');
  }
}

/* ============== 家長報告 (per-pet 總覽) ============== */

// 用 buildReportUrl 但檔名改 report-pet.html
function buildParentReportUrl(settings, gistId) {
  return buildReportUrl(settings, gistId).replace('/report.html#', '/report-pet.html#');
}

// 組家長報告 payload。依 pet.parentReportConfig.sections 決定包含哪些 section。
function buildParentReportPayload(pet) {
  const cfg = (pet.parentReportConfig && pet.parentReportConfig.sections) || {};
  const payload = {
    schema: 'wendy-pet-report-v1',
    generated: new Date().toISOString(),
    pet: {
      name: pet.name,
      species: pet.species,
      breed: pet.breed || '',
      gender: pet.gender || '',
      neutered: pet.neutered || '',
      birth: pet.birth || '',
      ownerName: pet.ownerName || '',
      ownerContact: pet.ownerContact || '',
    },
    config: { sections: cfg },
  };
  // 基本資料（notes 整段）
  if (cfg.basic !== false) {
    payload.basic = { notes: pet.notes || '' };
  }
  // 困擾行為
  if (cfg.concerns !== false) {
    payload.concerns = pet.concerns || '';
  }
  // 首堂諮詢 + 每堂訓練紀錄 + 教材附件
  const wantFirstConsult = cfg.firstConsult !== false;
  const wantSessions = cfg.sessions !== false;
  const wantMaterials = cfg.materials !== false;
  const allMaterials = load(KEYS.materials, []);
  const materialMap = {};
  allMaterials.forEach(m => { materialMap[m.id] = m; });
  if (wantFirstConsult || wantSessions) {
    const petSessions = load(KEYS.sessions, [])
      .filter(s => s.petId === pet.id)
      .sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    // 訓練項目庫（給 records 補 method.steps）
    const items = ensureItemShape(pet.species === 'cat' ? load(KEYS.itemsCat, []) : load(KEYS.itemsDog, []));
    const itemMap = {};
    items.forEach(it => { itemMap[it.name] = it.methods || []; });
    const enrichSession = (s) => {
      const enriched = {
        id: s.id,
        date: s.date,
        location: s.location || '',
        duration: s.duration || 0,
        status: s.status || 'done',
        courseType: s.courseType || '',
        groupSubType: s.groupSubType || '',
        groupSubTypeOther: s.groupSubTypeOther || '',
        courseTypeOther: s.courseTypeOther || '',
        sessionSeq: s.sessionSeq || '',
        sessionTotal: s.sessionTotal || '',
        homework: s.homework || '',
        // 首堂諮詢專用：sanitize 過的 HTML，給家長看的報告內容
        firstConsultReport: s.firstConsultReport || '',
        // trainerNotes / fasNotes 是內部筆記，不給家長
        // records 補 methodDetails（含方法 + steps）
        records: (s.records || []).filter(r => r.selected !== false).map(r => {
          const itMethods = itemMap[r.name] || [];
          const checkedNames = r.methods || [];
          const methodDetails = checkedNames.map(mn => {
            const m = itMethods.find(im => im.name === mn);
            return { name: mn, steps: (m && m.steps) || '' };
          });
          return { ...r, methodDetails };
        }),
      };
      // 教材附件
      if (wantMaterials) {
        enriched.attachedMaterials = (s.attachedMaterialIds || [])
          .map(id => materialMap[id])
          .filter(Boolean)
          .map(m => ({ id: m.id, title: m.title, url: m.url || '', content: m.content || '' }));
        enriched.externalLinks = (s.externalLinks || []).filter(l => l && (l.title || l.url));
      }
      return enriched;
    };
    if (wantFirstConsult) {
      const fc = petSessions.find(s => s.courseType === 'firstConsult');
      if (fc) payload.firstConsult = enrichSession(fc);
    }
    if (wantSessions) {
      // 一般 sessions（不含 firstConsult，避免重複；首堂在 firstConsult section）
      payload.sessions = petSessions
        .filter(s => s.courseType !== 'firstConsult')
        .map(enrichSession);
    }
  }
  return payload;
}

// 推送家長報告到 gist（create or update）
async function pushParentReport(pet) {
  const settings = load(KEYS.settings, {});
  if (!settings.githubPat) {
    showNotice('請先到設定填入 GitHub PAT', 'err');
    return null;
  }
  const payload = buildParentReportPayload(pet);
  const body = {
    description: `Wendy Parent Report - ${pet.name}`,
    public: false,
    files: { 'pet-report.json': { content: JSON.stringify(payload, null, 2) } },
  };
  showNotice('同步中⋯');
  try {
    let resp;
    if (pet.parentReportGistId) {
      resp = await fetch(`https://api.github.com/gists/${pet.parentReportGistId}`, {
        method: 'PATCH',
        headers: {
          'Authorization': `Bearer ${settings.githubPat}`,
          'Accept': 'application/vnd.github+json',
        },
        body: JSON.stringify(body),
      });
    } else {
      resp = await fetch('https://api.github.com/gists', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${settings.githubPat}`,
          'Accept': 'application/vnd.github+json',
        },
        body: JSON.stringify(body),
      });
    }
    if (!resp.ok) {
      const err = await resp.text();
      throw new Error(`GitHub ${resp.status}: ${err.slice(0,200)}`);
    }
    const gist = await resp.json();
    // 寫回 pet.parentReportGistId
    const pets = load(KEYS.pets, []);
    const idx = pets.findIndex(p => p.id === pet.id);
    if (idx >= 0) {
      pets[idx].parentReportGistId = gist.id;
      save(KEYS.pets, pets);
    }
    showNotice('✓ 已同步到家長頁');
    return { gistId: gist.id, gistUrl: gist.html_url, reportUrl: buildParentReportUrl(settings, gist.id) };
  } catch (e) {
    showNotice('同步失敗：' + e.message, 'err');
    return null;
  }
}

function showShareModal(reportUrl, gistUrl) {
  const html = `
    <div class="modal">
      <h2>🔗 分享連結已產生</h2>
      <div class="notice ok">把下面這個連結貼給飼主，他點開就能看當堂報告。</div>

      </div>
      <div class="field">
        <label>原始 Gist 連結</label>
        <input type="text" readonly value="${escapeAttr(gistUrl)}">
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="m_close">關閉</button>
        <button class="btn" id="m_copy">複製連結</button>
      </div>
    </div>
  `;
  const overlay = openModal(html);
  overlay.querySelector('#m_close').onclick = () => overlay.remove();
  overlay.querySelector('#m_copy').onclick = async () => {
    try {
      await navigator.clipboard.writeText(reportUrl);
      showNotice('已複製到剪貼簿');
    } catch {
      overlay.querySelector('#shareUrl').select();
      document.execCommand('copy');
      showNotice('已複製');
    }
  };
}
