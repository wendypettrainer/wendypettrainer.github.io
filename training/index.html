<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wendy 溫蒂．貓與狗訓練日常</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f0e6d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wendy 訓練">
<style>
  :root {
    --bg: #f0e6d6;
    --bg-soft: #f7f0e3;
    --brown: #8b6f47;
    --brown-dark: #6b5435;
    --brown-light: #c9b693;
    --text: #3d2f1f;
    --text-soft: #6b5435;
    --good: #6b9e6e;
    --ok: #c9a85a;
    --work: #c97a4f;
    --shadow: 0 2px 8px rgba(139, 111, 71, 0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
                 "Microsoft JhengHei", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
  }
  .app { max-width: 720px; margin: 0 auto; padding-bottom: 80px; }
  header.top {
    background: var(--brown);
    color: var(--bg);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: var(--shadow);
  }
  header.top h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.5px;
    flex: 1;
    text-align: center;
  }

  .breadcrumb {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 2px;
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;
    scrollbar-width: none;
    min-width: 0;
  }
  .breadcrumb::-webkit-scrollbar { display: none; }
  .bc-link {
    color: inherit;
    text-decoration: none;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .bc-link:hover { background: rgba(255,255,255,0.18); }
  .bc-current {
    color: white;
    font-weight: 600;
    padding: 4px 6px;
    flex-shrink: 0;
  }
  .bc-sep {
    color: rgba(255,255,255,0.4);
    flex-shrink: 0;
    padding: 0 1px;
  }
  .icon-btn {
    background: transparent;
    border: none;
    color: var(--bg);
    font-size: 18px;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 6px;
    min-width: 36px;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.15); }
  .icon-btn:disabled { opacity: 0.3; cursor: default; }

  .sync-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #999;
    flex-shrink: 0;
    margin: 0 4px;
    cursor: help;
    transition: background 0.3s;
  }
  .sync-dot.ok { background: #6b9e6e; }
  .sync-dot.syncing { background: #c9a85a; animation: pulse 1.2s ease-in-out infinite; }
  .sync-dot.pending { background: #c9a85a; }
  .sync-dot.error { background: #c97a4f; }
  .sync-dot.disabled { background: #999; opacity: 0.5; }
  @keyframes pulse { 50% { opacity: 0.4; } }

  main { padding: 16px; }

  .crumb {
    font-size: 13px;
    color: var(--text-soft);
    margin-bottom: 12px;
  }

  .card {
    background: var(--bg-soft);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.05s;
  }
  .card:hover { transform: translateY(-1px); }
  .card-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .card-title { font-weight: 600; font-size: 16px; color: var(--brown-dark); }
  .card-meta { font-size: 13px; color: var(--text-soft); margin-top: 4px; }
  .badge {
    background: var(--brown);
    color: var(--bg);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 12px;
  }

  .card-menu-btn {
    background: transparent;
    border: none;
    font-size: 20px;
    color: var(--text-soft);
    padding: 4px 12px;
    border-radius: 6px;
    cursor: pointer;
    line-height: 1;
    flex-shrink: 0;
  }
  .card-menu-btn:hover { background: rgba(139,111,71,0.12); color: var(--brown-dark); }

  .card-menu {
    background: white;
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(61,47,31,0.18);
    padding: 6px;
    z-index: 50;
    min-width: 160px;
  }
  .card-menu button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    color: var(--text);
    font-family: inherit;
  }
  .card-menu button:hover { background: var(--bg-soft); }
  .card-menu button.danger { color: var(--work); }
  .card-menu button.danger:hover { background: rgba(201,122,79,0.1); }

  .btn {
    background: var(--brown);
    color: var(--bg);
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .btn:hover { background: var(--brown-dark); }
  .btn.ghost {
    background: transparent;
    color: var(--brown);
    border: 1px solid var(--brown);
    box-shadow: none;
  }
  .btn.ghost:hover { background: var(--brown); color: var(--bg); }
  .btn.danger { background: var(--work); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .fab {
    position: fixed;
    bottom: 24px;
    right: max(24px, calc(50vw - 360px + 24px));
    background: var(--brown);
    color: var(--bg);
    border: none;
    width: 56px;
    height: 56px;
    border-radius: 28px;
    font-size: 28px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(139,111,71,0.35);
    z-index: 5;
  }
  .fab:hover { background: var(--brown-dark); }

  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-soft);
  }
  .empty h3 { color: var(--brown-dark); margin-bottom: 8px; }

  /* Brand hero (only on main pets view) */
  .brand-hero {
    text-align: center;
    padding: 20px 16px 8px;
    margin: -16px -16px 16px;
    background: var(--bg);
  }
  .brand-hero img {
    max-width: 280px;
    width: 80%;
    height: auto;
  }

  /* Forms */
  label { display: block; font-size: 13px; color: var(--text-soft); margin-bottom: 6px; }
  input[type=text], input[type=date], input[type=number], input[type=password],
  textarea, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--brown-light);
    border-radius: 8px;
    background: white;
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
  }
  input:focus, textarea:focus, select:focus {
    outline: 2px solid var(--brown);
    outline-offset: -1px;
  }
  textarea { resize: vertical; min-height: 80px; }
  .field { margin-bottom: 14px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .radio-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .radio-opt {
    flex: 1;
    min-width: 80px;
    padding: 10px 12px;
    background: white;
    border: 1px solid var(--brown-light);
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text);
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .radio-opt input[type=radio] { accent-color: var(--brown); }
  .radio-opt:has(input:checked) {
    background: var(--bg-soft);
    border-color: var(--brown);
    color: var(--brown-dark);
    font-weight: 500;
  }

  /* Modal */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(61,47,31,0.4);
    display: flex; align-items: flex-end;
    justify-content: center;
    z-index: 20;
  }
  .modal {
    background: var(--bg);
    width: 100%;
    max-width: 720px;
    border-radius: 16px 16px 0 0;
    padding: 20px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 { color: var(--brown-dark); margin-bottom: 14px; font-size: 18px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions .btn { flex: 1; }

  /* Training items */
  .item {
    background: var(--bg-soft);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 8px;
    border: 2px solid transparent;
    transition: border-color 0.1s;
  }
  .item.selected { border-color: var(--brown); }
  .item-head {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .item-name { flex: 1; font-weight: 500; }
  .steps-badge {
    display: inline-block;
    font-size: 11px;
    margin-left: 4px;
    opacity: 0.7;
  }
  .check {
    width: 22px; height: 22px;
    border: 2px solid var(--brown-light);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .item.selected .check {
    background: var(--brown);
    border-color: var(--brown);
    color: var(--bg);
  }
  .ratings {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    padding-left: 32px;
  }
  .rating-btn {
    flex: 1;
    padding: 8px 4px;
    border: 1px solid var(--brown-light);
    border-radius: 6px;
    background: white;
    font-size: 13px;
    cursor: pointer;
    color: var(--text-soft);
  }
  .rating-btn.active.good { background: var(--good); color: white; border-color: var(--good); }
  .rating-btn.active.ok { background: var(--ok); color: white; border-color: var(--ok); }
  .rating-btn.active.work { background: var(--work); color: white; border-color: var(--work); }

  .pet-note-input {
    margin-top: 8px;
    margin-left: 32px;
    width: calc(100% - 32px);
    padding: 6px 10px;
    border: 1px dashed var(--brown-light);
    border-radius: 6px;
    background: white;
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    min-height: 32px;
    resize: vertical;
  }
  .pet-note-input:focus {
    outline: 1px solid var(--brown);
    border-style: solid;
  }

  .methods-section {
    margin-top: 8px;
    margin-left: 32px;
    padding: 8px 10px;
    background: white;
    border-radius: 6px;
    border: 1px solid var(--brown-light);
  }
  .methods-label {
    font-size: 11px;
    color: var(--brown);
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }
  .method-check {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 4px;
    cursor: pointer;
    font-size: 14px;
  }
  .method-check input[type=checkbox] {
    accent-color: var(--brown);
    width: 18px; height: 18px;
    cursor: pointer;
  }

  .notice {
    background: var(--brown-light);
    color: var(--brown-dark);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 12px;
  }
  .autosave-banner {
    background: #d4e7d3;
    color: #3d6b3f;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 14px;
    border-left: 3px solid #6b9e6e;
  }
  .notice.ok { background: #d4e7d3; color: #3d6b3f; }
  .notice.err { background: #f5d4c2; color: #8a3920; }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
    background: var(--bg-soft);
    padding: 4px;
    border-radius: 8px;
  }
  .tab {
    flex: 1;
    padding: 8px;
    background: transparent;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-soft);
  }
  .tab.active { background: var(--brown); color: var(--bg); }

  .search-input {
    width: 100%;
    padding: 10px 16px;
    border: 1px solid var(--brown-light);
    border-radius: 24px;
    background: white;
    font-size: 14px;
    color: var(--text);
    margin-bottom: 12px;
    font-family: inherit;
  }
  .search-input:focus {
    outline: 2px solid var(--brown);
    outline-offset: -1px;
  }

  .item-list-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--bg-soft);
    border-radius: 8px;
    margin-bottom: 6px;
  }
  .item-list-row input {
    border: none;
    background: transparent;
    flex: 1;
    padding: 4px;
  }
  .item-list-row input:focus { outline: 1px solid var(--brown); border-radius: 4px; }
  .item-edit-block {
    background: var(--bg-soft);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .item-edit-top {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-bottom: 6px;
  }
  .item-edit-top input {
    flex: 1;
    padding: 6px 8px;
    border: 1px solid var(--brown-light);
    border-radius: 6px;
    background: white;
    font-size: 14px;
  }
  .item-edit-block textarea {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--brown-light);
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    color: var(--text-soft);
    background: white;
    min-height: 50px;
    resize: vertical;
  }
  .methods-wrap {
    margin-top: 8px;
    margin-left: 12px;
    border-left: 2px solid var(--brown-light);
    padding-left: 12px;
  }
  .method-block {
    background: white;
    border-radius: 6px;
    padding: 8px;
    margin-bottom: 6px;
    border: 1px solid var(--brown-light);
  }
  .method-top {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-bottom: 6px;
  }
  .method-top input {
    flex: 1;
    padding: 5px 8px;
    border: 1px solid var(--brown-light);
    border-radius: 4px;
    font-size: 13px;
  }
  .method-block textarea {
    min-height: 40px;
    font-size: 12px;
  }
  .add-method {
    margin-top: 4px;
  }
  .small-btn {
    background: transparent;
    border: 1px solid var(--brown-light);
    color: var(--brown);
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .small-btn.danger { color: var(--work); border-color: var(--work); }

  .actions-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 16px;
  }
  .actions-row .btn { flex: 1; min-width: 120px; }

  /* === 顏色編輯器（contenteditable + toolbar） === */
  .color-editor {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    min-height: 36px;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.55;
    background: white;
    outline: none;
    word-break: break-word;
  }
  .color-editor:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(139,111,71,0.15); }
  .color-editor:empty::before { content: attr(data-placeholder); color: var(--text-soft); }
  .color-toolbar {
    display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 4px;
  }
  .color-toolbar button {
    padding: 4px 10px; font-size: 12px;
    border: 1px solid var(--border); border-radius: 4px;
    background: white; cursor: pointer;
    font-family: inherit; line-height: 1.2;
  }
  .color-toolbar button:hover { background: var(--header-bg); }
  .color-toolbar button.tb-clear { color: #666; }
  .color-toolbar button.tb-red { color: #c97a4f; font-weight: 600; }
  .color-toolbar button.tb-green { color: #6b9e6e; font-weight: 600; }
  .color-toolbar button.tb-blue { color: #5a7a9e; font-weight: 600; }

  /* === FAS 色帶（首堂諮詢內部觀察） === */
  .fas-bar {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }
  .fas-btn {
    padding: 10px 4px; border: 2px solid transparent;
    border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: 600; color: white;
    text-align: center; line-height: 1.2;
    font-family: inherit;
  }
  .fas-btn.lvl-low { background: var(--good); }
  .fas-btn.lvl-mid { background: var(--ok); }
  .fas-btn.lvl-high { background: var(--work); }
  .fas-btn:not(.active) { opacity: 0.5; }
  .fas-btn.active { opacity: 1; outline: 2px solid var(--brown-dark); outline-offset: 2px; }
  .fas-btn small { display:block; font-size:10px; opacity:0.85; font-weight:500; margin-top:2px; }
  .fas-desc {
    background: var(--bg-soft, #f7f1e6);
    border-left: 3px solid var(--brown-light);
    padding: 10px 12px; border-radius: 6px;
    font-size: 13px; line-height: 1.6; color: var(--text);
    margin-top: 4px; white-space: pre-wrap;
  }
  .fas-desc:empty { display: none; }
  .fc-section-title {
    font-size: 14px; color: var(--brown-dark); font-weight: 700;
    margin: 22px 0 8px; display: flex; align-items: center; gap: 8px;
  }
  .fc-section-title .small { font-size: 11px; font-weight: 400; color: var(--text-soft); }
  .template-buttons {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;
  }
  .template-buttons .small-btn {
    background: var(--header-bg, #f0e6d6); color: var(--brown);
    border: 1px solid var(--brown-light); padding: 6px 12px;
    border-radius: 6px; font-size: 12px; cursor: pointer;
    font-family: inherit;
  }
  .template-buttons .small-btn:hover { background: var(--brown-light); color: white; }

  /* iOS safe area */
  @supports (padding: env(safe-area-inset-bottom)) {
    .app { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="icon-btn" id="backBtn" title="返回上一層">‹</button>
    <nav class="breadcrumb" id="breadcrumb"></nav>
    <span class="sync-dot" id="syncDot" title="同步狀態（點開設定查看）"></span>
    <button class="icon-btn" id="settingsBtn" title="設定">⚙</button>
  </header>
  <main id="main"></main>
</div>

<script>
/* ============== LOGO PRELOAD ============== */
let LOGO_DATA = null, LOGO_W = 0, LOGO_H = 0;
(function preloadLogo() {
  const img = new Image();
  img.onload = () => {
    try {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth;
      c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      LOGO_DATA = c.toDataURL('image/png');
      LOGO_W = img.naturalWidth;
      LOGO_H = img.naturalHeight;
    } catch (e) { /* tainted canvas (cross-origin) — PDF will skip logo */ }
  };
  img.src = 'logo.png';
})();

/* ============== STATE & STORAGE ============== */
const KEYS = {
  pets: 'petcare.pets',
  sessions: 'petcare.sessions',
  itemsCat: 'petcare.trainingItems.cat',
  itemsDog: 'petcare.trainingItems.dog',
  bookings: 'petcare.bookings',                  // 預約 / 匯款通知記錄
  bookingTemplate: 'petcare.bookingTemplate',    // 帳戶 + 須知 + 預設值
  settings: 'petcare.settings',
  version: 'petcare.version',
  lastModified: 'petcare.lastModified',  // 雲端同步用
};

// 哪些 key 會被同步到雲端（settings 不同步：含 PAT、device-specific）
const SYNCABLE_KEYS = new Set([
  'petcare.pets',
  'petcare.sessions',
  'petcare.trainingItems.cat',
  'petcare.trainingItems.dog',
  'petcare.bookings',
  'petcare.bookingTemplate',
]);

const DEFAULT_DOG_ITEMS = [
  '坐下 Sit', '趴下 Down', '等等 Stay', '過來 Come', '跟隨散步 Heel',
  '不暴衝（牽繩禮儀）', '定點大小便', '籠內訓練', '看我（專注）',
  '放下 Drop it', '不要 Leave it', '握手 / 擊掌',
  '社會化：人', '社會化：狗', '社會化：環境聲音',
  '接受梳毛 / 剪指甲', '不撲人', '進出門禮儀',
].map(name => ({ name, methods: [] }));

const DEFAULT_CAT_ITEMS = [
  '響片連結', '目標棒觸碰', '進外出籠（Crate）',

// 把任何舊版資料自動升級成 v4：{ name, methods: [{name, steps, table?}] }
function normalizeTable(t) {
  if (!t || !Array.isArray(t.headers) || !Array.isArray(t.rows)) return null;
  const cols = t.headers.length;
  if (cols === 0) return null;
  const headers = t.headers.map(h => String(h || ''));
  const rows = t.rows.map(r => {
    const row = Array.isArray(r) ? r.slice(0, cols).map(c => String(c || '')) : [];
    while (row.length < cols) row.push('');
    return row;
  });
  return { headers, rows };
}
function emptyTable(cols = 3, rowCount = 2) {
  return {
    headers: Array.from({ length: cols }, (_, i) => `欄${i+1}`),
    rows: Array.from({ length: rowCount }, () => Array.from({ length: cols }, () => '')),
  };
}
// 顏色 sanitize：只允許 <br> 跟 <span style="color:..."> 跟 <span style="font-weight:...">
function sanitizeColorHtml(html) {
  if (!html) return '';
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  // 直接移除危險元素
  tmp.querySelectorAll('script, style, iframe, object, embed, link, meta').forEach(el => el.remove());
  function walk(node) {
    [...node.childNodes].forEach(child => {
      if (child.nodeType === 8) { child.remove(); return; }   // comment
      if (child.nodeType !== 1) return;                        // text
      const tag = child.tagName.toLowerCase();
      if (tag === 'br') return;
      if (tag === 'span') {
        const color = child.style.color;
        const fontWeight = child.style.fontWeight;
        while (child.attributes.length > 0) child.removeAttribute(child.attributes[0].name);
        if (color) child.style.color = color;
        if (fontWeight === '600' || fontWeight === 'bold' || fontWeight === '700') child.style.fontWeight = '600';
        walk(child);
        return;
      }
      // div / p → 取出內容、加 <br>，移除 div/p 標籤
      walk(child);
      const parent = child.parentNode;
      if ((tag === 'div' || tag === 'p') && parent) {
        if (child.previousSibling) parent.insertBefore(document.createElement('br'), child);
      }
      while (child.firstChild) parent.insertBefore(child.firstChild, child);
      child.remove();
    });
  }
  walk(tmp);
  return tmp.innerHTML;
}
// 套色彩到當前 selection（必須在 editorEl 範圍內）
function applyColorToSelection(color, editorEl) {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0) { showNotice('請先選取要上色的文字', 'err'); return; }
  const range = sel.getRangeAt(0);
  if (range.collapsed) { showNotice('請先選取要上色的文字', 'err'); return; }
  if (!editorEl.contains(range.commonAncestorContainer)) { showNotice('請先選取要上色的文字', 'err'); return; }
  const fragment = range.extractContents();
  const span = document.createElement('span');
  if (color) {
    span.style.color = color;
    span.style.fontWeight = '600';
  }
  span.appendChild(fragment);
  range.insertNode(span);
  // 把游標放到 span 後
  sel.removeAllRanges();
  const newRange = document.createRange();
  newRange.selectNodeContents(span);
  newRange.collapse(false);
  sel.addRange(newRange);
  editorEl.dispatchEvent(new Event('input', { bubbles: true }));
}
// 純文字 → HTML（用於舊資料遷移：純文字 step 升級成 HTML）
function plainTextToHtml(s) {
  if (!s) return '';
  return escapeHtml(s).replace(/\n/g, '<br>');
}
// 偵測是否已經是 HTML 格式（含 tag）
function looksLikeHtml(s) {
  return typeof s === 'string' && /<(br|span|div|p)\b/i.test(s);
}
// 確保字串為 sanitized HTML（舊資料遷移 + 新資料 sanitize）
function ensureColorHtml(s) {
  if (!s) return '';
  return looksLikeHtml(s) ? sanitizeColorHtml(s) : plainTextToHtml(s);
}
// 訓練方法表格 → HTML（cell 內容已是 sanitized HTML）
function methodTableToHtml(table, opts = {}) {
  const t = normalizeTable(table);
  if (!t) return '';
  const headerStyle = opts.compact
    ? 'background:#f0e6d6; color:#6b5435; font-weight:600; padding:6px 8px; border:1px solid #c9b89a; font-size:12px;'
    : 'background:#f0e6d6; color:#6b5435; font-weight:700; padding:8px 10px; border:1px solid #c9b89a;';
  const cellStyle = opts.compact
    ? 'padding:6px 8px; border:1px solid #d8cdb6; vertical-align:top; font-size:12px; line-height:1.5;'
    : 'padding:8px 10px; border:1px solid #d8cdb6; vertical-align:top; line-height:1.55;';
  return `<table style="border-collapse:collapse; width:100%; margin:6px 0; background:white;">
    <thead><tr>${t.headers.map(h => `<th style="${headerStyle}; text-align:left;">${ensureColorHtml(h)}</th>`).join('')}</tr></thead>
    <tbody>${t.rows.map(row => `<tr>${row.map((c, i) => `<td style="${cellStyle}${i===0 ? ' font-weight:600;' : ''}">${ensureColorHtml(c)}</td>`).join('')}</tr>`).join('')}</tbody>
  </table>`;
}
function ensureItemShape(arr) {
  if (!Array.isArray(arr)) return [];
  return arr.map(it => {
    if (typeof it === 'string') {
      // v1
      return { name: it, methods: [] };
    }
    if (Array.isArray(it.methods)) {
      // v3+ → 升級為 v4（加 table 欄位 + steps 統一為 HTML）
      return {
        name: it.name || '',
        methods: it.methods.map(m => ({
          name: (m && m.name) || '',
          steps: (m && m.steps != null) ? ensureColorHtml(m.steps) : '',
          table: (m && m.table) ? normalizeTable(m.table) : null,
        })),
      };
    }
    // v2: had {name, steps}
    if (it.steps && it.steps.trim()) {
      return { name: it.name || '', methods: [{ name: '基本方法', steps: ensureColorHtml(it.steps), table: null }] };
    }
    return { name: it.name || '', methods: [] };
  });
}

function load(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch { return fallback; }
}
function _writeRaw(key, value) {
  // 直接寫，不觸發 sync（用於 pull 從雲端蓋本機）
  localStorage.setItem(key, JSON.stringify(value));
}
function save(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
  // 寫到可同步的 key 時，且只有同步已啟用，才更新 lastModified 並排程 push
  // （未啟用時若也標記 lastModified，會讓「全新裝置首次啟用同步」誤判自己比較新而推空資料）
  if (SYNCABLE_KEYS && SYNCABLE_KEYS.has(key)) {
    if (typeof syncEnabled === 'function' && syncEnabled()) {
      localStorage.setItem(KEYS.lastModified, JSON.stringify(new Date().toISOString()));
      if (typeof schedulePush === 'function') schedulePush();
    }
  }
}

}

const SYNC = {
  GIST_DESCRIPTION: 'Wendy 訓練資料同步 v1',
  pushTimer: null,
  pushing: false,
  pulling: false,
  status: 'idle',          // idle | pending | syncing | ok | error | offline | disabled
  lastError: '',
  statusListeners: [],
};

function syncEnabled() {
  const s = load(KEYS.settings, {});
  return !!s.syncEnabled && !!s.githubPat;
}
function setSyncStatus(status, errMsg) {
  SYNC.status = status;
  SYNC.lastError = errMsg || '';
  SYNC.statusListeners.forEach(fn => { try { fn(); } catch(e){} });
}
function onSyncStatusChange(fn) { SYNC.statusListeners.push(fn); }
function getSyncSettings() { return load(KEYS.settings, {}); }
function updateSyncSettings(patch) {
  const cur = load(KEYS.settings, {});
  Object.assign(cur, patch);
  // 用底層寫入避免被當成可同步 key（settings 不同步）
  _writeRaw(KEYS.settings, cur);
}

async function gistApi(method, path, body) {
  const s = load(KEYS.settings, {});
  if (!s.githubPat) throw new Error('未設定 PAT');
  const r = await fetch(`https://api.github.com${path}`, {
    method,
    headers: {
      'Authorization': `Bearer ${s.githubPat}`,
      'Accept': 'application/vnd.github+json',
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) {
    const txt = await r.text().catch(() => '');
    throw new Error(`GitHub ${r.status}: ${txt.slice(0, 120)}`);
  }
  return r.json();
}

async function findOrCreateSyncGist() {
  const s = load(KEYS.settings, {});
  if (s.syncGistId) return s.syncGistId;
  // 用 description 找既有 gist（其他裝置已建立）
  const list = await gistApi('GET', '/gists?per_page=100');
  const found = list.find(g => (g.description || '').startsWith(SYNC.GIST_DESCRIPTION));
  if (found) {
    updateSyncSettings({ syncGistId: found.id });
    return found.id;
  }
  // 都沒有 → 建新的
  const gist = await gistApi('POST', '/gists', {
    description: SYNC.GIST_DESCRIPTION,
    public: false,
    files: { 'data.json': { content: '{}' } },
  });
  updateSyncSettings({ syncGistId: gist.id });
  return gist.id;
}

function buildSyncPayload() {
  return {
    schemaVersion: 5,
    lastModified: load(KEYS.lastModified, ''),
    pets: load(KEYS.pets, []),
    sessions: load(KEYS.sessions, []),
    itemsCat: load(KEYS.itemsCat, []),
    itemsDog: load(KEYS.itemsDog, []),
    bookings: load(KEYS.bookings, []),
    bookingTemplate: load(KEYS.bookingTemplate, {}),
  };
}

function applySyncPayload(remote) {
  if (!remote || typeof remote !== 'object') return false;
  // 用 _writeRaw 避免遞迴 push
  if (Array.isArray(remote.pets)) _writeRaw(KEYS.pets, remote.pets);
  if (Array.isArray(remote.sessions)) _writeRaw(KEYS.sessions, remote.sessions);
  if (Array.isArray(remote.itemsCat)) _writeRaw(KEYS.itemsCat, remote.itemsCat);
  if (Array.isArray(remote.itemsDog)) _writeRaw(KEYS.itemsDog, remote.itemsDog);
  if (Array.isArray(remote.bookings)) _writeRaw(KEYS.bookings, remote.bookings);
  if (remote.bookingTemplate && typeof remote.bookingTemplate === 'object') {
    _writeRaw(KEYS.bookingTemplate, remote.bookingTemplate);
  }
  if (remote.lastModified) _writeRaw(KEYS.lastModified, remote.lastModified);
  return true;
}

async function pushToCloud() {
  if (!syncEnabled()) return;
  if (SYNC.pushing) return;
  SYNC.pushing = true;
  setSyncStatus('syncing');
  try {
    const gistId = await findOrCreateSyncGist();
    // 推之前把 lastModified 蓋成現在，確保雲端有時間戳給其他裝置比較
    _writeRaw(KEYS.lastModified, new Date().toISOString());
    const payload = buildSyncPayload();
    await gistApi('PATCH', `/gists/${gistId}`, {
      files: { 'data.json': { content: JSON.stringify(payload, null, 2) } },
    });
    updateSyncSettings({ syncLastTime: new Date().toISOString() });
    setSyncStatus('ok');
  } catch (e) {
    setSyncStatus('error', e.message);
    console.warn('Sync push failed:', e);
  } finally {
    SYNC.pushing = false;
  }
}

function schedulePush() {
  if (!syncEnabled()) return;
  setSyncStatus('pending');
  clearTimeout(SYNC.pushTimer);
  SYNC.pushTimer = setTimeout(pushToCloud, 3000);
}

async function pullFromCloud(opts = {}) {
  if (!syncEnabled()) return;
  if (SYNC.pulling) return;
  SYNC.pulling = true;
  setSyncStatus('syncing');
  try {
    const gistId = await findOrCreateSyncGist();
    const gist = await gistApi('GET', `/gists/${gistId}`);
    const file = gist.files && gist.files['data.json'];
    if (!file || !file.content) {
      // 雲端是空的 → 推本機上去
      SYNC.pulling = false;
      await pushToCloud();
      return;
    }
    let content = file.content;
    if (file.truncated && file.raw_url) {
      const r = await fetch(file.raw_url);
      content = await r.text();
    }
    let remote;
    try { remote = JSON.parse(content || '{}'); }
    catch { throw new Error('雲端資料解析失敗'); }

    const localTs = load(KEYS.lastModified, '');
    const remoteTs = remote.lastModified || '';

    // 防呆：本機是空的（pets/sessions 都沒資料）但雲端有，無條件拉取
    // 避免「全新裝置首次啟用」誤推空資料蓋掉雲端
    const localPets = load(KEYS.pets, []);
    const localSess = load(KEYS.sessions, []);
    const localEmpty = (!localPets || localPets.length === 0) && (!localSess || localSess.length === 0);
    const remoteHasData = (Array.isArray(remote.pets) && remote.pets.length > 0)
                       || (Array.isArray(remote.sessions) && remote.sessions.length > 0);

    if (opts.forcePull || (remoteTs && remoteTs > localTs) || (localEmpty && remoteHasData)) {
      applySyncPayload(remote);
      updateSyncSettings({ syncLastTime: new Date().toISOString() });
      setSyncStatus('ok');
      // 重新 render 以反映新資料
      if (typeof render === 'function') render();
    } else if (opts.forcePush || localTs > remoteTs) {
      SYNC.pulling = false;
      await pushToCloud();
      return;
    } else {
      updateSyncSettings({ syncLastTime: new Date().toISOString() });
      setSyncStatus('ok');
    }
  } catch (e) {
    setSyncStatus('error', e.message);
    console.warn('Sync pull failed:', e);
  } finally {
    SYNC.pulling = false;
  }
}

/* ============== UTIL ============== */
function fmtDate(s) {
  if (!s) return '';
  const [y,m,d] = s.split('-');
  return `${y}/${m}/${d}`;
}
function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}
function speciesLabel(s) { return s === 'cat' ? '貓' : '狗'; }
function speciesEmoji(s) { return s === 'cat' ? '🐱' : '🐶'; }
function genderLabel(g) { return g === 'male' ? '♂' : g === 'female' ? '♀' : ''; }
function neuteredLabel(n) { return n === 'yes' ? '已絕育' : n === 'no' ? '未絕育' : ''; }
function petTagline(p) {
  // 一行短描述：品種 · ♂ · 已絕育 · 4 個月齡
  return [
    p.breed || speciesLabel(p.species),
    genderLabel(p.gender),
    neuteredLabel(p.neutered),
    p.birth,
  ].filter(Boolean).join(' · ');
}

function getPet(id) { return load(KEYS.pets, []).find(p => p.id === id); }
function getSession(id) { return load(KEYS.sessions, []).find(s => s.id === id); }
function getPetSessions(petId) {
  return load(KEYS.sessions, [])
    .filter(s => s.petId === petId)
    .sort((a,b) => b.date.localeCompare(a.date));
}

// 排序鍵：最近的 session 日期，沒 session 用 createdAt 當 fallback
function getPetSortKey(pet) {
  const sessions = getPetSessions(pet.id);
  if (sessions.length) return sessions[0].date;
  return pet.createdAt ? pet.createdAt.slice(0, 10) : '';
}
function petMatchesQuery(pet, q) {
  if (!q) return true;
  const lc = q.toLowerCase();
  return (pet.name||'').toLowerCase().includes(lc)
      || (pet.breed||'').toLowerCase().includes(lc)
      || (pet.ownerName||'').toLowerCase().includes(lc);
}

function showNotice(msg, type = 'ok') {
  const n = document.createElement('div');
  n.className = 'notice ' + type;
  n.textContent = msg;
  n.style.position = 'fixed';
  n.style.top = '70px';
  n.style.left = '50%';
  n.style.transform = 'translateX(-50%)';
  n.style.zIndex = '100';
  n.style.maxWidth = '90%';
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 3000);
}

/* ============== ROUTER ============== */
function go(view, params = {}) {
  state.view = view;
  if ('petId' in params) state.petId = params.petId;
  if ('sessionId' in params) state.sessionId = params.sessionId;
  if ('bookingId' in params) state.bookingId = params.bookingId;
  render();
}

function updateHeader() {
  const back = document.getElementById('backBtn');
  const breadcrumb = document.getElementById('breadcrumb');
  const isHome = state.view === 'pets';
  back.style.visibility = isHome ? 'hidden' : 'visible';

  // 組麵包屑：每段 { label, action?, petId?, current? }
  const segs = [{ label: '🏠', action: 'brand' }];
  if (state.view === 'pets') {
    segs.push({ label: '寵物列表', current: true });
  } else if (state.view === 'sessions') {
    segs.push({ label: '寵物列表', action: 'pets' });
    const p = getPet(state.petId);
    if (p) segs.push({ label: `${speciesEmoji(p.species)} ${p.name}`, current: true });
  } else if (state.view === 'session') {
    segs.push({ label: '寵物列表', action: 'pets' });
    const s = getSession(state.sessionId);
    const p = s && getPet(s.petId);
    if (p) segs.push({ label: `${speciesEmoji(p.species)} ${p.name}`, action: 'sessions', petId: p.id });
    if (s) segs.push({ label: fmtDate(s.date), current: true });
  } else if (state.view === 'bookings') {
    segs.push({ label: '寵物列表', action: 'pets' });
    const p = getPet(state.petId);
    if (p) segs.push({ label: `${speciesEmoji(p.species)} ${p.name}`, action: 'sessions', petId: p.id });
    segs.push({ label: '📋 匯款通知', current: true });
  } else if (state.view === 'booking') {
    segs.push({ label: '寵物列表', action: 'pets' });
    const p = getPet(state.petId);
    if (p) segs.push({ label: `${speciesEmoji(p.species)} ${p.name}`, action: 'sessions', petId: p.id });
    segs.push({ label: '📋 匯款通知', action: 'bookings', petId: state.petId });
    segs.push({ label: state.bookingId ? '編輯' : '新增', current: true });
  } else if (state.view === 'settings') {
    segs.push({ label: '寵物列表', action: 'pets' });
    segs.push({ label: '⚙ 設定', current: true });
  }

  breadcrumb.innerHTML = segs.map((seg, i) => {
    const sep = i > 0 ? '<span class="bc-sep">/</span>' : '';
    if (seg.current) return sep + `<span class="bc-current">${escapeHtml(seg.label)}</span>`;
    const dataAttr = seg.petId ? ` data-petid="${escapeAttr(seg.petId)}"` : '';
    return sep + `<a class="bc-link" data-action="${seg.action}"${dataAttr}>${escapeHtml(seg.label)}</a>`;
  }).join('');

  breadcrumb.querySelectorAll('.bc-link').forEach(a => {
    a.onclick = (e) => {
      e.preventDefault();
      const action = a.dataset.action;
      if (action === 'brand') {
        // 本機 file:// 模式跳上層只會看到資料夾，沒意義 → 退回 App 內首頁
        if (window.location.protocol === 'file:') {
          go('pets');
          showNotice('本機模式：實際部署後此按鈕會跳到品牌首頁');
        } else {
          window.location.href = '../';
        }
      } else if (action === 'pets') {
        go('pets');
      } else if (action === 'sessions') {
        go('sessions', { petId: a.dataset.petid });
      } else if (action === 'bookings') {
        go('bookings', { petId: a.dataset.petid });
      }
    };
  });
}

function refreshSyncDot() {
  const dot = document.getElementById('syncDot');
  if (!dot) return;
  if (!syncEnabled()) {
    dot.className = 'sync-dot disabled';
    dot.title = '同步未啟用';
    return;
  }
  const map = {
    ok: { cls: 'ok', txt: '已同步' },
    syncing: { cls: 'syncing', txt: '同步中⋯' },
    pending: { cls: 'pending', txt: '即將同步' },
    error: { cls: 'error', txt: '同步失敗：' + (SYNC.lastError || '') },
    idle: { cls: 'disabled', txt: '尚未同步' },
  };
  const info = map[SYNC.status] || map.idle;
  dot.className = 'sync-dot ' + info.cls;
  dot.title = info.txt;
}
onSyncStatusChange(refreshSyncDot);
document.getElementById('syncDot').onclick = () => {
  state._returnView = state.view;
  go('settings');
};

document.getElementById('backBtn').onclick = () => {
  if (state.view === 'sessions') go('pets');
  else if (state.view === 'session') go('sessions', { petId: state.petId });
  else if (state.view === 'bookings') go('sessions', { petId: state.petId });
  else if (state.view === 'booking') go('bookings', { petId: state.petId });
  else if (state.view === 'settings') go(state._returnView || 'pets');
};
document.getElementById('settingsBtn').onclick = () => {
  state._returnView = state.view;
  go('settings');
};

/* ============== VIEW: PETS ============== */
function renderPets() {
  const main = document.getElementById('main');
  const allPets = load(KEYS.pets, []);
  const hero = `
    <div class="brand-hero">
      <img src="logo.png" alt="Wendy 溫蒂．貓與狗訓練日常"
           onerror="this.style.display='none'">
    </div>`;

  if (allPets.length === 0) {
    main.innerHTML = hero + `
      <div class="empty">
        <h3>還沒有寵物資料</h3>
        <p>點右下角 ＋ 新增第一隻</p>
      </div>
      <button class="fab" id="fab">＋</button>
    `;
    document.getElementById('fab').onclick = () => openAddPetChooser();
    return;
  }

  // 計算各物種數量
  const dogCount = allPets.filter(p => p.species === 'dog').length;
  const catCount = allPets.filter(p => p.species === 'cat').length;
  const showSearch = allPets.length > 0;

  // Tabs
  const tabs = `
    <div class="tabs">
      <button class="tab ${state.petFilter===''?'active':''}" data-pet-filter="">全部 (${allPets.length})</button>
      <button class="tab ${state.petFilter==='dog'?'active':''}" data-pet-filter="dog">🐶 狗 (${dogCount})</button>
      <button class="tab ${state.petFilter==='cat'?'active':''}" data-pet-filter="cat">🐱 貓 (${catCount})</button>
    </div>`;

  // Search
  const search = showSearch ? `
    <input type="text" class="search-input" id="petSearch"
           placeholder="🔍 搜尋名字、品種或飼主"
           value="${escapeAttr(state.petQuery)}">` : '';

  // Filter + sort
  let pets = allPets.slice();
  if (state.petFilter) pets = pets.filter(p => p.species === state.petFilter);
  if (state.petQuery.trim()) pets = pets.filter(p => petMatchesQuery(p, state.petQuery.trim()));
  pets.sort((a, b) => getPetSortKey(b).localeCompare(getPetSortKey(a)));

  let listHtml;
  if (pets.length === 0) {
    listHtml = `
      <div class="empty">
        <h3>沒有符合條件的寵物</h3>
        <p>試試其他關鍵字或切換物種</p>
      </div>`;
  } else {
    listHtml = pets.map(p => {
      const sessions = getPetSessions(p.id);
      const count = sessions.length;
      const recentLabel = sessions.length
        ? `最近：${fmtDate(sessions[0].date)}`
        : '尚未上課';
      // 購買過的課程類型摘要（按次數降冪）
      const petBookings = getPetBookings(p.id);
      const courseSummary = (() => {
        if (petBookings.length === 0) return '';
        const counts = {};
        petBookings.forEach(b => {
          const label = courseTypeLabel(b);
          counts[label] = (counts[label] || 0) + 1;
        });
        const parts = Object.entries(counts)
          .sort((a, b) => b[1] - a[1])
          .map(([label, n]) => `${escapeHtml(label)} ×${n}`);
        return `<div class="card-meta" style="margin-top:4px; font-size:12px; color:var(--brown-dark)">📋 ${parts.join(' · ')}</div>`;
      })();
      return `
        <div class="card" data-id="${p.id}">
          <div class="card-row">
            <div>
              <div class="card-title">${speciesEmoji(p.species)} ${escapeHtml(p.name)}</div>
              <div class="card-meta">${escapeHtml(petTagline(p))} · 飼主：${escapeHtml(p.ownerName || '—')}</div>
              <div class="card-meta" style="margin-top:4px; font-size:12px">${recentLabel}</div>
              ${courseSummary}
            </div>
            <span class="badge">${count} 堂</span>
          </div>
        </div>`;
    }).join('');
  }

  main.innerHTML = hero + tabs + search + listHtml + `<button class="fab" id="fab">＋</button>`;

  // Tab handler
  main.querySelectorAll('[data-pet-filter]').forEach(t => {
    t.onclick = () => { state.petFilter = t.dataset.petFilter; renderPets(); };
  });
  // Search handler
  const sInput = document.getElementById('petSearch');
  if (sInput) {
    sInput.oninput = () => {
      state.petQuery = sInput.value;
      renderPets();
      // 重新 render 後 input 會被取代，把 focus 放回去
      const newInput = document.getElementById('petSearch');
      if (newInput) {
        newInput.focus();
        newInput.setSelectionRange(newInput.value.length, newInput.value.length);
      }
    };
  }
  // Card click
  main.querySelectorAll('.card[data-id]').forEach(el => {
    el.onclick = () => go('sessions', { petId: el.dataset.id });
  });
  document.getElementById('fab').onclick = () => openAddPetChooser();
}

  const html = `
    <div class="modal" style="max-width:420px">
      <h2>新增寵物</h2>
      <div style="display:flex; flex-direction:column; gap:10px; margin-top:10px">

        <button class="btn" id="add_csv">📥 CSV 匯入</button>
        <button class="btn ghost" id="add_manual">✏️ 手動填寫</button>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="add_cancel">取消</button>
      </div>
    </div>
  `;
  const overlay = openModal(html);
  overlay.querySelector('#add_cancel').onclick = () => overlay.remove();
  overlay.querySelector('#add_manual').onclick = () => { overlay.remove(); openPetForm(); };
  overlay.querySelector('#add_email').onclick = () => { overlay.remove(); openEmailImport(); };

}

            <option value="no" ${data.neutered==='no'?'selected':''}>否</option>
          </select>

      </div>

        <div class="field">
          <label>出生年月 / 月齡</label>
          <input id="f_birth" type="text" value="${escapeAttr(data.birth)}" placeholder="2023-05 或 4 個月齡">
        </div>

          <label>飼主姓名</label>
          <input id="f_owner" type="text" value="${escapeAttr(data.ownerName)}" placeholder="例：陳小姐">
        </div>
      </div>
      <div class="field">
        <label>飼主聯絡（電話 / LINE / Email）</label>
        <input id="f_contact" type="text" value="${escapeAttr(data.ownerContact)}" placeholder="可選">
      </div>
      <div class="field">
        <label>飼主地址（用於到府上課與匯款通知）</label>
        <input id="f_address" type="text" value="${escapeAttr(data.ownerAddress || '')}" placeholder="例：嘉義縣民雄鄉⋯">
      </div>
      <div class="field">
        <label>⚠️ 目前困擾行為（客戶想解決的問題）</label>
        <textarea id="f_concerns" placeholder="例：吠叫、撲人、不上廁所、護食⋯">${escapeHtml(data.concerns || '')}</textarea>
      </div>
      <div class="field">
        <label>備註（個性 / 過敏 / 特殊狀況 / 健康 / 家庭環境⋯）</label>
        <textarea id="f_notes">${escapeHtml(data.notes)}</textarea>
      </div>
      <div class="modal-actions">
        ${isEdit ? '<button class="btn danger" id="m_del">刪除</button>' : ''}
        <button class="btn ghost" id="m_cancel">取消</button>
        <button class="btn" id="m_save">${isEdit ? '儲存' : '建立'}</button>
      </div>
    </div>
  `;
  const overlay = openModal(html);
  overlay.querySelector('#m_cancel').onclick = () => overlay.remove();
  overlay.querySelector('#m_save').onclick = () => {
    const name = overlay.querySelector('#f_name').value.trim();
    if (!name) { showNotice('請填名字', 'err'); return; }
    const updated = {
      id: data.id || uid(),
      species: overlay.querySelector('#f_species').value,
      name,
      breed: overlay.querySelector('#f_breed').value.trim(),
      birth: overlay.querySelector('#f_birth').value.trim(),
      gender: overlay.querySelector('#f_gender').value,
      neutered: overlay.querySelector('#f_neutered').value,
      ownerName: overlay.querySelector('#f_owner').value.trim(),
      ownerContact: overlay.querySelector('#f_contact').value.trim(),
      ownerAddress: overlay.querySelector('#f_address').value.trim(),
      concerns: overlay.querySelector('#f_concerns').value.trim(),
      notes: overlay.querySelector('#f_notes').value.trim(),
      createdAt: data.createdAt || new Date().toISOString(),
    };
    const pets = load(KEYS.pets, []);
    if (isEdit) {
      const idx = pets.findIndex(p => p.id === data.id);
      pets[idx] = updated;
    } else {
      pets.push(updated);
    }
    save(KEYS.pets, pets);
    overlay.remove();
    render();
  };
  if (isEdit) {
    overlay.querySelector('#m_del').onclick = () => {
      if (!confirm(`刪除 ${data.name}？此寵物的所有課程記錄也會一併刪除。`)) return;
      save(KEYS.pets, load(KEYS.pets, []).filter(p => p.id !== data.id));
      save(KEYS.sessions, load(KEYS.sessions, []).filter(s => s.petId !== data.id));
      overlay.remove();
      go('pets');
    };
  }
}

/* ============== VIEW: SESSIONS ============== */
// ===== Session 排序 =====
const SESSION_SORT_OPTIONS = [
  { key: 'date_desc',      label: '日期：新到舊' },
  { key: 'date_asc',       label: '日期：舊到新' },
  { key: 'upcoming_first', label: '即將上課優先' },
  { key: 'by_type',        label: '課程類型分組' },
];
function getSessionSortPref() {
  const s = load(KEYS.settings, {});
  return s.sessionSort || 'date_desc';
}
function setSessionSortPref(key) {
  const s = load(KEYS.settings, {});
  s.sessionSort = key;
  save(KEYS.settings, s);
}
function applySessionSort(sessions, key) {
  const today = todayStr();
  const arr = sessions.slice();
  switch (key) {
    case 'date_asc':
      return arr.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    case 'upcoming_first':
      return arr.sort((a, b) => {
        const aFut = (a.date || '') >= today;
        const bFut = (b.date || '') >= today;
        if (aFut && !bFut) return -1;
        if (!aFut && bFut) return 1;
        if (aFut && bFut) return (a.date || '').localeCompare(b.date || '');
        return (b.date || '').localeCompare(a.date || '');
      });
    case 'by_type':
      return arr.sort((a, b) => {
        const labA = courseTypeLabel(a) || '未分類';
        const labB = courseTypeLabel(b) || '未分類';
        if (labA !== labB) return labA.localeCompare(labB);
        return (b.date || '').localeCompare(a.date || '');
      });
    case 'date_desc':
    default:
      return arr.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  }
}

function renderSessions() {
  const main = document.getElementById('main');
  const pet = getPet(state.petId);
  if (!pet) { go('pets'); return; }
  const sortKey = getSessionSortPref();
  const sessions = applySessionSort(getPetSessions(pet.id), sortKey);
  const meta = `
    <div class="card" style="cursor:default; background:transparent; box-shadow:none; padding:8px 4px">
      <div class="card-meta">
        ${escapeHtml(petTagline(pet))} ·
        飼主 ${escapeHtml(pet.ownerName || '—')}
        ${pet.ownerContact ? ' · ' + escapeHtml(pet.ownerContact) : ''}
      </div>
      ${pet.ownerAddress ? `<div class="card-meta" style="margin-top:6px">📍 ${escapeHtml(pet.ownerAddress)}</div>` : ''}
      ${pet.concerns ? `<div class="card-meta" style="margin-top:8px; padding:8px 10px; background:rgba(201,122,79,0.12); border-left:3px solid var(--work); border-radius:4px; white-space:pre-wrap">⚠️ ${escapeHtml(pet.concerns)}</div>` : ''}
      ${pet.notes ? `<div class="card-meta" style="margin-top:6px; white-space:pre-wrap">📝 ${escapeHtml(pet.notes)}</div>` : ''}
      <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap">
        <button class="small-btn" id="editPet">編輯寵物資料</button>
        <button class="small-btn" id="bookingBtn">📋 匯款通知</button>
      </div>
    </div>
  `;
  // 排序選單（只有 ≥1 堂課時才顯示）
  const sortBar = sessions.length === 0 ? '' : `
    <div style="display:flex; justify-content:flex-end; align-items:center; gap:6px; margin:6px 4px 10px">
      <label for="sessionSort" style="font-size:12px; color:var(--text-soft)">排序</label>
      <select id="sessionSort" style="padding:5px 8px; border:1px solid var(--border); border-radius:6px; background:white; font-size:13px; color:var(--text); font-family:inherit">
        ${SESSION_SORT_OPTIONS.map(o => `<option value="${o.key}" ${o.key===sortKey?'selected':''}>${o.label}</option>`).join('')}
      </select>
    </div>`;

  // 卡片渲染（共用）
  function sessionCardHtml(s) {
    const recCount = (s.records || []).filter(r => r.selected).length;
    const isToday = s.date === todayStr();
    const ctLab = courseTypeLabel(s);
    const seqLab = sessionSeqLabel(s);
    const courseLine = (ctLab || seqLab)
      ? `<div class="card-meta" style="color:var(--brown-dark); font-weight:500">📋 ${escapeHtml(ctLab)}${ctLab && seqLab ? ' · ' : ''}${escapeHtml(seqLab)}</div>`
      : '';
    return `
      <div class="card" data-id="${s.id}">
        <div class="card-row">
          <div>
            <div class="card-title">${fmtDate(s.date)} ${isToday ? '<span class="badge" style="background:var(--good)">今天</span>' : ''}</div>
            ${courseLine}
            <div class="card-meta">
              ${s.location ? '📍 ' + escapeHtml(s.location) + ' · ' : ''}
              ${s.duration ? s.duration + ' 分鐘' : ''}
              ${recCount > 0 ? ' · 已記錄 ' + recCount + ' 項' : ' · 尚未記錄'}
            </div>
          </div>
          <button class="card-menu-btn" data-menu="${s.id}" title="更多動作">⋯</button>
        </div>
      </div>`;
  }

  let body;
  if (sessions.length === 0) {
    body = `<div class="empty"><h3>還沒有課程</h3><p>點右下角 ＋ 新增第一堂</p></div>`;
  } else if (sortKey === 'by_type') {
    // 課程類型分組：加分類標頭
    const groups = {};
    sessions.forEach(s => {
      const lab = courseTypeLabel(s) || '未分類';
      if (!groups[lab]) groups[lab] = [];
      groups[lab].push(s);
    });
    body = Object.keys(groups).sort().map(label => `
      <h3 style="font-size:14px; color:var(--brown-dark); margin:18px 4px 8px; border-bottom:1px solid var(--border); padding-bottom:4px">
        📋 ${escapeHtml(label)} <span style="color:var(--text-soft); font-weight:400">(${groups[label].length})</span>
      </h3>
      ${groups[label].map(sessionCardHtml).join('')}
    `).join('');
  } else {
    body = sessions.map(sessionCardHtml).join('');
  }
  main.innerHTML = meta + sortBar + body + `<button class="fab" id="fab">＋</button>`;
  // 排序選單
  const sortSelect = document.getElementById('sessionSort');
  if (sortSelect) sortSelect.onchange = (e) => {
    setSessionSortPref(e.target.value);
    renderSessions();
  };
  document.getElementById('editPet').onclick = () => openPetForm(pet);
  document.getElementById('bookingBtn').onclick = () => go('bookings', { petId: pet.id });
  main.querySelectorAll('.card[data-id]').forEach(el => {
    el.onclick = (e) => {
      // 點到 ⋯ 按鈕時不要進入該堂課
      if (e.target.classList.contains('card-menu-btn')) return;
      go('session', { sessionId: el.dataset.id });
    };
  });
  // ⋯ 按鈕：開選單（編輯 / 刪除）
  main.querySelectorAll('.card-menu-btn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const sid = btn.dataset.menu;
      const sess = getSession(sid);
      if (!sess) return;
      openSessionMenu(btn, sess);
    };
  });
  document.getElementById('fab').onclick = () => openSessionForm();
}

function openSessionMenu(anchorBtn, sess) {
  // 關掉舊的（如果有）
  document.querySelectorAll('.card-menu').forEach(m => m.remove());
  const rect = anchorBtn.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.className = 'card-menu';
  menu.style.position = 'fixed';
  menu.style.top = (rect.bottom + 4) + 'px';
  menu.style.right = (window.innerWidth - rect.right) + 'px';
  menu.innerHTML = `
    <button data-act="edit">✏️ 編輯課程資訊</button>
    <button data-act="delete" class="danger">🗑 刪除這堂課</button>
  `;
  document.body.appendChild(menu);
  // 點外面關閉
  setTimeout(() => {
    const close = (e) => {
      if (!menu.contains(e.target)) {
        menu.remove();
        document.removeEventListener('click', close);
      }
    };
    document.addEventListener('click', close);
  }, 0);
  menu.querySelector('[data-act="edit"]').onclick = () => {

/* ============== BOOKING / 匯款通知 ============== */
function getBooking(id) { return load(KEYS.bookings, []).find(b => b.id === id); }
function getPetBookings(petId) {
  return load(KEYS.bookings, [])
    .filter(b => b.petId === petId)
    .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
}
function loadBookingTemplate() {
  // 缺欄位用預設補（向後相容、設定漏填都能容錯）
  return Object.assign({}, DEFAULT_BOOKING_TEMPLATE, load(KEYS.bookingTemplate, {}));
}
// 課程類型 → 顯示文字（共用：booking + session）
function courseTypeLabel(b) {
  switch (b && b.courseType) {
    case 'firstConsult': return '首堂諮詢';
    case 'group':
      if (b.groupSubType === 'puppy') return '幼犬班';
      if (b.groupSubType === 'youth') return '青少年犬班';
      if (b.groupSubType === 'other') return (b.groupSubTypeOther || '').trim() || '團體班';
      return '團體班';
    case 'other':
      return (b.courseTypeOther || '').trim() || '其他課程';
    case 'oneOnOne':
      return '一對一';
    default:
      return '';
  }
}
// 排序顯示：第 X 堂 / 共 Y 堂（首堂諮詢不顯示）
function sessionSeqLabel(s) {
  if (!s) return '';
  if (s.courseType === 'firstConsult') return '';
  const seq = parseInt(s.sessionSeq, 10);
  const total = parseInt(s.sessionTotal, 10);
  if (!seq && !total) return '';
  if (seq && total) return `第 ${seq} 堂 / 共 ${total} 堂`;
  if (seq) return `第 ${seq} 堂`;
  return '';
}
function bookingSubtotal(booking) {
  const n = booking.sessionCount || 0;
  return ((booking.feePerClass || 0) + (booking.transportPerClass || 0)) * n;
}
// 優惠金額（折抵後是正數，要從 subtotal 扣掉）
function bookingDiscount(booking) {
  const sub = bookingSubtotal(booking);
  const v = parseFloat(booking.discountValue) || 0;
  if (booking.discountType === 'amount') return Math.min(v, sub);
  if (booking.discountType === 'percent') return Math.round(sub * v / 100);
  return 0;
}
function bookingTotal(booking) {
  return bookingSubtotal(booking) - bookingDiscount(booking);
}
// 24h "16:00" → 「下午4:00」；空字串維持空
function fmtTime12(hhmm) {
  if (!hhmm) return '';
  const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm);
  if (!m) return hhmm;
  let h = parseInt(m[1], 10);
  const ampm = h < 12 ? '上午' : '下午';
  if (h === 0) h = 12;
  else if (h > 12) h -= 12;
  return `${ampm}${h}:${m[2]}`;
}
function fmtTimeRange(start, end) {
  if (!start && !end) return '';
  if (!end) return fmtTime12(start);
  // 同上午/下午只前綴一次
  const s = fmtTime12(start), e = fmtTime12(end);
  const sP = s.startsWith('上午') || s.startsWith('下午') ? s.slice(0, 2) : '';
  const eP = e.startsWith('上午') || e.startsWith('下午') ? e.slice(0, 2) : '';
  if (sP && sP === eP) return s + '-' + e.slice(2);
  return s + '-' + e;
}
function fmtMoney(n) { return 'NT$ ' + (n || 0).toLocaleString('en-US'); }

function renderBooking() {
  const main = document.getElementById('main');

  const tpl = loadBookingTemplate();
  const isEdit = !!state.bookingId;
  const data = isEdit ? getBooking(state.bookingId) : null;
  if (isEdit && !data) { go('bookings', { petId: pet.id }); return; }

  // 帶入預設或既有資料
  // 新建 booking 時：地點優先用「飼主地址」（多數客戶到府上課），沒填才退到全域預設
  const b = data ? JSON.parse(JSON.stringify(data)) : {
    id: '',
    petId: pet.id,
    sessionCount: 1,
    sessions: [{ date: '', startTime: '', endTime: '' }],
    location: (pet.ownerAddress && pet.ownerAddress.trim()) || tpl.defaultLocation,
    feePerClass: tpl.defaultFeePerClass,
    transportPerClass: tpl.defaultTransportPerClass,
    discountType: '',     // '' | 'amount' | 'percent'
    discountValue: 0,
    discountLabel: '',
    paymentDueDate: '',
    paymentDueNote: '中午前',
    courseType: 'oneOnOne',           // 'oneOnOne' | 'firstConsult' | 'group' | 'other'
    groupSubType: 'puppy',            // 'puppy' | 'youth' | 'other'  (only if courseType==='group')
    groupSubTypeOther: '',            // 自填的團體班類型 (only if groupSubType==='other')
    courseTypeOther: '',              // 自填的課程類型 (only if courseType==='other')
  };

  if (b.discountType === undefined) b.discountType = '';
  if (b.discountValue === undefined) b.discountValue = 0;
  if (b.discountLabel === undefined) b.discountLabel = '';
  if (b.courseType === undefined) b.courseType = 'oneOnOne';
  if (b.groupSubType === undefined) b.groupSubType = 'puppy';

  if (b.courseTypeOther === undefined) b.courseTypeOther = '';
  // 確保 sessions 長度跟 sessionCount 對齊（編輯舊資料時也修正）
  function alignSessions() {
    while (b.sessions.length < b.sessionCount) b.sessions.push({ date: '', startTime: '', endTime: '' });
    if (b.sessions.length > b.sessionCount) b.sessions.length = b.sessionCount;
  }
  alignSessions();

  function rerender() { renderInner(); }
  function renderInner() {
    const sessRows = b.sessions.map((s, i) => `
      <div class="session-row" style="display:grid; grid-template-columns: 60px 1fr 1fr 1fr; gap:8px; align-items:center; margin-bottom:8px;">

      </div>
    `).join('');

    const total = bookingTotal(b);

    main.innerHTML = `
      <div class="card" style="cursor:default; background:transparent; box-shadow:none; padding:8px 4px">
        <div class="card-meta">
          ${speciesEmoji(pet.species)} ${escapeHtml(pet.name)} ${pet.breed ? '(' + escapeHtml(pet.breed) + ')' : ''} ·

        <div class="field">

          <div id="bk_sessions">${sessRows}</div>

        <div style="display:grid; grid-template-columns: 1fr 100px 60px 1fr; gap:8px; align-items:center; margin-bottom:8px;">

          <div style="text-align:center; color:var(--text-soft)">/ 堂</div>
          <div style="text-align:right; color:var(--text-soft)" id="bk_transportSubtotal">$ ${(b.transportPerClass*b.sessionCount).toLocaleString()}</div>
        </div>

        <div style="border-top:1px dashed var(--brown-light); padding-top:8px; margin-top:6px;">
          <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
            <div style="flex:0 0 60px; color:var(--text-soft); font-size:13px">優惠</div>
            <select id="bk_discountType" style="flex:0 0 110px; padding:6px 8px;">
              <option value="" ${b.discountType===''?'selected':''}>無</option>
              <option value="amount" ${b.discountType==='amount'?'selected':''}>固定金額</option>
              <option value="percent" ${b.discountType==='percent'?'selected':''}>百分比 %</option>
            </select>

                   placeholder="優惠說明（如：四堂組合優惠）"
                   style="flex:1; padding:6px 8px;" ${b.discountType?'':'disabled'}>
          </div>

      <div class="card" style="cursor:default">
        <div class="row2">
          <div class="field">
            <label>繳費截止日</label>
            <input id="bk_due" type="date" value="${escapeAttr(b.paymentDueDate||'')}">
          </div>
          <div class="field">
            <label>截止備註</label>
            <select id="bk_dueNote">
              <option value="" ${b.paymentDueNote===''?'selected':''}>—</option>
              <option value="中午前" ${b.paymentDueNote==='中午前'?'selected':''}>中午前</option>
              <option value="下午前" ${b.paymentDueNote==='下午前'?'selected':''}>下午前</option>
              <option value="晚上前" ${b.paymentDueNote==='晚上前'?'selected':''}>晚上前</option>
            </select>
          </div>
        </div>

      <div class="actions-row" style="margin-top:14px">

        <button class="btn ghost" id="bk_pdf">🖨 預覽 / 列印 PDF</button>
        ${isEdit ? '<button class="btn danger" id="bk_del">刪除</button>' : ''}
      </div>
    `;

    // 事件
    // 課程類型 radio
    main.querySelectorAll('input[name="bkCourseType"]').forEach(r => {
      r.onchange = () => {
        b.courseType = r.value;
        // 切到 group 而 groupSubType 是空字串時，預設選 puppy
        if (b.courseType === 'group' && !b.groupSubType) b.groupSubType = 'puppy';
        rerender();
      };
    });
    const grpSel = document.getElementById('bk_groupSubType');
    if (grpSel) grpSel.onchange = (e) => {
      b.groupSubType = e.target.value;
      rerender();
    };
    const grpOther = document.getElementById('bk_groupSubTypeOther');
    if (grpOther) grpOther.oninput = (e) => { b.groupSubTypeOther = e.target.value; };
    const ctOther = document.getElementById('bk_courseTypeOther');
    if (ctOther) ctOther.oninput = (e) => { b.courseTypeOther = e.target.value; };
    main.querySelectorAll('input[name="bkCount"]').forEach(r => {
      r.onchange = () => {
        b.sessionCount = parseInt(r.value, 10);
        alignSessions();
        rerender();
      };
    });
    main.querySelectorAll('#bk_sessions input').forEach(inp => {
      inp.onchange = () => {
        const i = parseInt(inp.dataset.i, 10);
        b.sessions[i][inp.dataset.f] = inp.value;
      };
    });
    document.getElementById('bk_location').onchange = (e) => { b.location = e.target.value.trim(); };
    document.getElementById('bk_fee').oninput = (e) => {
      b.feePerClass = parseInt(e.target.value, 10) || 0;
      document.getElementById('bk_feeSubtotal').textContent = '$ ' + (b.feePerClass*b.sessionCount).toLocaleString();
      document.getElementById('bk_total').textContent = fmtMoney(bookingTotal(b));
    };
    document.getElementById('bk_transport').oninput = (e) => {
      b.transportPerClass = parseInt(e.target.value, 10) || 0;
      document.getElementById('bk_transportSubtotal').textContent = '$ ' + (b.transportPerClass*b.sessionCount).toLocaleString();
      document.getElementById('bk_total').textContent = fmtMoney(bookingTotal(b));
    };
    document.getElementById('bk_due').onchange = (e) => { b.paymentDueDate = e.target.value; };
    document.getElementById('bk_dueNote').onchange = (e) => { b.paymentDueNote = e.target.value; };

    // 優惠：類型切換 → 顯示/隱藏值欄、改單位、enable label
    function refreshDiscountUI() {
      const valueRow = document.getElementById('bk_discountValueRow');
      const labelInp = document.getElementById('bk_discountLabel');
      const unit = document.getElementById('bk_discountUnit');
      if (b.discountType) {
        valueRow.removeAttribute('hidden');
        labelInp.removeAttribute('disabled');
        unit.textContent = b.discountType === 'percent' ? '%' : '$';
      } else {
        valueRow.setAttribute('hidden', '');
        labelInp.setAttribute('disabled', '');
      }
      document.getElementById('bk_discountSubtotal').textContent = '- $ ' + bookingDiscount(b).toLocaleString();
      document.getElementById('bk_total').textContent = fmtMoney(bookingTotal(b));
    }
    document.getElementById('bk_discountType').onchange = (e) => {
      b.discountType = e.target.value;
      if (!b.discountType) { b.discountValue = 0; b.discountLabel = ''; }
      refreshDiscountUI();
    };
    document.getElementById('bk_discountLabel').oninput = (e) => { b.discountLabel = e.target.value; };
    document.getElementById('bk_discountValue').oninput = (e) => {
      b.discountValue = parseFloat(e.target.value) || 0;
      refreshDiscountUI();
    };
    // 課程/交通/堂數變動時也要重算優惠 (百分比情況)
    const origFeeHandler = document.getElementById('bk_fee').oninput;
    document.getElementById('bk_fee').oninput = (e) => {
      origFeeHandler(e);
      refreshDiscountUI();
    };
    const origTransHandler = document.getElementById('bk_transport').oninput;
    document.getElementById('bk_transport').oninput = (e) => {
      origTransHandler(e);
      refreshDiscountUI();
    };

    document.getElementById('bk_save').onclick = () => commitBooking({ thenPdf: false });
    document.getElementById('bk_pdf').onclick = () => commitBooking({ thenPdf: true });
    if (isEdit) {
      document.getElementById('bk_del').onclick = () => {
        if (!confirm('刪除這筆匯款通知？')) return;
        save(KEYS.bookings, load(KEYS.bookings, []).filter(x => x.id !== b.id));
        showNotice('已刪除');
        go('bookings', { petId: pet.id });
      };
    }
  }

  function commitBooking({ thenPdf }) {
    // 第 1 堂必填，其他堂可空（上完前一堂再回來補）
    if (!b.sessions[0] || !b.sessions[0].date) {
      showNotice('請至少填第 1 堂的日期', 'err');
      return;
    }
    const now = new Date().toISOString();
    const updated = Object.assign({}, b, {
      id: b.id || uid(),
      createdAt: b.createdAt || now,
      updatedAt: now,
    });
    const all = load(KEYS.bookings, []);
    const idx = all.findIndex(x => x.id === updated.id);
    if (idx >= 0) all[idx] = updated; else all.push(updated);
    save(KEYS.bookings, all);
    showNotice('已儲存');
    if (thenPdf) {
      exportBookingPdf(updated, pet);
    } else if (!isEdit) {
      // 第一次新增 → 跳到編輯模式 (帶 id)
      go('booking', { petId: pet.id, bookingId: updated.id });
    }
  }

  renderInner();
}

// FAS 等級描述（從 FAS Spectrum 標準）
const FAS_DESCRIPTIONS = {
  '0': '沒有 FAS 的徵兆，表現出放鬆的肢體語言，並願意與家庭成員進行社交互動。',
  '1': '表現出 1 或 2 個輕微 FAS 的徵兆：流口水、舔唇、不願意眼神接觸、轉過頭但不走開、抬起腳掌、瞳孔部分放大和/或喘氣（嘴巴微微張開），每分鐘發生少於 4 次。對零食或玩具感興趣，並會與家庭成員進行社交互動。',
  '2': '表現出 1 到 2 個中度 FAS 的徵兆：耳朵稍微向後或向某一側、尾巴朝下、皺眉頭、移動緩慢、過度尋求關注 和/或張開口緊繃的喘著氣。容易接受零食或玩具，仍希望與家庭成員進行社交互動。',
  '3': '出現超過 2 個中等程度的 FAS 徵兆，在一分鐘內發生 4 次以上。可能會拒絕零食或玩具，或很急促地吃下進食。也可能不太想與互動，但不會主動避開。',
  '4': '不具有攻擊行為的強烈 FAS 徵兆：僵住、坐立不安、迴避、瞳孔放大、過度喘氣、呼吸頻率加快、頭抖、緊閉尾巴、耳朵向後 和/或尾巴捲起或擺動。可能不接受任何零食或玩具，沒興趣與家庭成員互動，可能出現主動避開。',
  '5': '具有攻擊行為的強烈 FAS 徵兆：低吼、暴衝、吠叫、哈氣、咆哮和/或空咬。'
};
function fasColorClass(level) {
  if (level === '0' || level === '1') return 'lvl-low';
  if (level === '2' || level === '3') return 'lvl-mid';
  if (level === '4' || level === '5') return 'lvl-high';
  return '';
}
function fasShortLabel(level) {
  return ({'0':'放鬆','1':'輕微','2':'輕中度','3':'中度','4':'高度','5':'高度+攻擊'})[level] || '';
}
function fasEmoji(level) {
  if (level === '0' || level === '1') return '🟢';
  if (level === '2' || level === '3') return '🟡';
  if (level === '4' || level === '5') return '🔴';
  return '';
}
function fasMarker(level) {
  return `${fasEmoji(level)} ${fasShortLabel(level)} `;
}

function renderFirstConsultSession(sess, pet) {
  const main = document.getElementById('main');
  const tpl = loadBookingTemplate();
  const templates = tpl.firstConsultTemplates || [];
  main.innerHTML = `
    <div class="autosave-banner">
      💾 FAS 觀察筆記、報告內容都<b>自動儲存</b>。觀察筆記是內部用、不會出現在給家長的報告 PDF 上。
    </div>
    <div class="card" style="cursor:default">
      <div class="card-row">
        <div>
          <div class="card-title">${speciesEmoji(pet.species)} ${escapeHtml(pet.name)} ${genderLabel(pet.gender)}</div>
          <div class="card-meta">
            ${fmtDate(sess.date)}
            ${sess.location ? ' · 📍 ' + escapeHtml(sess.location) : ''}
            ${sess.duration ? ' · ' + sess.duration + ' 分鐘' : ''}
            <br>📋 首堂諮詢
          </div>
        </div>
        <button class="small-btn" id="editSess">編輯</button>
      </div>
    </div>

    <div class="fc-section-title">🔍 內部觀察 <span class="small">（不會出現在報告）</span></div>
    <div class="card" style="cursor:default">
      <div class="field">
        <label>FAS 觀察筆記</label>
        <textarea id="fasNotes" rows="10" placeholder="點下方色帶按鈕插入帶顏色的等級標記。例：&#10;🔴 高度 進門時瞳孔放大、僵住 5 秒&#10;🟢 輕微 接受零食後緩和&#10;🟡 中度 飼主大聲說話時又緊繃...">${escapeHtml(sess.fasNotes||'')}</textarea>
        <div style="margin-top:8px; font-size:12px; color:var(--text-soft)">點按鈕在游標位置插入帶顏色的等級標記：</div>
        <div class="fas-bar" style="margin-top:6px">
          ${['0','1','2','3','4','5'].map(lv => `
            <button type="button" class="fas-btn ${fasColorClass(lv)} active" data-fas="${lv}" style="opacity:1">
              ${lv}<small>${fasShortLabel(lv)}</small>
            </button>
          `).join('')}
        </div>
        <details style="margin-top:10px">
          <summary style="cursor:pointer; font-size:12px; color:var(--accent); user-select:none">📖 各等級特徵說明（點開）</summary>
          <div style="margin-top:8px; padding:10px 12px; background:#f7f1e6; border-left:3px solid var(--brown-light); border-radius:6px; font-size:12px; line-height:1.7;">
            ${['0','1','2','3','4','5'].map(lv => `
              <div style="margin-bottom:6px"><b style="color:${lv<2?'#6b9e6e':lv<4?'#c9a85a':'#c97a4f'}">${fasEmoji(lv)} ${fasShortLabel(lv)}</b>：${escapeHtml(FAS_DESCRIPTIONS[lv])}</div>
            `).join('')}
          </div>
        </details>
      </div>
    </div>

    <div class="fc-section-title">📨 給家長的報告 <span class="small">（會出現在 PDF）</span></div>
    <div class="card" style="cursor:default">
      <div class="field">
        <label>報告內容</label>
        <textarea id="firstConsultReport" rows="14" placeholder="這裡的內容會印在給飼主的 PDF 報告上...">${escapeHtml(sess.firstConsultReport||'')}</textarea>
        <div class="template-buttons">
          ${templates.length === 0 ? '<span style="font-size:12px; color:var(--text-soft)">（尚未設定模板，去設定頁編輯）</span>' :
            templates.map((t, i) => `<button type="button" class="small-btn" data-tpl-idx="${i}">+ ${escapeHtml(t.label)}</button>`).join('')}
        </div>
      </div>
    </div>

    <div class="actions-row">
      <button class="btn" id="saveBtn">💾 儲存</button>
      <button class="btn ghost" id="pdfBtn">📄 報告 PDF</button>
    </div>
  `;
  document.getElementById('editSess').onclick = () => openSessionForm(sess);

  function saveAll() {
    sess.fasNotes = document.getElementById('fasNotes').value;
    sess.firstConsultReport = document.getElementById('firstConsultReport').value;
    const sessions = load(KEYS.sessions, []);
    const idx = sessions.findIndex(s => s.id === sess.id);
    if (idx >= 0) { sessions[idx] = sess; save(KEYS.sessions, sessions); }
  }

  // FAS 按鈕
  // FAS 色帶按鈕：在 fasNotes 游標位置插入「[FAS X] 」標記
  main.querySelectorAll('.fas-btn').forEach(btn => {
    btn.onclick = () => {
      const lv = btn.dataset.fas;
      const ta = document.getElementById('fasNotes');
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      const before = ta.value.substring(0, start);
      const after = ta.value.substring(end);
      // 自動換行：如果游標前不是行首，先加 \n
      const needsNewline = before && !before.endsWith('\n');
      const marker = (needsNewline ? '\n' : '') + fasMarker(lv);
      ta.value = before + marker + after;
      const newPos = start + marker.length;
      ta.selectionStart = ta.selectionEnd = newPos;
      ta.focus();
      saveAll();
    };
  });

  // 模板插入按鈕
  main.querySelectorAll('[data-tpl-idx]').forEach(btn => {
    btn.onclick = () => {
      const i = parseInt(btn.dataset.tplIdx, 10);
      const tplItem = templates[i];
      if (!tplItem) return;
      const ta = document.getElementById('firstConsultReport');
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      const before = ta.value.substring(0, start);
      const after = ta.value.substring(end);
      const sep = (before && !before.endsWith('\n\n')) ? (before.endsWith('\n') ? '\n' : '\n\n') : '';
      const inserted = sep + tplItem.content;
      ta.value = before + inserted + after;
      const newPos = start + inserted.length;
      ta.selectionStart = ta.selectionEnd = newPos;
      ta.focus();
      saveAll();
    };
  });

  // Auto-save
  ['fasNotes', 'firstConsultReport'].forEach(id => {
    document.getElementById(id).addEventListener('blur', saveAll);
  });

  document.getElementById('saveBtn').onclick = () => { saveAll(); showNotice('已儲存'); };
  document.getElementById('pdfBtn').onclick = () => {
    saveAll();
    exportFirstConsultPdf(sess, pet);
  };
}

function renderSession() {
  const main = document.getElementById('main');
  const sess = getSession(state.sessionId);
  if (!sess) { go('sessions', { petId: state.petId }); return; }
  const pet = getPet(sess.petId);
  if (!pet) { go('pets'); return; }
  // 首堂諮詢走專用 view
  if (sess.courseType === 'firstConsult') {
    return renderFirstConsultSession(sess, pet);
  }
  const items = ensureItemShape(pet.species === 'cat' ? load(KEYS.itemsCat, []) : load(KEYS.itemsDog, []));
  const recordsByName = {};
  (sess.records || []).forEach(r => recordsByName[r.name] = r);

  const itemsHtml = items.map(it => {
    const name = it.name;
    const r = recordsByName[name] || { name, selected: false, rating: '', methods: [], petNote: '' };
    const itMethods = it.methods || [];
    const hasMethods = itMethods.length > 0;
    const checkedSet = new Set(r.methods || []);
    const methodsBlock = hasMethods ? `
      <div class="methods-section">
        <div class="methods-label">🎯 今天用的方法（可複選）</div>
        ${itMethods.map(m => {
          const stepsHtml = ensureColorHtml(m.steps);
          const hasSteps = stepsHtml && stepsHtml.replace(/<[^>]+>/g, '').trim().length > 0;
          const hasTbl = !!normalizeTable(m.table);
          const hasDetails = hasSteps || hasTbl;
          return `
            <div style="margin-bottom:6px">
              <label class="method-check" style="margin-bottom:2px">
                <input type="checkbox" data-method="${escapeAttr(m.name)}" ${checkedSet.has(m.name)?'checked':''}>

      </div>

    <div class="field" style="margin-top:18px">
      <label>📝 本週飼主作業</label>
      <textarea id="homework" placeholder="例：每天早晚各 5 分鐘練習坐下，遛狗時遇到其他狗保持距離 3 公尺以上⋯">${escapeHtml(sess.homework||'')}</textarea>
    </div>
    <div class="field">
      <label>👀 訓練師備註（不會輸出給飼主）</label>
      <textarea id="trainerNotes" placeholder="自己的觀察、下次計畫⋯">${escapeHtml(sess.notes||'')}</textarea>
    </div>

    <div class="actions-row">
      <button class="btn" id="saveBtn">💾 儲存</button>
      <button class="btn ghost" id="pdfBtn">📄 下載 PDF</button>
      <button class="btn ghost" id="shareBtn">🔗 產生分享連結</button>
    </div>
  `;

  document.getElementById('editSess').onclick = () => openSessionForm(sess);

  // Item interaction
  main.querySelectorAll('.item').forEach(el => {
    const name = el.dataset.name;
    el.querySelector('.item-head').onclick = () => {
      const cur = recordsByName[name] || { name, selected: false, rating: '', petNote: '' };
      cur.selected = !cur.selected;
      if (!cur.selected) { cur.rating = ''; cur.petNote = ''; }
      recordsByName[name] = cur;
      saveRecords();
      renderSession();
    };
    el.querySelectorAll('.rating-btn').forEach(rb => {
      rb.onclick = (e) => {
        e.stopPropagation();
        const cur = recordsByName[name];
        cur.rating = cur.rating === rb.dataset.rating ? '' : rb.dataset.rating;
        saveRecords();
        renderSession();
      };
    });
    const noteInput = el.querySelector('.pet-note-input');
    if (noteInput) {
      noteInput.onblur = () => {
        const cur = recordsByName[name];
        if (cur) cur.petNote = noteInput.value;
        saveRecords();
      };
      noteInput.onclick = (e) => e.stopPropagation();
    }
    el.querySelectorAll('.method-check input[type=checkbox]').forEach(cb => {
      cb.onclick = (e) => {
        e.stopPropagation();
        const cur = recordsByName[name];
        if (!cur) return;
        cur.methods = cur.methods || [];
        const mname = cb.dataset.method;
        if (cb.checked) {
          if (!cur.methods.includes(mname)) cur.methods.push(mname);
        } else {
          cur.methods = cur.methods.filter(m => m !== mname);
        }
        saveRecords();
      };
    });
  });

  function saveRecords() {
    sess.records = Object.values(recordsByName).filter(r => r.selected);
    sess.homework = document.getElementById('homework').value;
    sess.notes = document.getElementById('trainerNotes').value;
    const sessions = load(KEYS.sessions, []);
    const idx = sessions.findIndex(s => s.id === sess.id);
    sessions[idx] = sess;
    save(KEYS.sessions, sessions);
  }

  document.getElementById('saveBtn').onclick = () => {
    saveRecords();
    showNotice('已儲存');
  };
  document.getElementById('pdfBtn').onclick = () => {
    saveRecords();
    exportPdf(sess, pet);
  };
  document.getElementById('shareBtn').onclick = async () => {
    saveRecords();
    await shareToGist(sess, pet);
  };

  // Auto-save homework / notes on blur
  ['homework','trainerNotes'].forEach(id => {
    document.getElementById(id).addEventListener('blur', saveRecords);
  });
}
