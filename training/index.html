  let fcTpls = JSON.parse(JSON.stringify(bookingTpl.firstConsultTemplates || DEFAULT_BOOKING_TEMPLATE.firstConsultTemplates || []));
  function renderFcTplList() {
    const wrap = document.getElementById('fcTplList');
    if (!wrap) return;
    wrap.innerHTML = fcTpls.map((t, i) => `
      <div style="border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:10px">
        <div style="display:flex; align-items:flex-end; gap:6px; margin-bottom:6px">

          </div>
          <button class="small-btn" data-fc-up="${i}" ${i===0?'disabled':''} style="height:36px">↑</button>
          <button class="small-btn" data-fc-down="${i}" ${i===fcTpls.length-1?'disabled':''} style="height:36px">↓</button>
          <button class="btn danger" data-fc-del="${i}" style="height:36px">刪除</button>
        </div>
        <div class="field" style="margin-bottom:0">
          <label>插入文字內容</label>
          ${colorToolbarHtml('fcTpl_' + i)}
          <div class="color-editor" contenteditable="true"
               data-fc-content="${i}" data-tb-id="fcTpl_${i}"
               style="font-size:12px; line-height:1.55; min-height:80px;"
               data-placeholder="點選文字 + 顏色按鈕上色">${ensureColorHtml(t.content)}</div>
        </div>
      </div>
    `).join('');
    wrap.querySelectorAll('[data-fc-label]').forEach(el => {
      el.oninput = (e) => { fcTpls[parseInt(el.dataset.fcLabel,10)].label = e.target.value; };
    });
    wrap.querySelectorAll('[data-fc-content]').forEach(el => {
      el.onblur = () => { fcTpls[parseInt(el.dataset.fcContent,10)].content = sanitizeColorHtml(el.innerHTML); };
      // 即時更新（非 sanitized，儲存時再 sanitize）
      el.oninput = () => { fcTpls[parseInt(el.dataset.fcContent,10)].content = el.innerHTML; };
      // 綁定 toolbar
      const tb = wrap.querySelector(`[data-tb-for="${el.dataset.tbId}"]`);
      if (tb) bindColorToolbar(tb, el);
    });
    wrap.querySelectorAll('[data-fc-del]').forEach(el => {
      el.onclick = () => {
        if (!confirm('刪除這個模板？')) return;
        fcTpls.splice(parseInt(el.dataset.fcDel,10), 1);
        renderFcTplList();
      };
    });
    wrap.querySelectorAll('[data-fc-up]').forEach(el => {
      el.onclick = () => {
        const i = parseInt(el.dataset.fcUp,10);
        if (i === 0) return;
        [fcTpls[i-1], fcTpls[i]] = [fcTpls[i], fcTpls[i-1]];
        renderFcTplList();
      };
    });
    wrap.querySelectorAll('[data-fc-down]').forEach(el => {
      el.onclick = () => {
        const i = parseInt(el.dataset.fcDown,10);
        if (i >= fcTpls.length - 1) return;
        [fcTpls[i+1], fcTpls[i]] = [fcTpls[i], fcTpls[i+1]];
        renderFcTplList();
      };
    });
  }
  renderFcTplList();
  document.getElementById('fc_addTpl').onclick = () => {
    fcTpls.push({ label: '新模板', content: '' });
    renderFcTplList();
  };
  document.getElementById('fc_save').onclick = () => {

    }));
    showNotice('已重設首堂諮詢模板');

  };

  function renderMaterialsList() {

    if (mats.length === 0) {

      <div style="border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:10px">
        <div class="row2" style="margin-bottom:6px">
          <div class="field" style="margin-bottom:0">
            <label>標題</label>
            <input type="text" data-mat-title="${i}" value="${escapeAttr(m.title||'')}" placeholder="例：散步禮儀詳細指引">

        </div>
      </div>
    `).join('');
    wrap.querySelectorAll('[data-mat-title]').forEach(el => {
      el.oninput = (e) => { mats[parseInt(el.dataset.matTitle,10)].title = e.target.value; };
    });
    wrap.querySelectorAll('[data-mat-url]').forEach(el => {
      el.oninput = (e) => { mats[parseInt(el.dataset.matUrl,10)].url = e.target.value; };

      el.onchange = (e) => {
        const cleaned = cleanUrl(e.target.value);
        if (cleaned !== e.target.value) {
          e.target.value = cleaned;
          mats[parseInt(el.dataset.matUrl,10)].url = cleaned;
        }
      };
    });
    wrap.querySelectorAll('[data-mat-content]').forEach(el => {
      el.onblur = () => { mats[parseInt(el.dataset.matContent,10)].content = sanitizeColorHtml(el.innerHTML); };
      el.oninput = () => { mats[parseInt(el.dataset.matContent,10)].content = el.innerHTML; };
      const tb = wrap.querySelector(`[data-tb-for="${el.dataset.tbId}"]`);
      if (tb) bindColorToolbar(tb, el);
    });
    wrap.querySelectorAll('[data-mat-del]').forEach(el => {
      el.onclick = () => {
        if (!confirm('刪除這份教材？\n\n（要儲存後才會真的刪除；尚未儲存可重新進設定頁恢復。）')) return;
        mats.splice(parseInt(el.dataset.matDel,10), 1);
        renderMaterialsList();
      };
    });

  const matSaveBtn = document.getElementById('mat_save');
  if (matSaveBtn) matSaveBtn.onclick = () => {

    const cleaned = mats
      .filter(m => {
        if (!(m.title || '').trim()) return false;
        const hasUrl = (m.url || '').trim();
        const hasContent = sanitizeColorHtml(m.content || '').replace(/<[^>]+>/g, '').trim();
        return hasUrl || hasContent;
      })
      .map(m => ({
        id: m.id || uid(),
        title: (m.title || '').trim(),
        url: cleanUrl((m.url || '').trim()),
        content: sanitizeColorHtml(m.content || ''),
        createdAt: m.createdAt || new Date().toISOString(),
        updatedAt: new Date().toISOString(),

  if (lineTplSave) {

      lineTplArea.value = DEFAULT_LINE_TEMPLATE;
      save(KEYS.lineTemplate, '');  // 空字串 → getLineTemplate 會 fallback 到預設
      showNotice('已重設為預設模板');
    };
  }
  if (lineTplPreview) {
    lineTplPreview.onclick = () => {
      // 暫存編輯中的內容讓 fillLineTemplate 能用
      const original = load(KEYS.lineTemplate, '');
      save(KEYS.lineTemplate, lineTplArea.value || '');
      try {
        const tomorrow = getTomorrowDateStr();
        const allSessions = load(KEYS.sessions, []);
        const pets = load(KEYS.pets, []);
        const s = allSessions.find(x => x.status === 'booked' && x.date === tomorrow);
        if (!s) {
          // 沒有明日 → 隨便挑一筆 booked 預覽
          const anyBooked = allSessions.find(x => x.status === 'booked' && x.date);
          if (!anyBooked) {
            lineTplPreviewOut.style.display = 'block';
            lineTplPreviewOut.textContent = '（沒有任何已預約的課程，無法預覽。請先建立預約。）';
            return;
          }
          const pet = pets.find(p => p.id === anyBooked.petId) || {};
          lineTplPreviewOut.style.display = 'block';
          lineTplPreviewOut.textContent = '【預覽範例（沒有明日課程，用 ' + fmtDate(anyBooked.date) + ' 那筆）】\n\n' + fillLineTemplate(anyBooked, pet);
        } else {
          const pet = pets.find(p => p.id === s.petId) || {};
          lineTplPreviewOut.style.display = 'block';
          lineTplPreviewOut.textContent = fillLineTemplate(s, pet);
        }
      } finally {
        save(KEYS.lineTemplate, original);
      }
    };
  }

    function methodHtml(m, i, j) {

        <div class="method-block">

            <button type="button" class="tb-red" data-color="#c97a4f">A 紅</button>
            <button type="button" class="tb-green" data-color="#6b9e6e">A 綠</button>

               data-i="${i}" data-j="${j}" data-mfield="steps"

            ${tbl ? `<button class="small-btn danger" data-mtdel="${i}_${j}">移除表格</button>` : ''}
          </div>
          ${tbl ? `<div style="margin-top:8px; overflow-x:auto;">${methodTableToHtml(tbl, {compact:true})}</div>` : ''}
        </div>`;
    }

    document.getElementById('itemEditor').innerHTML = `
      <div class="card" style="cursor:default">
        <p class="card-meta" style="margin-bottom:10px">
          • 每個訓練項目下可加多個「訓練方法」，每個方法有自己的步驟<br>
          • 上課時可勾選今天用了哪些方法<br>
          • 飼主端會看到對應步驟當回家功課指引
        </p>
        ${list.map((it, i) => `
          <div class="item-edit-block">
            <div class="item-edit-top">
              <input data-i="${i}" data-field="name" value="${escapeAttr(it.name)}" placeholder="訓練項目名稱">
              <button class="small-btn" data-up="${i}" ${i===0?'disabled':''}>↑</button>
              <button class="small-btn" data-down="${i}" ${i===list.length-1?'disabled':''}>↓</button>
              <button class="small-btn danger" data-del="${i}">刪</button>
            </div>
            <div class="methods-wrap">

            </div>
          </div>
        `).join('')}

      </div>
    `;

    function updateItemField(i, field, value) {
      const cur = ensureItemShape(load(key, []));
      cur[i][field] = (field === 'name') ? value.trim() : value;
      save(key, cur);
    }
    function updateMethodField(i, j, field, value) {
      const cur = ensureItemShape(load(key, []));
      cur[i].methods[j][field] = (field === 'name') ? value.trim() : value;
      save(key, cur);
    }

    document.querySelectorAll('#itemEditor input[data-field]').forEach(inp => {
      inp.onchange = () => updateItemField(parseInt(inp.dataset.i), inp.dataset.field, inp.value);
    });
    document.querySelectorAll('#itemEditor input[data-mfield]').forEach(inp => {
      inp.onchange = () => updateMethodField(parseInt(inp.dataset.i), parseInt(inp.dataset.j), inp.dataset.mfield, inp.value);
    });
    // Steps contenteditable: 儲存 sanitized HTML on blur
    document.querySelectorAll('#itemEditor .color-editor[data-mfield="steps"]').forEach(div => {
      div.onblur = () => {
        const i = parseInt(div.dataset.i), j = parseInt(div.dataset.j);
        const cur = ensureItemShape(load(key, []));
        cur[i].methods[j].steps = sanitizeColorHtml(div.innerHTML);
        save(key, cur);

        cur[i].methods[j].table = null;
        save(key, cur);
        renderItemEditor();
      };

    document.querySelectorAll('[data-up]').forEach(btn => {
      btn.onclick = () => {
        const i = parseInt(btn.dataset.up);

        const cur = ensureItemShape(load(key, []));

        save(key, cur);
        renderItemEditor();
      };
    });
    document.querySelectorAll('[data-down]').forEach(btn => {
      btn.onclick = () => {

        const cur = ensureItemShape(load(key, []));
        if (i >= cur.length - 1) return;
        [cur[i+1], cur[i]] = [cur[i], cur[i+1]];
        save(key, cur);
        renderItemEditor();
      };
    });
    document.getElementById('addItem').onclick = () => {
      const cur = ensureItemShape(load(key, []));
      cur.push({ name: '新項目', methods: [] });
      save(key, cur);
      renderItemEditor();

  document.querySelectorAll('.tab').forEach(t => {

      t.classList.add('active');
      currentTab = t.dataset.tab;

  // Data management（CSV / Email 匯入入口已搬到寵物列表 ＋ 按鈕，這裡不再綁定）

  // 資料修復：連結舊 booking 到既有 sessions + 補產殼
  const linkOldBtn = document.getElementById('linkOldData');
  if (linkOldBtn) linkOldBtn.onclick = () => {
    const result = linkLegacyBookingsToSessions();
    if (result.linked === 0 && result.spawned === 0) {
      showNotice('沒有要連結 / 補建的項目（舊資料已 OK）');
      return;
    }
    const msg = `掃描完成：\n• 連結 ${result.linked} 筆現有紀錄到課程預約\n• 補建 ${result.spawned} 筆空白紀錄\n\n繼續？`;
    if (!confirm(msg)) return;
    save(KEYS.sessions, result.newSessions);
    showNotice(`已連結 ${result.linked} 筆 · 補建 ${result.spawned} 筆`);
    renderSettings();
  };

  document.getElementById('exportData').onclick = () => {
    const dump = {
      version: 4,
      pets: load(KEYS.pets, []),
      sessions: load(KEYS.sessions, []),
      itemsCat: load(KEYS.itemsCat, []),
      itemsDog: load(KEYS.itemsDog, []),
      bookings: load(KEYS.bookings, []),
      bookingTemplate: load(KEYS.bookingTemplate, {}),
      payments: load(KEYS.payments, []),
      studioPayments: load(KEYS.studioPayments, []),
      materials: load(KEYS.materials, []),
      exportedAt: new Date().toISOString(),
    };
    const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `petcare-backup-${todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };
  document.getElementById('importData').onclick = () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json';
    input.onchange = async () => {
      const file = input.files[0];
      if (!file) return;
      try {
        const data = JSON.parse(await file.text());
        if (!confirm('匯入會覆蓋現有資料，確定？')) return;
        if (data.pets) save(KEYS.pets, data.pets);
        if (data.sessions) save(KEYS.sessions, data.sessions);
        if (data.itemsCat) save(KEYS.itemsCat, data.itemsCat);
        if (data.itemsDog) save(KEYS.itemsDog, data.itemsDog);
        if (data.bookings) save(KEYS.bookings, data.bookings);
        if (data.bookingTemplate) save(KEYS.bookingTemplate, data.bookingTemplate);
        if (data.payments) save(KEYS.payments, data.payments);
        if (data.studioPayments) save(KEYS.studioPayments, data.studioPayments);
        if (data.materials) save(KEYS.materials, data.materials);
        showNotice('匯入完成');
        render();
      } catch (e) {
        showNotice('匯入失敗：' + e.message, 'err');
      }
    };
    input.click();
  };
  document.getElementById('resetItems').onclick = () => {
    if (!confirm('將兩份清單還原為預設？你的自訂項目會消失。')) return;
    save(KEYS.itemsDog, DEFAULT_DOG_ITEMS);
    save(KEYS.itemsCat, DEFAULT_CAT_ITEMS);
    render();
  };
}

/* ============== EMAIL 單筆匯入 (SurveyCake / Google 表單通知信) ============== */
function parseSurveyCakeEmail(text) {
  if (!text) return null;
  // 1. 剝掉 markdown email link：[a@b](mailto:a@b) → a@b
  text = text.replace(/\[([^\]]+)\]\(mailto:[^)]+\)/g, '$1');
  // 2. 拆行、去空白、過濾空行
  const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  // 3. 嚴格交替：偶數行=問題、奇數行=答案
  const qa = [];
  for (let i = 0; i < lines.length; i += 2) {
    if (i + 1 < lines.length) qa.push([lines[i], lines[i + 1]]);
  }
  if (qa.length === 0) return null;

  // 4. 物種偵測：問題裡「狗狗」vs「貓貓」誰多
  const dogScore = (text.match(/狗狗/g) || []).length;
  const catScore = (text.match(/貓貓/g) || []).length;
  const species = catScore > dogScore ? 'cat' : 'dog';

  const result = {
    species,
    name: '', breed: '', birth: '', gender: '', neutered: '',
    ownerName: '', ownerContact: '', ownerAddress: '',
    concerns: '', notes: '',
  };
  const noteLines = [];

  function detectField(q) {
    // 嚴格 regex：盡量綁問題的「主語」+「關鍵字」，避免命中含有相同字的其他問題
    if (/^(狗狗|貓貓|寵物)名稱$|^名字$/.test(q)) return 'name';
    if (/^(狗狗|貓貓|寵物)?品種$/.test(q)) return 'breed';
    if (/^(狗狗|貓貓|寵物)?年齡|^狗狗年齡\/生日$|^生日$|^出生/.test(q)) return 'birth';
    if (/^性別$|^(狗狗|貓貓|寵物)性別$/.test(q)) return 'genderInfo';
    if (/^主要飼養人姓名$|^飼主姓名$|^姓名$/.test(q)) return 'ownerName';
    if (/^聯絡電話$|^電話$|^手機$|^聯繫電話$/.test(q)) return 'ownerContact';
    if (/^居住地址$|^地址$|^住址$/.test(q)) return 'ownerAddress';
    if (/困擾您的行為|^困擾行為$|請詳述目前.*困擾/.test(q)) return 'concerns';
    return null;
  }

  for (const [q, a] of qa) {
    const field = detectField(q);
    if (field === 'genderInfo') {
      // "男生（未結紮）" → gender + neutered (空值才填，避免覆蓋)
      if (!result.gender) {
        if (/男生|男孩|^男|^公|♂|male/i.test(a)) result.gender = 'male';
        else if (/女生|女孩|^女|^母|♀|female/i.test(a)) result.gender = 'female';
      }
      if (!result.neutered) {
        if (/未結紮|未絕育|不結紮|不絕育|沒結紮|沒絕育/.test(a)) result.neutered = 'no';
        else if (/已結紮|已絕育|結紮|絕育/.test(a)) result.neutered = 'yes';
      }
    } else if (field && !result[field]) {
      // 第一次遇到該欄位才填，已填的當作不認識的問題進 notes（first-match-wins）
      result[field] = a;
    } else {
      // 不認識的問題 OR 重複出現的同欄位 → 進備註
      noteLines.push(`【${q}】${a}`);
    }
  }
  result.notes = noteLines.join('\n');
  return result;
}

}

// 找既有寵物：名字一樣，且 (飼主名也一樣 OR 雙方都沒填飼主名)
function findExistingPet(parsed) {
  if (!parsed.name) return null;
  const pets = load(KEYS.pets, []);
  return pets.find(p => {
    if (p.name !== parsed.name) return false;
    // 名字一樣，再比飼主名（嚴格）
    if (parsed.ownerName && p.ownerName) {
      return parsed.ownerName === p.ownerName;
    }
    // 任一方沒填飼主，視為同一隻（保守判斷）
    return true;
  });
}

/* ============== VIEW: CALENDAR（全局月曆）============== */
function renderCalendar() {
  const main = document.getElementById('main');
  const settings = load(KEYS.settings, {});
  const todayStrV = todayStr();
  const monthStr = settings.calendarMonth || todayStrV.slice(0, 7);  // 'YYYY-MM'
  const [year, month] = monthStr.split('-').map(Number);

  const allSessions = load(KEYS.sessions, []);
  const allPets = load(KEYS.pets, []);
  const petById = {};
  allPets.forEach(p => { petById[p.id] = p; });

  // 收集該月所有 sessions（依日期分組）
  const sessionsByDate = {};
  for (const s of allSessions) {
    if (!s.date) continue;
    if (s.date.slice(0, 7) !== monthStr) continue;
    if (!sessionsByDate[s.date]) sessionsByDate[s.date] = [];
    sessionsByDate[s.date].push(s);
  }

  // 月份 grid
  const firstDay = new Date(year, month - 1, 1);
  const lastDay = new Date(year, month, 0);
  const daysInMonth = lastDay.getDate();
  const firstWeekday = firstDay.getDay();  // 0=Sun

  const cells = [];
  for (let i = 0; i < firstWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells.push({ day: d, dateStr, sessions: sessionsByDate[dateStr] || [] });
  }
  while (cells.length % 7 !== 0) cells.push(null);

  // 上下月（直接算字串，避免 toISOString 的 UTC 時區 bug）
  const ymStr = (y, m) => `${y}-${String(m).padStart(2,'0')}`;
  const prevMonth = month === 1 ? ymStr(year - 1, 12) : ymStr(year, month - 1);
  const nextMonth = month === 12 ? ymStr(year + 1, 1) : ymStr(year, month + 1);

  // 該月統計
  let totalCount = 0, doneCount = 0, closedCount = 0, bookedFutureCount = 0, pendingCount = 0;
  for (const arr of Object.values(sessionsByDate)) {
    for (const s of arr) {
      totalCount++;
      if (s.status === 'closed') closedCount++;
      else if (s.status === 'done') doneCount++;
      else if (s.date && s.date < todayStrV) pendingCount++;
      else bookedFutureCount++;
    }
  }

  const headerHtml = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px; flex-wrap:wrap">
      <div>
        <div style="font-size:18px; font-weight:600; color:var(--brown-dark)">📅 ${year} 年 ${month} 月</div>
        <div style="font-size:12px; color:var(--text-soft); margin-top:4px; line-height:1.8">
          本月共 ${totalCount} 堂
          <span class="legend-chip booked">已預約 ${bookedFutureCount}</span>
          <span class="legend-chip pending">待結案 ${pendingCount}</span>
          <span class="legend-chip done">已完成 ${doneCount}</span>
          <span class="legend-chip closed">已結案 ${closedCount}</span>
        </div>
      </div>
      <div style="display:flex; gap:6px">
        <button class="small-btn" id="calPrev" type="button">◀</button>
        <button class="small-btn" id="calToday" type="button">本月</button>
        <button class="small-btn" id="calNext" type="button">▶</button>
      </div>
    </div>
  `;

  const weekHeader = `
    <div class="cal-week-header">
      <div class="sun">日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="sat">六</div>
    </div>
  `;

  const cellsHtml = cells.map(c => {
    if (!c) return `<div class="cal-cell empty"></div>`;
    const isToday = c.dateStr === todayStrV;
    const sessHtml = c.sessions.map(s => {
      const pet = petById[s.petId];
      const petName = pet ? pet.name : '?';
      let cls;
      if (s.status === 'closed') cls = 'cal-sess-closed';
      else if (s.status === 'done') cls = 'cal-sess-done';
      else if (s.date && s.date < todayStrV) cls = 'cal-sess-pending';
      else cls = 'cal-sess-booked';
      return `<div class="cal-sess ${cls}" data-cal-sid="${s.id}" title="${escapeAttr(petName)}">${escapeHtml(petName)}</div>`;
    }).join('');
    return `<div class="cal-cell ${isToday ? 'today' : ''}">
      <div class="cal-day">${c.day}</div>
      ${sessHtml}
    </div>`;
  }).join('');

  main.innerHTML = headerHtml + weekHeader + `<div class="cal-grid">${cellsHtml}</div>` + `
    <p style="margin-top:14px; font-size:11px; color:var(--text-soft); line-height:1.8">
      • 顏色：<span class="legend-chip booked">已預約</span><span class="legend-chip pending">待結案</span><span class="legend-chip done">已完成</span><span class="legend-chip closed">已結案</span><br>
      • 點任一格 session 跳到該堂課詳情頁；待安排（沒日期）的 session 不會出現在月曆。
    </p>
  `;

  document.getElementById('calPrev').onclick = () => {
    const sx = load(KEYS.settings, {});
    sx.calendarMonth = prevMonth;
    save(KEYS.settings, sx);
    renderCalendar();
  };
  document.getElementById('calNext').onclick = () => {
    const sx = load(KEYS.settings, {});
    sx.calendarMonth = nextMonth;
    save(KEYS.settings, sx);
    renderCalendar();
  };
  document.getElementById('calToday').onclick = () => {
    const sx = load(KEYS.settings, {});
    sx.calendarMonth = todayStrV.slice(0, 7);
    save(KEYS.settings, sx);
    renderCalendar();
  };
  main.querySelectorAll('[data-cal-sid]').forEach(el => {
    el.onclick = () => go('session', { sessionId: el.dataset.calSid });
  });
}

/* ============== STATS DRAWER（卡片 drill-down）============== */
let _statsDrawerEscBound = false;
function _statsDrawerEscHandler(e) {
  if (e.key === 'Escape') closeStatsDrawer();
}
function openStatsDrawer(opts) {
  // opts: { title, mainValue, subtitle, sections:[{label, rows}], onRowClick, footer:{label, value} }
  const overlay = document.getElementById('statsDrawerOverlay');
  const drawer = document.getElementById('statsDrawer');
  if (!overlay || !drawer) return;

  document.getElementById('statsDrawerTitle').textContent = opts.title || '';
  document.getElementById('statsDrawerMainValue').textContent = opts.mainValue || '';
  document.getElementById('statsDrawerSubtitle').innerHTML = opts.subtitle || '';

  const body = document.getElementById('statsDrawerBody');
  const sections = opts.sections || [];
  const hasRows = sections.some(s => s.rows && s.rows.length > 0);
  if (!hasRows) {
    body.innerHTML = `<div class="stats-drill-empty">${opts.emptyText || '期間內沒有資料 🎉'}</div>`;
  } else {
    body.innerHTML = sections.map(sec => {
      if (!sec.rows || sec.rows.length === 0) return '';
      const labelHtml = sec.label ? `<div class="stats-drill-section-label">${sec.label}</div>` : '';
      const rowsHtml = sec.rows.map((r, idx) => {
        const rowKey = sec.key ? `${sec.key}|${idx}` : `${idx}`;
        const clickable = r.petId ? 'clickable' : '';
        const amountClass = r.amountClass || '';
        return `
          <div class="stats-drill-row ${clickable}" data-row-key="${rowKey}" data-petid="${r.petId || ''}">
            <div class="stats-drill-row-main">
              <div class="stats-drill-row-title">${r.title}</div>
              ${r.meta ? `<div class="stats-drill-row-meta">${r.meta}</div>` : ''}
            </div>
            <div class="stats-drill-row-amount ${amountClass}">
              ${r.amount}
              ${r.amountSub ? `<span class="stats-drill-sub">${r.amountSub}</span>` : ''}
            </div>
          </div>
        `;
      }).join('');
      return labelHtml + '<div class="stats-drill-list">' + rowsHtml + '</div>';
    }).join('');
    body.querySelectorAll('.stats-drill-row.clickable').forEach(el => {
      el.onclick = () => {
        const petId = el.dataset.petid;
        if (petId) {
          closeStatsDrawer();
          go('sessions', { petId });
        }
      };
    });
  }

  const footer = document.getElementById('statsDrawerFooter');
  if (opts.footer && opts.footer.label) {
    footer.innerHTML = `
      <div class="stats-drawer-footer-row">
        <span>${opts.footer.label}</span>
        <strong>${opts.footer.value || ''}</strong>
      </div>
    `;
    footer.style.display = '';
  } else {
    footer.innerHTML = '';
    footer.style.display = 'none';
  }

  overlay.classList.remove('hidden');
  drawer.classList.remove('hidden');
  if (!_statsDrawerEscBound) {
    document.addEventListener('keydown', _statsDrawerEscHandler);
    _statsDrawerEscBound = true;
  }
}
function closeStatsDrawer() {
  const overlay = document.getElementById('statsDrawerOverlay');
  const drawer = document.getElementById('statsDrawer');
  if (overlay) overlay.classList.add('hidden');
  if (drawer) drawer.classList.add('hidden');
  if (_statsDrawerEscBound) {
    document.removeEventListener('keydown', _statsDrawerEscHandler);
    _statsDrawerEscBound = false;
  }
}

/* ============== VIEW: STATS（呆帳統計）============== */
function renderStats() {
  const main = document.getElementById('main');
  const settings = load(KEYS.settings, {});
  const range = settings.statsRange || 'all';

  // 計算 cutoff 日期
  let cutoff = null;
  const today = new Date();
  if (range !== 'all') {
    const d = new Date(today);
    if (range === '1m') d.setMonth(d.getMonth() - 1);
    else if (range === '3m') d.setMonth(d.getMonth() - 3);
    else if (range === '6m') d.setMonth(d.getMonth() - 6);
    else if (range === '1y') d.setFullYear(d.getFullYear() - 1);
    // 用本地時區避免 UTC 偏移
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    cutoff = `${y}-${m}-${day}`;
  }

  const allBookings = load(KEYS.bookings, []);
  const bookings = cutoff
    ? allBookings.filter(b => (b.createdAt || '').slice(0, 10) >= cutoff)
    : allBookings;
  const sessions = load(KEYS.sessions, []);
  const pets = load(KEYS.pets, []);
  const todayStrV = todayStr();

  // 累計
  let totalRev = 0, realizedRev = 0, unrealizedRev = 0, pendingRev = 0, overdueRev = 0;
  let totalReceived = 0, totalRefunded = 0;  // L2: 實際金流（payments）
  let totalRecognized = 0, totalDeferred = 0, totalReceivable = 0;  // C: 權責發生制
  const closedDetails = [];
  const byType = {};
  const csvRows = [];  // L1-b: CSV 匯出每筆 booking 一行

  // Drill-down 明細收集（每張卡片可點開的明細列表）
  const drillData = {
    total: [], received: [], refunded: [], balance: [],
    recognized: [], deferred: [], receivable: [],
    realized: [], unrealized: [], pending: [],
  };

  for (const b of bookings) {
    const sessCount = b.sessionCount || 0;
    if (sessCount === 0) continue;
    const fee = (b.feePerClass || 0) + (b.transportPerClass || 0);
    const subtotal = fee * sessCount;
    const discount = bookingDiscount(b);
    const total = subtotal - discount;
    const pricePerSess = total / sessCount;
    totalRev += total;

    // L2: 累計實收 / 退費（payments）
    const summary = bookingPaymentSummary(b);
    totalReceived += summary.received;
    totalRefunded += summary.refunded;
    // C: 權責發生制 累計
    const recog = bookingRevenueRecognition(b);
    totalRecognized += recog.recognizedRev;
    totalDeferred += recog.deferredRev;
    totalReceivable += recog.receivable;

    const bSess = sessions.filter(s => s.sourceBookingId === b.id);
    let realized = 0, unrealized = 0, pending = 0, overdue = 0;
    let closedReasons = [], closedCount = 0, doneCount = 0;
    for (const s of bSess) {
      if (s.status === 'done') { realized += pricePerSess; doneCount++; }
      else if (s.status === 'closed') {
        unrealized += pricePerSess;
        closedCount++;
        if (s.closeReason) closedReasons.push(s.closeReason);
      } else if (s.status === 'booked') {
        if (s.date && s.date < todayStrV) overdue += pricePerSess;
        else pending += pricePerSess;
      }
    }
    // 沒對應殼的 booking 堂數（舊資料未連結）→ 算進「進行中」
    const remaining = Math.max(0, sessCount - bSess.length);
    if (remaining > 0) pending += pricePerSess * remaining;

    realizedRev += realized;
    unrealizedRev += unrealized;
    pendingRev += pending;
    overdueRev += overdue;

    const ctLab = courseTypeLabel(b) || '其他';
    if (!byType[ctLab]) byType[ctLab] = { revenue: 0, realized: 0, unrealized: 0, count: 0 };
    byType[ctLab].revenue += total;
    byType[ctLab].realized += realized;
    byType[ctLab].unrealized += unrealized;
    byType[ctLab].count++;

    const pet = pets.find(p => p.id === b.petId) || {};
    if (closedCount > 0) {
      closedDetails.push({
        petName: pet.name || '?',
        petSpecies: pet.species || '',
        ownerName: pet.ownerName || '',
        courseType: ctLab,
        sessCount, doneCount, closedCount,
        amount: closedCount * pricePerSess,
        reasons: closedReasons,
        bookingId: b.id,
        petId: b.petId,
      });
    }
    // CSV row（每筆 booking 一行，不論是否呆帳）
    csvRows.push({
      bookingDate: (b.createdAt || '').slice(0, 10),
      petName: pet.name || '?',
      ownerName: pet.ownerName || '',
      courseType: ctLab,
      sessCount,
      total,
      received: summary.received,
      refunded: summary.refunded,
      balance: total - summary.received + summary.refunded,
      doneCount,
      closedCount,
      pendingCount: bSess.filter(s => s.status === 'booked').length + remaining,
      closedReasons: closedReasons.join('；'),
    });

    // ===== Drill-down 明細 =====
    const petIcon = pet.species === 'cat' ? '🐱' : '🐶';
    const petLbl = pet.name
      ? `${petIcon} ${escapeHtml(pet.name)}${pet.ownerName ? ' · ' + escapeHtml(pet.ownerName) : ''}`
      : escapeHtml(pet.ownerName || '?');
    const bDate = (b.createdAt || '').slice(0, 10);
    const balanceAmt = total - summary.received + summary.refunded;

    // 應收（合約）
    drillData.total.push({
      petId: b.petId, petLabel: petLbl, ctLab, bookingDate: bDate,
      total, sessCount, balance: balanceAmt, received: summary.received,
    });

    // 實收 / 退費（拆 payments）
    const _payments = getBookingPayments(b.id);
    for (const p of _payments) {
      if (p.type === 'in') {
        drillData.received.push({ petId: b.petId, petLabel: petLbl, ctLab, date: p.date, amount: p.amount, note: p.note || '' });
      } else if (p.type === 'refund') {
        drillData.refunded.push({ petId: b.petId, petLabel: petLbl, ctLab, date: p.date, amount: p.amount, note: p.note || '' });
      }
    }

    // 應收餘額
    if (balanceAmt > 0) {
      drillData.balance.push({
        petId: b.petId, petLabel: petLbl, ctLab, bookingDate: bDate,
        total, received: summary.received, refunded: summary.refunded,
        balance: balanceAmt, sessCount, doneCount,
      });
    }

    // 預收款（已收未上）
    if (recog.deferredRev > 0) {
      drillData.deferred.push({
        petId: b.petId, petLabel: petLbl, ctLab,
        deferred: recog.deferredRev, sessCount, doneCount,
        netReceived: summary.received - summary.refunded,
      });
    }

    // 已上未收（已上完但客戶沒付齊）
    if (recog.receivable > 0) {
      drillData.receivable.push({
        petId: b.petId, petLabel: petLbl, ctLab,
        receivable: recog.receivable, sessCount, doneCount,
        netReceived: summary.received - summary.refunded, recognizedRev: recog.recognizedRev,
      });
    }

    // sessions 級別
    for (const s of bSess) {
      const row = {
        petId: b.petId, petLabel: petLbl, ctLab,
        date: s.date || '', amount: pricePerSess,
      };
      if (s.status === 'done') {
        drillData.recognized.push(row);
        drillData.realized.push(row);
      } else if (s.status === 'closed') {
        drillData.unrealized.push(Object.assign({}, row, { reason: s.closeReason || '' }));
      } else if (s.status === 'booked') {
        const isOverdue = s.date && s.date < todayStrV;
        drillData.pending.push(Object.assign({}, row, { isOverdue }));
      }
    }
    // 沒對應 session 的剩餘堂數（舊資料未連結）→ 進行中（無日期）
    if (remaining > 0) {
      drillData.pending.push({
        petId: b.petId, petLabel: petLbl, ctLab,
        date: '', amount: pricePerSess * remaining,
        isOverdue: false, isRemaining: true, remainingCount: remaining,
      });
    }
  }
  closedDetails.sort((a, b) => b.amount - a.amount);

  // 排序 drill-down 列表
  drillData.total.sort((a, b) => b.total - a.total);
  drillData.received.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  drillData.refunded.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  drillData.balance.sort((a, b) => b.balance - a.balance);
  drillData.recognized.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  drillData.realized.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  drillData.deferred.sort((a, b) => b.deferred - a.deferred);
  drillData.receivable.sort((a, b) => b.receivable - a.receivable);
  drillData.unrealized.sort((a, b) => b.amount - a.amount);
  drillData.pending.sort((a, b) => {
    // 待結案（overdue）優先，再來按日期由近至遠
    if (a.isOverdue !== b.isOverdue) return a.isOverdue ? -1 : 1;
    return (a.date || '9999').localeCompare(b.date || '9999');
  });

  // 教室派案聚合（D7）
  const studioMap = {};   // studioName → { accrued, doneCount, bookingCount }
  for (const b of bookings) {
    if (!b.isStudioBooking) continue;
    const sName = b.studioNameSnapshot || '未指定教室';
    if (!studioMap[sName]) studioMap[sName] = { accrued: 0, doneCount: 0, bookingCount: 0 };
    const bSess = sessions.filter(s => s.sourceBookingId === b.id);
    const dCnt = bSess.filter(s => s.status === 'done').length;
    studioMap[sName].accrued += dCnt * (b.feePerClass || 0);
    studioMap[sName].doneCount += dCnt;
    studioMap[sName].bookingCount++;
  }
  // studio payments：套用 cutoff（按收到日期）
  const allStudioPayments = load(KEYS.studioPayments, []);
  const filteredStudioPayments = cutoff
    ? allStudioPayments.filter(p => (p.date || '').slice(0,10) >= cutoff)
    : allStudioPayments;
  const studioReceivedMap = {};
  for (const sp of filteredStudioPayments) {
    studioReceivedMap[sp.studioName] = (studioReceivedMap[sp.studioName] || 0) + sp.amount;
  }
  const studioNames = [...new Set([...Object.keys(studioMap), ...Object.keys(studioReceivedMap)])].sort();

  // helpers
  const fmtMoney = n => 'NT$ ' + Math.round(n).toLocaleString('zh-TW');
  const pct = (num, denom) => denom ? (num / denom * 100).toFixed(1) + '%' : '0%';

  const RANGE_OPTS = [
    { k: 'all', l: '全部' },
    { k: '1y', l: '近 1 年' },
    { k: '6m', l: '近 6 個月' },
    { k: '3m', l: '近 3 個月' },
    { k: '1m', l: '近 1 個月' },
  ];

  const closedTotalCount = closedDetails.reduce((sum, d) => sum + d.closedCount, 0);

  const query = (settings.statsQuery || '').trim().toLowerCase();
  const header = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px; flex-wrap:wrap">
      <div>
        <div style="font-size:18px; font-weight:600; color:var(--brown-dark)">📊 會計</div>
        <div style="font-size:12px; color:var(--text-soft); margin-top:2px">範圍內 ${bookings.length} 筆課程預約 · ${closedTotalCount} 堂強制結案</div>
      </div>
      <select id="statsRange" style="padding:6px 10px; border:1px solid var(--border); border-radius:6px; background:white; font-family:inherit; color:var(--text)">
        ${RANGE_OPTS.map(o => `<option value="${o.k}" ${o.k===range?'selected':''}>${o.l}</option>`).join('')}
      </select>
    </div>
    <div style="display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap">
      <input type="text" id="statsQuery" value="${escapeAttr(settings.statsQuery || '')}" placeholder="🔍 搜尋呆帳明細：寵物名 / 飼主 / 結案原因 / 課程類型" style="flex:1; min-width:220px; padding:8px 12px; border:1px solid var(--border); border-radius:6px; font-family:inherit; font-size:13px">
      <button class="small-btn" id="exportStatsCsv" type="button">📤 匯出 CSV</button>
    </div>
  `;

  const balance = totalRev - totalReceived + totalRefunded;
  // 「應收餘額」對應的 drill-down key：超收時不可點（沒有 balance > 0 的 booking）
  const balanceCard = balance > 0 ? 'balance' : '';
  // 標記哪些卡片該為可點（有對應明細資料時）
  const clickCls = (key, hasData) => hasData ? `clickable" data-stats-card="${key}` : '';
  const summaryGrid = `
    <div style="font-size:12px; color:var(--text-soft); margin-bottom:6px">💰 金流（payments）</div>
    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:10px; margin-bottom:14px">
      <div class="stat-card ${clickCls('total', drillData.total.length > 0)}">
        <div class="stat-label">應收（合約）</div>
        <div class="stat-value">${fmtMoney(totalRev)}</div>
      </div>
      <div class="stat-card good ${clickCls('received', drillData.received.length > 0)}">
        <div class="stat-label">實收</div>
        <div class="stat-value">${fmtMoney(totalReceived)}</div>
        <div class="stat-pct">${pct(totalReceived, totalRev)}</div>
      </div>
      <div class="stat-card warn ${clickCls('refunded', drillData.refunded.length > 0)}">
        <div class="stat-label">退費</div>
        <div class="stat-value">${fmtMoney(totalRefunded)}</div>
      </div>
      <div class="stat-card ${balance > 0 ? 'warn' : 'good'} ${clickCls(balanceCard, balanceCard === 'balance' && drillData.balance.length > 0)}">
        <div class="stat-label">${balance > 0 ? '應收餘額' : (balance < 0 ? '已超收' : '已結清')}</div>
        <div class="stat-value">${fmtMoney(Math.abs(balance))}</div>
      </div>
    </div>
    <div style="font-size:12px; color:var(--text-soft); margin-bottom:6px">📒 收入認列（權責發生制）</div>
    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:10px; margin-bottom:14px">
      <div class="stat-card good ${clickCls('recognized', drillData.recognized.length > 0)}">
        <div class="stat-label">已認列收入</div>
        <div class="stat-value">${fmtMoney(totalRecognized)}</div>
        <div class="stat-pct">${pct(totalRecognized, totalRev)} 履約率</div>
      </div>
      <div class="stat-card ${clickCls('deferred', drillData.deferred.length > 0)}">
        <div class="stat-label">預收款</div>
        <div class="stat-value">${fmtMoney(totalDeferred)}</div>
        <div class="stat-pct" style="color:var(--text-soft)">已收未上的</div>
      </div>
      <div class="stat-card ${totalReceivable > 0 ? 'warn' : ''} ${clickCls('receivable', drillData.receivable.length > 0)}">
        <div class="stat-label">已上未收</div>
        <div class="stat-value">${fmtMoney(totalReceivable)}</div>
        <div class="stat-pct" style="color:var(--text-soft)">已上完但客戶沒付齊</div>
      </div>
    </div>
    <div style="font-size:12px; color:var(--text-soft); margin-bottom:6px">📋 課時履約（sessions）</div>
    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:10px; margin-bottom:18px">
      <div class="stat-card good ${clickCls('realized', drillData.realized.length > 0)}">
        <div class="stat-label">已兌現</div>
        <div class="stat-value">${fmtMoney(realizedRev)}</div>
        <div class="stat-pct">${pct(realizedRev, totalRev)}</div>
      </div>
      <div class="stat-card warn ${clickCls('unrealized', drillData.unrealized.length > 0)}">
        <div class="stat-label">未兌現（呆帳）</div>
        <div class="stat-value">${fmtMoney(unrealizedRev)}</div>
        <div class="stat-pct">${pct(unrealizedRev, totalRev)}</div>
      </div>
      <div class="stat-card ${clickCls('pending', drillData.pending.length > 0)}">
        <div class="stat-label">進行中</div>
        <div class="stat-value">${fmtMoney(pendingRev + overdueRev)}</div>
        <div class="stat-pct" style="color:${overdueRev>0?'var(--work)':'var(--text-soft)'}">${overdueRev>0 ? '含 ' + fmtMoney(overdueRev) + ' 待結案' : '正常進度'}</div>
      </div>
    </div>
  `;

  const filteredClosed = !query ? closedDetails : closedDetails.filter(d =>
    d.petName.toLowerCase().includes(query)
    || (d.ownerName || '').toLowerCase().includes(query)
    || d.courseType.toLowerCase().includes(query)
    || d.reasons.some(r => (r || '').toLowerCase().includes(query))
  );
  const closedHtml = filteredClosed.length === 0
    ? (closedDetails.length === 0
        ? `<div class="empty" style="padding:20px; text-align:center; color:var(--text-soft); background:rgba(107,158,110,0.05); border-radius:8px">期間內沒有強制結案紀錄 🎉</div>`
        : `<div class="empty" style="padding:20px; text-align:center; color:var(--text-soft)">「${escapeHtml(query)}」沒有符合的呆帳明細</div>`)
    : filteredClosed.map(d => `
        <div class="card" data-petid="${d.petId}">
          <div class="card-row">
            <div style="flex:1; min-width:0">
              <div class="card-title">${d.petSpecies==='cat'?'🐱':'🐶'} ${escapeHtml(d.petName)}${d.ownerName ? ' · ' + escapeHtml(d.ownerName) : ''}</div>
              <div class="card-meta">
                ${escapeHtml(d.courseType)} · 共 ${d.sessCount} 堂 · 已完成 ${d.doneCount} · 結案 ${d.closedCount}
              </div>
              ${d.reasons.length > 0 ? `<div class="card-meta" style="margin-top:4px; color:var(--work)">原因：${d.reasons.map(escapeHtml).join('；')}</div>` : ''}
            </div>
            <div style="font-weight:700; color:var(--work); font-size:15px; flex-shrink:0; margin-left:10px">${fmtMoney(d.amount)}</div>
          </div>
        </div>
      `).join('');

  const byTypeRows = Object.entries(byType).sort((a, b) => b[1].revenue - a[1].revenue);
  const byTypeHtml = byTypeRows.length === 0 ? '' : `
    <div style="overflow-x:auto">
    <table style="width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; min-width:480px">
      <thead>
        <tr style="background:#f0e6d6; color:#6b5435; text-align:left">
          <th style="padding:8px 10px; border:1px solid var(--border)">類型</th>
          <th style="padding:8px 10px; border:1px solid var(--border); text-align:right">份數</th>
          <th style="padding:8px 10px; border:1px solid var(--border); text-align:right">總收費</th>
          <th style="padding:8px 10px; border:1px solid var(--border); text-align:right; color:#4a7d4d">已兌現</th>
          <th style="padding:8px 10px; border:1px solid var(--border); text-align:right; color:var(--work)">未兌現</th>
          <th style="padding:8px 10px; border:1px solid var(--border); text-align:right">呆帳率</th>
        </tr>
      </thead>
      <tbody>
        ${byTypeRows.map(([lab, d]) => `
          <tr>
            <td style="padding:8px 10px; border:1px solid var(--border)">${escapeHtml(lab)}</td>
            <td style="padding:8px 10px; border:1px solid var(--border); text-align:right">${d.count}</td>
            <td style="padding:8px 10px; border:1px solid var(--border); text-align:right">${fmtMoney(d.revenue)}</td>
            <td style="padding:8px 10px; border:1px solid var(--border); text-align:right; color:#4a7d4d">${fmtMoney(d.realized)}</td>
            <td style="padding:8px 10px; border:1px solid var(--border); text-align:right; color:var(--work)">${fmtMoney(d.unrealized)}</td>
            <td style="padding:8px 10px; border:1px solid var(--border); text-align:right">${pct(d.unrealized, d.revenue)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    </div>
  `;

  // 教室派案 section html
  const studioSectionHtml = studioNames.length === 0 ? '' : `
    <h3 style="color:var(--brown-dark); margin: 24px 0 10px; font-size:15px">🏫 教室派案</h3>
    ${studioNames.map(name => {
      const accrued = (studioMap[name] && studioMap[name].accrued) || 0;
      const received = studioReceivedMap[name] || 0;
      const balance = accrued - received;
      const balLabel = balance > 0 ? '應收餘額' : (balance < 0 ? '已超付' : '已結清');
      const balCls = balance > 0 ? 'warn' : 'good';
      const sps = filteredStudioPayments.filter(p => p.studioName === name);
      return `
        <div class="card" style="cursor:default; padding:12px 14px; margin-bottom:10px">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; flex-wrap:wrap">
            <h4 style="margin:0; color:var(--brown-dark); font-size:14px">🏫 ${escapeHtml(name)}</h4>
            <button class="small-btn" data-add-studio-pay="${escapeAttr(name)}" type="button">+ 新增教室付款</button>
          </div>
          <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap:8px; margin-bottom:8px">
            <div class="stat-card good">
              <div class="stat-label">累計應付</div>
              <div class="stat-value">${fmtMoney(accrued)}</div>
              <div class="stat-pct">${(studioMap[name] && studioMap[name].doneCount) || 0} 堂 done</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">累計實付</div>
              <div class="stat-value">${fmtMoney(received)}</div>
              <div class="stat-pct">${sps.length} 筆</div>
            </div>
            <div class="stat-card ${balCls}">
              <div class="stat-label">${balLabel}</div>
              <div class="stat-value">${fmtMoney(Math.abs(balance))}</div>
            </div>
          </div>
          ${sps.length === 0 ? '<p style="font-size:12px; color:var(--text-soft); padding:6px 0; margin:0">尚無教室付款紀錄</p>' : `
            <details>
              <summary style="cursor:pointer; font-size:12px; color:var(--accent); user-select:none">📋 ${sps.length} 筆付款紀錄</summary>
              <div style="overflow-x:auto; margin-top:6px">
              <table style="width:100%; border-collapse:collapse; font-size:12px; min-width:480px">
                <thead><tr style="background:#f0e6d6; color:#6b5435"><th style="padding:5px 8px; border:1px solid var(--border); text-align:left">收到日期</th><th style="padding:5px 8px; border:1px solid var(--border); text-align:left">對應月份</th><th style="padding:5px 8px; border:1px solid var(--border); text-align:right">金額</th><th style="padding:5px 8px; border:1px solid var(--border); text-align:left">備註</th></tr></thead>
                <tbody>
                  ${sps.map(sp => `<tr data-edit-sp="${sp.id}" style="cursor:pointer"><td style="padding:5px 8px; border:1px solid var(--border)">${escapeHtml(fmtDate(sp.date))}</td><td style="padding:5px 8px; border:1px solid var(--border)">${escapeHtml(sp.period || '—')}</td><td style="padding:5px 8px; border:1px solid var(--border); text-align:right; font-weight:600">${fmtMoney(sp.amount)}</td><td style="padding:5px 8px; border:1px solid var(--border); color:var(--text-soft)">${escapeHtml(sp.note || '')}</td></tr>`).join('')}
                </tbody>
              </table>
              </div>

// 簡單但堅實的 CSV 解析器：處理引號、轉義引號、多行儲存格、CRLF
function parseCsv(text) {
  const rows = [];
  let row = [];
  let cell = '';
  let inQuote = false;
  let i = 0;
  const N = text.length;
  while (i < N) {
    const c = text[i];
    if (inQuote) {
      if (c === '"' && text[i+1] === '"') { cell += '"'; i += 2; continue; }
      if (c === '"') { inQuote = false; i++; continue; }
      cell += c;
      i++;
    } else {
      if (c === '"') { inQuote = true; i++; continue; }
      if (c === ',') { row.push(cell); cell = ''; i++; continue; }
      if (c === '\r' || c === '\n') {
        if (c === '\r' && text[i+1] === '\n') i++;
        row.push(cell); cell = '';
        if (row.length > 1 || (row[0] && row[0] !== '')) rows.push(row);
        row = [];
        i++;
        continue;
      }
      cell += c;
      i++;
    }
  }
  if (cell !== '' || row.length > 0) {
    row.push(cell);
    if (row.length > 1 || (row[0] && row[0] !== '')) rows.push(row);
  }
  return rows;
}

  const s = colName || '';
  // 飼主姓名（不能是「飼主在 X 上的名字」這種社群帳號欄位）
  if (/^飼主.*姓名$|^飼主名$|^主人.*姓名$|^主人名$/i.test(s)) return 'ownerName';
  // 飼主聯絡（優先電話 > Email；Email 因可能用作識別、放備註更實用，這裡只抓電話）
  if (/聯絡電話|^電話|^手機|^phone$/i.test(s)) return 'ownerContact';
  // 飼主地址（住址、地址、上課地點、住處）
  if (/地址|住址|^住處$|上課地點|address|location/i.test(s)) return 'ownerAddress';
  // 寵物名字（嚴格：開頭必須是「寵物」）
  if (/^寵物.*名(字|稱)?$|^pet.*name$|^name$/i.test(s)) return 'name';
  // 寵物品種（嚴格：開頭必須是「寵物」）
  if (/^寵物.*品種$|^breed$/i.test(s)) return 'breed';
  // 性別
  if (/^寵物.*性別$|^性別$|^sex$|^gender$/i.test(s)) return 'gender';
  // 絕育（只抓「是否絕育」這個 yes/no 問題，後續「絕育的原因」等都歸備註）
  if (/^是否絕育/i.test(s)) return 'neutered';
  // 出生（嚴格：「出生」開頭、寵物的出生）
  if (/^寵物.*出生|^出生|^生日|^birth/i.test(s)) return 'birth';
  // 困擾行為（客戶填寫的目前最想解決的問題）
  if (/困擾.*行為|目前.*困擾|想解決|問題.*行為|concerns?$/i.test(s)) return 'concerns';
  // 其他全部歸備註
  return 'notes';
}

// 值轉換（性別、絕育用）
function normalizeGender(v) {
  if (!v) return '';
  const s = String(v).trim();
  if (/^(男|公|male|m|♂)/i.test(s)) return 'male';
  if (/^(女|母|female|f|♀)/i.test(s)) return 'female';
  return '';
}
function normalizeNeutered(v) {
  if (!v) return '';
  const s = String(v).trim();
  if (/^(是|已|yes|y|true|已結|已絕)/i.test(s)) return 'yes';
  if (/^(否|未|no|n|false|沒|還沒)/i.test(s)) return 'no';
  return '';
}

let CSV_IMPORT_STATE = null;  // { rows, headers, mapping, batchSpecies }

function openCsvImport() {
  CSV_IMPORT_STATE = { rows: null, headers: null, mapping: {}, batchSpecies: 'dog' };
  const overlay = openModal(`
    <div class="modal" style="max-width:720px">
      <h2>📥 從 CSV 匯入寵物</h2>
      <div class="field">
        <label>選 CSV 檔（從 Google 表單 / SurveyCake 下載）</label>
        <input id="csvFile" type="file" accept=".csv,text/csv" style="padding:8px;">
      </div>
      <div id="csvImportContent"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="csv_cancel">關閉</button>
      </div>
    </div>
  `);
  overlay.querySelector('#csv_cancel').onclick = () => overlay.remove();
  overlay.querySelector('#csvFile').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const rows = parseCsv(text);
      if (rows.length < 2) {
        showNotice('CSV 只有標題列，沒有資料', 'err');
        return;
      }
      CSV_IMPORT_STATE.headers = rows[0];
      CSV_IMPORT_STATE.rows = rows.slice(1);
      // 自動偵測 mapping
      CSV_IMPORT_STATE.mapping = {};
      CSV_IMPORT_STATE.headers.forEach((h, i) => {
        CSV_IMPORT_STATE.mapping[i] = autoMapColumn(h);
      });
      renderCsvMapping(overlay);
    } catch (err) {
      showNotice('CSV 解析失敗：' + err.message, 'err');
    }
  };
}

function renderCsvMapping(overlay) {
  const { headers, rows, mapping, batchSpecies } = CSV_IMPORT_STATE;
  const optionsHtml = CSV_FIELD_OPTIONS.map(o => `<option value="${o.value}">${o.label}</option>`).join('');
  const rowsHtml = headers.map((h, i) => {
    const sample = (rows[0] && rows[0][i] || '').slice(0, 40);
    const opts = CSV_FIELD_OPTIONS.map(o =>
      `<option value="${o.value}" ${mapping[i]===o.value?'selected':''}>${o.label}</option>`

    return `

        </td>

    <div class="notice" style="margin-bottom:12px">
      偵測到 <b>${rows.length}</b> 筆資料，<b>${headers.length}</b> 個欄位。下方確認對應、選物種，再預覽匯入。
    </div>

    <div class="field">
      <label>這批寵物全部是？</label>
      <div class="radio-group">

        <label class="radio-opt"><input type="radio" name="batchSpecies" value="cat" ${batchSpecies==='cat'?'checked':''}> 🐱 貓</label>
      </div>
    </div>

    <div class="field">
      <label>欄位對應（★ 為必填）</label>
      <table style="width:100%; border-collapse:collapse; font-size:13px;">
        <thead>
          <tr style="background:var(--bg-soft)">
            <th style="text-align:left; padding:6px 8px;">CSV 欄位</th>
            <th style="text-align:left; padding:6px 8px;">匯入到 App 的⋯</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>

    </div>

  overlay.querySelectorAll('select[data-col]').forEach(sel => {

}

// 把一個 CSV 列轉成 pet 物件
function csvRowToPet(row, headers, mapping, batchSpecies) {
  const pet = {
    id: uid(),
    species: batchSpecies,
    name: '', breed: '', gender: '', neutered: '', birth: '',
    ownerName: '', ownerContact: '', ownerAddress: '',
    concerns: '', notes: '',
    createdAt: new Date().toISOString(),
  };
  const noteParts = [];
  headers.forEach((h, i) => {
    const target = mapping[i];
    const raw = (row[i] || '').trim();
    if (!raw) return;
    if (!target) return;
    if (target === 'gender') pet.gender = normalizeGender(raw);
    else if (target === 'neutered') pet.neutered = normalizeNeutered(raw);
    else if (target === 'notes') noteParts.push(`【${h}】${raw}`);
    else if (target in pet) pet[target] = raw;
  });
  pet.notes = noteParts.join('\n');
  return pet;
}

function renderCsvPreview(overlay) {
  const { headers, rows, mapping, batchSpecies } = CSV_IMPORT_STATE;
  // 必須有 name 對應
  const hasName = Object.values(mapping).includes('name');
  if (!hasName) {
    showNotice('⚠️ 必須有一個欄位對應到「名字」', 'err');
    return;
  }
  const previewPets = rows.slice(0, 3).map(r => csvRowToPet(r, headers, mapping, batchSpecies));
  const allPets = rows.map(r => csvRowToPet(r, headers, mapping, batchSpecies));
  const validCount = allPets.filter(p => p.name).length;
  const skippedCount = allPets.length - validCount;

  const previewHtml = previewPets.map(p => `
    <div class="card" style="cursor:default; margin-bottom:8px;">
      <div class="card-title">${speciesEmoji(p.species)} ${escapeHtml(p.name||'(空白名字、會被略過)')}</div>
      <div class="card-meta">${escapeHtml(petTagline(p))} · 飼主：${escapeHtml(p.ownerName||'—')}${p.ownerContact?' · '+escapeHtml(p.ownerContact):''}</div>
      ${p.notes ? `<div class="card-meta" style="margin-top:8px; padding-top:8px; border-top:1px dashed var(--brown-light); white-space:pre-wrap; max-height:120px; overflow-y:auto;">${escapeHtml(p.notes)}</div>` : ''}
    </div>
  `).join('');

  document.getElementById('csvImportContent').innerHTML = `
    <div class="notice" style="margin-bottom:12px">
      準備匯入 <b>${validCount}</b> 隻寵物${skippedCount?`（${skippedCount} 筆名字空白會略過）`:''}。下方是前 3 筆預覽：
    </div>
    ${previewHtml}
    <div class="actions-row" style="margin-top:14px">
      <button class="btn ghost" id="csv_back">← 重新對應</button>
      <button class="btn" id="csv_confirm">✓ 確認匯入 ${validCount} 筆</button>
    </div>
  `;
  document.getElementById('csv_back').onclick = () => renderCsvMapping(overlay);
  document.getElementById('csv_confirm').onclick = () => {
    const newPets = allPets.filter(p => p.name);
    const cur = load(KEYS.pets, []);
    save(KEYS.pets, cur.concat(newPets));
    showNotice(`✅ 已匯入 ${newPets.length} 隻寵物`);
    overlay.remove();
    render();
  };
}

/* ============== HELPERS ============== */
function openModal(html) {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = html;
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  document.body.appendChild(overlay);
  return overlay;
}
// 訓練方法表格編輯器
function openTableEditor(initialTable, onSave) {
  let t = normalizeTable(initialTable) || emptyTable(3, 3);
  let activeCell = null;  // 最後 focus 的 cell（toolbar 用）

  // 同步 DOM cell 內容回 t.headers / t.rows（在重 render 前呼叫）
  function syncFromDom() {
    overlay.querySelectorAll('[data-tehdr]').forEach(el => {
      t.headers[parseInt(el.dataset.tehdr)] = sanitizeColorHtml(el.innerHTML);
    });
    overlay.querySelectorAll('[data-tecell]').forEach(el => {
      const [ri, ci] = el.dataset.tecell.split('_').map(Number);
      t.rows[ri][ci] = sanitizeColorHtml(el.innerHTML);
    });
  }

  function render() {
    const colWidth = `minmax(80px, 1fr)`;
    const gridCols = `40px ${Array.from({length: t.headers.length}, () => colWidth).join(' ')} 40px`;
    overlay.querySelector('#te_grid').innerHTML = `
      <div style="display:grid; grid-template-columns:${gridCols}; gap:4px; min-width:fit-content;">
        <div></div>
        ${t.headers.map((h, ci) => `
          <div style="position:relative;">
            <div contenteditable="true" data-tehdr="${ci}" data-placeholder="欄${ci+1}標題"
              class="color-editor" style="background:#f0e6d6; border:1px solid #c9a85a; border-radius:4px; font-weight:600; color:#6b5435; font-size:13px; padding:6px 8px; min-height:32px;">${ensureColorHtml(h)}</div>
          </div>
        `).join('')}
        <div style="display:flex; align-items:center; justify-content:center;">
          <button class="small-btn danger" data-tedelcol style="padding:2px 6px; font-size:11px;" title="刪最後一欄">−欄</button>
        </div>
        ${t.rows.map((row, ri) => `
          <div style="display:flex; align-items:center; justify-content:center; color:var(--text-soft); font-size:11px;">${ri+1}</div>
          ${row.map((c, ci) => `
            <div contenteditable="true" data-tecell="${ri}_${ci}" data-placeholder=""
              class="color-editor" style="font-size:13px; min-height:32px; padding:6px 8px;">${ensureColorHtml(c)}</div>
          `).join('')}
          <div style="display:flex; align-items:center; justify-content:center;">
            <button class="small-btn danger" data-tedelrow="${ri}" style="padding:2px 6px; font-size:11px;" title="刪這列">×</button>
          </div>
        `).join('')}
      </div>
    `;
    // Track active cell for toolbar
    overlay.querySelectorAll('.color-editor').forEach(el => {
      el.onfocus = () => { activeCell = el; };
    });
    overlay.querySelectorAll('[data-tedelrow]').forEach(btn => {
      btn.onclick = () => {
        const ri = parseInt(btn.dataset.tedelrow);
        if (t.rows.length <= 1) { showNotice('至少要保留 1 列', 'err'); return; }
        syncFromDom();
        t.rows.splice(ri, 1);
        render();
      };
    });
    overlay.querySelector('[data-tedelcol]').onclick = () => {
      if (t.headers.length <= 1) { showNotice('至少要保留 1 欄', 'err'); return; }
      syncFromDom();
      t.headers.pop();
      t.rows.forEach(r => r.pop());
      render();
    };
  }

  const overlay = openModal(`
    <div class="modal" style="max-width:900px; width:95vw;">
      <h2>訓練方法表格編輯</h2>
      <p style="color:var(--text-soft); font-size:12px; margin-bottom:8px">
        • 第一行（淺色）是欄標題；其他列每格自由填。第 1 欄會自動加粗。<br>
        🎨 <b>上色</b>：點 cell 進入編輯 → 選取要變色的字 → 按下方顏色按鈕。
      </p>
      <div class="color-toolbar" id="te_toolbar" style="margin-bottom:10px;">
        <button type="button" class="tb-clear" data-color="">清色</button>
        <button type="button" class="tb-red" data-color="#c97a4f">A 紅</button>
        <button type="button" class="tb-green" data-color="#6b9e6e">A 綠</button>
        <button type="button" class="tb-blue" data-color="#5a7a9e">A 藍</button>
      </div>
      <div id="te_grid" style="overflow-x:auto; padding:4px 0;"></div>
      <div style="display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;">
        <button class="small-btn" id="te_addrow">＋ 新增列</button>
        <button class="small-btn" id="te_addcol">＋ 新增欄</button>
        <button class="small-btn danger" id="te_clear">清空表格</button>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="te_cancel">取消</button>
        <button class="btn" id="te_save">儲存</button>
      </div>
    </div>
  `);

  render();
  // Bind toolbar
  overlay.querySelectorAll('#te_toolbar button[data-color]').forEach(btn => {
    btn.onmousedown = (e) => e.preventDefault();
    btn.onclick = (e) => {
      e.preventDefault();
      if (!activeCell) { showNotice('請先點一個格子再選取文字', 'err'); return; }
      applyColorToSelection(btn.dataset.color, activeCell);
    };
  });

  overlay.querySelector('#te_addrow').onclick = () => {
    syncFromDom();
    t.rows.push(Array.from({length: t.headers.length}, () => ''));
    render();
  };
  overlay.querySelector('#te_addcol').onclick = () => {
    syncFromDom();
    t.headers.push(`欄${t.headers.length + 1}`);
    t.rows.forEach(r => r.push(''));
    render();
  };
  overlay.querySelector('#te_clear').onclick = () => {
    if (!confirm('清空整個表格？')) return;
    t = emptyTable(3, 3);
    render();
  };
  overlay.querySelector('#te_cancel').onclick = () => overlay.remove();
  overlay.querySelector('#te_save').onclick = () => {
    syncFromDom();
    onSave(normalizeTable(t));
    overlay.remove();
  };
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }
