<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wendy 溫蒂．貓與狗訓練日常</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f7f3ed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wendy 訓練">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* 北歐風 + 一點暖意：淡奶白 + 深炭 + 焦糖 accent */
    --bg: #f7f3ed;             /* 主背景：淡奶白（比純白暖、比奶油淡） */
    --bg-soft: #ede5d6;        /* 次背景：暖米色（accent 區） */
    --brown: #4a4138;          /* 主文字色：深炭棕 */
    --brown-dark: #2c2620;     /* 強調色 / 主標題 */
    --brown-light: #b8ad9a;    /* 輔助色：淡木灰 */
    --text: #2c2620;           /* 一般文字：深炭灰 */
    --text-soft: #7a716a;      /* 次文字：中灰 */
    --good: #7a9a7d;           /* 成功 / done：莫蘭迪綠 */
    --ok: #c9b573;             /* 中性 / 警示：莫蘭迪黃 */
    --work: #b8745a;           /* 警告 / pending：莫蘭迪橘 */
    --border: #e0dcd4;         /* 細邊線（配合暖底色微調） */
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    --accent: #4a4138;         /* alias：保持既有 var(--accent) 引用不壞 */
    --accent-warm: #c08a5e;    /* 焦糖 accent：強調 button / 今天 / hover */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont,
                 "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    font-weight: 400;
  }
  .app { max-width: 720px; margin: 0 auto; padding-bottom: 80px; }
  header.top {
    background: #ffffff;
    color: var(--text);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid var(--border);
  }
  header.top h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.3px;
    flex: 1;
    text-align: center;
  }
  .brand-logo {
    display: flex;
    align-items: center;
    flex-shrink: 0;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 6px;
    transition: background 0.15s;
  }
  .brand-logo:hover { background: var(--bg-soft); }
  .brand-logo img {
    height: 28px;
    width: auto;
    display: block;
  }

  .breadcrumb {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 2px;
    font-size: 13px;
    color: var(--text-soft);
    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;
    scrollbar-width: none;
    min-width: 0;
  }
  .breadcrumb::-webkit-scrollbar { display: none; }
  .bc-link {
    color: inherit;
    text-decoration: none;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .bc-link:hover { background: var(--bg-soft); }
  .bc-current {
    color: var(--brown-dark);
    font-weight: 600;
    padding: 4px 6px;
    flex-shrink: 0;
  }
  .bc-sep {
    color: var(--brown-light);
    flex-shrink: 0;
    padding: 0 1px;
  }
  .icon-btn {
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 6px;
    min-width: 36px;
  }
  .icon-btn:hover { background: var(--bg-soft); }
  .icon-btn:disabled { opacity: 0.3; cursor: default; }

  .sync-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #999;
    flex-shrink: 0;
    margin: 0 4px;
    cursor: help;
    transition: background 0.3s;
  }
  .sync-dot.ok { background: #6b9e6e; }
  .sync-dot.syncing { background: #c9a85a; animation: pulse 1.2s ease-in-out infinite; }
  .sync-dot.pending { background: #c9a85a; }
  .sync-dot.error { background: #c97a4f; }
  .sync-dot.disabled { background: #999; opacity: 0.5; }
  @keyframes pulse { 50% { opacity: 0.4; } }

  main { padding: 16px; }

  .crumb {
    font-size: 13px;
    color: var(--text-soft);
    margin-bottom: 12px;
  }

  .card {
    background: #ffffff;
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .card:hover { border-color: var(--brown-light); }
  .card-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .card-title { font-weight: 600; font-size: 16px; color: var(--brown-dark); letter-spacing: 0.2px; }
  .card-meta { font-size: 14px; color: var(--text-soft); margin-top: 4px; font-weight: 400; }
  .badge {
    background: var(--bg-soft);
    color: var(--brown-dark);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
    border: 1px solid var(--border);
  }

  .card-menu-btn {
    background: transparent;
    border: none;
    font-size: 18px;
    color: var(--text-soft);
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    line-height: 1;
    flex-shrink: 0;
  }
  .card-menu-btn:hover { background: var(--bg-soft); color: var(--text); }

  /* Session 狀態 toggle 圓圈（booked/done） */
  .status-toggle {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid var(--border, #c9b89a);
    background: white;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    color: white;
    line-height: 1;
    display: inline-flex;
    align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-right: 12px;
    margin-top: 2px;
    padding: 0;
    transition: background 0.15s, border-color 0.15s;
  }
  .status-toggle.done {
    background: var(--good, #6b9e6e);
    border-color: var(--good, #6b9e6e);
  }
  .status-toggle.closed {
    background: #b8b3aa; border-color: #b8b3aa; color: white; font-size: 11px;
  }
  .status-toggle.booked:hover { border-color: var(--accent, #8b6f47); }
  /* done 卡片視覺：淺灰底 + 標題刪除線 */
  .card.session-done { background: #f5f0e8; opacity: 0.72; }
  .card.session-done .card-title { text-decoration: line-through; color: var(--text-soft); }
  /* closed 卡片視覺：更灰、刪除線 */
  .card.session-closed { background: #ece7df; opacity: 0.55; }
  .card.session-closed .card-title { text-decoration: line-through; color: var(--text-soft); }
  /* 狀態 badge（已預約 / 待結案 / 已完成） */
  .status-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
    margin-left: 6px;
    line-height: 1.4;
    vertical-align: 2px;
    white-space: nowrap;
  }
  .status-badge.unscheduled { background: #ebe5dc; color: #8a7e6f; }
  .status-badge.booked      { background: #f0e6d6; color: #6b5435; }
  .status-badge.pending     { background: #fbe8d4; color: #c97a4f; border: 1px solid #e8b894; }
  .status-badge.done        { background: rgba(107,158,110,0.15); color: #4a7d4d; }
  .status-badge.closed      { background: #d8d4ce; color: #6a6258; text-decoration: line-through; }

  /* 寵物列表帳齡 badge */
  .aging-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
  }
  .aging-badge.aging-mild { background: #fbe8d4; color: #c97a4f; }
  .aging-badge.aging-warn { background: #f9d8a8; color: #a85f33; border: 1px solid #e8b894; }
  .aging-badge.aging-bad  { background: #f5b9a0; color: #8a3a1a; font-weight: 600; border: 1px solid #d88068; }

  /* 月曆 view */
  .cal-week-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-soft);
    margin-bottom: 4px;
  }
  .cal-week-header .sun { color: #c97a4f; }
  .cal-week-header .sat { color: #5a7a9e; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    background: var(--border);
    border: 1px solid var(--border);
  }
  .cal-cell {
    background: white;
    min-height: 78px;
    padding: 4px;
    font-size: 11px;
    overflow: hidden;
  }
  .cal-cell.empty { background: rgba(0,0,0,0.03); }
  .cal-cell.today { background: rgba(192,138,94,0.10); border: 2px solid var(--accent-warm); padding: 2px; }
  .cal-day { font-weight: 600; color: var(--brown-dark); margin-bottom: 2px; font-size: 12px; }
  .cal-cell.empty .cal-day { color: var(--text-soft); opacity: 0.4; }
  .cal-sess {
    font-size: 10px;
    padding: 2px 4px;
    border-radius: 3px;
    margin-bottom: 2px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cal-sess-booked  { background: #f0e6d6; color: #6b5435; }
  .cal-sess-pending { background: #fbe8d4; color: #c97a4f; border: 1px solid #e8b894; }
  .cal-sess-done    { background: rgba(107,158,110,0.2); color: #4a7d4d; text-decoration: line-through; }
  .cal-sess-closed  { background: #d8d4ce; color: #6a6258; text-decoration: line-through; }

  /* 月曆 legend chip（4 個 status 圖例對齊） */
  .legend-chip {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 3px;
    font-size: 10px;
    margin-right: 4px;
    vertical-align: middle;
    text-decoration: none;
    border: 1px solid transparent;
    box-sizing: border-box;
  }
  .legend-chip.booked  { background: #f0e6d6; color: #6b5435; }
  .legend-chip.pending { background: #fbe8d4; color: #c97a4f; border-color: #e8b894; }
  .legend-chip.done    { background: rgba(107,158,110,0.2); color: #4a7d4d; }
  .legend-chip.closed  { background: #d8d4ce; color: #6a6258; }

  /* 設定頁可摺疊 section */
  .settings-section { margin-bottom: 14px; }
  .settings-section > summary {
    list-style: none;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    color: var(--brown-dark);
    padding: 8px 4px;
    user-select: none;
    border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .settings-section > summary::-webkit-details-marker { display: none; }
  .settings-section > summary::after {
    content: '▶';
    color: var(--text-soft);
    font-size: 12px;
  }
  .settings-section[open] > summary::after { content: '▼'; }

  /* 寵物列表來源 chips */
  .source-chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin: 8px 4px 6px;
  }
  .source-chip {
    padding: 4px 10px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: white;
    font-size: 12px;
    cursor: pointer;
    color: var(--text);
    font-family: inherit;
  }
  .source-chip.active {
    background: var(--brown-dark);
    color: white;
    border-color: var(--brown-dark);
  }

  /* 寵物詳情頁的分組資訊區（狗狗基本 / 困擾 / 家長基本） */
  .info-group {
    margin-top: 10px;
    padding: 10px 12px;
    background: rgba(240,230,214,0.4);
    border-radius: 6px;
    border-left: 3px solid transparent;  /* 預留位置讓所有 group 寬度一致 */
    box-sizing: border-box;
  }
  .info-group:first-child { margin-top: 0; }
  .info-group h4 {
    margin: 0 0 6px;
    font-size: 13px;
    color: var(--brown-dark);
    font-weight: 600;
  }
  .info-group .info-row {
    font-size: 13px;
    color: var(--text);
    margin-bottom: 4px;
    line-height: 1.6;
  }
  .info-group.concerns {
    background: rgba(201,122,79,0.12);
    border-left-color: var(--work);  /* 紅左邊條保留作為警示視覺 */
  }

  /* 教室派案 badge */
  .studio-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
    margin-left: 6px;
    background: #fdf6dc;
    color: #8b6f47;
    border: 1px solid #e8c870;
    vertical-align: 2px;
  }
  /* Section header（即將上課優先模式 3 段） */
  .session-section-header {
    font-size: 14px;
    color: var(--brown-dark);
    margin: 18px 4px 8px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 4px;
    font-weight: 600;
  }
  .session-section-header.pending { color: var(--work, #c97a4f); }
  .session-section-header.closed  { color: #6a6258; }

  /* 統計頁卡片 */
  .stat-card {
    background: white;
    border-radius: 8px;
    padding: 12px 14px;
    border: 1px solid var(--border);
  }
  .stat-card.good { background: rgba(107,158,110,0.08); border-color: rgba(107,158,110,0.3); }
  .stat-card.warn { background: rgba(201,122,79,0.08); border-color: rgba(201,122,79,0.3); }
  .stat-label { font-size: 12px; color: var(--text-soft); margin-bottom: 4px; }
  .stat-value { font-size: 18px; font-weight: 700; color: var(--brown-dark); line-height: 1.3; }
  .stat-card.good .stat-value { color: #4a7d4d; }
  .stat-card.warn .stat-value { color: var(--work); }
  .stat-pct { font-size: 11px; color: var(--text-soft); margin-top: 2px; }

  /* 可點卡片（drill-down）*/
  .stat-card.clickable {
    cursor: pointer;
    position: relative;
    transition: box-shadow 150ms ease, transform 150ms ease;
  }
  .stat-card.clickable:hover {
    box-shadow: 0 4px 14px rgba(61,47,31,0.12);
    transform: translateY(-1px);
  }
  .stat-card.clickable::after {
    content: '›';
    position: absolute;
    top: 8px;
    right: 10px;
    font-size: 16px;
    color: var(--text-soft);
    opacity: 0.5;
    transition: opacity 150ms ease, transform 150ms ease;
  }
  .stat-card.clickable:hover::after { opacity: 1; transform: translateX(2px); }

  /* Drill-down Drawer */
  .stats-drawer-overlay {
    position: fixed; inset: 0;
    background: rgba(40,28,15,0.4);
    z-index: 90;
    opacity: 1;
    transition: opacity 200ms ease;
  }
  .stats-drawer-overlay.hidden { display: none; }
  .stats-drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 520px;
    max-width: 100vw;
    background: var(--bg, #faf6ef);
    box-shadow: -8px 0 24px rgba(61,47,31,0.18);
    z-index: 100;
    display: flex; flex-direction: column;
    transform: translateX(0);
    transition: transform 220ms cubic-bezier(.2,.7,.3,1);
  }
  .stats-drawer.hidden { transform: translateX(100%); pointer-events: none; }
  @media (max-width: 600px) {
    .stats-drawer { width: 100vw; }
  }
  .stats-drawer-header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    flex-shrink: 0;
    background: white;
  }
  .stats-drawer-header h3 {
    margin: 0;
    font-size: 16px;
    color: var(--brown-dark);
  }
  .stats-drawer-header .stats-drawer-subtitle {
    margin-top: 4px;
    font-size: 12px;
    color: var(--text-soft);
    line-height: 1.5;
  }
  .stats-drawer-header .stats-drawer-mainvalue {
    margin-top: 6px;
    font-size: 20px;
    font-weight: 700;
    color: var(--brown-dark);
  }
  .stats-drawer-close {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 30px; height: 30px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-soft);
    flex-shrink: 0;
  }
  .stats-drawer-close:hover { background: rgba(0,0,0,0.05); color: var(--text); }
  .stats-drawer-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px 18px;
  }
  .stats-drawer-footer {
    flex-shrink: 0;
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    background: white;
    font-size: 13px;
  }
  .stats-drawer-footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text-soft);
  }
  .stats-drawer-footer-row strong {
    color: var(--brown-dark);
    font-size: 15px;
  }
  .stats-drill-list { display: flex; flex-direction: column; gap: 6px; }
  .stats-drill-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 6px;
    transition: background 120ms ease, border-color 120ms ease;
  }
  .stats-drill-row.clickable { cursor: pointer; }
  .stats-drill-row.clickable:hover {
    background: rgba(107,158,110,0.06);
    border-color: rgba(107,158,110,0.3);
  }
  .stats-drill-row-main { flex: 1; min-width: 0; }
  .stats-drill-row-title {
    font-size: 13px;
    color: var(--brown-dark);
    font-weight: 600;
    line-height: 1.4;
  }
  .stats-drill-row-meta {
    font-size: 11.5px;
    color: var(--text-soft);
    margin-top: 3px;
    line-height: 1.5;
  }
  .stats-drill-row-amount {
    font-size: 14px;
    font-weight: 700;
    color: var(--brown-dark);
    flex-shrink: 0;
    text-align: right;
    line-height: 1.4;
  }
  .stats-drill-row-amount.good { color: #4a7d4d; }
  .stats-drill-row-amount.warn { color: var(--work); }
  .stats-drill-row-amount .stats-drill-sub {
    display: block;
    font-size: 11px;
    color: var(--text-soft);
    font-weight: 400;
    margin-top: 2px;
  }
  .stats-drill-section-label {
    font-size: 11px;
    color: var(--text-soft);
    margin: 10px 4px 4px;
    text-transform: none;
    letter-spacing: 0.02em;
  }
  .stats-drill-section-label:first-child { margin-top: 0; }
  .stats-drill-empty {
    padding: 28px 16px;
    text-align: center;
    color: var(--text-soft);
    background: rgba(107,158,110,0.04);
    border-radius: 8px;
    font-size: 13px;
  }

  .card-menu {
    background: white;
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(61,47,31,0.18);
    padding: 6px;
    z-index: 50;
    min-width: 160px;
  }
  .card-menu button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    color: var(--text);
    font-family: inherit;
  }
  .card-menu button:hover { background: var(--bg-soft); }
  .card-menu button.danger { color: var(--work); }
  .card-menu button.danger:hover { background: rgba(201,122,79,0.1); }

  .btn {
    background: var(--brown-dark);
    color: #ffffff;
    border: 1px solid var(--brown-dark);
    padding: 9px 16px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn:hover { background: #1a1612; border-color: #1a1612; }
  .btn.ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }

let LOGO_DATA = null, LOGO_W = 0, LOGO_H = 0;
(function preloadLogo() {
  const img = new Image();
  img.onload = () => {
    try {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth;
      c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      LOGO_DATA = c.toDataURL('image/png');
      LOGO_W = img.naturalWidth;
      LOGO_H = img.naturalHeight;
    } catch (e) { /* tainted canvas (cross-origin) — PDF will skip logo */ }
  };
  img.src = 'logo.png';
})();

// 把任何舊版資料自動升級成 v4：{ name, methods: [{name, steps, table?}] }
function normalizeTable(t) {
  if (!t || !Array.isArray(t.headers) || !Array.isArray(t.rows)) return null;
  const cols = t.headers.length;
  if (cols === 0) return null;
  const headers = t.headers.map(h => String(h || ''));
  const rows = t.rows.map(r => {
    const row = Array.isArray(r) ? r.slice(0, cols).map(c => String(c || '')) : [];
    while (row.length < cols) row.push('');
    return row;
  });
  return { headers, rows };
}
function emptyTable(cols = 3, rowCount = 2) {
  return {
    headers: Array.from({ length: cols }, (_, i) => `欄${i+1}`),
    rows: Array.from({ length: rowCount }, () => Array.from({ length: cols }, () => '')),
  };
}
// 顏色 sanitize：只允許 <br> 跟 <span style="color:..."> 跟 <span style="font-weight:...">
function sanitizeColorHtml(html) {
  if (!html) return '';
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  // 直接移除危險元素
  tmp.querySelectorAll('script, style, iframe, object, embed, link, meta').forEach(el => el.remove());
  function walk(node) {
    [...node.childNodes].forEach(child => {
      if (child.nodeType === 8) { child.remove(); return; }   // comment
      if (child.nodeType !== 1) return;                        // text
      const tag = child.tagName.toLowerCase();
      if (tag === 'br') return;
      if (tag === 'span') {
        const color = child.style.color;
        const fontWeight = child.style.fontWeight;
        while (child.attributes.length > 0) child.removeAttribute(child.attributes[0].name);
        if (color) child.style.color = color;
        if (fontWeight === '600' || fontWeight === 'bold' || fontWeight === '700') child.style.fontWeight = '600';
        walk(child);
        return;
      }
      // div / p → 取出內容、加 <br>，移除 div/p 標籤
      walk(child);
      const parent = child.parentNode;
      if ((tag === 'div' || tag === 'p') && parent) {
        if (child.previousSibling) parent.insertBefore(document.createElement('br'), child);
      }
      while (child.firstChild) parent.insertBefore(child.firstChild, child);
      child.remove();
    });
  }
  walk(tmp);
  return tmp.innerHTML;
}
// 套色彩到當前 selection（必須在 editorEl 範圍內）
function applyColorToSelection(color, editorEl) {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0) { showNotice('請先選取要上色的文字', 'err'); return; }
  const range = sel.getRangeAt(0);
  if (range.collapsed) { showNotice('請先選取要上色的文字', 'err'); return; }
  if (!editorEl.contains(range.commonAncestorContainer)) { showNotice('請先選取要上色的文字', 'err'); return; }
  const fragment = range.extractContents();
  const span = document.createElement('span');
  if (color) {
    span.style.color = color;
    span.style.fontWeight = '600';
  }
  span.appendChild(fragment);
  range.insertNode(span);
  // 把游標放到 span 後
  sel.removeAllRanges();
  const newRange = document.createRange();
  newRange.selectNodeContents(span);
  newRange.collapse(false);
  sel.addRange(newRange);
  editorEl.dispatchEvent(new Event('input', { bubbles: true }));
}
// 純文字 → HTML（用於舊資料遷移：純文字 step 升級成 HTML）
function plainTextToHtml(s) {
  if (!s) return '';
  return escapeHtml(s).replace(/\n/g, '<br>');
}
// 偵測是否已經是 HTML 格式（含 tag）
function looksLikeHtml(s) {
  return typeof s === 'string' && /<(br|span|div|p)\b/i.test(s);
}
// 確保字串為 sanitized HTML（舊資料遷移 + 新資料 sanitize）
function ensureColorHtml(s) {
  if (!s) return '';
  if (looksLikeHtml(s)) return sanitizeColorHtml(s);
  // 自動修正：偵測雙重 escape 的 HTML（&lt;br&gt;、&amp;lt;br&amp;gt;）→ 解碼後當 HTML
  if (/&lt;(br|span|div|p)\b|&amp;lt;(br|span|div|p)\b/i.test(s)) {
    const ta = document.createElement('textarea');
    ta.innerHTML = s;
    let decoded = ta.value;
    // 二次解碼（&amp;lt; → &lt; → <）
    if (/&lt;(br|span|div|p)\b/i.test(decoded)) {
      ta.innerHTML = decoded;
      decoded = ta.value;
    }
    if (looksLikeHtml(decoded)) return sanitizeColorHtml(decoded);
  }
  return plainTextToHtml(s);
}

// 共用：插入 HTML 到 contenteditable 游標位置（會 sanitize）
function insertHtmlAtCursor(editorEl, html) {
  editorEl.focus();
  const sel = window.getSelection();
  let range;
  if (sel.rangeCount === 0 || !editorEl.contains(sel.getRangeAt(0).commonAncestorContainer)) {
    range = document.createRange();
    range.selectNodeContents(editorEl);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
  } else {
    range = sel.getRangeAt(0);
  }
  range.deleteContents();
  const tmp = document.createElement('div');
  tmp.innerHTML = sanitizeColorHtml(html);
  const nodes = [...tmp.childNodes];
  let lastNode = null;
  nodes.forEach(node => {
    range.insertNode(node);
    range.setStartAfter(node);
    range.collapse(true);
    lastNode = node;
  });
  sel.removeAllRanges();
  sel.addRange(range);
  editorEl.dispatchEvent(new Event('input', { bubbles: true }));
}
// 共用：插入純文字到 contenteditable 游標位置（\n 自動轉 <br>）
function insertTextAtCursor(editorEl, text) {
  editorEl.focus();
  const sel = window.getSelection();
  let range;
  if (sel.rangeCount === 0 || !editorEl.contains(sel.getRangeAt(0).commonAncestorContainer)) {
    range = document.createRange();
    range.selectNodeContents(editorEl);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
  } else {
    range = sel.getRangeAt(0);
  }
  range.deleteContents();
  const parts = String(text).split('\n');
  parts.forEach((part, i) => {
    if (i > 0) {
      const br = document.createElement('br');
      range.insertNode(br);
      range.setStartAfter(br);
      range.collapse(true);
    }
    if (part) {
      const tn = document.createTextNode(part);
      range.insertNode(tn);
      range.setStartAfter(tn);
      range.collapse(true);
    }
  });
  sel.removeAllRanges();
  sel.addRange(range);
  editorEl.dispatchEvent(new Event('input', { bubbles: true }));
}

function ensurePetShape(arr) {
  if (!Array.isArray(arr)) return [];
  return arr.map(p => {
    if (!p || typeof p !== 'object') return p;
    const incomingRates = p.studioRates || {};
    const incomingCfg = (p.parentReportConfig && typeof p.parentReportConfig === 'object') ? p.parentReportConfig : {};
    const incomingSections = (incomingCfg.sections && typeof incomingCfg.sections === 'object') ? incomingCfg.sections : {};

      studioName: typeof p.studioName === 'string' ? p.studioName : '',

function ensureSessionShape(arr) {

      status: ['booked', 'done', 'closed'].includes(s.status) ? s.status : 'done',
      sourceBookingId: s.sourceBookingId || null,
      sourceIndex: (typeof s.sourceIndex === 'number') ? s.sourceIndex : null,

function ensureItemShape(arr) {
  if (!Array.isArray(arr)) return [];
  return arr.map(it => {
    if (typeof it === 'string') {
      // v1
      return { name: it, methods: [] };

    if (Array.isArray(it.methods)) {
      // v3+ → 升級為 v4（加 table 欄位 + steps 統一為 HTML）
      return {
        name: it.name || '',
        methods: it.methods.map(m => ({
          name: (m && m.name) || '',
          steps: (m && m.steps != null) ? ensureColorHtml(m.steps) : '',
          table: (m && m.table) ? normalizeTable(m.table) : null,
        })),
      };
    }
    // v2: had {name, steps}
    if (it.steps && it.steps.trim()) {
      return { name: it.name || '', methods: [{ name: '基本方法', steps: ensureColorHtml(it.steps), table: null }] };
    }
    return { name: it.name || '', methods: [] };
  });
}

function load(key, fallback) {

function _writeRaw(key, value) {

function buildReportUrl(settings, gistId) {

  const repo = (settings.githubRepo || '').trim();
  let base;
  if (user && repo && repo.toLowerCase() === `${user.toLowerCase()}.github.io`) {

    base = `https://${user}.github.io`;

  return `${base}/report.html#gist=${gistId}`;
}

async function gistApi(method, path, body) {
  const s = load(KEYS.settings, {});
  if (!s.githubPat) throw new Error('未設定 PAT');
  const r = await fetch(`https://api.github.com${path}`, {
    method,
    headers: {
      'Authorization': `Bearer ${s.githubPat}`,
      'Accept': 'application/vnd.github+json',
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) {
    const txt = await r.text().catch(() => '');
    throw new Error(`GitHub ${r.status}: ${txt.slice(0, 120)}`);
  }
  return r.json();
}

async function findOrCreateSyncGist() {
  const s = load(KEYS.settings, {});
  if (s.syncGistId) return s.syncGistId;
  // 用 description 找既有 gist（其他裝置已建立）
  const list = await gistApi('GET', '/gists?per_page=100');
  const found = list.find(g => (g.description || '').startsWith(SYNC.GIST_DESCRIPTION));
  if (found) {
    updateSyncSettings({ syncGistId: found.id });
    return found.id;
  }
  // 都沒有 → 建新的
  const gist = await gistApi('POST', '/gists', {
    description: SYNC.GIST_DESCRIPTION,
    public: false,
    files: { 'data.json': { content: '{}' } },
  });
  updateSyncSettings({ syncGistId: gist.id });
  return gist.id;
}

function buildSyncPayload() {
  return {
    schemaVersion: 7,
    lastModified: load(KEYS.lastModified, ''),
    pets: load(KEYS.pets, []),
    sessions: load(KEYS.sessions, []),
    itemsCat: load(KEYS.itemsCat, []),
    itemsDog: load(KEYS.itemsDog, []),
    bookings: load(KEYS.bookings, []),
    bookingTemplate: load(KEYS.bookingTemplate, {}),
    payments: load(KEYS.payments, []),
    studioPayments: load(KEYS.studioPayments, []),
    materials: load(KEYS.materials, []),
  };
}

function applySyncPayload(remote) {
  if (!remote || typeof remote !== 'object') return false;
  // 用 _writeRaw 避免遞迴 push
  if (Array.isArray(remote.pets)) _writeRaw(KEYS.pets, ensurePetShape(remote.pets));
  if (Array.isArray(remote.sessions)) _writeRaw(KEYS.sessions, ensureSessionShape(remote.sessions));
  if (Array.isArray(remote.itemsCat)) _writeRaw(KEYS.itemsCat, remote.itemsCat);
  if (Array.isArray(remote.itemsDog)) _writeRaw(KEYS.itemsDog, remote.itemsDog);
  if (Array.isArray(remote.bookings)) _writeRaw(KEYS.bookings, remote.bookings);
  if (Array.isArray(remote.payments)) _writeRaw(KEYS.payments, ensurePaymentShape(remote.payments));
  if (Array.isArray(remote.studioPayments)) _writeRaw(KEYS.studioPayments, ensureStudioPaymentShape(remote.studioPayments));
  if (Array.isArray(remote.materials)) _writeRaw(KEYS.materials, ensureMaterialShape(remote.materials));
  if (remote.bookingTemplate && typeof remote.bookingTemplate === 'object') {
    _writeRaw(KEYS.bookingTemplate, remote.bookingTemplate);
  }
  if (remote.lastModified) _writeRaw(KEYS.lastModified, remote.lastModified);
  return true;
}

async function pushToCloud() {
  if (!syncEnabled()) return;
  if (SYNC.pushing) return;
  SYNC.pushing = true;
  setSyncStatus('syncing');
  try {
    const gistId = await findOrCreateSyncGist();
    // 推之前把 lastModified 蓋成現在，確保雲端有時間戳給其他裝置比較
    _writeRaw(KEYS.lastModified, new Date().toISOString());
    const payload = buildSyncPayload();
    await gistApi('PATCH', `/gists/${gistId}`, {
      files: { 'data.json': { content: JSON.stringify(payload, null, 2) } },
    });
    updateSyncSettings({ syncLastTime: new Date().toISOString() });
    setSyncStatus('ok');
  } catch (e) {
    setSyncStatus('error', e.message);
    console.warn('Sync push failed:', e);
  } finally {
    SYNC.pushing = false;
  }
}

function schedulePush() {
  if (!syncEnabled()) return;
  setSyncStatus('pending');
  clearTimeout(SYNC.pushTimer);
  SYNC.pushTimer = setTimeout(pushToCloud, 3000);
}

async function pullFromCloud(opts = {}) {
  if (!syncEnabled()) return;
  if (SYNC.pulling) return;
  SYNC.pulling = true;
  setSyncStatus('syncing');
  try {
    const gistId = await findOrCreateSyncGist();
    const gist = await gistApi('GET', `/gists/${gistId}`);
    const file = gist.files && gist.files['data.json'];
    if (!file || !file.content) {
      // 雲端是空的 → 推本機上去
      SYNC.pulling = false;
      await pushToCloud();
      return;
    }
    let content = file.content;
    if (file.truncated && file.raw_url) {
      const r = await fetch(file.raw_url);
      content = await r.text();
    }
    let remote;
    try { remote = JSON.parse(content || '{}'); }
    catch { throw new Error('雲端資料解析失敗'); }

    const localTs = load(KEYS.lastModified, '');
    const remoteTs = remote.lastModified || '';

    // 防呆：本機是空的（pets/sessions 都沒資料）但雲端有，無條件拉取
    // 避免「全新裝置首次啟用」誤推空資料蓋掉雲端
    const localPets = load(KEYS.pets, []);
    const localSess = load(KEYS.sessions, []);
    const localEmpty = (!localPets || localPets.length === 0) && (!localSess || localSess.length === 0);
    const remoteHasData = (Array.isArray(remote.pets) && remote.pets.length > 0)
                       || (Array.isArray(remote.sessions) && remote.sessions.length > 0);

    if (opts.forcePull || (remoteTs && remoteTs > localTs) || (localEmpty && remoteHasData)) {
      applySyncPayload(remote);
      updateSyncSettings({ syncLastTime: new Date().toISOString() });
      setSyncStatus('ok');
      // 重新 render 以反映新資料
      if (typeof render === 'function') render();
    } else if (opts.forcePush || localTs > remoteTs) {
      SYNC.pulling = false;
      await pushToCloud();
      return;
    } else {
      updateSyncSettings({ syncLastTime: new Date().toISOString() });
      setSyncStatus('ok');
    }
  } catch (e) {
    setSyncStatus('error', e.message);
    console.warn('Sync pull failed:', e);
  } finally {
    SYNC.pulling = false;
  }
}

/* ============== UTIL ============== */
function fmtDate(s) {
  if (!s) return '';
  const [y,m,d] = s.split('-');
  return `${y}/${m}/${d}`;
}
function todayStr() {
  // 用本地時區，避免 toISOString 在凌晨時段（GMT+8 凌晨 ≈ UTC 前一天下午）少算一天
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
// 清理 URL 的 tracking 參數（YouTube ?si= / Google ?usp= / utm_* / fbclid / gclid 等）
// 連結仍可點，只是更乾淨、節省儲存空間、便於閱讀
function cleanUrl(url) {
  if (!url || typeof url !== 'string') return url;
  const trimmed = url.trim();
  if (!trimmed) return trimmed;
  try {
    const u = new URL(trimmed);
    const removeKeys = [
      'si', 'feature', 'pp',              // YouTube
      'usp', 'authuser', 'sourceapp',     // Google Drive / Docs
      'fbclid', 'gclid', 'ref', 'ref_',   // 通用 tracking
      'igshid', 'mc_eid', 'mc_cid',       // Instagram / Mailchimp
    ];
    removeKeys.forEach(k => u.searchParams.delete(k));
    // utm_*
    const toDel = [];
    u.searchParams.forEach((_, k) => { if (k.toLowerCase().startsWith('utm_')) toDel.push(k); });
    toDel.forEach(k => u.searchParams.delete(k));
    let result = u.toString();
    return result.replace(/\?$/, '');  // 清掉空的 ?
  } catch (e) {
    return trimmed;  // 不是合法 URL，原樣回（讓 user 自行修正）
  }
}

function speciesLabel(s) { return s === 'cat' ? '貓' : '狗'; }
function speciesEmoji(s) { return s === 'cat' ? '🐱' : '🐶'; }
function genderLabel(g) { return g === 'male' ? '公' : g === 'female' ? '母' : ''; }
function neuteredLabel(n) { return n === 'yes' ? '已絕育' : n === 'no' ? '未絕育' : ''; }
function petTagline(p) {
  // 一行短描述：品種 · ♂ · 已絕育 · 4 個月齡
  return [
    p.breed || speciesLabel(p.species),
    genderLabel(p.gender),
    neuteredLabel(p.neutered),
    p.birth,
  ].filter(Boolean).join(' · ');
}

function getPet(id) { return load(KEYS.pets, []).find(p => p.id === id); }
function getSession(id) { return load(KEYS.sessions, []).find(s => s.id === id); }
function getPetSessions(petId) {
  return load(KEYS.sessions, [])
    .filter(s => s.petId === petId)
    .sort((a,b) => b.date.localeCompare(a.date));
}

/**
 * 帳齡天數：該寵物最早 status='booked' 且 date < today 的 session 距今天數。
 * 沒有逾期 booked → 回傳 0。
 */
function getPetAgingDays(petId) {
  const today = todayStr();
  const overdue = load(KEYS.sessions, [])
    .filter(s => s.petId === petId && s.status === 'booked' && s.date && s.date < today)
    .sort((a, b) => a.date.localeCompare(b.date));
  if (overdue.length === 0) return 0;
  const ms = new Date(today) - new Date(overdue[0].date);
  return Math.floor(ms / 86400000);
}

// 排序鍵：最近的 session 日期，沒 session 用 createdAt 當 fallback
function getPetSortKey(pet) {
  const sessions = getPetSessions(pet.id);
  if (sessions.length) return sessions[0].date;
  return pet.createdAt ? pet.createdAt.slice(0, 10) : '';
}

const PET_SORT_OPTIONS = [
  { key: 'upcoming_asc',  label: '即將上課：近到遠' },
  { key: 'activity_desc', label: '最近活動：新到舊' },
  { key: 'balance_desc',  label: '應收餘額大→小' },
  { key: 'name_asc',      label: '寵物名 A→Z' },
];
function getPetSortPref() {
  const s = load(KEYS.settings, {});
  return s.petSort || 'upcoming_asc';
}
function setPetSortPref(key) {
  const s = load(KEYS.settings, {});
  s.petSort = key;
  save(KEYS.settings, s);
}
/** 該寵物「下一次未來課程」的日期（包括今天）。沒有未來課時回傳 null。 */
function getPetUpcomingDate(petId) {
  const today = todayStr();
  const upcoming = load(KEYS.sessions, [])
    .filter(s => s.petId === petId && s.status === 'booked' && s.date && s.date >= today)
    .map(s => s.date)
    .sort();
  return upcoming.length ? upcoming[0] : null;
}
/** 該寵物所有 bookings 加總的「應收餘額」（含負餘額——已超收會抵消） */
function getPetBalance(petId) {
  const bookings = load(KEYS.bookings, []).filter(b => b.petId === petId);
  let sum = 0;
  for (const b of bookings) {
    const summary = bookingPaymentSummary(b);
    sum += summary.balance;
  }
  return sum;
}
/** 套用排序到寵物陣列（in-place）。回傳排序後陣列。 */
function applyPetSort(pets, key) {
  if (key === 'name_asc') {
    return pets.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'zh-Hant'));
  }
  if (key === 'balance_desc') {
    const cache = new Map();
    const bal = p => {
      if (!cache.has(p.id)) cache.set(p.id, getPetBalance(p.id));
      return cache.get(p.id);
    };
    return pets.sort((a, b) => {
      const ba = bal(a), bb = bal(b);
      if (bb !== ba) return bb - ba;  // 餘額大的優先
      return (a.name || '').localeCompare(b.name || '', 'zh-Hant');
    });
  }
  if (key === 'upcoming_asc') {
    const cache = new Map();
    const upc = p => {
      if (!cache.has(p.id)) cache.set(p.id, getPetUpcomingDate(p.id));
      return cache.get(p.id);
    };
    return pets.sort((a, b) => {
      const ua = upc(a), ub = upc(b);
      // 有未來課的優先（近到遠），沒有的排最後（fallback 最近活動新到舊）
      if (ua && ub) return ua.localeCompare(ub);
      if (ua && !ub) return -1;
      if (!ua && ub) return 1;
      return getPetSortKey(b).localeCompare(getPetSortKey(a));
    });
  }
  // 預設：activity_desc（最近活動：新到舊，含未來預約）—保留原本邏輯
  return pets.sort((a, b) => getPetSortKey(b).localeCompare(getPetSortKey(a)));
}

function petMatchesQuery(pet, q) {
  if (!q) return true;
  const lc = q.toLowerCase();
  return (pet.name||'').toLowerCase().includes(lc)
      || (pet.breed||'').toLowerCase().includes(lc)
      || (pet.ownerName||'').toLowerCase().includes(lc);
}

/* ============== 明日課程提醒區塊（首頁用） ============== */
function getTomorrowDateStr() {
  const t = new Date();
  t.setDate(t.getDate() + 1);
  const y = t.getFullYear();
  const m = String(t.getMonth() + 1).padStart(2, '0');
  const d = String(t.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function buildTomorrowReminderHtml() {
  const tomorrow = getTomorrowDateStr();
  const sessions = load(KEYS.sessions, [])
    .filter(s => s.status === 'booked' && s.date === tomorrow)
    .sort((a, b) => {
      const ta = getSessionTimeRange(a).start || '99:99';
      const tb = getSessionTimeRange(b).start || '99:99';
      return ta.localeCompare(tb);
    });
  if (sessions.length === 0) return '';

  const pets = load(KEYS.pets, []);
  const rows = sessions.map(s => {
    const pet = pets.find(p => p.id === s.petId) || {};
    const { start, end } = getSessionTimeRange(s);
    const timeLabel = (start && end) ? `${start}-${end}` : (start || '時間待確認');
    const seq = parseInt(s.sessionSeq, 10);
    const seqStr = seq ? `第 ${seq} 堂` : '';
    const courseLabel = courseTypeLabel(s) || '';
    const meta = [timeLabel, courseLabel, seqStr].filter(Boolean).join(' · ');
    return `
      <div class="tomorrow-row" data-session-id="${s.id}">
        <div class="tomorrow-info">
          <div class="tomorrow-name">${speciesEmoji(pet.species)} ${escapeHtml(pet.name || '—')}</div>
          <div class="tomorrow-meta">${escapeHtml(meta)}</div>
        </div>
        <div class="tomorrow-actions">
          <button class="btn ghost btn-sm" data-act="copy-line" data-sid="${s.id}" title="複製 LINE 提醒訊息">📋 LINE</button>
          <button class="btn ghost btn-sm" data-act="open-gcal" data-sid="${s.id}" title="加入 Google 行事曆">📅 行事曆</button>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="tomorrow-reminder">
      <div class="tomorrow-header">
        <span class="tomorrow-icon">⏰</span>
        <span class="tomorrow-title">明日 ${sessions.length} 堂課</span>
        <span class="tomorrow-date">${fmtDate(tomorrow)}</span>
      </div>
      <div class="tomorrow-list">${rows}</div>
    </div>`;
}

function bindTomorrowReminderHandlers(root) {
  const sessions = load(KEYS.sessions, []);
  const pets = load(KEYS.pets, []);
  root.querySelectorAll('.tomorrow-row [data-act]').forEach(btn => {
    const sid = btn.dataset.sid;
    const s = sessions.find(x => x.id === sid);
    if (!s) return;
    const pet = pets.find(p => p.id === s.petId) || {};
    if (btn.dataset.act === 'copy-line') {
      btn.onclick = (e) => {
        e.stopPropagation();
        const msg = fillLineTemplate(s, pet);
        copyToClipboard(msg).then(ok => {
          showNotice(ok ? '✓ 已複製 LINE 訊息，可貼到聊天室' : '複製失敗，請手動複製');
        });
      };
    } else if (btn.dataset.act === 'open-gcal') {
      btn.onclick = (e) => {
        e.stopPropagation();
        const url = buildGoogleCalUrl(gcalOptsFromSession(s, pet));
        if (!url) { showNotice('日期或時間不完整，無法產生行事曆'); return; }

  const allPets = load(KEYS.pets, []);

  if (allPets.length === 0) {
    main.innerHTML = `
      <div class="empty">
        <h3>還沒有寵物資料</h3>
        <p>點下方按鈕新增第一隻</p>
        <button class="tab-action" id="addPetBtn" type="button" style="margin-top:16px; padding:8px 18px; font-size:14px;">+ 新增寵物</button>
      </div>
    `;
    document.getElementById('addPetBtn').onclick = () => openAddPetChooser();
    return;
  }

  // 計算各物種數量
  const dogCount = allPets.filter(p => p.species === 'dog').length;
  const catCount = allPets.filter(p => p.species === 'cat').length;
  const showSearch = allPets.length > 0;

  // Tabs + 新增按鈕
  const tabs = `
    <div class="tabs">
      <button class="tab ${state.petFilter===''?'active':''}" data-pet-filter="">全部 (${allPets.length})</button>
      <button class="tab ${state.petFilter==='dog'?'active':''}" data-pet-filter="dog">🐶 狗 (${dogCount})</button>
      <button class="tab ${state.petFilter==='cat'?'active':''}" data-pet-filter="cat">🐱 貓 (${catCount})</button>
      <button class="tab-action" id="addPetBtn" type="button">+ 新增寵物</button>
    </div>`;

  // 來源 chips（直接 + 各教室）
  const directCount = allPets.filter(p => p.source !== 'studio').length;
  const studioPets = allPets.filter(p => p.source === 'studio');
  const studioNames = [...new Set(studioPets.map(p => p.studioName).filter(Boolean))].sort();
  const sourceFilter = state.petSourceFilter || '';
  const sourceChipsArr = [
    `<button class="source-chip ${sourceFilter===''?'active':''}" data-source-filter="">全部來源</button>`,
    `<button class="source-chip ${sourceFilter==='direct'?'active':''}" data-source-filter="direct">直接客戶 (${directCount})</button>`,
  ];
  studioNames.forEach(n => {
    const cnt = studioPets.filter(p => p.studioName === n).length;
    const key = 'studio:' + n;
    sourceChipsArr.push(`<button class="source-chip ${sourceFilter===key?'active':''}" data-source-filter="${escapeAttr(key)}">🏫 ${escapeHtml(n)} (${cnt})</button>`);
  });
  const sourceChips = (allPets.length === 0 || (directCount === allPets.length && studioPets.length === 0)) ? '' : `
    <div class="source-chips">${sourceChipsArr.join('')}</div>`;

  // 品種 chips（動態列出有寵物的品種）
  const breedFilter = state.petBreedFilter || '';
  const breedCounts = {};
  allPets.forEach(p => {
    const b = (p.breed || '').trim();
    if (b) breedCounts[b] = (breedCounts[b] || 0) + 1;
  });
  const breedNames = Object.keys(breedCounts).sort((a, b) => breedCounts[b] - breedCounts[a]);  // 多的在前
  const breedChipsArr = [
    `<button class="source-chip ${breedFilter===''?'active':''}" data-breed-filter="">全部品種</button>`,
  ];
  breedNames.forEach(name => {
    breedChipsArr.push(`<button class="source-chip ${breedFilter===name?'active':''}" data-breed-filter="${escapeAttr(name)}">${escapeHtml(name)} (${breedCounts[name]})</button>`);
  });
  const breedChips = breedNames.length === 0 ? '' : `
    <div class="source-chips">${breedChipsArr.join('')}</div>`;

  // Search
  const search = showSearch ? `
    <input type="text" class="search-input" id="petSearch"
           placeholder="🔍 搜尋名字、品種或飼主"
           value="${escapeAttr(state.petQuery)}">` : '';

  // Filter + sort
  let pets = allPets.slice();
  if (state.petFilter) pets = pets.filter(p => p.species === state.petFilter);
  if (sourceFilter === 'direct') pets = pets.filter(p => p.source !== 'studio');
  else if (sourceFilter && sourceFilter.startsWith('studio:')) {
    const targetStudio = sourceFilter.slice(7);
    pets = pets.filter(p => p.source === 'studio' && p.studioName === targetStudio);
  }
  if (breedFilter) pets = pets.filter(p => (p.breed || '').trim() === breedFilter);
  if (state.petQuery.trim()) pets = pets.filter(p => petMatchesQuery(p, state.petQuery.trim()));
  const petSortKey = getPetSortPref();
  applyPetSort(pets, petSortKey);

  // 排序選單（只有 ≥1 隻寵物時才顯示）
  const sortBar = pets.length === 0 ? '' : `
    <div style="display:flex; justify-content:flex-end; align-items:center; gap:6px; margin:6px 4px 10px">
      <label for="petSort" style="font-size:12px; color:var(--text-soft)">排序</label>
      <select id="petSort" style="padding:5px 8px; border:1px solid var(--border); border-radius:6px; background:white; font-size:13px; color:var(--text); font-family:inherit">
        ${PET_SORT_OPTIONS.map(o => `<option value="${o.key}" ${o.key===petSortKey?'selected':''}>${o.label}</option>`).join('')}
      </select>
    </div>`;

  let listHtml;
  if (pets.length === 0) {
    listHtml = `
      <div class="empty">
        <h3>沒有符合條件的寵物</h3>
        <p>試試其他關鍵字或切換物種</p>
      </div>`;
  } else {
    listHtml = pets.map(p => {
      const sessions = getPetSessions(p.id);
      const count = sessions.length;
      const recentLabel = sessions.length
        ? `最近：${fmtDate(sessions[0].date)}`
        : '尚未上課';
      // 購買過的課程類型摘要（按次數降冪）
      const petBookings = getPetBookings(p.id);
      const courseSummary = (() => {
        if (petBookings.length === 0) return '';
        const counts = {};
        petBookings.forEach(b => {
          const label = courseTypeLabel(b);
          counts[label] = (counts[label] || 0) + 1;
        });
        const parts = Object.entries(counts)
          .sort((a, b) => b[1] - a[1])
          .map(([label, n]) => `${escapeHtml(label)} ×${n}`);
        return `<div class="card-meta" style="margin-top:4px; font-size:12px; color:var(--brown-dark)">📋 ${parts.join(' · ')}</div>`;
      })();
      // 帳齡 badge：最久 booked 過期天數
      const aging = getPetAgingDays(p.id);
      const agingHtml = aging === 0 ? '' : (() => {
        const cls = aging >= 60 ? 'aging-bad' : (aging >= 30 ? 'aging-warn' : 'aging-mild');
        return `<div style="margin-top:4px"><span class="aging-badge ${cls}">⏰ 帳齡 ${aging} 天</span></div>`;
      })();
      const studioBadge = p.source === 'studio'
        ? `<span class="studio-badge">🏫 ${escapeHtml(p.studioName || '教室派案')}</span>`
        : '';
      return `
        <div class="card" data-id="${p.id}">
          <div class="card-row">
            <div>
              <div class="card-title">${speciesEmoji(p.species)} ${escapeHtml(p.name)}${studioBadge}</div>
              <div class="card-meta">${escapeHtml(petTagline(p))} · 飼主：${escapeHtml(p.ownerName || '—')}</div>
              <div class="card-meta" style="margin-top:4px; font-size:12px">${recentLabel}</div>
              ${courseSummary}
              ${agingHtml}
            </div>
            <span class="badge">${count} 堂</span>
          </div>
        </div>`;
    }).join('');
  }

  // 明日課程提醒區塊
  const tomorrowHtml = buildTomorrowReminderHtml();

  main.innerHTML = tomorrowHtml + tabs + sourceChips + breedChips + search + sortBar + listHtml;

  // 明日提醒按鈕
  bindTomorrowReminderHandlers(main);

  // Tab handler
  main.querySelectorAll('[data-pet-filter]').forEach(t => {
    t.onclick = () => { state.petFilter = t.dataset.petFilter; renderPets(); };
  });
  // 排序 select
  const sortSelect = document.getElementById('petSort');
  if (sortSelect) sortSelect.onchange = () => {
    setPetSortPref(sortSelect.value);
    renderPets();
  };
  // 來源 chip
  main.querySelectorAll('[data-source-filter]').forEach(t => {
    t.onclick = () => { state.petSourceFilter = t.dataset.sourceFilter; renderPets(); };
  });
  // 品種 chip
  main.querySelectorAll('[data-breed-filter]').forEach(t => {
    t.onclick = () => { state.petBreedFilter = t.dataset.breedFilter; renderPets(); };
  });
  // Search handler
  const sInput = document.getElementById('petSearch');
  if (sInput) {
    sInput.oninput = () => {
      state.petQuery = sInput.value;
      renderPets();
      // 重新 render 後 input 會被取代，把 focus 放回去
      const newInput = document.getElementById('petSearch');
      if (newInput) {
        newInput.focus();
        newInput.setSelectionRange(newInput.value.length, newInput.value.length);
      }
    };
  }
  // Card click
  main.querySelectorAll('.card[data-id]').forEach(el => {
    el.onclick = () => go('sessions', { petId: el.dataset.id });
  });
  const addBtn = document.getElementById('addPetBtn');
  if (addBtn) addBtn.onclick = () => openAddPetChooser();
}

  const html = `

      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="add_cancel">取消</button>
      </div>
    </div>
  `;
  const overlay = openModal(html);
  overlay.querySelector('#add_cancel').onclick = () => overlay.remove();
  overlay.querySelector('#add_manual').onclick = () => { overlay.remove(); openPetForm(); };

}

      overlay.remove();
      go('pets');
    };
  }
}

/* ============== VIEW: SESSIONS ============== */
// ===== Session 排序 =====
const SESSION_SORT_OPTIONS = [
  { key: 'date_desc',      label: '日期：新到舊' },
  { key: 'date_asc',       label: '日期：舊到新' },
  { key: 'upcoming_first', label: '即將上課優先' },
  { key: 'by_type',        label: '課程類型分組' },
];
function getSessionSortPref() {
  const s = load(KEYS.settings, {});
  return s.sessionSort || 'date_desc';
}
function setSessionSortPref(key) {
  const s = load(KEYS.settings, {});
  s.sessionSort = key;
  save(KEYS.settings, s);
}
function applySessionSort(sessions, key) {
  const today = todayStr();
  const arr = sessions.slice();
  switch (key) {
    case 'date_asc':
      return arr.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    case 'upcoming_first':
      // 注意：'upcoming_first' 在 renderSessions 走 3 段 partition path，不會進這裡。
      // 保留這 case 以防其他 caller 直接 call applySessionSort。
      return arr.sort((a, b) => {
        const aFut = (a.date || '') >= today;
        const bFut = (b.date || '') >= today;
        if (aFut && !bFut) return -1;
        if (!aFut && bFut) return 1;
        if (aFut && bFut) return (a.date || '').localeCompare(b.date || '');
        return (b.date || '').localeCompare(a.date || '');
      });
    case 'by_type':
      return arr.sort((a, b) => {
        const labA = courseTypeLabel(a) || '未分類';
        const labB = courseTypeLabel(b) || '未分類';
        if (labA !== labB) return labA.localeCompare(labB);
        return (b.date || '').localeCompare(a.date || '');
      });
    case 'date_desc':
    default:
      return arr.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  }
}

/**
 * 'upcoming_first' 模式專用：把 sessions 切成 4 段。
 * - upcoming：booked + (date >= today 或 date 空白「待安排」)
 * - pending： booked + date < today（待結案，呆帳訊號）
 * - done：    status === 'done'
 * - closed：  status === 'closed'（強制結案，已收錢無法兌現的呆帳）
 */
function partitionSessions(sessions) {
  const today = todayStr();
  const upcoming = [], pending = [], done = [], closed = [];
  for (const s of sessions) {
    if (s.status === 'closed') closed.push(s);
    else if (s.status === 'done') done.push(s);
    else if (!s.date || s.date >= today) upcoming.push(s);
    else pending.push(s);
  }
  // upcoming：日期近 → 遠；待安排（date 空）排該段最後
  upcoming.sort((a, b) => {
    if (!a.date && b.date) return 1;
    if (a.date && !b.date) return -1;
    if (!a.date && !b.date) return 0;
    return a.date.localeCompare(b.date);
  });
  // pending：最久過期 → 最近過期（最該追的呆帳浮上來）
  pending.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  // done：日期新 → 舊
  done.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  // closed：結案時間新 → 舊（fallback session date）
  closed.sort((a, b) => {
    const aT = a.closedAt || a.date || '';
    const bT = b.closedAt || b.date || '';
    return bT.localeCompare(aT);
  });
  return { upcoming, pending, done, closed };
}

/**
 * 給 session 算出顯示用的狀態 badge HTML。5 種：
 * - 已結案（status='closed'，呆帳）
 * - 已完成（status='done'）
 * - 待安排（booked + date 空）
 * - 待結案（booked + date 已過）
 * - 已預約（booked + date 未來）
 */
function statusBadgeHtml(s) {
  if (!s) return '';
  if (s.status === 'closed') return '<span class="status-badge closed">⊘ 已結案</span>';
  if (s.status === 'done') return '<span class="status-badge done">已完成</span>';
  if (!s.date) return '<span class="status-badge unscheduled">待安排</span>';
  const today = todayStr();
  if (s.date < today) return '<span class="status-badge pending">⚠ 待結案</span>';
  return '<span class="status-badge booked">已預約</span>';
}

/**
 * 翻轉 session.status。booked ↔ done 直接 toggle；
 * closed 要 confirm 解除（清掉 closeReason / closedAt）回 booked。
 */
function toggleSessionStatus(sessionId) {
  const all = load(KEYS.sessions, []);
  const idx = all.findIndex(s => s.id === sessionId);
  if (idx < 0) return null;
  const cur = all[idx].status;
  if (cur === 'closed') {
    if (!confirm('解除「已結案」狀態？這堂會回到「已預約」（清除結案原因 / 時間）')) return null;
    all[idx].status = 'booked';
    all[idx].closeReason = '';
    all[idx].closedAt = null;
  } else {
    all[idx].status = cur === 'done' ? 'booked' : 'done';
  }
  save(KEYS.sessions, all);
  return all[idx];
}

/**
 * 強制結案：把 booked 標成 closed + 記錄原因 / 時間（呆帳追蹤用）。
 */
function closeSession(sessionId, reason) {
  const all = load(KEYS.sessions, []);
  const idx = all.findIndex(s => s.id === sessionId);
  if (idx < 0) return null;
  all[idx].status = 'closed';
  all[idx].closeReason = (reason || '').trim();
  all[idx].closedAt = new Date().toISOString();
  save(KEYS.sessions, all);
  return all[idx];
}

function renderSessions() {
  const main = document.getElementById('main');
  const pet = getPet(state.petId);
  if (!pet) { go('pets'); return; }
  const sortKey = getSessionSortPref();
  const sessions = applySessionSort(getPetSessions(pet.id), sortKey);
  const _settings = load(KEYS.settings, {});
  const petInfoCollapsed = _settings.petInfoCollapsed === true;
  // 永遠可見的 action bar（編輯 + 課程預約）— 從 collapse body 拿出來
  const petActionBar = `
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin:4px 4px 8px">
      <button class="small-btn" id="editPet">編輯寵物資料</button>
      <button class="small-btn" id="bookingBtn">📋 課程預約</button>
    </div>
  `;
  // 把 notes 內 「【Q】A」 拆成 Q&A pairs，按 keyword 分到「狗狗基本」/「家長基本」
  const categorized = (() => {
    const dog = [], owner = [];
    if (!pet.notes) return { dog, owner };
    const lines = pet.notes.split(/\n+/).map(l => l.trim()).filter(Boolean);
    // 家長相關 keyword：基本資料 + Google Form metadata + 飼主承諾類問題
    const ownerKeyword = /(稱呼|稱謂|聯繫|聯絡|line|email|電子郵件|電子信箱|信箱|家庭|家長|姓名|地址|電話|手機|住址|職業|住所|社群|時間戳記|使用者名稱|使用者|練習成效|課後影片|關於練習|關於課後)/i;
    for (const line of lines) {
      const m = line.match(/^【([^】]+)】(.*)$/);
      if (m) {
        const q = m[1], a = (m[2] || '').trim();
        if (ownerKeyword.test(q)) owner.push({ q, a });
        else dog.push({ q, a });
      } else {
        dog.push({ q: '', a: line });
      }
    }
    // Dedup：notes 內的 Q 與 pet 結構化欄位 value 相同時，移除 notes 那筆（避免畫面重複）
    // 規則：Q 字面含特定關鍵字 + value 等於對應的 pet 欄位 → 隱藏
    const dedupRules = [
      { kwRegex: /地址|住址|住所/, val: (pet.ownerAddress || '').trim() },
      { kwRegex: /姓名|稱呼|稱謂|飼主名/, val: (pet.ownerName || '').trim() },
      { kwRegex: /電話|手機|聯繫|聯絡(?!.*影片)/i, val: (pet.ownerContact || '').trim() },
    ];
    // 額外：「使用者名稱」value 與「電子信箱」相同（Google 帳號 = 聯絡 email）→ 隱藏使用者名稱
    const emailPair = owner.find(p => /電子信箱|電子郵件/i.test(p.q));
    const dedupOwner = [];
    for (const o of owner) {
      const av = (o.a || '').trim();
      // 1. 跟 pet 結構化欄位重複
      const matchPet = dedupRules.some(r => r.val && r.kwRegex.test(o.q) && av === r.val);
      if (matchPet) continue;
      // 2. 「使用者名稱」value = 「電子信箱」value
      if (emailPair && o !== emailPair && /使用者名稱?$/.test(o.q) && av && av === emailPair.a) continue;
      dedupOwner.push(o);
    }
    return { dog, owner: dedupOwner };
  })();
  const renderQA = arr => arr.map(p => p.q
    ? `<div class="info-row"><b>${escapeHtml(p.q)}</b>：${escapeHtml(p.a)}</div>`
    : `<div class="info-row">${escapeHtml(p.a)}</div>`).join('');

  const meta = `

        const balText = balance > 0 ? `<span style="color:var(--work); font-weight:600">應收餘 ${fmtMoney(balance)}</span>`

        return `

              </div>

  // 排序選單（只有 ≥1 堂課時才顯示）

  function sessionCardHtml(s) {
    const recCount = (s.records || []).filter(r => r.selected).length;
    const isToday = s.date === todayStr();
    const isDone = s.status === 'done';
    const isClosed = s.status === 'closed';
    const ctLab = courseTypeLabel(s);
    const seqLab = sessionSeqLabel(s);
    const courseLine = (ctLab || seqLab)
      ? `<div class="card-meta" style="color:var(--brown-dark); font-weight:500">📋 ${escapeHtml(ctLab)}${ctLab && seqLab ? ' · ' : ''}${escapeHtml(seqLab)}</div>`
      : '';
    // 標題：有 date 顯示日期；date 空（已被 status badge 「待安排」表達，標題只顯示堂數）
    let titleHtml;
    if (s.date) {
      titleHtml = `${fmtDate(s.date)} ${isToday && !isDone && !isClosed ? '<span class="badge" style="background:#5a7d5f; color:#ffffff; border-color:#5a7d5f">今天</span>' : ''}`;
    } else {

    const toggleBtn = isClosed

      : `<button class="status-toggle ${isDone ? 'done' : 'booked'}" data-toggle="${s.id}" title="${isDone ? '取消完成' : '標記已完成'}">${isDone ? '✓' : ''}</button>`;

    const metaTail = recCount > 0
      ? ' · 已記錄 ' + recCount + ' 項'
      : (isClosed ? (s.closeReason ? ' · ' + escapeHtml(s.closeReason) : ' · 已結案') :
         isDone ? ' · 已完成' :

    return `

        <div class="card-row">

            ${courseLine}
            <div class="card-meta">
              ${s.location ? '📍 ' + escapeHtml(s.location) + ' · ' : ''}
              ${s.duration ? s.duration + ' 分鐘' : ''}
              ${metaTail}
            </div>
          </div>
          <button class="card-menu-btn" data-menu="${s.id}" title="更多動作">⋯</button>
        </div>
      </div>`;
  }

  let body;
  if (sessions.length === 0) {
    body = `<div class="empty"><h3>還沒有課程</h3><p>點右下角 ＋ 新增第一堂</p></div>`;
  } else if (sortKey === 'upcoming_first') {
    // 4 段顯示：即將上課 / 待結案 / 已完成 / 已結案（呆帳）
    const parts = partitionSessions(sessions);
    const sectionHtml = (label, list, cls) => list.length === 0 ? '' : `

         + sectionHtml('⚠ 待結案', parts.pending, 'pending')
         + sectionHtml('✓ 已完成', parts.done, '')

    btn.onclick = (e) => { e.stopPropagation(); openPaymentForm(btn.dataset.addPayRefund, null, 'refund'); };
  });
  main.querySelectorAll('.card[data-id]').forEach(el => {
    el.onclick = (e) => {
      // 點到 ⋯ 按鈕、toggle 按鈕時不要進入該堂課
      if (e.target.closest('.card-menu-btn')) return;
      if (e.target.closest('.status-toggle')) return;
      go('session', { sessionId: el.dataset.id });
    };
  });
  // ⋯ 按鈕：開選單（編輯 / 刪除）
  main.querySelectorAll('.card-menu-btn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const sid = btn.dataset.menu;
      const sess = getSession(sid);
      if (!sess) return;
      openSessionMenu(btn, sess);
    };
  });
  // 狀態 toggle 圓圈：booked ↔ done
  main.querySelectorAll('.status-toggle[data-toggle]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      toggleSessionStatus(btn.dataset.toggle);
      renderSessions();
    };
  });
  document.getElementById('fab').onclick = () => openSessionForm();
}

function openSessionMenu(anchorBtn, sess) {
  // 關掉舊的（如果有）
  document.querySelectorAll('.card-menu').forEach(m => m.remove());
  const rect = anchorBtn.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.className = 'card-menu';
  menu.style.position = 'fixed';
  menu.style.top = (rect.bottom + 4) + 'px';
  menu.style.right = (window.innerWidth - rect.right) + 'px';
  menu.innerHTML = `
    <button data-act="edit">✏️ 編輯課程資訊</button>
    <button data-act="delete" class="danger">🗑 刪除這堂課</button>
  `;
  document.body.appendChild(menu);
  // 點外面關閉
  setTimeout(() => {
    const close = (e) => {
      if (!menu.contains(e.target)) {
        menu.remove();
        document.removeEventListener('click', close);
      }
    };
    document.addEventListener('click', close);
  }, 0);
  menu.querySelector('[data-act="edit"]').onclick = () => {
    menu.remove();
    openSessionForm(sess);
  };
  menu.querySelector('[data-act="delete"]').onclick = () => {
    menu.remove();
    if (!confirm(`刪除 ${fmtDate(sess.date)} 這堂課的所有記錄？\n\n寵物資料與其他堂課不受影響。`)) return;
    save(KEYS.sessions, load(KEYS.sessions, []).filter(s => s.id !== sess.id));
    showNotice('已刪除課程');
    render();
  };
}
