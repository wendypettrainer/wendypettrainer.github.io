<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Wendy 溫蒂．貓與狗訓練日常</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8b6f47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wendy 訓練">
<style>
  :root {
    --bg: #f0e6d6;
    --bg-soft: #f7f0e3;
    --brown: #8b6f47;
    --brown-dark: #6b5435;
    --brown-light: #c9b693;
    --text: #3d2f1f;
    --text-soft: #6b5435;
    --good: #6b9e6e;
    --ok: #c9a85a;
    --work: #c97a4f;
    --shadow: 0 2px 8px rgba(139, 111, 71, 0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
                 "Microsoft JhengHei", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
  }
  .app { max-width: 720px; margin: 0 auto; padding-bottom: 80px; }
  header.top {
    background: var(--brown);
    color: var(--bg);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: var(--shadow);
  }
  header.top h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.5px;
    flex: 1;
    text-align: center;
  }

  .breadcrumb {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 2px;
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;
    scrollbar-width: none;
    min-width: 0;
  }
  .breadcrumb::-webkit-scrollbar { display: none; }
  .bc-link {
    color: inherit;
    text-decoration: none;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .bc-link:hover { background: rgba(255,255,255,0.18); }
  .bc-current {
    color: white;
    font-weight: 600;
    padding: 4px 6px;
    flex-shrink: 0;
  }
  .bc-sep {
    color: rgba(255,255,255,0.4);
    flex-shrink: 0;
    padding: 0 1px;
  }
  .icon-btn {
    background: transparent;
    border: none;
    color: var(--bg);
    font-size: 18px;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 6px;
    min-width: 36px;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.15); }
  .icon-btn:disabled { opacity: 0.3; cursor: default; }

  .sync-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #999;
    flex-shrink: 0;
    margin: 0 4px;
    cursor: help;
    transition: background 0.3s;
  }
  .sync-dot.ok { background: #6b9e6e; }
  .sync-dot.syncing { background: #c9a85a; animation: pulse 1.2s ease-in-out infinite; }
  .sync-dot.pending { background: #c9a85a; }
  .sync-dot.error { background: #c97a4f; }
  .sync-dot.disabled { background: #999; opacity: 0.5; }
  @keyframes pulse { 50% { opacity: 0.4; } }

  main { padding: 16px; }

  .crumb {
    font-size: 13px;
    color: var(--text-soft);
    margin-bottom: 12px;
  }

  .card {
    background: var(--bg-soft);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.05s;
  }
  .card:hover { transform: translateY(-1px); }
  .card-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .card-title { font-weight: 600; font-size: 16px; color: var(--brown-dark); }
  .card-meta { font-size: 13px; color: var(--text-soft); margin-top: 4px; }
  .badge {
    background: var(--brown);
    color: var(--bg);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 12px;
  }

  .card-menu-btn {
    background: transparent;
    border: none;
    font-size: 20px;
    color: var(--text-soft);
    padding: 4px 12px;
    border-radius: 6px;
    cursor: pointer;
    line-height: 1;
    flex-shrink: 0;
  }
  .card-menu-btn:hover { background: rgba(139,111,71,0.12); color: var(--brown-dark); }

  .card-menu {
    background: white;
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(61,47,31,0.18);
    padding: 6px;
    z-index: 50;
    min-width: 160px;
  }
  .card-menu button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    color: var(--text);
    font-family: inherit;
  }
  .card-menu button:hover { background: var(--bg-soft); }
  .card-menu button.danger { color: var(--work); }
  .card-menu button.danger:hover { background: rgba(201,122,79,0.1); }

  .btn {
    background: var(--brown);
    color: var(--bg);
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .btn:hover { background: var(--brown-dark); }
  .btn.ghost {
    background: transparent;
    color: var(--brown);
    border: 1px solid var(--brown);
    box-shadow: none;
  }
  .btn.ghost:hover { background: var(--brown); color: var(--bg); }
  .btn.danger { background: var(--work); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .fab {
    position: fixed;
    bottom: 24px;
    right: max(24px, calc(50vw - 360px + 24px));
    background: var(--brown);
    color: var(--bg);
    border: none;
    width: 56px;
    height: 56px;
    border-radius: 28px;
    font-size: 28px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(139,111,71,0.35);
    z-index: 5;
  }
  .fab:hover { background: var(--brown-dark); }

  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-soft);
  }
  .empty h3 { color: var(--brown-dark); margin-bottom: 8px; }

  /* Brand hero (only on main pets view) */
  .brand-hero {
    text-align: center;
    padding: 20px 16px 8px;
    margin: -16px -16px 16px;
    background: var(--bg);
  }
  .brand-hero img {
    max-width: 280px;
    width: 80%;
    height: auto;
  }

  /* Forms */
  label { display: block; font-size: 13px; color: var(--text-soft); margin-bottom: 6px; }
  input[type=text], input[type=date], input[type=number], input[type=password],
  textarea, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--brown-light);
    border-radius: 8px;
    background: white;
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
  }
  input:focus, textarea:focus, select:focus {
    outline: 2px solid var(--brown);
    outline-offset: -1px;
  }
  textarea { resize: vertical; min-height: 80px; }
  .field { margin-bottom: 14px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .radio-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .radio-opt {
    flex: 1;
    min-width: 80px;
    padding: 10px 12px;
    background: white;
    border: 1px solid var(--brown-light);
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text);
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .radio-opt input[type=radio] { accent-color: var(--brown); }
  .radio-opt:has(input:checked) {
    background: var(--bg-soft);
    border-color: var(--brown);
    color: var(--brown-dark);
    font-weight: 500;
  }

  /* Modal */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(61,47,31,0.4);
    display: flex; align-items: flex-end;
    justify-content: center;
    z-index: 20;
  }
  .modal {
    background: var(--bg);
    width: 100%;
    max-width: 720px;
    border-radius: 16px 16px 0 0;
    padding: 20px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 { color: var(--brown-dark); margin-bottom: 14px; font-size: 18px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions .btn { flex: 1; }

  /* Training items */
  .item {
    background: var(--bg-soft);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 8px;
    border: 2px solid transparent;
    transition: border-color 0.1s;
  }
  .item.selected { border-color: var(--brown); }
  .item-head {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .item-name { flex: 1; font-weight: 500; }
  .steps-badge {
    display: inline-block;
    font-size: 11px;
    margin-left: 4px;
    opacity: 0.7;
  }
  .check {
    width: 22px; height: 22px;
    border: 2px solid var(--brown-light);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .item.selected .check {
    background: var(--brown);
    border-color: var(--brown);
    color: var(--bg);
  }
  .ratings {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    padding-left: 32px;
  }
  .rating-btn {
    flex: 1;
    padding: 8px 4px;
    border: 1px solid var(--brown-light);
    border-radius: 6px;
    background: white;
    font-size: 13px;
    cursor: pointer;
    color: var(--text-soft);
  }
  .rating-btn.active.good { background: var(--good); color: white; border-color: var(--good); }
  .rating-btn.active.ok { background: var(--ok); color: white; border-color: var(--ok); }
  .rating-btn.active.work { background: var(--work); color: white; border-color: var(--work); }

  .pet-note-input {
    margin-top: 8px;
    margin-left: 32px;
    width: calc(100% - 32px);
    padding: 6px 10px;
    border: 1px dashed var(--brown-light);
    border-radius: 6px;
    background: white;
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    min-height: 32px;
    resize: vertical;
  }
  .pet-note-input:focus {
    outline: 1px solid var(--brown);
    border-style: solid;
  }

  .methods-section {
    margin-top: 8px;
    margin-left: 32px;
    padding: 8px 10px;
    background: white;
    border-radius: 6px;
    border: 1px solid var(--brown-light);
  }
  .methods-label {
    font-size: 11px;
    color: var(--brown);
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }
  .method-check {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 4px;
    cursor: pointer;
    font-size: 14px;
  }
  .method-check input[type=checkbox] {
    accent-color: var(--brown);
    width: 18px; height: 18px;
    cursor: pointer;
  }

  .notice {
    background: var(--brown-light);
    color: var(--brown-dark);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 12px;
  }
  .autosave-banner {
    background: #d4e7d3;
    color: #3d6b3f;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 14px;
    border-left: 3px solid #6b9e6e;
  }
  .notice.ok { background: #d4e7d3; color: #3d6b3f; }
  .notice.err { background: #f5d4c2; color: #8a3920; }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
    background: var(--bg-soft);
    padding: 4px;
    border-radius: 8px;
  }
  .tab {
    flex: 1;
    padding: 8px;
    background: transparent;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-soft);
  }
  .tab.active { background: var(--brown); color: var(--bg); }

  .search-input {
    width: 100%;
    padding: 10px 16px;
    border: 1px solid var(--brown-light);
    border-radius: 24px;
    background: white;
    font-size: 14px;
    color: var(--text);
    margin-bottom: 12px;
    font-family: inherit;
  }
  .search-input:focus {
    outline: 2px solid var(--brown);
    outline-offset: -1px;
  }

  .item-list-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--bg-soft);
    border-radius: 8px;
    margin-bottom: 6px;
  }
  .item-list-row input {
    border: none;
    background: transparent;
    flex: 1;
    padding: 4px;
  }
  .item-list-row input:focus { outline: 1px solid var(--brown); border-radius: 4px; }
  .item-edit-block {
    background: var(--bg-soft);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .item-edit-top {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-bottom: 6px;
  }
  .item-edit-top input {
    flex: 1;
    padding: 6px 8px;
    border: 1px solid var(--brown-light);
    border-radius: 6px;
    background: white;
    font-size: 14px;
  }
  .item-edit-block textarea {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--brown-light);
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    color: var(--text-soft);
    background: white;
    min-height: 50px;
    resize: vertical;
  }
  .methods-wrap {
    margin-top: 8px;
    margin-left: 12px;
    border-left: 2px solid var(--brown-light);
    padding-left: 12px;
  }
  .method-block {
    background: white;
    border-radius: 6px;
    padding: 8px;
    margin-bottom: 6px;
    border: 1px solid var(--brown-light);
  }
  .method-top {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-bottom: 6px;
  }
  .method-top input {
    flex: 1;
    padding: 5px 8px;
    border: 1px solid var(--brown-light);
    border-radius: 4px;
    font-size: 13px;
  }
  .method-block textarea {
    min-height: 40px;
    font-size: 12px;
  }
  .add-method {
    margin-top: 4px;
  }
  .small-btn {
    background: transparent;
    border: 1px solid var(--brown-light);
    color: var(--brown);
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .small-btn.danger { color: var(--work); border-color: var(--work); }

  .actions-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 16px;
  }
  .actions-row .btn { flex: 1; min-width: 120px; }

  /* iOS safe area */
  @supports (padding: env(safe-area-inset-bottom)) {
    .app { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="icon-btn" id="backBtn" title="返回上一層">‹</button>
    <nav class="breadcrumb" id="breadcrumb"></nav>
    <span class="sync-dot" id="syncDot" title="同步狀態（點開設定查看）"></span>
    <button class="icon-btn" id="settingsBtn" title="設定">⚙</button>
  </header>
  <main id="main"></main>
</div>

<script>
/* ============== LOGO PRELOAD ============== */
let LOGO_DATA = null, LOGO_W = 0, LOGO_H = 0;
(function preloadLogo() {
  const img = new Image();
  img.onload = () => {
    try {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth;
      c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      LOGO_DATA = c.toDataURL('image/png');
      LOGO_W = img.naturalWidth;
      LOGO_H = img.naturalHeight;
    } catch (e) { /* tainted canvas (cross-origin) — PDF will skip logo */ }
  };
  img.src = 'logo.png';
})();

/* ============== STATE & STORAGE ============== */
const KEYS = {
  pets: 'petcare.pets',
  sessions: 'petcare.sessions',
  itemsCat: 'petcare.trainingItems.cat',
  itemsDog: 'petcare.trainingItems.dog',
  settings: 'petcare.settings',
  version: 'petcare.version',
  lastModified: 'petcare.lastModified',  // 雲端同步用
};

// 哪些 key 會被同步到雲端（settings 不同步：含 PAT、device-specific）
const SYNCABLE_KEYS = new Set([
  'petcare.pets',
  'petcare.sessions',
  'petcare.trainingItems.cat',
  'petcare.trainingItems.dog',
]);

const DEFAULT_DOG_ITEMS = [
  '坐下 Sit', '趴下 Down', '等等 Stay', '過來 Come', '跟隨散步 Heel',
  '不暴衝（牽繩禮儀）', '定點大小便', '籠內訓練', '看我（專注）',
  '放下 Drop it', '不要 Leave it', '握手 / 擊掌',
  '社會化：人', '社會化：狗', '社會化：環境聲音',
  '接受梳毛 / 剪指甲', '不撲人', '進出門禮儀',
].map(name => ({ name, methods: [] }));

const DEFAULT_CAT_ITEMS = [
  '響片連結', '目標棒觸碰', '進外出籠（Crate）',
  '接受梳毛', '接受剪指甲', '接受刷牙',
  '定點待命', '擊掌 / 握手', '跟隨手勢',
  '坐下', '轉圈', '不上餐桌', '不咬手 / 不抓人',
  '接受陌生人靠近', '健康檢查姿勢（觸碰耳/嘴/腹）',
  '環境減敏：聲音', '環境減敏：陌生環境',
].map(name => ({ name, methods: [] }));

// 把任何舊版資料自動升級成 v3：{ name, methods: [{name, steps}] }
function ensureItemShape(arr) {
  if (!Array.isArray(arr)) return [];
  return arr.map(it => {
    if (typeof it === 'string') {
      // v1
      return { name: it, methods: [] };
    }
    if (Array.isArray(it.methods)) {
      // v3 already
      return {
        name: it.name || '',
        methods: it.methods.map(m => ({
          name: (m && m.name) || '',
          steps: (m && m.steps) || '',
        })),
      };
    }
    // v2: had {name, steps}
    if (it.steps && it.steps.trim()) {
      return { name: it.name || '', methods: [{ name: '基本方法', steps: it.steps }] };
    }
    return { name: it.name || '', methods: [] };
  });
}

function load(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch { return fallback; }
}
function _writeRaw(key, value) {
  // 直接寫，不觸發 sync（用於 pull 從雲端蓋本機）
  localStorage.setItem(key, JSON.stringify(value));
}
function save(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
  // 寫到可同步的 key 時，且只有同步已啟用，才更新 lastModified 並排程 push
  // （未啟用時若也標記 lastModified，會讓「全新裝置首次啟用同步」誤判自己比較新而推空資料）
  if (SYNCABLE_KEYS && SYNCABLE_KEYS.has(key)) {
    if (typeof syncEnabled === 'function' && syncEnabled()) {
      localStorage.setItem(KEYS.lastModified, JSON.stringify(new Date().toISOString()));
      if (typeof schedulePush === 'function') schedulePush();
    }
  }
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// 建構飼主檢視 URL，支援 user-page 模式（repo = user.github.io）+ 子目錄部署
function buildReportUrl(settings, gistId) {
  const user = (settings.githubUser || '').trim();
  const repo = (settings.githubRepo || '').trim();
  let base;
  if (user && repo && repo.toLowerCase() === `${user.toLowerCase()}.github.io`) {
    // User-page 模式：URL 沒有 repo 段
    base = `https://${user}.github.io`;
  } else {
    base = `https://${user}.github.io/${repo}`;
  }
  // 子目錄（例：'training'）
  const sub = (settings.pagesSubPath || '').replace(/^\/+|\/+$/g, '');
  if (sub) base = base + '/' + sub;
  return `${base}/report.html#gist=${gistId}`;
}

function initStorage() {
  // 用 _writeRaw 避免種子初始化誤觸發雲端 push（不該認為這是「使用者改動」）
  if (!localStorage.getItem(KEYS.version)) _writeRaw(KEYS.version, 2);
  if (!localStorage.getItem(KEYS.pets)) _writeRaw(KEYS.pets, []);
  if (!localStorage.getItem(KEYS.sessions)) _writeRaw(KEYS.sessions, []);
  if (!localStorage.getItem(KEYS.itemsCat)) _writeRaw(KEYS.itemsCat, DEFAULT_CAT_ITEMS);
  if (!localStorage.getItem(KEYS.itemsDog)) _writeRaw(KEYS.itemsDog, DEFAULT_DOG_ITEMS);
  if (!localStorage.getItem(KEYS.settings)) _writeRaw(KEYS.settings, {
    githubPat: '',
    githubUser: 'wendypettrainer',
    githubRepo: 'pet-care',
  });
  // Migration: 任何舊格式（string[] / {name,steps}）→ v3 {name, methods[]}
  _writeRaw(KEYS.itemsCat, ensureItemShape(load(KEYS.itemsCat, [])));
  _writeRaw(KEYS.itemsDog, ensureItemShape(load(KEYS.itemsDog, [])));
  _writeRaw(KEYS.version, 3);
}

const state = {
  view: 'pets',  // pets | sessions | session | settings
  petId: null,
  sessionId: null,
  petFilter: '',  // '' | 'dog' | 'cat'
  petQuery: '',
};

/* ============== CLOUD SYNC ============== */
const SYNC = {
  GIST_DESCRIPTION: 'Wendy 訓練資料同步 v1',
  pushTimer: null,
  pushing: false,
  pulling: false,
  status: 'idle',          // idle | pending | syncing | ok | error | offline | disabled
  lastError: '',
  statusListeners: [],
};

function syncEnabled() {
  const s = load(KEYS.settings, {});
  return !!s.syncEnabled && !!s.githubPat;
}
function setSyncStatus(status, errMsg) {
  SYNC.status = status;
  SYNC.lastError = errMsg || '';
  SYNC.statusListeners.forEach(fn => { try { fn(); } catch(e){} });
}
function onSyncStatusChange(fn) { SYNC.statusListeners.push(fn); }
function getSyncSettings() { return load(KEYS.settings, {}); }
function updateSyncSettings(patch) {
  const cur = load(KEYS.settings, {});
  Object.assign(cur, patch);
  // 用底層寫入避免被當成可同步 key（settings 不同步）
  _writeRaw(KEYS.settings, cur);
}

async function gistApi(method, path, body) {
  const s = load(KEYS.settings, {});
  if (!s.githubPat) throw new Error('未設定 PAT');
  const r = await fetch(`https://api.github.com${path}`, {
    method,
    headers: {
      'Authorization': `Bearer ${s.githubPat}`,
      'Accept': 'application/vnd.github+json',
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) {
    const txt = await r.text().catch(() => '');
    throw new Error(`GitHub ${r.status}: ${txt.slice(0, 120)}`);
  }
  return r.json();
}

async function findOrCreateSyncGist() {
  const s = load(KEYS.settings, {});
  if (s.syncGistId) return s.syncGistId;
  // 用 description 找既有 gist（其他裝置已建立）
  const list = await gistApi('GET', '/gists?per_page=100');
  const found = list.find(g => (g.description || '').startsWith(SYNC.GIST_DESCRIPTION));
  if (found) {
    updateSyncSettings({ syncGistId: found.id });
    return found.id;
  }
  // 都沒有 → 建新的
  const gist = await gistApi('POST', '/gists', {
    description: SYNC.GIST_DESCRIPTION,
    public: false,
    files: { 'data.json': { content: '{}' } },
  });
  updateSyncSettings({ syncGistId: gist.id });
  return gist.id;
}

function buildSyncPayload() {
  return {
    schemaVersion: 4,
    lastModified: load(KEYS.lastModified, ''),
    pets: load(KEYS.pets, []),
    sessions: load(KEYS.sessions, []),
    itemsCat: load(KEYS.itemsCat, []),
    itemsDog: load(KEYS.itemsDog, []),
  };
}

function applySyncPayload(remote) {
  if (!remote || typeof remote !== 'object') return false;
  // 用 _writeRaw 避免遞迴 push
  if (Array.isArray(remote.pets)) _writeRaw(KEYS.pets, remote.pets);
  if (Array.isArray(remote.sessions)) _writeRaw(KEYS.sessions, remote.sessions);
  if (Array.isArray(remote.itemsCat)) _writeRaw(KEYS.itemsCat, remote.itemsCat);
  if (Array.isArray(remote.itemsDog)) _writeRaw(KEYS.itemsDog, remote.itemsDog);
  if (remote.lastModified) _writeRaw(KEYS.lastModified, remote.lastModified);
  return true;
}

async function pushToCloud() {
  if (!syncEnabled()) return;
  if (SYNC.pushing) return;
  SYNC.pushing = true;
  setSyncStatus('syncing');
  try {
    const gistId = await findOrCreateSyncGist();
    // 推之前把 lastModified 蓋成現在，確保雲端有時間戳給其他裝置比較
    _writeRaw(KEYS.lastModified, new Date().toISOString());
    const payload = buildSyncPayload();
    await gistApi('PATCH', `/gists/${gistId}`, {
      files: { 'data.json': { content: JSON.stringify(payload, null, 2) } },
    });
    updateSyncSettings({ syncLastTime: new Date().toISOString() });
    setSyncStatus('ok');
  } catch (e) {
    setSyncStatus('error', e.message);
    console.warn('Sync push failed:', e);
  } finally {
    SYNC.pushing = false;
  }
}

function schedulePush() {
  if (!syncEnabled()) return;
  setSyncStatus('pending');
  clearTimeout(SYNC.pushTimer);
  SYNC.pushTimer = setTimeout(pushToCloud, 3000);
}

async function pullFromCloud(opts = {}) {
  if (!syncEnabled()) return;
  if (SYNC.pulling) return;
  SYNC.pulling = true;
  setSyncStatus('syncing');
  try {
    const gistId = await findOrCreateSyncGist();
    const gist = await gistApi('GET', `/gists/${gistId}`);
    const file = gist.files && gist.files['data.json'];
    if (!file || !file.content) {
      // 雲端是空的 → 推本機上去
      SYNC.pulling = false;
      await pushToCloud();
      return;
    }
    let content = file.content;
    if (file.truncated && file.raw_url) {
      const r = await fetch(file.raw_url);
      content = await r.text();
    }
    let remote;
    try { remote = JSON.parse(content || '{}'); }
    catch { throw new Error('雲端資料解析失敗'); }

    const localTs = load(KEYS.lastModified, '');
    const remoteTs = remote.lastModified || '';

    // 防呆：本機是空的（pets/sessions 都沒資料）但雲端有，無條件拉取
    // 避免「全新裝置首次啟用」誤推空資料蓋掉雲端
    const localPets = load(KEYS.pets, []);
    const localSess = load(KEYS.sessions, []);
    const localEmpty = (!localPets || localPets.length === 0) && (!localSess || localSess.length === 0);
    const remoteHasData = (Array.isArray(remote.pets) && remote.pets.length > 0)
                       || (Array.isArray(remote.sessions) && remote.sessions.length > 0);

    if (opts.forcePull || (remoteTs && remoteTs > localTs) || (localEmpty && remoteHasData)) {
      applySyncPayload(remote);
      updateSyncSettings({ syncLastTime: new Date().toISOString() });
      setSyncStatus('ok');
      // 重新 render 以反映新資料
      if (typeof render === 'function') render();
    } else if (opts.forcePush || localTs > remoteTs) {
      SYNC.pulling = false;
      await pushToCloud();
      return;
    } else {
      updateSyncSettings({ syncLastTime: new Date().toISOString() });
      setSyncStatus('ok');
    }
  } catch (e) {
    setSyncStatus('error', e.message);
    console.warn('Sync pull failed:', e);
  } finally {
    SYNC.pulling = false;
  }
}

/* ============== UTIL ============== */
function fmtDate(s) {
  if (!s) return '';
  const [y,m,d] = s.split('-');
  return `${y}/${m}/${d}`;
}
function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}
function speciesLabel(s) { return s === 'cat' ? '貓' : '狗'; }
function speciesEmoji(s) { return s === 'cat' ? '🐱' : '🐶'; }
function genderLabel(g) { return g === 'male' ? '♂' : g === 'female' ? '♀' : ''; }
function neuteredLabel(n) { return n === 'yes' ? '已絕育' : n === 'no' ? '未絕育' : ''; }
function petTagline(p) {
  // 一行短描述：品種 · ♂ · 已絕育 · 4 個月齡
  return [
    p.breed || speciesLabel(p.species),
    genderLabel(p.gender),
    neuteredLabel(p.neutered),
    p.birth,
  ].filter(Boolean).join(' · ');
}

function getPet(id) { return load(KEYS.pets, []).find(p => p.id === id); }
function getSession(id) { return load(KEYS.sessions, []).find(s => s.id === id); }
function getPetSessions(petId) {
  return load(KEYS.sessions, [])
    .filter(s => s.petId === petId)
    .sort((a,b) => b.date.localeCompare(a.date));
}

// 排序鍵：最近的 session 日期，沒 session 用 createdAt 當 fallback
function getPetSortKey(pet) {
  const sessions = getPetSessions(pet.id);
  if (sessions.length) return sessions[0].date;
  return pet.createdAt ? pet.createdAt.slice(0, 10) : '';
}
function petMatchesQuery(pet, q) {
  if (!q) return true;
  const lc = q.toLowerCase();
  return (pet.name||'').toLowerCase().includes(lc)
      || (pet.breed||'').toLowerCase().includes(lc)
      || (pet.ownerName||'').toLowerCase().includes(lc);
}

function showNotice(msg, type = 'ok') {
  const n = document.createElement('div');
  n.className = 'notice ' + type;
  n.textContent = msg;
  n.style.position = 'fixed';
  n.style.top = '70px';
  n.style.left = '50%';
  n.style.transform = 'translateX(-50%)';
  n.style.zIndex = '100';
  n.style.maxWidth = '90%';
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 3000);
}

/* ============== ROUTER ============== */
function go(view, params = {}) {
  state.view = view;
  if ('petId' in params) state.petId = params.petId;
  if ('sessionId' in params) state.sessionId = params.sessionId;
  render();
}

function updateHeader() {
  const back = document.getElementById('backBtn');
  const breadcrumb = document.getElementById('breadcrumb');
  const isHome = state.view === 'pets';
  back.style.visibility = isHome ? 'hidden' : 'visible';

  // 組麵包屑：每段 { label, action?, petId?, current? }
  const segs = [{ label: '🏠', action: 'brand' }];
  if (state.view === 'pets') {
    segs.push({ label: '寵物列表', current: true });
  } else if (state.view === 'sessions') {
    segs.push({ label: '寵物列表', action: 'pets' });
    const p = getPet(state.petId);
    if (p) segs.push({ label: `${speciesEmoji(p.species)} ${p.name}`, current: true });
  } else if (state.view === 'session') {
    segs.push({ label: '寵物列表', action: 'pets' });
    const s = getSession(state.sessionId);
    const p = s && getPet(s.petId);
    if (p) segs.push({ label: `${speciesEmoji(p.species)} ${p.name}`, action: 'sessions', petId: p.id });
    if (s) segs.push({ label: fmtDate(s.date), current: true });
  } else if (state.view === 'settings') {
    segs.push({ label: '寵物列表', action: 'pets' });
    segs.push({ label: '⚙ 設定', current: true });
  }

  breadcrumb.innerHTML = segs.map((seg, i) => {
    const sep = i > 0 ? '<span class="bc-sep">/</span>' : '';
    if (seg.current) return sep + `<span class="bc-current">${escapeHtml(seg.label)}</span>`;
    const dataAttr = seg.petId ? ` data-petid="${escapeAttr(seg.petId)}"` : '';
    return sep + `<a class="bc-link" data-action="${seg.action}"${dataAttr}>${escapeHtml(seg.label)}</a>`;
  }).join('');

  breadcrumb.querySelectorAll('.bc-link').forEach(a => {
    a.onclick = (e) => {
      e.preventDefault();
      const action = a.dataset.action;
      if (action === 'brand') {
        // 本機 file:// 模式跳上層只會看到資料夾，沒意義 → 退回 App 內首頁
        if (window.location.protocol === 'file:') {
          go('pets');
          showNotice('本機模式：實際部署後此按鈕會跳到品牌首頁');
        } else {
          window.location.href = '../';
        }
      } else if (action === 'pets') {
        go('pets');
      } else if (action === 'sessions') {
        go('sessions', { petId: a.dataset.petid });
      }
    };
  });
}

function refreshSyncDot() {
  const dot = document.getElementById('syncDot');
  if (!dot) return;
  if (!syncEnabled()) {
    dot.className = 'sync-dot disabled';
    dot.title = '同步未啟用';
    return;
  }
  const map = {
    ok: { cls: 'ok', txt: '已同步' },
    syncing: { cls: 'syncing', txt: '同步中⋯' },
    pending: { cls: 'pending', txt: '即將同步' },
    error: { cls: 'error', txt: '同步失敗：' + (SYNC.lastError || '') },
    idle: { cls: 'disabled', txt: '尚未同步' },
  };
  const info = map[SYNC.status] || map.idle;
  dot.className = 'sync-dot ' + info.cls;
  dot.title = info.txt;
}
onSyncStatusChange(refreshSyncDot);
document.getElementById('syncDot').onclick = () => {
  state._returnView = state.view;
  go('settings');
};

document.getElementById('backBtn').onclick = () => {
  if (state.view === 'sessions') go('pets');
  else if (state.view === 'session') go('sessions', { petId: state.petId });
  else if (state.view === 'settings') go(state._returnView || 'pets');
};
document.getElementById('settingsBtn').onclick = () => {
  state._returnView = state.view;
  go('settings');
};

/* ============== VIEW: PETS ============== */
function renderPets() {
  const main = document.getElementById('main');
  const allPets = load(KEYS.pets, []);
  const hero = `
    <div class="brand-hero">
      <img src="logo.png" alt="Wendy 溫蒂．貓與狗訓練日常"
           onerror="this.style.display='none'">
    </div>`;

  if (allPets.length === 0) {
    main.innerHTML = hero + `
      <div class="empty">
        <h3>還沒有寵物資料</h3>
        <p>點右下角 ＋ 新增第一隻</p>
      </div>
      <button class="fab" id="fab">＋</button>
    `;
    document.getElementById('fab').onclick = () => openPetForm();
    return;
  }

  // 計算各物種數量
  const dogCount = allPets.filter(p => p.species === 'dog').length;
  const catCount = allPets.filter(p => p.species === 'cat').length;
  const showSearch = allPets.length > 5;

  // Tabs
  const tabs = `
    <div class="tabs">
      <button class="tab ${state.petFilter===''?'active':''}" data-pet-filter="">全部 (${allPets.length})</button>
      <button class="tab ${state.petFilter==='dog'?'active':''}" data-pet-filter="dog">🐶 狗 (${dogCount})</button>
      <button class="tab ${state.petFilter==='cat'?'active':''}" data-pet-filter="cat">🐱 貓 (${catCount})</button>
    </div>`;

  // Search
  const search = showSearch ? `
    <input type="text" class="search-input" id="petSearch"
           placeholder="🔍 搜尋名字、品種或飼主"
           value="${escapeAttr(state.petQuery)}">` : '';

  // Filter + sort
  let pets = allPets.slice();
  if (state.petFilter) pets = pets.filter(p => p.species === state.petFilter);
  if (state.petQuery.trim()) pets = pets.filter(p => petMatchesQuery(p, state.petQuery.trim()));
  pets.sort((a, b) => getPetSortKey(b).localeCompare(getPetSortKey(a)));

  let listHtml;
  if (pets.length === 0) {
    listHtml = `
      <div class="empty">
        <h3>沒有符合條件的寵物</h3>
        <p>試試其他關鍵字或切換物種</p>
      </div>`;
  } else {
    listHtml = pets.map(p => {
      const sessions = getPetSessions(p.id);
      const count = sessions.length;
      const recentLabel = sessions.length
        ? `最近：${fmtDate(sessions[0].date)}`
        : '尚未上課';
      return `
        <div class="card" data-id="${p.id}">
          <div class="card-row">
            <div>
              <div class="card-title">${speciesEmoji(p.species)} ${escapeHtml(p.name)}</div>
              <div class="card-meta">${escapeHtml(petTagline(p))} · 飼主：${escapeHtml(p.ownerName || '—')}</div>
              <div class="card-meta" style="margin-top:4px; font-size:12px">${recentLabel}</div>
            </div>
            <span class="badge">${count} 堂</span>
          </div>
        </div>`;
    }).join('');
  }

  main.innerHTML = hero + tabs + search + listHtml + `<button class="fab" id="fab">＋</button>`;

  // Tab handler
  main.querySelectorAll('[data-pet-filter]').forEach(t => {
    t.onclick = () => { state.petFilter = t.dataset.petFilter; renderPets(); };
  });
  // Search handler
  const sInput = document.getElementById('petSearch');
  if (sInput) {
    sInput.oninput = () => {
      state.petQuery = sInput.value;
      renderPets();
      // 重新 render 後 input 會被取代，把 focus 放回去
      const newInput = document.getElementById('petSearch');
      if (newInput) {
        newInput.focus();
        newInput.setSelectionRange(newInput.value.length, newInput.value.length);
      }
    };
  }
  // Card click
  main.querySelectorAll('.card[data-id]').forEach(el => {
    el.onclick = () => go('sessions', { petId: el.dataset.id });
  });
  document.getElementById('fab').onclick = () => openPetForm();
}

    gender: '', neutered: '',
    ownerName: '', ownerContact: '', notes: '',
  };

    <div class="modal">
      <h2>${isEdit ? '編輯寵物' : '新增寵物'}</h2>
      <div class="field">
        <label>物種</label>
        <select id="f_species">
          <option value="dog" ${data.species==='dog'?'selected':''}>🐶 狗</option>
          <option value="cat" ${data.species==='cat'?'selected':''}>🐱 貓</option>
        </select>
      </div>
      <div class="row2">
        <div class="field">
          <label>名字 *</label>
          <input id="f_name" type="text" value="${escapeAttr(data.name)}" placeholder="例：旺旺">
        </div>
        <div class="field">
          <label>品種</label>
          <input id="f_breed" type="text" value="${escapeAttr(data.breed)}" placeholder="例：柴犬">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>性別</label>
          <select id="f_gender">
            <option value="" ${!data.gender?'selected':''}>未填</option>
            <option value="male" ${data.gender==='male'?'selected':''}>♂ 公</option>
            <option value="female" ${data.gender==='female'?'selected':''}>♀ 母</option>
          </select>
        </div>
        <div class="field">
          <label>絕育</label>
          <select id="f_neutered">
            <option value="" ${!data.neutered?'selected':''}>未填</option>
            <option value="yes" ${data.neutered==='yes'?'selected':''}>是</option>
            <option value="no" ${data.neutered==='no'?'selected':''}>否</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>出生年月 / 月齡</label>
          <input id="f_birth" type="text" value="${escapeAttr(data.birth)}" placeholder="2023-05 或 4 個月齡">
        </div>
        <div class="field">
          <label>飼主姓名</label>
          <input id="f_owner" type="text" value="${escapeAttr(data.ownerName)}" placeholder="例：陳小姐">
        </div>
      </div>
      <div class="field">
        <label>飼主聯絡（電話 / LINE / Email）</label>
        <input id="f_contact" type="text" value="${escapeAttr(data.ownerContact)}" placeholder="可選">
      </div>
      <div class="field">
        <label>備註（個性 / 過敏 / 特殊狀況）</label>
        <textarea id="f_notes">${escapeHtml(data.notes)}</textarea>
      </div>
      <div class="modal-actions">
        ${isEdit ? '<button class="btn danger" id="m_del">刪除</button>' : ''}
        <button class="btn ghost" id="m_cancel">取消</button>
        <button class="btn" id="m_save">${isEdit ? '儲存' : '建立'}</button>
      </div>
    </div>
  `;
  const overlay = openModal(html);
  overlay.querySelector('#m_cancel').onclick = () => overlay.remove();

    const updated = {
      id: data.id || uid(),
      species: overlay.querySelector('#f_species').value,
      name,
      breed: overlay.querySelector('#f_breed').value.trim(),
      birth: overlay.querySelector('#f_birth').value.trim(),
      gender: overlay.querySelector('#f_gender').value,
      neutered: overlay.querySelector('#f_neutered').value,
      ownerName: overlay.querySelector('#f_owner').value.trim(),
      ownerContact: overlay.querySelector('#f_contact').value.trim(),
      notes: overlay.querySelector('#f_notes').value.trim(),
      createdAt: data.createdAt || new Date().toISOString(),

      pets[idx] = updated;

    save(KEYS.pets, pets);

      save(KEYS.sessions, load(KEYS.sessions, []).filter(s => s.petId !== data.id));
      overlay.remove();
      go('pets');
    };
  }

  if (sessions.length === 0) {
    body = `<div class="empty"><h3>還沒有課程</h3><p>點右下角 ＋ 新增第一堂</p></div>`;
  } else {
    body = sessions.map(s => {
      const recCount = (s.records || []).filter(r => r.selected).length;
      const isToday = s.date === todayStr();
      return `
        <div class="card" data-id="${s.id}">
          <div class="card-row">
            <div>
              <div class="card-title">${fmtDate(s.date)} ${isToday ? '<span class="badge" style="background:var(--good)">今天</span>' : ''}</div>
              <div class="card-meta">
                ${s.location ? '📍 ' + escapeHtml(s.location) + ' · ' : ''}
                ${s.duration ? s.duration + ' 分鐘' : ''}
                ${recCount > 0 ? ' · 已記錄 ' + recCount + ' 項' : ' · 尚未記錄'}
              </div>
            </div>
            <button class="card-menu-btn" data-menu="${s.id}" title="更多動作">⋯</button>
          </div>
        </div>`;
    }).join('');
  }
  main.innerHTML = meta + body + `<button class="fab" id="fab">＋</button>`;
  document.getElementById('editPet').onclick = () => openPetForm(pet);
  main.querySelectorAll('.card[data-id]').forEach(el => {
    el.onclick = (e) => {
      // 點到 ⋯ 按鈕時不要進入該堂課
      if (e.target.classList.contains('card-menu-btn')) return;
      go('session', { sessionId: el.dataset.id });
    };
  });
  // ⋯ 按鈕：開選單（編輯 / 刪除）
  main.querySelectorAll('.card-menu-btn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const sid = btn.dataset.menu;
      const sess = getSession(sid);
      if (!sess) return;
      openSessionMenu(btn, sess);
    };
  });
  document.getElementById('fab').onclick = () => openSessionForm();
}

function openSessionMenu(anchorBtn, sess) {
  // 關掉舊的（如果有）
  document.querySelectorAll('.card-menu').forEach(m => m.remove());
  const rect = anchorBtn.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.className = 'card-menu';
  menu.style.position = 'fixed';
  menu.style.top = (rect.bottom + 4) + 'px';
  menu.style.right = (window.innerWidth - rect.right) + 'px';
  menu.innerHTML = `
    <button data-act="edit">✏️ 編輯課程資訊</button>
    <button data-act="delete" class="danger">🗑 刪除這堂課</button>
  `;
  document.body.appendChild(menu);
  // 點外面關閉
  setTimeout(() => {
    const close = (e) => {
      if (!menu.contains(e.target)) {
        menu.remove();
        document.removeEventListener('click', close);
      }
    };
    document.addEventListener('click', close);
  }, 0);
  menu.querySelector('[data-act="edit"]').onclick = () => {
    menu.remove();
    openSessionForm(sess);
  };
  menu.querySelector('[data-act="delete"]').onclick = () => {
    menu.remove();
    if (!confirm(`刪除 ${fmtDate(sess.date)} 這堂課的所有記錄？\n\n寵物資料與其他堂課不受影響。`)) return;
    save(KEYS.sessions, load(KEYS.sessions, []).filter(s => s.id !== sess.id));
    showNotice('已刪除課程');
    render();
  };
}

function openSessionForm(session = null) {
  const isEdit = !!session;
  const data = session || {
    id: '', petId: state.petId, date: todayStr(),
    location: '', duration: 60,
  };
  // 把舊的 freeform location 對應到 radio：教室/家中 直接命中，其他都歸到「其他」+文字
  const presetLocs = ['教室', '家中'];
  const isPreset = presetLocs.includes(data.location);
  const initType = !data.location ? '' : (isPreset ? data.location : 'other');
  const initOther = isPreset ? '' : (data.location || '');
  const html = `
    <div class="modal">
      <h2>${isEdit ? '編輯課程' : '新增課程'}</h2>
      <div class="row2">
        <div class="field">
          <label>日期 *</label>
          <input id="f_date" type="date" value="${data.date}">
        </div>
        <div class="field">
          <label>時長（分鐘）</label>
          <input id="f_duration" type="number" value="${data.duration||''}" min="0">
        </div>
      </div>
      <div class="field">
        <label>地點</label>
        <div class="radio-group">
          <label class="radio-opt"><input type="radio" name="locType" value="教室" ${initType==='教室'?'checked':''}> 教室</label>
          <label class="radio-opt"><input type="radio" name="locType" value="家中" ${initType==='家中'?'checked':''}> 家中</label>
          <label class="radio-opt"><input type="radio" name="locType" value="other" ${initType==='other'?'checked':''}> 其他</label>
        </div>
        <input id="f_locOther" type="text" value="${escapeAttr(initOther)}" placeholder="請輸入地點"
               style="margin-top:8px; display:${initType==='other'?'block':'none'};">
      </div>
      <div class="modal-actions">
        ${isEdit ? '<button class="btn danger" id="m_del">刪除</button>' : ''}
        <button class="btn ghost" id="m_cancel">取消</button>
        <button class="btn" id="m_save">${isEdit ? '儲存' : '建立並開始記錄'}</button>
      </div>
    </div>
  `;
  const overlay = openModal(html);
  overlay.querySelector('#m_cancel').onclick = () => overlay.remove();
  // Toggle 其他 文字輸入
  overlay.querySelectorAll('input[name="locType"]').forEach(r => {
    r.onchange = () => {
      const ot = overlay.querySelector('#f_locOther');
      ot.style.display = (r.value === 'other' && r.checked) ? 'block' : 'none';
      if (r.value === 'other' && r.checked) ot.focus();
    };
  });
  overlay.querySelector('#m_save').onclick = () => {
    const date = overlay.querySelector('#f_date').value;
    if (!date) { showNotice('請選日期', 'err'); return; }
    const locTypeEl = overlay.querySelector('input[name="locType"]:checked');
    const locType = locTypeEl ? locTypeEl.value : '';
    const locOther = overlay.querySelector('#f_locOther').value.trim();
    const finalLoc = locType === 'other' ? locOther : (locType || '');
    const updated = {
      id: data.id || uid(),
      petId: data.petId,
      date,
      duration: parseInt(overlay.querySelector('#f_duration').value) || 0,
      location: finalLoc,
      records: data.records || [],
      homework: data.homework || '',
      notes: data.notes || '',
      gistId: data.gistId,
      createdAt: data.createdAt || new Date().toISOString(),
    };
    const sessions = load(KEYS.sessions, []);
    if (isEdit) {
      const idx = sessions.findIndex(s => s.id === data.id);
      sessions[idx] = updated;
    } else {
      sessions.push(updated);
    }
    save(KEYS.sessions, sessions);
    overlay.remove();
    if (isEdit) render();
    else go('session', { sessionId: updated.id });
  };
  if (isEdit) {
    overlay.querySelector('#m_del').onclick = () => {
      if (!confirm('刪除這堂課的所有記錄？')) return;
      save(KEYS.sessions, load(KEYS.sessions, []).filter(s => s.id !== data.id));
      overlay.remove();
      go('sessions', { petId: state.petId });
    };
  }
}

/* ============== VIEW: SESSION RECORD ============== */
function renderSession() {
  const main = document.getElementById('main');
  const sess = getSession(state.sessionId);
  if (!sess) { go('sessions', { petId: state.petId }); return; }
  const pet = getPet(sess.petId);
  if (!pet) { go('pets'); return; }
  const items = ensureItemShape(pet.species === 'cat' ? load(KEYS.itemsCat, []) : load(KEYS.itemsDog, []));
  const recordsByName = {};
  (sess.records || []).forEach(r => recordsByName[r.name] = r);

  const itemsHtml = items.map(it => {
    const name = it.name;
    const r = recordsByName[name] || { name, selected: false, rating: '', methods: [], petNote: '' };
    const itMethods = it.methods || [];
    const hasMethods = itMethods.length > 0;
    const checkedSet = new Set(r.methods || []);
    const methodsBlock = hasMethods ? `
      <div class="methods-section">
        <div class="methods-label">🎯 今天用的方法（可複選）</div>
        ${itMethods.map(m => `
          <label class="method-check">
            <input type="checkbox" data-method="${escapeAttr(m.name)}" ${checkedSet.has(m.name)?'checked':''}>
            <span>${escapeHtml(m.name || '（未命名方法）')}</span>
          </label>
        `).join('')}
      </div>` : '';
    return `
      <div class="item ${r.selected ? 'selected' : ''}" data-name="${escapeAttr(name)}">
        <div class="item-head">
          <div class="check">${r.selected ? '✓' : ''}</div>
          <div class="item-name">${escapeHtml(name)}${hasMethods ? ' <span class="steps-badge" title="此項目有 '+itMethods.length+' 種訓練方法">📋</span>' : ''}</div>
        </div>
        ${r.selected ? `
          <div class="ratings">
            <button class="rating-btn good ${r.rating==='good'?'active':''}" data-rating="good">😊 好</button>
            <button class="rating-btn ok ${r.rating==='ok'?'active':''}" data-rating="ok">😐 普通</button>
            <button class="rating-btn work ${r.rating==='work'?'active':''}" data-rating="work">💪 需加強</button>
          </div>
          ${methodsBlock}
          <textarea class="pet-note-input" data-pet-note="${escapeAttr(name)}"
            placeholder="💭 針對這隻寵物的調整備註（可選，會給飼主）"
            rows="1">${escapeHtml(r.petNote || '')}</textarea>
        ` : ''}
      </div>`;
  }).join('');

  main.innerHTML = `
    <div class="autosave-banner">
      💾 評分、方法勾選、備註都是<b>自動儲存</b>。儲存按鈕只是快速確認。
    </div>
    <div class="card" style="cursor:default">
      <div class="card-row">
        <div>
          <div class="card-title">${speciesEmoji(pet.species)} ${escapeHtml(pet.name)} ${genderLabel(pet.gender)}</div>
          <div class="card-meta">
            ${fmtDate(sess.date)}
            ${sess.location ? ' · 📍 ' + escapeHtml(sess.location) : ''}
            ${sess.duration ? ' · ' + sess.duration + ' 分鐘' : ''}
          </div>
        </div>
        <button class="small-btn" id="editSess">編輯</button>
      </div>
    </div>

    <h3 style="color:var(--brown-dark); margin: 18px 0 10px; font-size:15px">訓練項目（點選擇要記錄的項目）</h3>
    <div id="itemList">${itemsHtml}</div>

    <div class="field" style="margin-top:18px">
      <label>📝 本週飼主作業</label>
      <textarea id="homework" placeholder="例：每天早晚各 5 分鐘練習坐下，遛狗時遇到其他狗保持距離 3 公尺以上⋯">${escapeHtml(sess.homework||'')}</textarea>
    </div>
    <div class="field">
      <label>👀 訓練師備註（不會輸出給飼主）</label>
      <textarea id="trainerNotes" placeholder="自己的觀察、下次計畫⋯">${escapeHtml(sess.notes||'')}</textarea>
    </div>

    <div class="actions-row">
      <button class="btn" id="saveBtn">💾 儲存</button>
      <button class="btn ghost" id="pdfBtn">📄 下載 PDF</button>
      <button class="btn ghost" id="shareBtn">🔗 產生分享連結</button>
    </div>
  `;

  document.getElementById('editSess').onclick = () => openSessionForm(sess);

  // Item interaction
  main.querySelectorAll('.item').forEach(el => {
    const name = el.dataset.name;
    el.querySelector('.item-head').onclick = () => {
      const cur = recordsByName[name] || { name, selected: false, rating: '', petNote: '' };
      cur.selected = !cur.selected;
      if (!cur.selected) { cur.rating = ''; cur.petNote = ''; }
      recordsByName[name] = cur;
      saveRecords();
      renderSession();
    };
    el.querySelectorAll('.rating-btn').forEach(rb => {
      rb.onclick = (e) => {
        e.stopPropagation();
        const cur = recordsByName[name];
        cur.rating = cur.rating === rb.dataset.rating ? '' : rb.dataset.rating;
        saveRecords();
        renderSession();
      };
    });
    const noteInput = el.querySelector('.pet-note-input');
    if (noteInput) {
      noteInput.onblur = () => {
        const cur = recordsByName[name];
        if (cur) cur.petNote = noteInput.value;
        saveRecords();
      };
      noteInput.onclick = (e) => e.stopPropagation();
    }
    el.querySelectorAll('.method-check input[type=checkbox]').forEach(cb => {
      cb.onclick = (e) => {
        e.stopPropagation();
        const cur = recordsByName[name];
        if (!cur) return;
        cur.methods = cur.methods || [];
        const mname = cb.dataset.method;
        if (cb.checked) {
          if (!cur.methods.includes(mname)) cur.methods.push(mname);
        } else {
          cur.methods = cur.methods.filter(m => m !== mname);
        }
        saveRecords();
      };
    });
  });

  function saveRecords() {
    sess.records = Object.values(recordsByName).filter(r => r.selected);
    sess.homework = document.getElementById('homework').value;
    sess.notes = document.getElementById('trainerNotes').value;
    const sessions = load(KEYS.sessions, []);
    const idx = sessions.findIndex(s => s.id === sess.id);
    sessions[idx] = sess;
    save(KEYS.sessions, sessions);
  }

  document.getElementById('saveBtn').onclick = () => {
    saveRecords();
    showNotice('已儲存');
  };
  document.getElementById('pdfBtn').onclick = () => {
    saveRecords();
    exportPdf(sess, pet);
  };
  document.getElementById('shareBtn').onclick = async () => {
    saveRecords();
    await shareToGist(sess, pet);
  };

  // Auto-save homework / notes on blur
  ['homework','trainerNotes'].forEach(id => {
    document.getElementById(id).addEventListener('blur', saveRecords);
  });
}

/* ============== PDF EXPORT (走瀏覽器列印對話框，中文完美) ============== */
function exportPdf(sess, pet) {
  const items = ensureItemShape(pet.species === 'cat' ? load(KEYS.itemsCat, []) : load(KEYS.itemsDog, []));
  const itemMap = {};
  items.forEach(it => { itemMap[it.name] = it.methods || []; });

  const speciesEmoji = pet.species === 'cat' ? '🐱' : '🐶';
  const genderTxt = pet.gender === 'male' ? '♂' : pet.gender === 'female' ? '♀' : '';
  const neuteredTxt = pet.neutered === 'yes' ? '已絕育' : pet.neutered === 'no' ? '未絕育' : '';
  const metaParts = [
    pet.breed,
    genderTxt,
    neuteredTxt,
    pet.birth,
  ].filter(Boolean).join(' · ');

  const records = (sess.records || []).filter(r => r.selected);
  const recordsHtml = records.length === 0
    ? `<p style="color:#999; text-align:center; padding:16px;">（這堂課還沒有勾選項目）</p>`
    : records.map(r => {
        const itMethods = itemMap[r.name] || [];
        const checkedNames = r.methods || [];
        const ratingCls = r.rating === 'good' ? 'good' : r.rating === 'ok' ? 'ok' : r.rating === 'work' ? 'work' : 'none';
        const ratingTxt = r.rating === 'good' ? '😊 表現好' : r.rating === 'ok' ? '😐 普通' : r.rating === 'work' ? '💪 需加強' : '已練習';
        const methodsHtml = checkedNames.map(mn => {
          const m = itMethods.find(im => im.name === mn);
          const stepsTxt = (m && m.steps || '').trim();
          return `
            <div class="item-method">
              <div class="item-label">🎯 方法：${escapeHtml(mn || '（未命名方法）')}</div>
              ${stepsTxt ? `<div class="item-method-steps">${escapeHtml(stepsTxt)}</div>` : ''}
            </div>`;
        }).join('');
        const noteHtml = (r.petNote && r.petNote.trim())
          ? `<div class="item-petnote">
               <div class="item-label">💭 針對 ${escapeHtml(pet.name)} 的調整</div>
               ${escapeHtml(r.petNote)}
             </div>`
          : '';
        return `
          <div class="item">
            <div class="item-row">
              <span class="item-name">${escapeHtml(r.name)}</span>
              <span class="rating ${ratingCls}">${ratingTxt}</span>
            </div>
            ${methodsHtml}
            ${noteHtml}
          </div>`;
      }).join('');

  // 用 LOGO_DATA（base64）或絕對 URL 引 logo
  const logoSrc = LOGO_DATA || (window.location.protocol.startsWith('http')

  const html = `<!DOCTYPE html>

  w.document.close();
  w.document.title = `${pet.name}_${sess.date}`;
  showNotice('已開新分頁 → 列印對話框會自動跳出，選「另存為 PDF」');
}

/* ============== GIST SHARE ============== */
async function shareToGist(sess, pet) {
  const settings = load(KEYS.settings, {});
  if (!settings.githubPat) {
    showNotice('請先到設定填入 GitHub PAT', 'err');
    return;
  }
  // 把該項目「被勾選的方法」連同 steps 一起嵌入 record，飼主端看得到
  const items = ensureItemShape(pet.species === 'cat' ? load(KEYS.itemsCat, []) : load(KEYS.itemsDog, []));
  const itemMap = {};
  items.forEach(it => { itemMap[it.name] = it.methods || []; });
  const enrichedRecords = (sess.records || []).map(r => {
    const itMethods = itemMap[r.name] || [];
    const checkedNames = r.methods || [];
    const methodDetails = checkedNames.map(mn => {
      const m = itMethods.find(im => im.name === mn);
      return { name: mn, steps: (m && m.steps) || '' };
    });
    return { ...r, methodDetails };
  });
  const payload = {
    pet: {
      name: pet.name, species: pet.species, breed: pet.breed,
      gender: pet.gender, neutered: pet.neutered, birth: pet.birth,
      ownerName: pet.ownerName,
    },
    session: {
      date: sess.date, location: sess.location, duration: sess.duration,
      records: enrichedRecords, homework: sess.homework,
    },
    brand: 'Wendy 溫蒂．貓與狗訓練日常',
    generated: new Date().toISOString(),
  };
  const body = {
    description: `Wendy Pet Training Report - ${pet.name} ${sess.date}`,
    public: false,
    files: { 'report.json': { content: JSON.stringify(payload, null, 2) } },
  };

  showNotice('上傳中⋯');
  try {
    let resp;
    if (sess.gistId) {
      resp = await fetch(`https://api.github.com/gists/${sess.gistId}`, {
        method: 'PATCH',
        headers: {
          'Authorization': `Bearer ${settings.githubPat}`,
          'Accept': 'application/vnd.github+json',
        },
        body: JSON.stringify(body),
      });
    } else {
      resp = await fetch('https://api.github.com/gists', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${settings.githubPat}`,
          'Accept': 'application/vnd.github+json',
        },
        body: JSON.stringify(body),
      });
    }
    if (!resp.ok) {
      const err = await resp.text();
      throw new Error(`GitHub ${resp.status}: ${err.slice(0,200)}`);
    }
    const gist = await resp.json();
    sess.gistId = gist.id;
    const sessions = load(KEYS.sessions, []);
    const idx = sessions.findIndex(s => s.id === sess.id);
    sessions[idx] = sess;
    save(KEYS.sessions, sessions);

    const reportUrl = buildReportUrl(settings, gist.id);
    showShareModal(reportUrl, gist.html_url);
  } catch (e) {
    showNotice('上傳失敗：' + e.message, 'err');
  }
}

function showShareModal(reportUrl, gistUrl) {
  const html = `
    <div class="modal">
      <h2>🔗 分享連結已產生</h2>
      <div class="notice ok">把下面這個連結貼給飼主，他點開就能看當堂報告。</div>
      <div class="field">
        <label>飼主檢視連結（建議貼這個）</label>
        <input id="shareUrl" type="text" readonly value="${escapeAttr(reportUrl)}">
      </div>
      <div class="field">
        <label>原始 Gist 連結</label>
        <input type="text" readonly value="${escapeAttr(gistUrl)}">
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="m_close">關閉</button>
        <button class="btn" id="m_copy">複製連結</button>
      </div>
    </div>
  `;
  const overlay = openModal(html);
  overlay.querySelector('#m_close').onclick = () => overlay.remove();
  overlay.querySelector('#m_copy').onclick = async () => {
    try {
      await navigator.clipboard.writeText(reportUrl);
      showNotice('已複製到剪貼簿');
    } catch {
      overlay.querySelector('#shareUrl').select();
      document.execCommand('copy');
      showNotice('已複製');
    }
  };
}

/* ============== VIEW: SETTINGS ============== */
function renderSettings() {
  const main = document.getElementById('main');
  const s = load(KEYS.settings, {});
  const dogItems = load(KEYS.itemsDog, []);
  const catItems = load(KEYS.itemsCat, []);

  const lastSyncTxt = s.syncLastTime
    ? new Date(s.syncLastTime).toLocaleString('zh-TW')
    : '從未同步';
  const syncStatusTxt = !s.syncEnabled ? '未啟用'
    : SYNC.status === 'ok' ? '✅ 已同步'
    : SYNC.status === 'syncing' ? '🔄 同步中⋯'
    : SYNC.status === 'pending' ? '⏳ 即將上傳'
    : SYNC.status === 'error' ? '❌ ' + SYNC.lastError
    : '⏳ 等待中';

  main.innerHTML = `
    <div class="autosave-banner">
      💾 訓練項目區會<b>自動儲存</b>（離開欄位即存）。GitHub 設定要按下方「儲存設定」鈕。
    </div>

    <h3 style="color:var(--brown-dark); margin: 4px 0 10px; font-size:15px">☁️ 跨裝置同步</h3>
    <div class="card" style="cursor:default">
      <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
        <input type="checkbox" id="s_syncEnabled" ${s.syncEnabled?'checked':''}
               style="width:18px; height:18px; accent-color:var(--brown);">
        <span><b>開啟雲端同步</b>（讓 iPhone / iPad / Mac 共用同一份資料）</span>
      </label>
      <div class="card-meta" style="margin-top:10px">
        狀態：<b>${syncStatusTxt}</b><br>
        最後同步：${lastSyncTxt}<br>
        ${s.syncGistId ? '雲端 Gist ID：<code style="font-size:11px">' + escapeHtml(s.syncGistId) + '</code>' : ''}
      </div>
      <div class="actions-row" style="margin-top:12px">
        <button class="btn ghost" id="s_pullNow">⬇ 從雲端拉取</button>
        <button class="btn ghost" id="s_pushNow">⬆ 推上雲端</button>
      </div>
      <p class="card-meta" style="margin-top:10px; line-height:1.6">
        💡 <b>怎麼運作</b>：每次本機改動 3 秒後自動推到你的私人 Gist。其他裝置打開 App 時自動拉取。<br>
        💡 <b>衝突規則</b>：以時間戳「最後存者為準」。請避免兩台同時編輯。<br>
        💡 <b>需要</b>：下方 GitHub PAT 已設定（gist 權限）。
      </p>
    </div>

    <h3 style="color:var(--brown-dark); margin: 24px 0 10px; font-size:15px">GitHub 同步</h3>
    <div class="card" style="cursor:default">
      <div class="field">
        <label>GitHub Personal Access Token（gist 權限）</label>
        <input id="s_pat" type="password" value="${escapeAttr(s.githubPat||'')}" placeholder="ghp_...">
      </div>
      <div class="row2">
        <div class="field">
          <label>GitHub User</label>
          <input id="s_user" type="text" value="${escapeAttr(s.githubUser||'')}">
        </div>
        <div class="field">
          <label>GitHub Repo</label>
          <input id="s_repo" type="text" value="${escapeAttr(s.githubRepo||'')}" placeholder="例：pet-care 或 wendypettrainer.github.io">
        </div>
      </div>
      <div class="field">
        <label>子目錄（這個 App 在 repo 裡的路徑，沒有就空白）</label>
        <input id="s_subpath" type="text" value="${escapeAttr(s.pagesSubPath||'')}" placeholder="例：training">
      </div>
      <button class="btn" id="s_save">儲存設定</button>
      <p class="card-meta" style="margin-top:10px">
        💡 分享連結預覽：<br>
        <code style="font-size:11px; word-break:break-all" id="urlPreview">—</code>
      </p>
      <p class="card-meta" style="margin-top:10px">
        💡 PAT 只存在這台裝置的 localStorage，不會上傳。產生分享連結時用來建立 secret gist；
        飼主開連結時匿名讀取，不需 PAT。
      </p>
    </div>

    <h3 style="color:var(--brown-dark); margin: 24px 0 10px; font-size:15px">訓練項目清單</h3>
    <div class="tabs">
      <button class="tab active" data-tab="dog">🐶 狗 (${dogItems.length})</button>
      <button class="tab" data-tab="cat">🐱 貓 (${catItems.length})</button>
    </div>
    <div id="itemEditor"></div>

    <h3 style="color:var(--brown-dark); margin: 24px 0 10px; font-size:15px">資料管理</h3>
    <div class="card" style="cursor:default">
      <div class="actions-row">
        <button class="btn ghost" id="exportData">匯出全部資料 (JSON)</button>
        <button class="btn ghost" id="importData">匯入 JSON</button>
        <button class="btn danger" id="resetItems">重設清單為預設</button>
      </div>
      <p class="card-meta" style="margin-top:10px">
        匯出可備份，匯入會覆蓋現有資料。重設清單只會還原訓練項目，寵物與課程不受影響。
      </p>
    </div>
  `;

  function refreshUrlPreview() {
    const previewSettings = {
      githubUser: document.getElementById('s_user').value.trim(),
      githubRepo: document.getElementById('s_repo').value.trim(),
      pagesSubPath: document.getElementById('s_subpath').value.trim(),
    };
    const url = buildReportUrl(previewSettings, '【gist_id】');
    const el = document.getElementById('urlPreview');
    if (el) el.textContent = url;
  }
  ['s_user', 's_repo', 's_subpath'].forEach(id => {
    document.getElementById(id).oninput = refreshUrlPreview;
  });
  refreshUrlPreview();

  document.getElementById('s_save').onclick = () => {
    const cur = load(KEYS.settings, {});
    save(KEYS.settings, {
      ...cur,
      githubPat: document.getElementById('s_pat').value.trim(),
      githubUser: document.getElementById('s_user').value.trim(),
      githubRepo: document.getElementById('s_repo').value.trim(),
      pagesSubPath: document.getElementById('s_subpath').value.trim(),
    });
    showNotice('設定已儲存');
  };

  // 同步：開關
  const syncCheckbox = document.getElementById('s_syncEnabled');
  if (syncCheckbox) {
    syncCheckbox.onchange = async () => {
      const enabling = syncCheckbox.checked;
      updateSyncSettings({ syncEnabled: enabling });
      refreshSyncDot();
      if (enabling) {
        const settings = load(KEYS.settings, {});
        if (!settings.githubPat) {
          showNotice('請先在下方填入 GitHub PAT', 'err');
          updateSyncSettings({ syncEnabled: false });
          syncCheckbox.checked = false;
          refreshSyncDot();
          return;
        }
        showNotice('啟動同步⋯');
        await pullFromCloud();
        renderSettings();  // 重 render 顯示最新狀態
      } else {
        showNotice('同步已關閉');
      }
    };
  }
  document.getElementById('s_pullNow').onclick = async () => {
    if (!syncEnabled()) { showNotice('請先開啟同步', 'err'); return; }
    showNotice('從雲端拉取⋯');
    await pullFromCloud({ forcePull: true });
    renderSettings();
  };
  document.getElementById('s_pushNow').onclick = async () => {
    if (!syncEnabled()) { showNotice('請先開啟同步', 'err'); return; }
    showNotice('推上雲端⋯');
    await pushToCloud();
    renderSettings();
  };

  // Tab switching for item editor
  let currentTab = 'dog';
  function renderItemEditor() {
    const key = currentTab === 'dog' ? KEYS.itemsDog : KEYS.itemsCat;
    const list = ensureItemShape(load(key, []));

    function methodHtml(m, i, j) {
      return `
        <div class="method-block">
          <div class="method-top">
            <input data-i="${i}" data-j="${j}" data-mfield="name" value="${escapeAttr(m.name)}" placeholder="方法名稱（例：手勢引導 / 響片）">
            <button class="small-btn danger" data-mdel="${i}_${j}">刪</button>
          </div>
          <textarea data-i="${i}" data-j="${j}" data-mfield="steps"
            placeholder="（可選）這個方法的步驟，例：1. 食物在鼻子前  2. 慢慢往頭頂移..."
            rows="2">${escapeHtml(m.steps)}</textarea>
        </div>`;
    }

    document.getElementById('itemEditor').innerHTML = `
      <div class="card" style="cursor:default">
        <p class="card-meta" style="margin-bottom:10px">
          💡 每個訓練項目下可加多個「訓練方法」，每個方法有自己的步驟。
          上課時可勾選今天用了哪些方法，飼主端會看到對應步驟當回家功課指引。
        </p>
        ${list.map((it, i) => `
          <div class="item-edit-block">
            <div class="item-edit-top">
              <input data-i="${i}" data-field="name" value="${escapeAttr(it.name)}" placeholder="訓練項目名稱">
              <button class="small-btn" data-up="${i}" ${i===0?'disabled':''}>↑</button>
              <button class="small-btn danger" data-del="${i}">刪</button>
            </div>
            <div class="methods-wrap">
              ${(it.methods || []).map((m, j) => methodHtml(m, i, j)).join('')}
              <button class="small-btn add-method" data-addmethod="${i}">＋ 新增方法</button>
            </div>
          </div>
        `).join('')}
        <button class="btn ghost" id="addItem" style="margin-top:8px">＋ 新增訓練項目</button>
      </div>
    `;

    function updateItemField(i, field, value) {
      const cur = ensureItemShape(load(key, []));
      cur[i][field] = (field === 'name') ? value.trim() : value;
      save(key, cur);
    }
    function updateMethodField(i, j, field, value) {
      const cur = ensureItemShape(load(key, []));
      cur[i].methods[j][field] = (field === 'name') ? value.trim() : value;
      save(key, cur);
    }

    document.querySelectorAll('#itemEditor input[data-field]').forEach(inp => {
      inp.onchange = () => updateItemField(parseInt(inp.dataset.i), inp.dataset.field, inp.value);
    });
    document.querySelectorAll('#itemEditor input[data-mfield]').forEach(inp => {
      inp.onchange = () => updateMethodField(parseInt(inp.dataset.i), parseInt(inp.dataset.j), inp.dataset.mfield, inp.value);
    });
    document.querySelectorAll('#itemEditor textarea[data-mfield]').forEach(ta => {
      ta.onchange = () => updateMethodField(parseInt(ta.dataset.i), parseInt(ta.dataset.j), ta.dataset.mfield, ta.value);
    });
    document.querySelectorAll('[data-del]').forEach(btn => {
      btn.onclick = () => {
        const i = parseInt(btn.dataset.del);
        const cur = ensureItemShape(load(key, []));
        if (!confirm(`刪除「${cur[i].name}」整個項目？`)) return;
        cur.splice(i, 1);
        save(key, cur);
        renderItemEditor();
      };
    });
    document.querySelectorAll('[data-mdel]').forEach(btn => {
      btn.onclick = () => {
        const [i, j] = btn.dataset.mdel.split('_').map(Number);
        const cur = ensureItemShape(load(key, []));
        cur[i].methods.splice(j, 1);
        save(key, cur);
        renderItemEditor();
      };
    });
    document.querySelectorAll('[data-addmethod]').forEach(btn => {
      btn.onclick = () => {
        const i = parseInt(btn.dataset.addmethod);
        const cur = ensureItemShape(load(key, []));
        cur[i].methods.push({ name: '', steps: '' });
        save(key, cur);
        renderItemEditor();
      };
    });
    document.querySelectorAll('[data-up]').forEach(btn => {
      btn.onclick = () => {
        const i = parseInt(btn.dataset.up);
        if (i === 0) return;
        const cur = ensureItemShape(load(key, []));
        [cur[i-1], cur[i]] = [cur[i], cur[i-1]];
        save(key, cur);
        renderItemEditor();
      };
    });
    document.getElementById('addItem').onclick = () => {
      const cur = ensureItemShape(load(key, []));
      cur.push({ name: '新項目', methods: [] });
      save(key, cur);
      renderItemEditor();
    };
  }
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      currentTab = t.dataset.tab;
      renderItemEditor();
    };
  });
  renderItemEditor();

  // Data management
  document.getElementById('exportData').onclick = () => {
    const dump = {
      version: 1,
      pets: load(KEYS.pets, []),
      sessions: load(KEYS.sessions, []),
      itemsCat: load(KEYS.itemsCat, []),
      itemsDog: load(KEYS.itemsDog, []),
      exportedAt: new Date().toISOString(),
    };
    const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `petcare-backup-${todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };
  document.getElementById('importData').onclick = () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json';
    input.onchange = async () => {
      const file = input.files[0];
      if (!file) return;
      try {
        const data = JSON.parse(await file.text());
        if (!confirm('匯入會覆蓋現有資料，確定？')) return;
        if (data.pets) save(KEYS.pets, data.pets);
        if (data.sessions) save(KEYS.sessions, data.sessions);
        if (data.itemsCat) save(KEYS.itemsCat, data.itemsCat);
        if (data.itemsDog) save(KEYS.itemsDog, data.itemsDog);
        showNotice('匯入完成');
        render();
      } catch (e) {
        showNotice('匯入失敗：' + e.message, 'err');
      }
    };
    input.click();
  };
  document.getElementById('resetItems').onclick = () => {
    if (!confirm('將兩份清單還原為預設？你的自訂項目會消失。')) return;
    save(KEYS.itemsDog, DEFAULT_DOG_ITEMS);
    save(KEYS.itemsCat, DEFAULT_CAT_ITEMS);
    render();
  };
}

/* ============== HELPERS ============== */
function openModal(html) {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = html;
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  document.body.appendChild(overlay);
  return overlay;
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

/* ============== RENDER ============== */
function render() {
  updateHeader();
  if (state.view === 'pets') renderPets();
  else if (state.view === 'sessions') renderSessions();
  else if (state.view === 'session') renderSession();
  else if (state.view === 'settings') renderSettings();
}

initStorage();
render();
refreshSyncDot();
// 載入後背景同步（不阻塞 UI）
if (syncEnabled()) {
  setTimeout(() => pullFromCloud(), 200);
}
</script>
