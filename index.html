<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wendy 溫蒂．貓與狗訓練日常</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f7f3ed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wendy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f3ed;
    --bg-soft: #ede5d6;
    --brown: #4a4138;
    --brown-dark: #2c2620;
    --brown-light: #b8ad9a;
    --text: #2c2620;
    --text-soft: #7a716a;
    --border: #e0dcd4;
    --accent-warm: #c08a5e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
                 "Microsoft JhengHei", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 60px 24px 80px;
  }
  header.brand {
    text-align: center;
    margin-bottom: 56px;
  }
  header.brand img {
    max-width: 320px;
    width: 75%;
    height: auto;
  }
  header.brand h1 {
    color: var(--brown-dark);
    font-size: 24px;
    font-weight: 600;
    margin-top: 12px;
    letter-spacing: 0.5px;
  }
  .tagline {
    color: var(--text-soft);
    font-size: 13px;
    margin-top: 12px;
    letter-spacing: 2px;
    font-weight: 400;
    text-transform: uppercase;
  }
  .tools {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  @media (min-width: 600px) {
    .tools { grid-template-columns: 1fr 1fr; }
  }
  .tool-card {
    display: block;
    background: #ffffff;
    color: var(--text);
    text-decoration: none;
    border-radius: 8px;
    padding: 28px 22px;
    border: 1px solid var(--border);
    transition: border-color 0.2s, transform 0.2s;
  }
  .tool-card:hover {
    border-color: var(--accent-warm);
    transform: translateY(-1px);
  }
  .tool-icon {
    font-size: 32px;
    margin-bottom: 12px;
    color: var(--accent-warm);
  }
  .tool-title {
    font-size: 17px;
    font-weight: 600;
    color: var(--brown-dark);
    margin-bottom: 6px;
    letter-spacing: 0.3px;
  }
  .tool-desc {
    font-size: 13px;
    color: var(--text-soft);
    line-height: 1.6;
  }
  .footer {
    text-align: center;
    margin-top: 56px;
    font-size: 12px;
    color: var(--text-soft);
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="page">
  <header class="brand">
    <img src="logo.png" alt="Wendy 溫蒂．貓與狗訓練日常"
         onerror="this.outerHTML='<h1>Wendy 溫蒂．貓與狗訓練日常</h1>'">
    <div class="tagline">Cat &amp; Dog Training · Pet Care</div>
  </header>

  <div class="tools">
    <a class="tool-card" href="training/">
      <div class="tool-icon">📒</div>
      <div class="tool-title">訓練課程記錄</div>
      <div class="tool-desc">寵物資料、課程記錄、訓練項目與方法、一鍵分享報告給飼主</div>
    </a>
    <a class="tool-card" href="care/">
      <div class="tool-icon">🩺</div>
      <div class="tool-title">照護日記</div>
      <div class="tool-desc">每日照護紀錄與雲端分享</div>
    </a>
  </div>

  <div class="footer">
    Wendy 溫蒂．貓與狗訓練日常
  </div>
</div>
</body>
</html>
