<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ede5d6">
<title>泰迪照護每日紀錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* 北歐風配色（對齊訓練 app） */
    --bg:#f7f3ed; --card:#ffffff; --header-bg:#ede5d6;
    --accent:#c08a5e; --accent-soft:#b8ad9a;
    --text:#2c2620; --muted:#7a716a; --border:#e0dcd4;
    --input-bg:#fafafa; --warn:#fff8e1; --warn-bd:#f0d878;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Inter','Noto Sans TC',-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg); color:var(--text); font-size:16px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .container{max-width:720px; margin:0 auto; padding:16px;}

  /* Top nav (麵包屑 + 同步狀態 + 設定) — 對齊訓練 app 北歐風 */
  .top-nav {
    background: #ffffff;
    color: var(--text);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid var(--border);
    max-width: 720px;
    margin: 0 auto;
  }
  .top-nav .brand-logo {
    display: flex;
    align-items: center;
    flex-shrink: 0;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 6px;
    transition: background 0.15s;
    text-decoration: none;
  }
  .top-nav .brand-logo:hover { background: var(--header-bg); }
  .top-nav .brand-logo img {
    height: 28px;
    width: auto;
    display: block;
  }
  .top-nav .breadcrumb {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 2px;
    font-size: 13px;
    color: var(--muted);
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: none;
    min-width: 0;
  }
  .top-nav .breadcrumb::-webkit-scrollbar { display: none; }
  .top-nav .bc-link {
    color: inherit;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .top-nav .bc-link:hover { background: var(--header-bg); }
  .top-nav .bc-current {
    color: var(--text);
    font-weight: 600;
    padding: 4px 6px;
    flex-shrink: 0;
  }
  .top-nav .bc-sep {
    color: var(--accent-soft);
    padding: 0 1px;
    flex-shrink: 0;
  }
  .top-nav .sync-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #999;
    margin: 0 4px;
    cursor: help;
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .top-nav .sync-dot.ok { background: #6b9e6e; }
  .top-nav .sync-dot.syncing { background: #c9a85a; animation: pulse 1.2s ease-in-out infinite; }
  .top-nav .sync-dot.pending { background: #c9a85a; }
  .top-nav .sync-dot.error { background: #c97a4f; }
  .top-nav .sync-dot.disabled { background: #999; opacity: 0.5; }
  @keyframes pulse { 50% { opacity: 0.4; } }
  .top-nav .icon-btn {
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .top-nav .icon-btn:hover { background: var(--header-bg); }
  .header{
    background:var(--header-bg); border-radius:12px; padding:16px 20px;
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px; gap:12px;
  }
  .header h1{margin:0; font-size:24px; font-weight:800; letter-spacing:1px; display:flex; align-items:baseline; flex-wrap:wrap; gap:4px;}
  .pet-selector{
    font-size:24px; font-weight:800; letter-spacing:1px;
    background:transparent; border:none; padding:0 6px;
    color:var(--accent); font-family:inherit; cursor:pointer;
    border-bottom:2px dashed var(--accent-soft);
  }
  .pet-selector:active{transform:scale(.98);}
  .pet-selector .caret{font-size:12px; vertical-align:middle; opacity:.6; margin-left:2px;}
  .pet-card{
    display:flex; align-items:center; gap:10px; padding:12px 14px;
    border:1.5px solid var(--border); border-radius:10px;
    margin-bottom:8px; cursor:pointer; background:white;
  }
  .pet-card.active{border-color:var(--accent); background:var(--header-bg);}
  .pet-card .pet-emoji{font-size:24px; flex:0 0 auto;}
  .pet-card .pet-info{flex:1; min-width:0;}
  .pet-card .pet-info .pet-name{font-weight:700; font-size:16px;}
  .pet-card .pet-info .pet-detail{font-size:12px; color:var(--muted); margin-top:2px;}
  .pet-card .pet-actions{display:flex; gap:4px;}
  .pet-card .pet-actions button{
    flex:0 0 auto; padding:4px 10px; font-size:13px;
    background:transparent; color:var(--muted);
    border:1px solid var(--border); border-radius:6px;
  }
  .pet-card .pet-actions button:hover{color:var(--accent);}
  .pet-form .row{margin-bottom:10px;}
  .pet-form .row > .lbl{flex:0 0 56px;}
  .pet-form input[type=text], .pet-form textarea{
    background:var(--input-bg);
  }
  .header .date-input{
    margin-top:6px; font-size:14px; padding:4px 8px; color:var(--muted);
    background:transparent; border:1px dashed var(--accent-soft); border-radius:6px;
    font-family:inherit;
  }
  .add-pet-btn{
    margin-top:8px; font-size:13px; padding:6px 12px;
    color:var(--accent); background:transparent;
    border:1px solid var(--accent-soft); border-radius:6px;
    cursor:pointer; font-family:inherit; font-weight:600;
  }
  .add-pet-btn:hover{ background:var(--header-bg); }
  .add-pet-btn:active{ transform:scale(.98); }
  /* === 寵物列表 view === */
  .pet-list{ display:flex; flex-direction:column; gap:10px; }
  .pet-list-empty{
    text-align:center; padding:48px 24px; color:var(--muted);
    background:var(--card); border:1.5px dashed var(--border); border-radius:10px;
  }
  .pet-list-card{
    background:var(--card);
    border:1.5px solid var(--border); border-radius:10px;
    padding:14px 16px; cursor:pointer;
    display:flex; align-items:center; gap:12px;
    transition:border-color .15s, transform .1s;
  }
  .pet-list-card:hover{ border-color:var(--accent); }
  .pet-list-card:active{ transform:scale(.99); }
  .pet-list-card .plc-emoji{ font-size:32px; flex:0 0 auto; }
  .pet-list-card .plc-info{ flex:1; min-width:0; }
  .pet-list-card .plc-name{ font-weight:700; font-size:18px; color:var(--text); }
  .pet-list-card .plc-meta{ font-size:13px; color:var(--muted); margin-top:3px; line-height:1.4; }
  .pet-list-card .plc-recent{ font-size:12px; color:var(--accent); margin-top:2px; }
  .pet-list-card .plc-badge{
    flex:0 0 auto; padding:6px 10px; font-size:13px; font-weight:600;
    background:var(--header-bg); color:var(--accent); border-radius:6px;
  }
  /* Tabs（物種分類）— 對齊訓練 app */
  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 14px;
    background: transparent;
    padding: 0;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .tab {
    flex-shrink: 0;
    padding: 10px 16px;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    transition: color 0.15s, border-color 0.15s;
    margin-bottom: -1px;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }
  .tab-action {
    margin-left: auto;
    padding: 6px 14px;
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
    flex-shrink: 0;
    margin-bottom: 4px;
  }
  .tab-action:hover { background: #8b4d22; }
  .tab-action:active { transform: translateY(1px); }
  /* 品種 chips */
  .source-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }
  .source-chip {
    padding: 5px 12px;
    background: #ffffff;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }
  .source-chip:hover { border-color: var(--accent); color: var(--accent); }
  .source-chip.active {
    background: var(--text);
    color: #ffffff;
    border-color: var(--text);
  }
  /* 搜尋框 */
  .search-input {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    background: #ffffff;
    color: var(--text);
    margin-bottom: 12px;
  }
  .search-input:focus { outline: none; border-color: var(--accent); }
  .brand{
    text-align:right; font-weight:800; font-size:20px; color:var(--accent);
    line-height:1.1;
  }
  .brand .sub{font-size:10px; color:var(--muted); font-weight:500; margin-top:4px; letter-spacing:1px;}
  .brand .logo{font-size:28px;}
  .brand .logo-img{
    display:block; max-width:88px; max-height:60px; width:auto; height:auto;
    margin:0 0 4px auto; object-fit:contain;
  }
  .section{
    background:var(--card); border-radius:12px; margin-bottom:12px;
    overflow:hidden; border:1px solid var(--border);
  }
  .section-title{
    background:var(--header-bg); padding:10px 16px; font-weight:700;
    font-size:15px; text-align:center; letter-spacing:1px;
  }
  .section-body{padding:14px 16px;}
  .row{display:flex; gap:10px; align-items:flex-start; margin-bottom:10px;}
  .row:last-child{margin-bottom:0;}
  .row > .lbl{
    flex:0 0 56px; background:var(--input-bg); padding:8px;
    border-radius:6px; font-weight:700; text-align:center; font-size:14px;
    align-self:stretch; display:flex; align-items:center; justify-content:center;
  }
  .row .field{flex:1; min-width:0;}
  input[type=text], input[type=number], textarea, select{
    width:100%; padding:10px 12px; border:1px solid var(--border);
    border-radius:8px; background:var(--input-bg); font-size:16px;
    font-family:inherit; color:var(--text);
  }
  input[type=number]{ -moz-appearance:textfield; }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  textarea{min-height:72px; resize:vertical;}
  .water-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .water-grid .cell{text-align:center;}
  .water-grid .cell label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px;}
  .water-grid input{text-align:center;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:0;}
  .two-col > div{padding:14px 16px;}
  .two-col > div:first-child{border-right:1px solid var(--border);}
  .col-title{font-weight:700; text-align:center; margin-bottom:10px; font-size:15px; letter-spacing:1px;}
  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{
    display:inline-flex; align-items:center; gap:4px; padding:7px 12px;
    border:1.5px solid var(--border); border-radius:8px; background:white;
    font-size:13px; cursor:pointer; user-select:none; transition:all .15s;
  }
  .chip input{display:none;}
  .chip:has(input:checked){
    background:var(--accent); color:white; border-color:var(--accent);
  }
  .num-with-unit{display:flex; gap:6px; align-items:center;}
  .num-with-unit input{flex:1;}
  .num-with-unit .unit{font-size:14px; color:var(--muted);}

  /* 日期歷史 chips */
  .date-history{
    display:flex; gap:6px; margin:8px 0 12px;
    overflow-x:auto; padding-bottom:4px;
    -webkit-overflow-scrolling:touch;
  }
  .date-history:empty{ margin:0; }
  .date-chip{
    flex:0 0 auto; white-space:nowrap;
    padding:5px 12px; font-size:12px;
    background:var(--input-bg); border:1px solid var(--border);
    border-radius:14px; cursor:pointer; color:var(--muted);
    font-family:inherit;
  }
  .date-chip.active{
    background:var(--accent); color:white; border-color:var(--accent);
    font-weight:700;
  }
  .date-chip.today-empty{
    background:white; border-style:dashed; color:var(--accent-soft);
  }

  /* 嘔吐有/無 收合控制 */
  #vomitDetails{display:none; margin-top:10px;}
  #bodySection:has(input[name="vomit_status"][value="有"]:checked) #vomitDetails{
    display:block;
  }
  .actions{display:flex; gap:8px; margin-top:16px;}
  button{
    flex:1; padding:14px; border-radius:10px; border:none;
    background:var(--accent); color:white; font-size:16px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }
  button.secondary{
    background:white; color:var(--accent); border:1.5px solid var(--accent);
  }
  button:active{transform:scale(.98);}
  .share-result{
    margin-top:12px; padding:14px; background:white;
    border:1px solid var(--border); border-radius:10px; display:none;
  }
  .share-result.show{display:block;}
  .share-url{
    word-break:break-all; font-family:ui-monospace,monospace;
    font-size:12px; background:var(--input-bg); padding:10px;
    border-radius:6px; margin-bottom:8px; max-height:96px; overflow-y:auto;
    color:var(--muted);
  }
  .photo-grid{
    display:flex; flex-wrap:wrap; gap:8px;
  }
  .photo{
    position:relative; height:120px; flex:0 0 auto;
    border-radius:8px; overflow:hidden; background:var(--input-bg);
  }
  .photo img{
    height:100%; width:auto; display:block;
  }
  .photo .remove{
    position:absolute; top:4px; right:4px; background:rgba(0,0,0,.6);
    color:white; border-radius:50%; width:22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    border:none; cursor:pointer; padding:0; font-size:14px; line-height:1;
  }
  .photo-add{
    border:2px dashed var(--border); display:flex; align-items:center;
    justify-content:center; flex-direction:column; cursor:pointer;
    color:var(--muted); font-size:12px;
    width:120px; height:120px; flex:0 0 auto;
    border-radius:8px;
  }
  .photo-add input{display:none;}
  .photo-add .plus{font-size:24px; line-height:1;}
  .photo-note{font-size:12px; color:var(--muted); margin-top:8px;}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:#2d2620; color:white; padding:10px 18px; border-radius:8px;
    opacity:0; transition:opacity .25s; z-index:1000; pointer-events:none;
    font-size:14px;
  }
  .toast.show{opacity:1;}

  /* 多日選擇彈窗 */
  .modal{
    position:fixed; inset:0; background:rgba(0,0,0,.5);
    display:flex !important; align-items:center; justify-content:center;
    z-index:2000; padding:16px;
  }
  .modal[style*="none"]{display:none !important;}
  .modal-card{
    background:white; border-radius:12px; width:100%; max-width:480px;
    max-height:80vh; display:flex; flex-direction:column; overflow:hidden;
  }
  .modal-header{
    padding:14px 18px; border-bottom:1px solid var(--border);
    font-weight:700; font-size:16px;
  }
  .modal-body{
    padding:8px 18px; overflow-y:auto; flex:1;
  }
  .modal-body label{
    display:flex; align-items:center; gap:10px; padding:8px 0;
    border-bottom:1px solid var(--border); cursor:pointer;
  }
  .modal-body label:last-child{border-bottom:none;}
  .modal-body label input{width:18px; height:18px;}
  .modal-body .summary{font-size:12px; color:var(--muted); margin-left:auto;}
  .modal-actions{
    display:flex; gap:8px; padding:12px 18px;
    border-top:1px solid var(--border);
  }
  .modal-actions button{flex:1; padding:12px;}
  .modal-toolbar{
    display:flex; gap:8px; padding:6px 18px 0;
  }
  .modal-toolbar button{
    flex:0 0 auto; padding:4px 10px; font-size:13px; font-weight:500;
    background:transparent; color:var(--accent); border:1px solid var(--border);
    border-radius:6px;
  }

  /* 多日報告檢視 */
  body.multiday-mode .container, body.multiday-mode #toast{display:none;}
  body.viewer-only{ background:var(--bg); }
  body.viewer-only .container, body.viewer-only #petModal, body.viewer-only #multiModal{
    display:none !important;
  }
  #multiReport{
    max-width:760px; margin:0 auto; padding:16px;
  }
  .report-toolbar{
    position:sticky; top:0; background:var(--bg); padding:8px 0 12px;
    display:flex; gap:8px; z-index:10; margin-bottom:8px;
  }
  .report-toolbar button{padding:10px 14px; font-size:14px;}
  .report-cover{
    background:white; border:1px solid var(--border); border-radius:12px;
    padding:24px 20px; text-align:center; margin-bottom:12px;
  }
  .report-cover .cover-logo{
    max-width:120px; max-height:80px; margin:0 auto 16px;
  }
  .report-cover h1{
    font-size:28px; margin:0 0 8px; letter-spacing:2px;
  }
  .report-cover .pet{
    font-size:22px; color:var(--accent); font-weight:700; margin:8px 0;
  }
  .report-cover .period{
    font-size:16px; color:var(--muted); margin:8px 0 24px;
  }
  .report-cover .stats{
    display:grid; grid-template-columns:repeat(2,1fr); gap:8px;
    text-align:left; max-width:360px; margin:0 auto;
  }
  .report-cover .stats .stat{
    background:var(--input-bg); padding:10px 14px; border-radius:8px;
  }
  .report-cover .stats .stat .label{font-size:12px; color:var(--muted);}
  .report-cover .stats .stat .value{font-size:18px; font-weight:700; color:var(--text);}
  .report-cover .signoff{
    margin-top:32px; font-size:13px; color:var(--muted); line-height:1.7;
  }
  .day-card{
    background:white; border:1px solid var(--border); border-radius:12px;
    padding:18px 22px; margin-bottom:12px;
    page-break-inside:avoid; break-inside:avoid-page;
  }
  .day-card + .day-card{ page-break-before:always; break-before:page; }
  .day-card h2{
    margin:0 0 12px; font-size:20px; padding-bottom:8px;
    border-bottom:2px solid var(--header-bg);
  }
  .day-card .day-row{
    display:flex; gap:8px; padding:6px 0; font-size:14px;
    border-bottom:1px dashed var(--border);
  }
  .day-card .day-row:last-child{border-bottom:none;}
  .day-card .day-row .key{
    flex:0 0 76px; font-weight:700; color:var(--accent);
  }
  .day-card .day-row .val{flex:1;}
  .day-card .empty{color:var(--muted); font-style:italic;}

  /* 表格式多日報告 */
  .report-table-wrap{
    background:white; border-radius:10px; overflow:auto;
    margin-bottom:12px; border:1px solid var(--border);
  }
  .report-table{
    width:100%; border-collapse:collapse; font-size:13px;
  }
  .report-table th, .report-table td{
    border:1px solid var(--border); padding:8px 10px;
    text-align:left; vertical-align:top;
    word-break:break-word;
  }
  .report-table thead th{
    background:var(--header-bg); font-weight:700;
    text-align:center; white-space:nowrap;
  }
  .report-table tbody th{
    background:var(--input-bg); font-weight:700;
    color:var(--accent); text-align:center;
    white-space:nowrap; width:1%;
  }
  .report-table td.empty{ color:#ccc; text-align:center; }
  .report-table td.highlight{ background:#fff8e1; }
  .report-orient-toggle{
    display:inline-flex; gap:0; border-radius:6px; overflow:hidden;
    border:1.5px solid var(--accent); margin-left:auto;
  }
  .report-orient-toggle button{
    padding:6px 12px; font-size:13px; background:white;
    color:var(--accent); border:none; border-radius:0;
    flex:0 0 auto; cursor:pointer;
  }
  .report-orient-toggle button.active{
    background:var(--accent); color:white;
  }

  @media print{
    body.multiday-mode #multiReport{padding:0; max-width:none;}
    body.multiday-mode .report-toolbar{display:none !important;}
    body.multiday-mode .report-cover, body.multiday-mode .day-card{
      border:none; box-shadow:none;
    }
    body.multiday-mode .report-cover{
      padding:14px 16px; margin-bottom:8px;
    }
    body.multiday-mode .report-cover h1{ font-size:18pt; }
    body.multiday-mode .report-cover .pet{ font-size:14pt; }
    body.multiday-mode .report-cover .stats .value{ font-size:13pt; }

<script>
// 短鍵命名（為了縮短 localStorage 體積）
const FIELD_MAP = {
  date:'d',
  meal:'m', meal_done:'md', meal_partial:'mp', meal_no:'mn', meal_water:'mw',
  water_1f:'w1', water_master:'wm', water_3f:'w3',
  snack:'s',
  med_name:'mn2', med_done:'mdd', med_smooth:'ms', med_diff:'mdf', med_skip:'msk',
  mood:'mo', mood_note:'mon',
  poop_count:'pc', pee_count:'uc',
  poop_normal:'pn', poop_soft:'ps', poop_hard:'ph',
  vomit_status:'vs',
  vomit_count:'vc', vomit_hairball:'vh', vomit_food:'vf', vomit_yellow:'vy', vomit_blood:'vb', vomit_note:'vn',
  note:'n'
};
const REVERSE = Object.fromEntries(Object.entries(FIELD_MAP).map(([k,v])=>[v,k]));

function $(id){ return document.getElementById(id); }
function getValue(id){
  // 先嘗試 radio group（依 name 找）
  const radioGroup = document.querySelectorAll(`input[type="radio"][name="${id}"]`);
  if(radioGroup.length > 0){
    const r = document.querySelector(`input[type="radio"][name="${id}"]:checked`);
    return r ? r.value : '';
  }
  const el = $(id);
  if(!el) return '';
  if(el.type==='checkbox') return el.checked? 1 : 0;
  return el.value;
}
function setValue(id, v){
  const radioGroup = document.querySelectorAll(`input[type="radio"][name="${id}"]`);
  if(radioGroup.length > 0){
    radioGroup.forEach(r => r.checked = (r.value === v));
    return;
  }
  const el = $(id);
  if(!el) return;
  if(el.type==='checkbox') el.checked = !!v;
  else el.value = v ?? '';
}
function collect(){
  const out = {};
  for(const [full, short] of Object.entries(FIELD_MAP)){
    const v = getValue(full);
    if(v!=='' && v!==0 && v!==false && v!=null) out[short] = v;
  }
  return out;
}
function apply(data){
  for(const [short, v] of Object.entries(data)){
    const full = REVERSE[short];
    if(full) setValue(full, v);
  }
}

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

// === 資料層 v2：多寵物 ===
const STORAGE_KEY = 'teddy_data_v2';
// 舊版 keys（用於遷移）
const LEGACY_RECORDS_KEY = 'teddy_records';
const LEGACY_PET_NAME_KEY = 'teddy_pet_name';
const LEGACY_PHOTO_PREFIX = 'teddy_photos_';
const LEGACY_DRAFT_KEY = 'teddy_draft';

function genId(){ return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
function speciesEmoji(s){ return s==='狗'?'🐶':s==='貓'?'🐱':'🐾'; }

function getData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  } catch(e){}
  return null;
}
function saveData(data){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  catch(e){ toast('儲存失敗，可能空間不足'); return; }
  // 雲端同步：只有啟用時才標 lastModified 與排程 push
  if (typeof teddySyncEnabled === 'function' && teddySyncEnabled()) {
    localStorage.setItem(TEDDY_SYNC.LAST_MOD_KEY, new Date().toISOString());
    if (typeof teddySchedulePush === 'function') teddySchedulePush();
  }
}

/* 匯出全部照護資料成 JSON 檔（gist 之外的第二層保險）。
 * 不包 PAT、sync flag — 還原時各裝置自己重新填、重新啟用。
 */
function exportTeddyBackup(){
  const data = getData() || {};
  const dump = {
    schemaVersion: 1,
    appName: 'wendy-pet-care',
    teddy_data_v2: data,
    exportedAt: new Date().toISOString(),
  };
  const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
  a.href = url;
  a.download = `teddy-care-backup-${today}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('已匯出備份');
}
function ensureData(){
  let data = getData();
  if(data) return data;
  // 第一次：嘗試從舊版遷移
  data = { pets:[], current_pet_id:null, records:{}, photos:{} };
  const oldName = localStorage.getItem(LEGACY_PET_NAME_KEY);
  const oldRecords = (()=>{ try{ return JSON.parse(localStorage.getItem(LEGACY_RECORDS_KEY)||'{}'); }catch(e){ return {}; } })();
  // 收集舊版所有照片 keys
  const oldPhotos = {};
  for(let i=0; i<localStorage.length; i++){
    const k = localStorage.key(i);
    if(k && k.startsWith(LEGACY_PHOTO_PREFIX)){
      const date = k.substring(LEGACY_PHOTO_PREFIX.length);
      try{ oldPhotos[date] = JSON.parse(localStorage.getItem(k)); }catch(e){}
    }
  }
  // 若舊資料存在則建立第一隻
  const hasLegacy = oldName || Object.keys(oldRecords).length || Object.keys(oldPhotos).length;
  if(hasLegacy){
    const id = genId();
    data.pets.push({
      id, name: oldName || '泰迪', species:'貓', owner:'', notes:''
    });
    data.current_pet_id = id;
    data.records[id] = oldRecords;
    data.photos[id] = oldPhotos;
  } else {
    // 全新使用者：建立預設一隻
    const id = genId();
    data.pets.push({ id, name:'泰迪', species:'貓', owner:'', notes:'' });
    data.current_pet_id = id;
  }
  saveData(data);
  return data;
}

function getCurrentPet(){
  const data = getData();
  if(!data || !data.pets.length) return null;
  return data.pets.find(p => p.id === data.current_pet_id) || data.pets[0];
}
function setCurrentPet(petId){
  const data = getData();
  data.current_pet_id = petId;
  saveData(data);
  refreshPetUI();
  loadDay($('date').value);
  loadPhotos();
  updateHistoryHint();
}
function refreshPetUI(){
  const pet = getCurrentPet();
  if(!pet) return;
  $('currentPetName').textContent = pet.name;
  const meta = [];
  if(pet.owner) meta.push(`飼主：${pet.owner}`);
  if(pet.species) meta.push(pet.species);
  if(pet.notes) meta.push(`📝 ${pet.notes}`);
  $('currentPetMeta').textContent = meta.join('・');
}

// === 照片：依寵物 + 日期分桶 ===
function getPetPhotos(petId, date){
  const data = getData();
  return (data?.photos?.[petId]?.[date]) || [];
}
function setPetPhotos(petId, date, photos){
  const data = getData();
  if(!data.photos[petId]) data.photos[petId] = {};
  if(photos.length === 0) delete data.photos[petId][date];
  else data.photos[petId][date] = photos;
  saveData(data);
}
function loadPhotos(){
  const grid = $('photoGrid');
  if(!grid) return;
  grid.innerHTML = '';
  const pet = getCurrentPet();
  const date = $('date').value;
  if(!pet || !date) return;
  const photos = getPetPhotos(pet.id, date);
  photos.forEach((src, idx)=>{
    const div = document.createElement('div');
    div.className = 'photo';
    div.innerHTML = `<img src="${src}" alt=""><button class="remove" onclick="removePhoto(${idx})" type="button">×</button>`;
    grid.appendChild(div);
  });
  const add = document.createElement('label');
  add.className = 'photo-add';
  add.innerHTML = `<div class="plus">＋</div><div>加照片</div>
    <input type="file" accept="image/*" capture="environment" onchange="addPhoto(event)">`;

function addPhoto(e){
  const file = e.target.files[0];
  if(!file) return;
  const pet = getCurrentPet(), date = $('date').value;
  if(!pet || !date) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const img = new Image();
    img.onload = ()=>{
      // 壓縮：最長邊 800px、JPEG 0.7
      const max = 800;
      const ratio = Math.min(max / img.width, max / img.height, 1);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * ratio);
      canvas.height = Math.round(img.height * ratio);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      const photos = getPetPhotos(pet.id, date);
      photos.push(dataUrl);
      setPetPhotos(pet.id, date, photos);
      loadPhotos();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}
function removePhoto(idx){
  if(!confirm('刪除這張照片？')) return;
  const pet = getCurrentPet(), date = $('date').value;

  photos.splice(idx, 1);
  setPetPhotos(pet.id, date, photos);
  loadPhotos();
}

let _lastChipsKey = null;
function renderDateHistory(){
  const el = $('dateHistory');
  if(!el) return;
  const records = getRecords();
  const dates = Object.keys(records).sort().reverse();
  const today = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
  const currentDate = $('date').value;
  // 快取：避免每次按鍵都重繪（會打斷 chips 的水平捲動位置）
  const key = JSON.stringify([dates, currentDate, today]);
  if(_lastChipsKey === key) return;
  _lastChipsKey = key;
  let html = '';
  // 若今天還沒有紀錄，顯示「今天 (空)」
  if(!dates.includes(today)){
    const cls = `date-chip today-empty ${currentDate===today?'active':''}`;
    html += `<button type="button" class="${cls}" onclick="switchToDate('${today}')">今天 (空)</button>`;
  }
  html += dates.map(d => {
    const dt = new Date(d + 'T00:00:00');
    const w = ['日','一','二','三','四','五','六'][dt.getDay()];
    const isCurrent = d === currentDate;
    const isToday = d === today;
    return `<button type="button" class="date-chip ${isCurrent?'active':''}" onclick="switchToDate('${d}')">${dt.getMonth()+1}/${dt.getDate()} 週${w}${isToday?' (今)':''}</button>`;
  }).join('');
  el.innerHTML = html;
}

function makeShortSummary(data){

// 欄位 → 顯示值
function renderRecord(date, data){
  const rows = [];
  // 飲食

  if(data.m) foodParts.push(data.m);
  if(data.md) foodParts.push('✓吃完');
  if(data.mp) foodParts.push('✓吃部分');
  if(data.mn) foodParts.push('✗沒吃');
  if(data.mw) foodParts.push('✓加水');
  if(foodParts.length) rows.push({k:'正餐', v:foodParts.join('、')});
  // 飲水
  const waterParts = [];
  if(data.w1) waterParts.push('一樓');
  if(data.wm) waterParts.push('主臥');
  if(data.w3) waterParts.push('三樓');
  if(waterParts.length) rows.push({k:'飲水', v:waterParts.join('、')});
  // 零食
  if(data.s) rows.push({k:'零食', v:data.s});
  // 餵藥
  const medParts = [];
  if(data.mn2) medParts.push(data.mn2);
  if(data.mdd) medParts.push('已餵');
  if(data.ms) medParts.push('順利');
  if(data.mdf) medParts.push('不易餵');
  if(data.msk) medParts.push('未餵');
  if(medParts.length) rows.push({k:'餵藥', v:medParts.join('、')});
  // 精神
  const moodParts = [];
  if(data.mo) moodParts.push(data.mo);
  if(data.mon) moodParts.push(data.mon);
  if(moodParts.length) rows.push({k:'精神', v:moodParts.join('，')});
  // 排泄
  const excrParts = [];
  if(data.pc) excrParts.push(`便 ${data.pc} 顆`);
  if(data.uc) excrParts.push(`尿 ${data.uc} 塊`);
  if(data.pn) excrParts.push('形狀正常');
  if(data.ps) excrParts.push('軟便');
  if(data.ph) excrParts.push('硬便');
  if(excrParts.length) rows.push({k:'排泄', v:excrParts.join('、')});
  // 身體狀況（嘔吐有/無）
  if(data.vs === '無'){
    rows.push({k:'身體狀況', v:'嘔吐：無'});
  } else if(data.vs === '有' || (!data.vs && (data.vc||data.vh||data.vf||data.vy||data.vb||data.vn))){
    const bodyParts = ['嘔吐：有'];
    if(data.vc) bodyParts.push(`${data.vc} 次`);
    if(data.vh) bodyParts.push('毛球');
    if(data.vf) bodyParts.push('食物');
    if(data.vy) bodyParts.push('黃水/胃液');
    if(data.vb) bodyParts.push('有血');
    if(data.vn) bodyParts.push(`(${data.vn})`);
    rows.push({k:'身體狀況', v:bodyParts.join('、')});
  }
  // 備註
  if(data.n) rows.push({k:'備註', v:data.n});

  const dayLabel = formatDate(date);
  if(rows.length === 0){
    return `<div class="day-card"><h2>${dayLabel}</h2><div class="empty">這天沒有紀錄</div></div>`;

    <h2>${dayLabel}</h2>
    ${rows.map(r=>`<div class="day-row"><div class="key">${r.k}</div><div class="val">${escapeHtml(r.v)}</div></div>`).join('')}
  </div>`;
}
function formatDate(d){
  // 2026-05-04 → 2026/5/4 (週一)

  return `${dt.getFullYear()}/${dt.getMonth()+1}/${dt.getDate()}（週${w}）`;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// === GitHub Gist 同步 ===
const GITHUB_PAT_KEY = 'teddy_github_pat';
function getPat(){ return localStorage.getItem(GITHUB_PAT_KEY) || ''; }
function setPat(v){ localStorage.setItem(GITHUB_PAT_KEY, v); }

// === Cross-Device Cloud Sync (跨裝置同步) ===
const TEDDY_SYNC = {
  GIST_DESCRIPTION: 'Wendy 照護資料同步 v1',
  ENABLED_KEY: 'teddy_sync_enabled',
  GIST_ID_KEY: 'teddy_sync_gist_id',
  LAST_MOD_KEY: 'teddy_sync_last_modified',
  LAST_TIME_KEY: 'teddy_sync_last_time',
  pushTimer: null,
  pushing: false,
  pulling: false,
  status: 'idle',
  lastError: '',
  statusListeners: [],
};

function teddySyncEnabled() {
  return localStorage.getItem(TEDDY_SYNC.ENABLED_KEY) === '1' && !!getPat();
}
function setTeddySyncEnabled(on) {
  if (on) localStorage.setItem(TEDDY_SYNC.ENABLED_KEY, '1');
  else localStorage.removeItem(TEDDY_SYNC.ENABLED_KEY);
}
function setTeddySyncStatus(status, errMsg) {
  TEDDY_SYNC.status = status;
  TEDDY_SYNC.lastError = errMsg || '';
  TEDDY_SYNC.statusListeners.forEach(fn => { try { fn(); } catch(e){} });
}
function onTeddySyncStatusChange(fn) { TEDDY_SYNC.statusListeners.push(fn); }

async function findOrCreateTeddySyncGist() {
  let gistId = localStorage.getItem(TEDDY_SYNC.GIST_ID_KEY);
  if (gistId) return gistId;
  const list = await gistApi('GET', '/gists?per_page=100');
  const found = (list || []).find(g => (g.description || '').startsWith(TEDDY_SYNC.GIST_DESCRIPTION));
  if (found) {
    localStorage.setItem(TEDDY_SYNC.GIST_ID_KEY, found.id);
    return found.id;
  }
  const result = await gistApi('POST', '/gists', {
    description: TEDDY_SYNC.GIST_DESCRIPTION,
    public: false,
    files: { 'data.json': { content: '{}' } },
  });
  localStorage.setItem(TEDDY_SYNC.GIST_ID_KEY, result.id);
  return result.id;
}

function buildTeddySyncPayload() {
  const data = getData() || {};
  return {
    schemaVersion: 1,
    lastModified: localStorage.getItem(TEDDY_SYNC.LAST_MOD_KEY) || '',
    teddy_data_v2: data,
  };
}

function applyTeddySyncPayload(remote) {
  if (!remote || typeof remote !== 'object') return false;
  if (remote.teddy_data_v2 && typeof remote.teddy_data_v2 === 'object') {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(remote.teddy_data_v2));
  }
  if (remote.lastModified) {
    localStorage.setItem(TEDDY_SYNC.LAST_MOD_KEY, remote.lastModified);
  }
  return true;
}

async function teddyPushToCloud() {
  if (!teddySyncEnabled()) return;
  if (TEDDY_SYNC.pushing) return;
  TEDDY_SYNC.pushing = true;
  setTeddySyncStatus('syncing');
  try {
    const gistId = await findOrCreateTeddySyncGist();
    // 推之前蓋成現在時間，給其他裝置正確時間戳比較
    localStorage.setItem(TEDDY_SYNC.LAST_MOD_KEY, new Date().toISOString());
    const payload = buildTeddySyncPayload();
    await gistApi('PATCH', '/gists/' + gistId, {
      files: { 'data.json': { content: JSON.stringify(payload, null, 2) } },
    });
    localStorage.setItem(TEDDY_SYNC.LAST_TIME_KEY, new Date().toISOString());
    setTeddySyncStatus('ok');
  } catch (e) {
    setTeddySyncStatus('error', e.message || String(e));
    console.warn('Teddy sync push failed:', e);
  } finally {
    TEDDY_SYNC.pushing = false;
  }
}

function teddySchedulePush() {
  if (!teddySyncEnabled()) return;
  setTeddySyncStatus('pending');
  clearTimeout(TEDDY_SYNC.pushTimer);
  TEDDY_SYNC.pushTimer = setTimeout(teddyPushToCloud, 3000);
}

async function teddyPullFromCloud(opts) {
  opts = opts || {};
  if (!teddySyncEnabled()) return;
  if (TEDDY_SYNC.pulling) return;
  TEDDY_SYNC.pulling = true;
  setTeddySyncStatus('syncing');
  try {
    const gistId = await findOrCreateTeddySyncGist();
    const gist = await gistApi('GET', '/gists/' + gistId);
    const file = gist && gist.files && gist.files['data.json'];
    if (!file || !file.content) {
      // 雲端空 → 推本機上去
      TEDDY_SYNC.pulling = false;
      await teddyPushToCloud();
      return;
    }
    let content = file.content;
    if (file.truncated && file.raw_url) {
      const r = await fetch(file.raw_url);
      content = await r.text();
    }
    let remote;
    try { remote = JSON.parse(content || '{}'); }
    catch { throw new Error('雲端資料解析失敗'); }

    const localTs = localStorage.getItem(TEDDY_SYNC.LAST_MOD_KEY) || '';
    const remoteTs = remote.lastModified || '';

    // 防呆：本機 pets 是空的、雲端有資料 → 強制 pull（不可能誤推空資料蓋掉雲端）
    const localData = getData();
    const localEmpty = !localData || !Array.isArray(localData.pets) || localData.pets.length === 0;
    const remoteData = remote.teddy_data_v2 || {};
    const remoteHasData = Array.isArray(remoteData.pets) && remoteData.pets.length > 0;

    if (opts.forcePull || (remoteTs && remoteTs > localTs) || (localEmpty && remoteHasData)) {
      applyTeddySyncPayload(remote);
      localStorage.setItem(TEDDY_SYNC.LAST_TIME_KEY, new Date().toISOString());
      setTeddySyncStatus('ok');
      // 重新 render UI
      try {
        if (typeof refreshPetUI === 'function') refreshPetUI();
        const dateEl = document.getElementById('date');
        if (dateEl && dateEl.value && typeof loadDay === 'function') loadDay(dateEl.value);
        if (typeof renderDateHistory === 'function') renderDateHistory();
      } catch(e) { console.warn('Re-render after sync pull:', e); }
    } else if (opts.forcePush || localTs > remoteTs) {
      TEDDY_SYNC.pulling = false;
      await teddyPushToCloud();
      return;
    } else {
      localStorage.setItem(TEDDY_SYNC.LAST_TIME_KEY, new Date().toISOString());
      setTeddySyncStatus('ok');
    }
  } catch (e) {
    setTeddySyncStatus('error', e.message || String(e));
    console.warn('Teddy sync pull failed:', e);
  } finally {
    TEDDY_SYNC.pulling = false;
  }
}

async function gistApi(method, path, body){
  const pat = getPat();
  const headers = {
    'Accept':'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28'
  };
  if(pat) headers['Authorization'] = `Bearer ${pat}`;
  const opts = { method, headers };
  if(body){
    headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(`https://api.github.com${path}`, opts);
  if(!res.ok){
    const err = await res.json().catch(()=>({}));
    throw new Error(err.message || `HTTP ${res.status}`);
  }
  return res.json();
}

// 純上傳邏輯（無 UI），給 manual 和 auto 共用
async function _doSyncToGist(pet){
  const data = getData();
  // 重要：從新讀出來的 data 裡找到對應 pet，要修改的是這一份，否則 saveData 不會包含我們的修改
  const petInData = data.pets.find(p => p.id === pet.id);
  if(!petInData) throw new Error('找不到寵物');
  const records = data.records[petInData.id] || {};
  if(Object.keys(records).length === 0){
    throw new Error('還沒有紀錄');
  }
  const payload = {
    version: 1,
    pet: { name:petInData.name, species:petInData.species, owner:petInData.owner||'', notes:petInData.notes||'' },
    records: records,
    lastUpdate: new Date().toISOString()
  };
  const fileName = `${petInData.name || 'pet'}_照護紀錄.json`;
  const content = JSON.stringify(payload, null, 2);
  let gistId = petInData.gistId;
  let createdNew = false;
  if(!gistId){
    const result = await gistApi('POST', '/gists', {
      description:`${petInData.name} 照護紀錄（由 Wendy 維護）`,
      public:false,
      files:{ [fileName]:{ content } }
    });
    gistId = result.id;
    petInData.gistId = gistId;
    createdNew = true;
  } else {
    try{
      await gistApi('PATCH', `/gists/${gistId}`, {
        files:{ [fileName]:{ content } }
      });
    } catch(e){
      // Gist 可能被使用者手動刪了；fallback 建新的
      if(String(e.message).includes('404') || String(e.message).includes('Not Found')){
        const result = await gistApi('POST', '/gists', {
          description:`${petInData.name} 照護紀錄（由 Wendy 維護）`,
          public:false,
          files:{ [fileName]:{ content } }
        });
        gistId = result.id;
        petInData.gistId = gistId;
        createdNew = true;
      } else {
        throw e;
      }
    }
  }
  // 不論 create / patch / 重建，gistId 都寫回 localStorage
  saveData(data);
  // 也更新 caller 傳進來的 pet 物件參考
  pet.gistId = gistId;
  return location.origin + location.pathname + `?view=${gistId}`;
}

async function autoSyncToGist(){
  // 此函數保留以相容呼叫點，但實際上不再自動推
  // 真正的推送只透過 syncToGist()（按鈕觸發）
  return;
}

async function fetchGist(gistId){
  // 客戶端可以匿名讀 secret gist（有 ID 就行）
  // 防快取策略（避免觸發 CORS preflight，只用「簡單請求」+ URL 時間戳 + cache:no-store）
  const cacheBust = Date.now();
  const res = await fetch(`https://api.github.com/gists/${gistId}?_=${cacheBust}`, {
    cache: 'no-store',
    headers:{ 'Accept':'application/vnd.github+json' }
  });
  if(!res.ok) throw new Error(`無法讀取 (${res.status})`);
  const gist = await res.json();
  const file = Object.values(gist.files)[0];
  let content = file.content;
  if(file.truncated && file.raw_url){
    const sep = file.raw_url.includes('?') ? '&' : '?';
    const r = await fetch(file.raw_url + sep + `_=${cacheBust}`, { cache:'no-store' });
    content = await r.text();
  }
  return JSON.parse(content);
}

// === Excel (CSV) 匯出：當前寵物全部紀錄 ===
function exportPetCsv(){
  const pet = getCurrentPet();
  if(!pet){ toast('沒有寵物'); return; }
  const records = getRecords();
  const dates = Object.keys(records).sort();
  if(dates.length === 0){ toast('這隻還沒有紀錄'); return; }

  const data = getData();
  const photoBucket = data.photos[pet.id] || {};

  // 標題列
  const headers = [
    '日期', '星期',
    '正餐描述', '吃完', '吃部分', '沒吃', '加水',
    '飲水_一樓', '飲水_主臥', '飲水_三樓',
    '零食',
    '藥品', '已餵', '順利', '不易餵', '未餵',
    '精神', '精神描述',
    '便_顆數', '便_形狀正常', '便_軟便', '便_硬便',
    '尿_塊數',
    '嘔吐', '嘔吐次數', '嘔吐_毛球', '嘔吐_食物', '嘔吐_黃水胃液', '嘔吐_有血', '嘔吐物描述',
    '備註',
    '照片數'
  ];

  const yn = v => v ? 'V' : '';
  const rows = dates.map(d => {
    const r = records[d] || {};
    const dt = new Date(d + 'T00:00:00');
    const w = ['日','一','二','三','四','五','六'][dt.getDay()];
    const photos = photoBucket[d] || [];
    return [
      d, '週'+w,
      r.m||'', yn(r.md), yn(r.mp), yn(r.mn), yn(r.mw),
      yn(r.w1), yn(r.wm), yn(r.w3),
      r.s||'',
      r.mn2||'', yn(r.mdd), yn(r.ms), yn(r.mdf), yn(r.msk),
      r.mo||'', r.mon||'',
      r.pc||'', yn(r.pn), yn(r.ps), yn(r.ph),
      r.uc||'',
      r.vs||'', r.vc||'', yn(r.vh), yn(r.vf), yn(r.vy), yn(r.vb), r.vn||'',
      r.n||'',
      photos.length || ''
    ];
  });

  // CSV escape：含逗號/雙引號/換行的欄位需用 "" 包起來，內部 " 變成 ""
  const esc = v => {
    const s = String(v ?? '');
    return /[,"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  // 加 UTF-8 BOM，Excel 才能正確讀中文
  const csv = '﻿' + [headers, ...rows]
    .map(row => row.map(esc).join(','))
    .join('\r\n');

  const blob = new Blob([csv], { type:'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
  // 檔名：寵物名_照護紀錄_匯出日期.csv
  a.href = url;
  a.download = `${pet.name}_照護紀錄_${today}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast(`✅ ${pet.name} ${dates.length} 天紀錄已匯出`);
}

// Filter state (module-level)
let _petListSpeciesFilter = '';   // '' / '貓' / '狗' / '其他'
let _petListBreedFilter = '';
let _petListQuery = '';

function renderPetListView(){
  const data = ensureData();
  const list = $('petList');
  const filters = $('petListFilters');
  if(!list) return;

  const allPets = data.pets || [];

  // 0 寵物時：顯示空 state + 一顆置中新增按鈕（也保留 filters 區為空）
  if(allPets.length === 0){
    if(filters) filters.innerHTML = `
      <div style="display:flex; justify-content:flex-end; margin-bottom:14px;">
        <button type="button" class="tab-action" onclick="quickAddPet()">+ 新增寵物</button>
      </div>`;
    list.innerHTML = '<div class="pet-list-empty">尚未新增寵物<br><br>點上方「+ 新增寵物」開始</div>';
    return;
  }

  // 計算各物種數量
  const dogCount = allPets.filter(p => p.species === '狗').length;
  const catCount = allPets.filter(p => p.species === '貓').length;
  const otherCount = allPets.filter(p => p.species && p.species !== '狗' && p.species !== '貓').length;
  const sp = _petListSpeciesFilter;

  // 品種 chips（動態列出有寵物的品種）
  const breedCounts = {};
  allPets.forEach(p => {
    const b = (p.breed || '').trim();
    if(b) breedCounts[b] = (breedCounts[b] || 0) + 1;
  });
  const breedNames = Object.keys(breedCounts).sort((a, b) => breedCounts[b] - breedCounts[a]);
  const breedFilter = _petListBreedFilter;
  const breedChipsHtml = breedNames.length === 0 ? '' : `
    <div class="source-chips">
      <button class="source-chip ${breedFilter==='' ? 'active' : ''}" data-breed-filter="">全部品種</button>
      ${breedNames.map(n =>
        `<button class="source-chip ${breedFilter===n ? 'active' : ''}" data-breed-filter="${escapeHtml(n)}">${escapeHtml(n)} (${breedCounts[n]})</button>`
      ).join('')}
    </div>`;

  // 渲染 filters: tabs + 新增按鈕 + breed chips + search
  if(filters) filters.innerHTML = `
    <div class="tabs">
      <button class="tab ${sp==='' ? 'active' : ''}" data-species-filter="">全部 (${allPets.length})</button>
      ${dogCount > 0 ? `<button class="tab ${sp==='狗' ? 'active' : ''}" data-species-filter="狗">🐶 狗 (${dogCount})</button>` : ''}
      ${catCount > 0 ? `<button class="tab ${sp==='貓' ? 'active' : ''}" data-species-filter="貓">🐱 貓 (${catCount})</button>` : ''}
      ${otherCount > 0 ? `<button class="tab ${sp==='其他' ? 'active' : ''}" data-species-filter="其他">🐾 其他 (${otherCount})</button>` : ''}
      <button type="button" class="tab-action" onclick="quickAddPet()">+ 新增寵物</button>
    </div>
    ${breedChipsHtml}
    <input type="text" class="search-input" id="careSearch" placeholder="🔍 搜尋名字、品種或飼主" value="${escapeHtml(_petListQuery)}">
  `;

  // 綁定 filter 互動
  filters.querySelectorAll('[data-species-filter]').forEach(t => {
    t.onclick = () => { _petListSpeciesFilter = t.dataset.speciesFilter; renderPetListView(); };
  });
  filters.querySelectorAll('[data-breed-filter]').forEach(t => {
    t.onclick = () => { _petListBreedFilter = t.dataset.breedFilter; renderPetListView(); };
  });
  const searchEl = $('careSearch');
  if(searchEl){
    searchEl.oninput = (e) => {
      _petListQuery = e.target.value;
      const cursor = e.target.selectionStart;
      renderPetListView();
      const ne = $('careSearch');
      if(ne){ ne.focus(); ne.setSelectionRange(cursor, cursor); }
    };
  }

  // Filter pets
  const q = _petListQuery.trim().toLowerCase();
  let pets = allPets.slice();
  if(sp === '其他') pets = pets.filter(p => p.species && p.species !== '狗' && p.species !== '貓');
  else if(sp) pets = pets.filter(p => p.species === sp);
  if(breedFilter) pets = pets.filter(p => (p.breed || '').trim() === breedFilter);
  if(q){
    pets = pets.filter(p =>
      (p.name || '').toLowerCase().includes(q) ||
      (p.breed || '').toLowerCase().includes(q) ||
      (p.owner || '').toLowerCase().includes(q)
    );
  }

  if(pets.length === 0){
    list.innerHTML = '<div class="pet-list-empty">沒有符合條件的寵物<br><br>試試其他關鍵字或切換物種</div>';
    return;
  }

  list.innerHTML = pets.map(p => {
    const latest = petLatestDiaryDate(p.id);
    const count = petDiaryCount(p.id);
    const recentLabel = latest ? `最近紀錄：${latest}` : '尚未紀錄';
    const metaParts = [];
    if(p.species) metaParts.push(p.species);
    if(p.breed) metaParts.push(escapeHtml(p.breed));
    if(p.owner) metaParts.push(`飼主：${escapeHtml(p.owner)}`);
    const g = genderLabel(p);
    if(g) metaParts.push(g);
    const n = neuteredLabel(p);
    if(n) metaParts.push(n);
    return `<div class="pet-list-card" onclick="gotoDiary('${p.id}')">
      <div class="plc-emoji">${speciesEmoji(p.species)}</div>
      <div class="plc-info">
        <div class="plc-name">${escapeHtml(p.name)}</div>
        ${metaParts.length ? `<div class="plc-meta">${metaParts.join(' · ')}</div>` : ''}
        <div class="plc-recent">${recentLabel}</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
        <div class="plc-badge">${count} 筆</div>
        <button type="button" class="add-pet-btn" style="margin-top:0; padding:3px 10px; font-size:12px;"
                onclick="event.stopPropagation(); openPetEditForm('${p.id}')">編輯</button>
      </div>
    </div>`;
  }).join('');
}

// 從現有客戶連結匯入（跨裝置接續用）
async function importFromShareLink(petId){
  const input = prompt('貼上現有客戶連結（或 Gist ID）：\n例如 https://...?view=abc123\n或 abc123');
  if(!input) return;
  // 解析 gistId：可吃完整 URL 或純 ID
  let gistId = input.trim();
  const m = gistId.match(/[?&]view=([a-f0-9]+)/i);
  if(m) gistId = m[1];
  if(!/^[a-f0-9]{20,}$/i.test(gistId)){
    toast('連結格式不對，無法解析 Gist ID');
    return;
  }
  toast('匯入中…');
  try{
    const cloud = await fetchGist(gistId);
    if(!cloud || !cloud.records){
      throw new Error('Gist 內容格式不對');
    }
    const data = ensureData();
    const pet = data.pets.find(p=>p.id===petId);
    if(!pet) throw new Error('找不到寵物');
    const localCount = Object.keys(data.records[petId] || {}).length;
    const cloudCount = Object.keys(cloud.records).length;
    if(localCount > 0){
      const ok = confirm(
        `本地有 ${localCount} 天紀錄，雲端有 ${cloudCount} 天。\n` +
        `匯入會用雲端資料覆蓋本地紀錄與寵物設定。\n` +
        `照片不會被影響（雲端不存照片）。\n\n繼續？`
      );
      if(!ok) return;
    }
    // 套用：寵物設定（雲端優先）+ gistId + records
    pet.gistId = gistId;
    if(cloud.pet){
      if(cloud.pet.name) pet.name = cloud.pet.name;
      if(cloud.pet.species) pet.species = cloud.pet.species;
      if(cloud.pet.owner !== undefined) pet.owner = cloud.pet.owner;
      if(cloud.pet.notes !== undefined) pet.notes = cloud.pet.notes;
    }
    data.records[petId] = cloud.records;
    saveData(data);
    refreshPetUI();
    loadDay($('date').value);
    loadPhotos();
    renderDateHistory();
    renderPetList();
    toast(`✅ 已匯入 ${cloudCount} 天紀錄`);
  } catch(e){
    toast('❌ 匯入失敗：' + e.message);
  }
}

function clearPetRecords(petId){
  const data = ensureData();
  const pet = data.pets.find(p=>p.id===petId);
  if(!pet) return;
  const recordCount = Object.keys(data.records[petId] || {}).length;
  const photoCount = Object.values(data.photos[petId] || {}).reduce((s,arr)=>s+arr.length, 0);
  if(recordCount === 0 && photoCount === 0){
    toast('已經沒有紀錄了');
    return;
  }
  const msg = `確定清空「${pet.name}」的 ${recordCount} 天紀錄、${photoCount} 張照片？\n\n保留：寵物名字、種類、飼主、備註\n清掉：所有日期紀錄、所有照片\n\n⚠️ 雲端 Gist 不會自動清，需要的話到 https://gist.github.com 手動刪`;
  if(!confirm(msg)) return;
  data.records[petId] = {};
  data.photos[petId] = {};
  saveData(data);
  // 重新整理畫面
  if(petId === getCurrentPet()?.id){
    clearFormFields();
    renderDateHistory();
  }
  toast(`已清空 ${pet.name} 的所有紀錄`);
  renderPetList();
}
function savePetForm(editingId){
  const name = $('petFormName').value.trim();
  if(!name){ toast('請填名字'); return; }
  const speciesRadio = document.querySelector('input[name="petFormSpecies"]:checked');
  const species = speciesRadio ? speciesRadio.value : '其他';
  const genderRadio = document.querySelector('input[name="petFormGender"]:checked');
  const gender = genderRadio ? genderRadio.value : '';
  const neuteredRadio = document.querySelector('input[name="petFormNeutered"]:checked');
  const neutered = neuteredRadio ? neuteredRadio.value : '';
  const breed = ($('petFormBreed') ? $('petFormBreed').value.trim() : '');
  const owner = $('petFormOwner').value.trim();
  const notes = $('petFormNotes').value.trim();
  const data = ensureData();
  if(editingId){
    const p = data.pets.find(x=>x.id===editingId);
    if(p){ p.name = name; p.species = species; p.breed = breed; p.gender = gender; p.neutered = neutered; p.owner = owner; p.notes = notes; }
  } else {
    const id = genId();
    data.pets.push({ id, name, species, breed, gender, neutered, owner, notes });
    data.current_pet_id = id;  // 新增後切過去
  }
  saveData(data);
  refreshPetUI();
  loadDay($('date').value);
  loadPhotos();
  updateHistoryHint();
  renderPetList();
  if (typeof renderPetListView === 'function') renderPetListView();
  toast(editingId?'已更新':'已新增');
}
function deletePet(petId){
  const data = ensureData();
  if(data.pets.length <= 1){ toast('至少要有一隻寵物'); return; }
  const pet = data.pets.find(p=>p.id===petId);
  if(!pet) return;
  const recordCount = Object.keys(data.records[petId]||{}).length;
  const photoCount = Object.values(data.photos[petId]||{}).reduce((s,arr)=>s+arr.length, 0);
  const warning = (recordCount||photoCount) ? `\n\n⚠️ 將同時刪除 ${recordCount} 天紀錄、${photoCount} 張照片，無法復原` : '';
  if(!confirm(`確定刪除「${pet.name}」？${warning}`)) return;
  data.pets = data.pets.filter(p=>p.id!==petId);
  delete data.records[petId];
  delete data.photos[petId];
  if(data.current_pet_id === petId) data.current_pet_id = data.pets[0].id;
  saveData(data);
  refreshPetUI();
  loadDay($('date').value);
  loadPhotos();
  updateHistoryHint();
  renderPetList();
  if (typeof renderPetListView === 'function') renderPetListView();
  toast('已刪除');
}

// === 表格式多日報告：欄位格式化器 ===
function fmtMeal(r){
  const p = [];
  if(r.m) p.push(escapeHtml(r.m));
  if(r.md) p.push('✓吃完');
  if(r.mp) p.push('✓部分');
  if(r.mn) p.push('✗沒吃');
  if(r.mw) p.push('+水');
  return p.join('・');
}
function fmtWater(r){
  const w = [];
  if(r.w1) w.push('1樓');
  if(r.wm) w.push('主臥');
  if(r.w3) w.push('3樓');
  return w.join('・');
}
function fmtMed(r){
  const p = [];
  if(r.mn2) p.push(escapeHtml(r.mn2));
  if(r.mdd) p.push('已餵');
  if(r.ms) p.push('順利');
  if(r.mdf) p.push('不易餵');
  if(r.msk) p.push('未餵');
  return p.join('・');
}
function fmtMood(r){
  const p = [];
  if(r.mo) p.push(r.mo);
  if(r.mon) p.push(escapeHtml(r.mon));
  return p.join('・');
}
function fmtPoop(r){
  const p = [];
  if(r.pc) p.push(`${r.pc} 顆`);
  if(r.pn) p.push('正常');
  if(r.ps) p.push('軟');
  if(r.ph) p.push('硬');
  return p.join('・');
}
function fmtPee(r){ return r.uc ? `${r.uc} 塊` : ''; }
function fmtVomit(r){
  if(r.vs === '無') return '<span style="color:#888;">無</span>';
  if(r.vs === '有' || (!r.vs && (r.vc||r.vh||r.vf||r.vy||r.vb||r.vn))){
    const p = ['<b style="color:#c44;">有</b>'];
    if(r.vc) p.push(`${r.vc}次`);
    if(r.vh) p.push('毛球');
    if(r.vf) p.push('食物');
    if(r.vy) p.push('黃水');
    if(r.vb) p.push('血');
    if(r.vn) p.push(`(${escapeHtml(r.vn)})`);
    return p.join('・');
  }
  return '';
}
function fmtNote(r){ return r.n ? escapeHtml(r.n) : ''; }
function fmtDateShort(d){
  const dt = new Date(d + 'T00:00:00');
  const w = ['日','一','二','三','四','五','六'][dt.getDay()];
  return `${dt.getMonth()+1}/${dt.getDate()}<br><span style="font-size:.85em;color:var(--muted);font-weight:normal;">週${w}</span>`;
}

const ROW_DEFS = [
  { label:'正餐', fn:fmtMeal },
  { label:'飲水', fn:fmtWater },
  { label:'零食', fn:r=>r.s?escapeHtml(r.s):'' },
  { label:'餵藥', fn:fmtMed },
  { label:'精神', fn:fmtMood },
  { label:'便便', fn:fmtPoop },
  { label:'排尿', fn:fmtPee },
  { label:'嘔吐', fn:fmtVomit },
  { label:'備註', fn:fmtNote },
];

function buildMultiTable(dates, records, orientation){
  const cell = v => v ? `<td>${v}</td>` : `<td class="empty">—</td>`;
  if(orientation === 'horizontal'){
    // 項目當列 × 日期當欄
    const headerCells = dates.map(d=>`<th>${fmtDateShort(d)}</th>`).join('');
    const bodyRows = ROW_DEFS.map(def => {
      const tds = dates.map(d => {
        const r = records[d] || {};
        return cell(def.fn(r));
      }).join('');
      return `<tr><th>${def.label}</th>${tds}</tr>`;
    }).join('');
    return `<div class="report-table-wrap">
      <table class="report-table">
        <thead><tr><th>項目</th>${headerCells}</tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>`;
  } else {
    // 日期當列 × 項目當欄
    const headerCells = ROW_DEFS.map(d=>`<th>${d.label}</th>`).join('');
    const bodyRows = dates.map(d => {
      const r = records[d] || {};
      const tds = ROW_DEFS.map(def => cell(def.fn(r))).join('');
      return `<tr><th>${fmtDateShort(d)}</th>${tds}</tr>`;
    }).join('');
    return `<div class="report-table-wrap">
      <table class="report-table">
        <thead><tr><th>日期</th>${headerCells}</tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>`;
  }
}

// 下載自包含 HTML 報告
function downloadHtmlReport(){
  // 取出當前 multiReport 的內容（去除 toolbar）
  const tmp = $('multiReport').cloneNode(true);
  const tb = tmp.querySelector('.report-toolbar');
  if(tb) tb.remove();
  // 把 logo.png 嘗試讀進來轉 base64（同源才會成功）
  const styles = Array.from(document.querySelectorAll('style')).map(s=>s.textContent).join('\n');
  const petName = getCurrentPet()?.name || '寵物';
  const html = `<!DOCTYPE html>
<html lang="zh-TW"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${escapeHtml(petName)} 照護紀錄</title>
<style>${styles}
body{background:var(--bg);}
#multiReport{display:block !important;}
</style></head><body class="multiday-mode">
<div id="multiReport">${tmp.innerHTML}</div>
</body></html>`;
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
  a.href = url;
  a.download = `${petName}_照護紀錄_${today}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('✅ HTML 已下載');
}

// === Top-nav wiring (麵包屑 + 同步狀態 + 設定按鈕) ===
function refreshTeddySyncDot() {
  const dot = document.getElementById('syncDot');
  if (!dot) return;
  if (!teddySyncEnabled()) {
    dot.className = 'sync-dot disabled';
    dot.title = '同步未啟用';
    return;
  }
  const map = {
    ok: { cls: 'ok', txt: '已同步' },
    syncing: { cls: 'syncing', txt: '同步中⋯' },
    pending: { cls: 'pending', txt: '即將同步' },
    error: { cls: 'error', txt: '同步失敗：' + (TEDDY_SYNC.lastError || '') },
    idle: { cls: 'disabled', txt: '尚未同步' },
  };
  const info = map[TEDDY_SYNC.status] || map.idle;
  dot.className = 'sync-dot ' + info.cls;
  dot.title = info.txt;
}

// === 初始化 ===
window.addEventListener('DOMContentLoaded', ()=>{
  // Viewer 模式：URL 帶 ?view=GIST_ID
  const params = new URLSearchParams(location.search);
  const gistId = params.get('view');
  if(gistId){
    enterViewerMode(gistId);
    return;
  }

  // 確保資料結構存在（含舊版資料遷移）
  ensureData();
  refreshPetUI();
  // 預設今天
  $('date').valueAsDate = new Date();
  // 載入今天的紀錄（若有）
  loadDay($('date').value);
  loadPhotos();
  updateHistoryHint();

  // Top-nav wiring
  const goBrand = () => {
    if (window.location.protocol === 'file:') {
      toast('本機模式：實際部署後此按鈕會跳到品牌首頁');
    } else {
      window.location.href = '../';
    }
  };
  const bcBrand = document.getElementById('bcBrand');
  if (bcBrand) bcBrand.onclick = goBrand;
  const brandLogoNav = document.getElementById('brandLogoNav');
  if (brandLogoNav) brandLogoNav.onclick = goBrand;
  const bcList = document.getElementById('bcList');
  if (bcList) bcList.onclick = () => gotoList();

  // 預設進入：寵物列表 view（第二層）
  applyView('list');
  renderPetListView();

  const settingsBtn = document.getElementById('settingsBtn');
  if (settingsBtn) {
    settingsBtn.onclick = () => openTeddySettings();
  }
  const dot = document.getElementById('syncDot');
  if (dot) dot.onclick = () => openTeddySettings();
  onTeddySyncStatusChange(refreshTeddySyncDot);
  refreshTeddySyncDot();
  // 啟用過 → 背景拉雲端
  if (teddySyncEnabled()) setTimeout(() => teddyPullFromCloud(), 200);

  // 切換日期 → 載入該天紀錄 + 照片
  $('date').addEventListener('change', ()=>{
    loadDay($('date').value);
    loadPhotos();
  });

  // 自動儲存 + 自動同步（排除寵物彈窗內的編輯）
  document.addEventListener('input', (e)=>{
    if(e.target.closest('#petModal')) return;
    saveCurrentDay();
    scheduleAutoSync();
  });
  document.addEventListener('change', (e)=>{
    if(e.target.closest('#petModal')) return;
    saveCurrentDay();
    scheduleAutoSync();
  });
});
</script>
</body>
</html>
